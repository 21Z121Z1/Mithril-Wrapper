pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        // The ZalithLauncher renderer plugin DSL is published on JitPack, not
        // on Maven Central - MobileGL's own plugin module resolves it from here.
        maven { url = uri("https://jitpack.io") }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
    }
}
rootProject.name = "MithrilAndroid"
include(":app")

import org.gradle.process.ExecSpec

/*
 * Minecraft 1.21.1 E2E lane (Gradle 8.10 / Java 21 / Fabric Loom 1.7.3).
 *
 * Plugin id note: the upstream lane targeted Minecraft 26.2 with Loom 1.16.3 and
 * the `net.fabricmc.fabric-loom` id. Two things changed for 1.21.1:
 *   - 1.21.1 predates the "non-obfuscated" split, so the classic `fabric-loom`
 *     plugin id is the one published for these Loom versions (the marker lives at
 *     /fabric-loom/fabric-loom.gradle.plugin/<version>/ on maven.fabricmc.net).
 *   - Loom 1.8+ requires Gradle 9, so with Gradle 8.10 we stay on the 1.7 line.
 * Run task note: `net.fabricmc.loom.task.prod.ClientProductionRunTask` is part of
 * the newer property-based run API (Loom 1.9+) and does not exist in 1.7.3, so the
 * lane drives the plain `runClient` task instead.
 */
plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'java'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // CRITICAL: make THIS project's own mod discoverable at dev runtime.
    // Loom 1.7 launches the game through net.fabricmc.devlaunchinjector.Main,
    // which builds the game classloader from the `runtimeClasspath` configuration
    // (recorded in the generated DLI config) -- it does NOT scan extra entries
    // appended to the JavaExec `classpath` property. A previous attempt that did
    // `classpath += files(sourceSets.main.output...)` compiled the mod but Knot
    // still reported "Loading 54 mods" (one fewer: mithril_minecraft_e2e was
    // absent), so the in-process state machine never ran and the lane hit
    // RUNTIME_MINECRAFT_HANG. Adding the compiled classes and processed
    // resources (fabric.mod.json) to `runtimeOnly` puts them on the
    // `runtimeClasspath` that DLI/Knot actually scan, so the mod loads.
    runtimeOnly files(sourceSets.main.output.classesDirs, sourceSets.main.output.resourcesDir)
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

def mithrilDylib = providers.gradleProperty('mithrilDylib').map { file(it).absolutePath }
def glfwBridge   = providers.gradleProperty('glfwBridge').map { file(it).absolutePath }
def glfwDelegate = providers.gradleProperty('glfwDelegate').map { file(it).absolutePath }
def evidenceRoot = providers.gradleProperty('evidenceRoot').map { file(it).absolutePath }

tasks.named('runClient') {
    // Route LWJGL at Mithril: the GL entry points come from libmithril.dylib and
    // the window/context layer comes from the EGL bridge dylib.
    // IMPORTANT: build a NEW list and assign it. On Gradle 8.x,
    // JavaExec#getJvmArgs() returns the value of a ListProperty, which is an
    // *immutable* list, so `jvmArgs.add(x)` throws
    // UnsupportedOperationException (ImmutableCollection.add) while the task is
    // being configured. That is exactly the "Could not create task ':runClient'"
    // failure this lane hit: the whole root project failed to configure, so the
    // game never started. Assigning through the setter replaces the property
    // value with a fresh, mutable list instead of mutating an immutable one.
    jvmArgs = (jvmArgs ?: []) + [
        "-Dmithril.e2e.root=${evidenceRoot.get()}",
        "-Dorg.lwjgl.glfw.libname=${glfwBridge.get()}",
        "-Dorg.lwjgl.opengl.libname=${mithrilDylib.get()}"
    ]

    // On a fresh CI checkout the mod has never been compiled, so the output
    // directories referenced by the runtimeOnly dependency above are empty at
    // runClient time. Force runClient to build the project's compiled classes
    // and processed resources (the aggregate `classes` task) first.
    dependsOn tasks.named('classes')

    // The native bridge reads its configuration from the environment. Older Loom
    // run tasks expose a JavaExec-style environment(...) method; configure it
    // only when present so this script keeps working across Loom versions (the
    // bridge has hard-coded fallbacks for when it is missing).
    try {
        environment('MITHRIL_E2E_ROOT', evidenceRoot.get())
        environment('MITHRIL_E2E_MITHRIL_DYLIB', mithrilDylib.get())
        environment('MITHRIL_E2E_GLFW_DELEGATE', glfwDelegate.get())
    } catch (Throwable ignored) {
        logger.lifecycle('runClient exposes no environment(...); relying on bridge fallbacks')
    }
}

name: One-shot apply GL enum hardening

on:
  push:
    branches:
      - ci/minecraft-on-mithril-e2e-20260815
    paths:
      - .github/workflows/one-shot-apply-gl-enum-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/minecraft-on-mithril-e2e-20260815
          persist-credentials: true
          fetch-depth: 1
      - name: Apply exact header patch
        run: |
          set -euo pipefail
          python3 ci/minecraft-e2e/apply_gl_enum_hardening.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mithril-Wrapper-cpp/include/GL/gl.h
          git commit -m 'fix(headers): expose pixel-transfer binding enums'
          git push origin HEAD:ci/minecraft-on-mithril-e2e-20260815

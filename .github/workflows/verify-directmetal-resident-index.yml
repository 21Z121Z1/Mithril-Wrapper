name: verify-directmetal-resident-index

on:
  push:
    branches: [perf/directmetal-resident-index-20260817]

permissions:
  contents: write

concurrency:
  group: verify-directmetal-resident-index
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/directmetal-resident-index-20260817
          submodules: false
          fetch-depth: 0

      - name: Fetch DirectMetal shader submodules
        run: >-
          git submodule update --init --depth=1
          third_party/SPIRV-Cross
          third_party/SPIRV-Headers
          third_party/glslang

      - name: Apply resident index-buffer phase
        run: python3 scripts/apply_directmetal_resident_index_phase5_v2.py

      - name: Verify source invariants
        run: |
          git diff --check
          grep -q 'struct ResidentIndexSource' src/backend/types.h
          grep -q 'TryResolveResidentIndices' src/gl/draw.cpp
          grep -q 'pending.resident_index' src/metal/engine.mm
          grep -q 'MTLIndexTypeUInt16' src/metal/engine.mm
          grep -q 'op.index_type' src/vk/draw.cpp
          grep -q 'directmetal_resident_index_smoke' cmake/MithrilSmokeTests.cmake

      - name: Configure DirectMetal Release build
        run: >-
          cmake -S . -B build-direct -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=OFF
          -DMITHRIL_BUILD_DIRECT=ON
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON

      - name: Build DirectMetal and regression tests
        run: cmake --build build-direct --parallel

      - name: Run dedicated resident-index regression
        run: ctest --test-dir build-direct -R '^directmetal_resident_index_smoke$' --output-on-failure

      - name: Run complete DirectMetal semantic suite
        run: ctest --test-dir build-direct -L directmetal --output-on-failure

      - name: Configure Vulkan reference build
        run: >-
          cmake -S . -B build-vulkan -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=ON
          -DMITHRIL_BUILD_DIRECT=OFF
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON

      - name: Build Vulkan reference
        run: cmake --build build-vulkan --parallel

      - name: Commit verified implementation
        run: |
          rm .github/workflows/verify-directmetal-resident-index.yml
          rm scripts/apply_directmetal_resident_index_phase5.py
          rm scripts/apply_directmetal_resident_index_phase5_v2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf: bind resident UInt16 and UInt32 EBOs'
          git push origin HEAD:perf/directmetal-resident-index-20260817

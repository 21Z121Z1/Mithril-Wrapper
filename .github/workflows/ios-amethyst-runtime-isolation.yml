name: Build Amethyst-isolated Mithril for iOS

on:
  push:
    branches:
      - 'fix/ios-amethyst-runtime-isolation'
  workflow_dispatch:

jobs:
  build-amethyst-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Fetch pinned ios-cmake toolchain
        shell: bash
        run: |
          set -euo pipefail
          IOS_CMAKE_COMMIT=b055a0320feccc168dca13b381ae7097c4771585
          curl -fsSL -o ios.toolchain.cmake \
            "https://github.com/leetal/ios-cmake/raw/${IOS_CMAKE_COMMIT}/ios.toolchain.cmake"
          test -s ios.toolchain.cmake
          echo "IOS_CMAKE_COMMIT=$IOS_CMAKE_COMMIT" >> "$GITHUB_ENV"

      - name: Stage Vulkan headers only
        shell: bash
        run: |
          set -euo pipefail
          # Compile against current Vulkan headers, but DO NOT stage/link a
          # static MoltenVK archive. The actual dependency is the exact dylib
          # already vendored by this repository and by Amethyst.
          MOLTENVK_TAG=v1.4.2
          curl -fsSL -o MoltenVK-ios.tar \
            "https://github.com/KhronosGroup/MoltenVK/releases/download/${MOLTENVK_TAG}/MoltenVK-ios.tar"
          mkdir -p moltenvk-staging
          tar -xf MoltenVK-ios.tar -C moltenvk-staging
          HDRS=$(find moltenvk-staging -type d -name vulkan -path '*/include/vulkan' | head -1)
          test -n "$HDRS"
          mv "$(dirname "$HDRS")" ./MoltenVK-Headers
          test -s MoltenVK-Headers/vulkan/vulkan.h

      - name: Verify launcher-owned MoltenVK identity
        shell: bash
        run: |
          set -euo pipefail
          MOLTENVK="$GITHUB_WORKSPACE/Mithril-Wrapper-cpp/3rdparty/MoltenVK/libMoltenVK.dylib"
          test -s "$MOLTENVK"
          file "$MOLTENVK"
          # This blob SHA is also the blob used at
          # EternityQwQ/Amethyst-iOS:Natives/resources/Frameworks/libMoltenVK.dylib.
          EXPECTED_BLOB_SHA=30477a5badd5114a2016e5fb27a27dc637c28b5d
          ACTUAL_BLOB_SHA=$(git hash-object "$MOLTENVK")
          echo "MoltenVK blob: $ACTUAL_BLOB_SHA"
          test "$ACTUAL_BLOB_SHA" = "$EXPECTED_BLOB_SHA"

      - name: Configure iPhoneOS arm64 with runtime isolation
        shell: bash
        run: |
          set -euo pipefail
          EXPORTS="$RUNNER_TEMP/amethyst-ios.exports"
          NOT_WEAK="$GITHUB_WORKSPACE/cmake/amethyst-ios.force-not-weak"
          MOLTENVK="$GITHUB_WORKSPACE/Mithril-Wrapper-cpp/3rdparty/MoltenVK/libMoltenVK.dylib"
          WRAPPER="$GITHUB_WORKSPACE/cmake/amethyst-ios.toolchain.cmake"
          BASE_TOOLCHAIN="$GITHUB_WORKSPACE/ios.toolchain.cmake"

          # Generate a literal 701-symbol allow-list from Mithril's verified
          # public ABI. This intentionally replaces the old `_gl*` wildcard,
          # which also matched glslang's `glslang_*` C interface.
          bash "$GITHUB_WORKSPACE/cmake/generate-amethyst-ios-exports.sh" "$EXPORTS"
          test "$(wc -l < "$EXPORTS" | tr -d ' ')" -eq 701
          test -s "$NOT_WEAK"
          test -s "$MOLTENVK"
          test -s "$WRAPPER"
          test -s "$BASE_TOOLCHAIN"
          if grep -Eq 'glslang|TInterm|spirv_cross|^__Z' "$EXPORTS"; then
            echo '::error::generated public ABI contains compiler implementation symbols'
            exit 1
          fi

          # ios-cmake overwrites CMAKE_SHARED_LINKER_FLAGS each time its
          # toolchain runs, including enable_language(OBJCXX). The wrapper
          # includes ios-cmake first and appends the isolation policy afterwards
          # on every pass. Environment fallback is required by CMake try_compile
          # compiler probes, which inherit env before all custom cache variables.
          export MITHRIL_IOS_BASE_TOOLCHAIN="$BASE_TOOLCHAIN"
          export MITHRIL_AMETHYST_EXPORT_LIST="$EXPORTS"
          export MITHRIL_AMETHYST_FORCE_NOT_WEAK_LIST="$NOT_WEAK"

          cmake -B build-amethyst-ios \
            -DCMAKE_TOOLCHAIN_FILE="$WRAPPER" \
            -DMITHRIL_IOS_BASE_TOOLCHAIN="$BASE_TOOLCHAIN" \
            -DMITHRIL_AMETHYST_EXPORT_LIST="$EXPORTS" \
            -DMITHRIL_AMETHYST_FORCE_NOT_WEAK_LIST="$NOT_WEAK" \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=15.0 \
            -DENABLE_BITCODE=OFF \
            -DENABLE_ARC=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMOLTENVK_LIBRARY="$MOLTENVK" \
            -DCMAKE_C_FLAGS="-Wno-error=implicit-function-declaration" \
            -DCMAKE_CXX_FLAGS="-Wno-error"

      - name: Build libmithril.dylib and capture final linker command
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cmake --build build-amethyst-ios --config RelWithDebInfo --target mithril \
            --verbose -j"$(sysctl -n hw.ncpu)" 2>&1 | tee /tmp/mithril-build.log

          grep -Fq -- '-exported_symbols_list' /tmp/mithril-build.log || {
            echo '::error::final link command lost -exported_symbols_list'
            exit 1
          }
          grep -Fq -- '-force_symbols_not_weak_list' /tmp/mithril-build.log || {
            echo '::error::final link command lost -force_symbols_not_weak_list'
            exit 1
          }

      - name: Locate artifact
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          DYLIB=$(find build-amethyst-ios -name libmithril.dylib -type f | head -1)
          test -n "$DYLIB"
          echo "path=$DYLIB" >> "$GITHUB_OUTPUT"
          file "$DYLIB"
          ls -lh "$DYLIB"
          xcrun vtool -show-build "$DYLIB"

      - name: Verify single MoltenVK ownership
        shell: bash
        run: |
          set -euo pipefail
          DYLIB='${{ steps.locate.outputs.path }}'
          otool -L "$DYLIB" | tee /tmp/mithril-dylibs.txt

          grep -Fq '@rpath/libMoltenVK.dylib' /tmp/mithril-dylibs.txt || {
            echo '::error::libmithril does not dynamically depend on Amethyst libMoltenVK.dylib'
            exit 1
          }

          # A dynamic-client libmithril must not contain MoltenVK Objective-C
          # implementation classes. This is the class that produced the
          # duplicate-class runtime warning in the crashing build.
          nm -a "$DYLIB" > /tmp/mithril-nm-all.txt
          if grep -Fq 'MVKBlockObserver' /tmp/mithril-nm-all.txt; then
            echo '::error::MoltenVK implementation is still embedded in libmithril'
            grep -F 'MVKBlockObserver' /tmp/mithril-nm-all.txt | head -20
            exit 1
          fi
          if strings "$DYLIB" | grep -Fq 'MVKBlockObserver'; then
            echo '::error::MoltenVK Objective-C implementation string remains embedded'
            exit 1
          fi

          # There must be exactly one MoltenVK load command and no framework
          # form left after the existing post-build install_name_tool patch.
          test "$(grep -c 'MoltenVK' /tmp/mithril-dylibs.txt)" -eq 1
          ! grep -Fq 'MoltenVK.framework/MoltenVK' /tmp/mithril-dylibs.txt

      - name: Verify glslang C++ image isolation
        shell: bash
        run: |
          set -euo pipefail
          DYLIB='${{ steps.locate.outputs.path }}'
          EXPECTED="$RUNNER_TEMP/amethyst-ios.exports"
          test -s "$EXPECTED"

          # The exports trie is the authoritative dyld-visible export plane.
          xcrun --find llvm-objdump >/dev/null
          xcrun llvm-objdump --macho --exports-trie "$DYLIB" > /tmp/mithril-exports-trie.txt
          awk 'NF >= 2 && $NF ~ /^_/ {print $NF}' /tmp/mithril-exports-trie.txt \
            | LC_ALL=C sort -u > /tmp/mithril-dyld-export-names.txt

          if ! diff -u "$EXPECTED" /tmp/mithril-dyld-export-names.txt; then
            MISSING_COUNT=$(comm -23 "$EXPECTED" /tmp/mithril-dyld-export-names.txt | wc -l | tr -d ' ')
            UNEXPECTED_COUNT=$(comm -13 "$EXPECTED" /tmp/mithril-dyld-export-names.txt | wc -l | tr -d ' ')
            echo "=== missing expected exports ($MISSING_COUNT) ==="
            comm -23 "$EXPECTED" /tmp/mithril-dyld-export-names.txt || true
            echo "=== unexpected dynamic exports ($UNEXPECTED_COUNT) ==="
            comm -13 "$EXPECTED" /tmp/mithril-dyld-export-names.txt || true
            echo '::error::Mach-O exports trie differs from exact 701-symbol GL/EGL ABI'
            exit 1
          fi
          test "$(wc -l < /tmp/mithril-dyld-export-names.txt | tr -d ' ')" -eq 701

          if grep -E '(TInterm|glslang|spirv_cross|__Z|_ShCompile)' /tmp/mithril-exports-trie.txt; then
            echo '::error::shader compiler/C++ implementation leaked into Mach-O exports trie'
            exit 1
          fi

          # Keep nm views as forensic evidence, but do not confuse Mach-O
          # private extern bookkeeping with the dyld-visible export set.
          nm -gU "$DYLIB" > /tmp/mithril-nm-gU.txt
          nm -m "$DYLIB" > /tmp/mithril-nm-m.txt
          nm -u "$DYLIB" > /tmp/mithril-undef.txt

          for sym in \
            eglGetDisplay eglInitialize eglCreateWindowSurface eglCreateContext eglMakeCurrent eglSwapBuffers \
            glGetString glGetError glCreateShader glCompileShader glCreateProgram glLinkProgram \
            glDrawArrays glDrawElements glReadPixels; do
            grep -Fxq "_${sym}" /tmp/mithril-dyld-export-names.txt || {
              echo "::error::required host export missing from exports trie: $sym"
              exit 1
            }
          done

          # This is the exact virtual method seen resolving into Amethyst's
          # libshaderc.dylib in the original crash. It must exist only as a
          # private, non-weak definition in libmithril.
          TINTERM=$(grep '_ZN11TIntermNode14getAsUnaryNodeEv' /tmp/mithril-nm-m.txt || true)
          echo "TIntermNode getAsUnaryNode: $TINTERM"
          test -n "$TINTERM"
          printf '%s\n' "$TINTERM" | grep -Fq 'non-external'
          if printf '%s\n' "$TINTERM" | grep -qi 'weak'; then
            echo '::error::TIntermNode::getAsUnaryNode remains weak/coalescable'
            exit 1
          fi

          # The force-not-weak list covers every Itanium C++ Mach-O symbol.
          # Explicitly audit the compiler object model/vtables/RTTI as well.
          grep -E '(TInterm|glslang|spirv_cross|__ZTV|__ZTI|__ZTS)' /tmp/mithril-nm-m.txt \
            > /tmp/mithril-compiler-cxx.txt || true
          test -s /tmp/mithril-compiler-cxx.txt
          if grep -qi 'weak' /tmp/mithril-compiler-cxx.txt; then
            echo '::error::private shader-compiler C++ symbol is still weak/coalescable'
            grep -i 'weak' /tmp/mithril-compiler-cxx.txt | head -50
            exit 1
          fi

          # No unresolved shader-compiler reference may escape to another image.
          if grep -E '(TInterm|glslang|spirv_cross)' /tmp/mithril-undef.txt; then
            echo '::error::unresolved shader-compiler reference would be satisfied by another image'
            exit 1
          fi

          # Direct dyld metadata regression checks for the original cross-image
          # dispatch. Empty compiler matches are the required result.
          xcrun --find dyld_info >/dev/null
          xcrun dyld_info -weak_bind "$DYLIB" > /tmp/mithril-weak-bind.txt || true
          xcrun dyld_info -bind "$DYLIB" > /tmp/mithril-bind.txt || true
          if grep -E '(TInterm|glslang|spirv_cross)' /tmp/mithril-weak-bind.txt; then
            echo '::error::shader-compiler symbol appears in dyld weak-bind metadata'
            exit 1
          fi
          if grep -E '(TInterm|glslang|spirv_cross)' /tmp/mithril-bind.txt; then
            echo '::error::shader-compiler symbol appears in external dyld bind metadata'
            exit 1
          fi

          xcrun llvm-objdump --macho --chained-fixups "$DYLIB" \
            > /tmp/mithril-chained-fixups.txt 2>/dev/null || true
          if grep -E '(TInterm|glslang|spirv_cross)' /tmp/mithril-chained-fixups.txt; then
            echo '::error::shader-compiler symbol appears in chained fixups'
            exit 1
          fi

      - name: Verify DirectMetal payload
        shell: bash
        run: |
          set -euo pipefail
          DYLIB='${{ steps.locate.outputs.path }}'
          nm "$DYLIB" > /tmp/mithril-all-symbols.txt
          for sym in _dmt_init _dmt_available _dmt_create_swapchain; do
            grep -Fq "$sym" /tmp/mithril-all-symbols.txt || {
              echo "::error::DirectMetal symbol absent: $sym"
              exit 1
            }
          done
          strings "$DYLIB" > /tmp/mithril-strings.txt
          grep -Fq 'Metal 3 (DirectMetal)' /tmp/mithril-strings.txt

      - name: Capture Mach-O forensic reports
        shell: bash
        run: |
          set -euo pipefail
          DYLIB='${{ steps.locate.outputs.path }}'
          mkdir -p package/forensics
          file "$DYLIB" > package/forensics/file.txt
          otool -L "$DYLIB" > package/forensics/otool-L.txt
          nm -m "$DYLIB" > package/forensics/nm-m.txt
          nm -gU "$DYLIB" > package/forensics/nm-gU.txt
          nm -u "$DYLIB" > package/forensics/nm-u.txt
          xcrun llvm-objdump --syms "$DYLIB" > package/forensics/llvm-objdump-syms.txt
          xcrun llvm-objdump --macho --dylibs-used "$DYLIB" > package/forensics/llvm-objdump-dylibs-used.txt
          xcrun llvm-objdump --macho --exports-trie "$DYLIB" > package/forensics/llvm-objdump-exports-trie.txt
          xcrun llvm-objdump --macho --chained-fixups "$DYLIB" > package/forensics/llvm-objdump-chained-fixups.txt 2>/dev/null || true
          xcrun dyld_info -weak_bind "$DYLIB" > package/forensics/dyld-weak-bind.txt || true
          xcrun dyld_info -bind "$DYLIB" > package/forensics/dyld-bind.txt || true

      - name: Ad-hoc sign and package
        shell: bash
        run: |
          set -euo pipefail
          DYLIB='${{ steps.locate.outputs.path }}'
          codesign -f -s - "$DYLIB"
          codesign --verify --verbose=2 "$DYLIB"
          codesign -dvvv "$DYLIB" 2>&1 | tee package/forensics/codesign.txt

          cp "$DYLIB" package/libmithril.dylib
          cat > package/BUILD_INFO.txt <<EOF
          repository=$GITHUB_REPOSITORY
          branch=${GITHUB_REF_NAME}
          commit=$GITHUB_SHA
          workflow_run=$GITHUB_RUN_ID
          target=iPhoneOS arm64
          deployment_target=15.0
          integration=Amethyst
          backend_default=DirectMetal
          ios_cmake_commit=$IOS_CMAKE_COMMIT
          moltenvk_version=v1.4.2
          moltenvk_linkage=dynamic-@rpath/libMoltenVK.dylib
          moltenvk_ownership=dynamic-launcher-owned
          moltenvk_blob=30477a5badd5114a2016e5fb27a27dc637c28b5d
          public_dynamic_exports=701-gl-egl-only
          glslang_isolation=exact-exports-trie+private-nonweak-cxx+zero-dyld-compiler-bind
          EOF
          shasum -a 256 package/libmithril.dylib > package/SHA256SUMS.txt
          cat package/BUILD_INFO.txt
          cat package/SHA256SUMS.txt

      - name: Upload Amethyst test dylib
        uses: actions/upload-artifact@v4
        with:
          name: mithril-ios-amethyst-isolated
          path: package/
          if-no-files-found: error
          retention-days: 14

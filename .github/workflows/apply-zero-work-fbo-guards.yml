name: apply-zero-work-fbo-guards

on:
  push:
    branches: [fix/directmetal-incomplete-fbo-20260819]
  pull_request:
    branches: [integration/directmetal-next]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/directmetal-incomplete-fbo-20260819
          fetch-depth: 0

      - name: Close zero-work rendering-command gaps
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/gl/state.cpp',
              '''    if (mask & ~valid) { PUSH_ERROR(GL_INVALID_VALUE); return; }\n    if (!mask) return;\n''',
              '''    if (mask & ~valid) { PUSH_ERROR(GL_INVALID_VALUE); return; }\n    // Clear is a rendering command even when mask selects no buffers.\n    // Framebuffer completeness is therefore still observable in the zero-work\n    // case; do not let this early return bypass the OpenGL 9.4.4 error.\n    if (!mask) {\n        if (glCheckFramebufferStatus(GL_DRAW_FRAMEBUFFER) !=\n            GL_FRAMEBUFFER_COMPLETE)\n            PUSH_ERROR(GL_INVALID_FRAMEBUFFER_OPERATION);\n        return;\n    }\n''',
          )

          replace_once(
              'src/gl/draw.cpp',
              '''    if (count < 0 || first < 0 || instance_count < 0) {\n        PUSH_ERROR(GL_INVALID_VALUE);\n        return;\n    }\n    std::vector<uint32_t> loop(static_cast<size_t>(count));\n''',
              '''    if (count < 0 || first < 0 || instance_count < 0) {\n        PUSH_ERROR(GL_INVALID_VALUE);\n        return;\n    }\n    // GL_LINE_LOOP is lowered through a synthetic index list. With count==0\n    // there is no segment and therefore no DrawCommon call, but the original\n    // GL command is still a rendering command and must validate the FBO.\n    if (count == 0 && glCheckFramebufferStatus(GL_DRAW_FRAMEBUFFER) !=\n                          GL_FRAMEBUFFER_COMPLETE) {\n        PUSH_ERROR(GL_INVALID_FRAMEBUFFER_OPERATION);\n        return;\n    }\n    std::vector<uint32_t> loop(static_cast<size_t>(count));\n''',
          )

          replace_once(
              'src/gl/draw.cpp',
              '''    std::vector<uint32_t> idx = LoadIndices(type, indices, count, start, end, &err);\n    if (err) { PUSH_ERROR(err); return; }\n    if (idx.empty()) return;\n''',
              '''    std::vector<uint32_t> idx = LoadIndices(type, indices, count, start, end, &err);\n    if (err) { PUSH_ERROR(err); return; }\n    // A valid zero-count indexed draw produces an empty decoded index list.\n    // Validate completeness before treating it as a no-op.\n    if (idx.empty()) {\n        if (glCheckFramebufferStatus(GL_DRAW_FRAMEBUFFER) !=\n            GL_FRAMEBUFFER_COMPLETE)\n            PUSH_ERROR(GL_INVALID_FRAMEBUFFER_OPERATION);\n        return;\n    }\n''',
          )

          for signature in (
              '''void APIENTRY glMultiDrawArrays(GLenum mode, const GLint* first,\n                                const GLsizei* count, GLsizei drawcount) {\n    if (drawcount < 0) { PUSH_ERROR(GL_INVALID_VALUE); return; }\n''',
              '''void APIENTRY glMultiDrawElements(GLenum mode, const GLsizei* count, GLenum type,\n                                  const void* const* indices, GLsizei drawcount) {\n    if (drawcount < 0) { PUSH_ERROR(GL_INVALID_VALUE); return; }\n''',
              '''void APIENTRY glMultiDrawElementsBaseVertex(GLenum mode, const GLsizei* count,\n                                            GLenum type,\n                                            const void* const* indices,\n                                            GLsizei drawcount,\n                                            const GLint* basevertex) {\n    if (drawcount < 0) { PUSH_ERROR(GL_INVALID_VALUE); return; }\n''',
          ):
              guarded = signature + '''    // MultiDraw* is itself a rendering command. drawcount==0 must not\n    // bypass framebuffer completeness validation.\n    if (drawcount == 0 && glCheckFramebufferStatus(GL_DRAW_FRAMEBUFFER) !=\n                              GL_FRAMEBUFFER_COMPLETE) {\n        PUSH_ERROR(GL_INVALID_FRAMEBUFFER_OPERATION);\n        return;\n    }\n'''
              replace_once('src/gl/draw.cpp', signature, guarded)

          p = Path('tests/directmetal_incomplete_fbo_smoke.c')
          text = p.read_text()
          replacements = [
              ('#define GL_TRIANGLES 0x0004\n', '#define GL_LINE_LOOP 0x0002\n#define GL_TRIANGLES 0x0004\n'),
              ('#define GL_TEXTURE_2D 0x0DE1\n', '#define GL_TEXTURE_2D 0x0DE1\n#define GL_ELEMENT_ARRAY_BUFFER 0x8893\n#define GL_STATIC_DRAW 0x88E4\n'),
              ('typedef void (*fn_glDrawArrays)(GLenum, GLint, GLsizei);\n',
               'typedef void (*fn_glDrawArrays)(GLenum, GLint, GLsizei);\ntypedef void (*fn_glDrawElements)(GLenum, GLsizei, GLenum, const void*);\ntypedef void (*fn_glMultiDrawArrays)(GLenum, const GLint*, const GLsizei*, GLsizei);\ntypedef void (*fn_glMultiDrawElements)(GLenum, const GLsizei*, GLenum, const void* const*, GLsizei);\ntypedef void (*fn_glGenBuffers)(GLsizei, GLuint*);\ntypedef void (*fn_glBindBuffer)(GLenum, GLuint);\ntypedef void (*fn_glBufferData)(GLenum, long, const void*, GLenum);\n'),
              ('    LOAD(fn_glDrawArrays, glDrawArrays);\n',
               '    LOAD(fn_glDrawArrays, glDrawArrays);\n    LOAD(fn_glDrawElements, glDrawElements);\n    LOAD(fn_glMultiDrawArrays, glMultiDrawArrays);\n    LOAD(fn_glMultiDrawElements, glMultiDrawElements);\n    LOAD(fn_glGenBuffers, glGenBuffers);\n    LOAD(fn_glBindBuffer, glBindBuffer);\n    LOAD(fn_glBufferData, glBufferData);\n'),
              ('          glDrawArrays && glReadPixels && glCopyTexImage2D && glBlitFramebuffer,\n',
               '          glDrawArrays && glDrawElements && glMultiDrawArrays &&\n          glMultiDrawElements && glGenBuffers && glBindBuffer && glBufferData &&\n          glReadPixels && glCopyTexImage2D && glBlitFramebuffer,\n'),
              ('    glClear(GL_DEPTH_BUFFER_BIT);\n    expect_error(glGetError, GL_INVALID_FRAMEBUFFER_OPERATION, "glClear");\n',
               '    glClear(GL_DEPTH_BUFFER_BIT);\n    expect_error(glGetError, GL_INVALID_FRAMEBUFFER_OPERATION, "glClear");\n    glClear(0);\n    expect_error(glGetError, GL_INVALID_FRAMEBUFFER_OPERATION, "glClear(zero-mask)");\n'),
              ('    glDrawArrays(GL_TRIANGLES, 0, 0);\n    expect_error(glGetError, GL_INVALID_FRAMEBUFFER_OPERATION,\n                 "glDrawArrays(zero-count)");\n',
               '    glDrawArrays(GL_TRIANGLES, 0, 0);\n    expect_error(glGetError, GL_INVALID_FRAMEBUFFER_OPERATION,\n                 "glDrawArrays(zero-count)");\n    glDrawArrays(GL_LINE_LOOP, 0, 0);\n    expect_error(glGetError, GL_INVALID_FRAMEBUFFER_OPERATION,\n                 "glDrawArrays(line-loop zero-count)");\n\n    GLuint ebo = 0;\n    glGenBuffers(1, &ebo);\n    glBindBuffer(GL_ELEMENT_ARRAY_BUFFER, ebo);\n    glBufferData(GL_ELEMENT_ARRAY_BUFFER, 0, NULL, GL_STATIC_DRAW);\n    glDrawElements(GL_TRIANGLES, 0, GL_UNSIGNED_BYTE, (const void*)0);\n    expect_error(glGetError, GL_INVALID_FRAMEBUFFER_OPERATION,\n                 "glDrawElements(zero-count)");\n    glMultiDrawArrays(GL_TRIANGLES, NULL, NULL, 0);\n    expect_error(glGetError, GL_INVALID_FRAMEBUFFER_OPERATION,\n                 "glMultiDrawArrays(zero-drawcount)");\n    glMultiDrawElements(GL_TRIANGLES, NULL, GL_UNSIGNED_BYTE, NULL, 0);\n    expect_error(glGetError, GL_INVALID_FRAMEBUFFER_OPERATION,\n                 "glMultiDrawElements(zero-drawcount)");\n'),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'test anchor changed: {old[:60]!r}')
              text = text.replace(old, new, 1)
          p.write_text(text)

          Path('.github/workflows/apply-zero-work-fbo-guards.yml').unlink()

      - name: Mechanical checks
        run: |
          git diff --check
          grep -q 'glClear(zero-mask)' tests/directmetal_incomplete_fbo_smoke.c
          grep -q 'line-loop zero-count' tests/directmetal_incomplete_fbo_smoke.c
          grep -q 'glDrawElements(zero-count)' tests/directmetal_incomplete_fbo_smoke.c
          grep -q 'glMultiDrawArrays(zero-drawcount)' tests/directmetal_incomplete_fbo_smoke.c

      - name: Commit final semantic guards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gl/state.cpp src/gl/draw.cpp tests/directmetal_incomplete_fbo_smoke.c \
                  .github/workflows/apply-zero-work-fbo-guards.yml
          git commit -m 'fix: validate incomplete FBO on zero-work rendering commands'
          git push origin HEAD:fix/directmetal-incomplete-fbo-20260819

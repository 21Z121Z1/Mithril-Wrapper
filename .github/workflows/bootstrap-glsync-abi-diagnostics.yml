name: Bootstrap GLsync ABI diagnostics

on:
  push:
    branches:
      - fix/mobilegl-style-mc262-startup-preflight

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobilegl-style-mc262-startup-preflight
      - name: Apply GLsync public-header and smoke diagnostics
        run: |
          set -euo pipefail
          python3 .github/scripts/instrument_glsync_smoke.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mithril-Wrapper-cpp/include/GL/glcorearb.h tests/render_smoke.c
          git rm .github/scripts/instrument_glsync_smoke.py
          git commit -m 'test: validate GLsync ABI and public query surface'
          git push origin HEAD:fix/mobilegl-style-mc262-startup-preflight
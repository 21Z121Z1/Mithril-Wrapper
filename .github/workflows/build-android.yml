name: Android build

on:
  push:
    branches-ignore:
      - 'l10n_main'
  pull_request:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Build libmithril.so (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Configure
        run: |
          # c++_static: Gradle does not package libc++_shared.so for a prebuilt
          # .so dropped into jniLibs - it only does that for libraries it builds
          # itself. A c++_shared build therefore dlopen()s with "library not
          # found" on device. Static linking removes the dependency entirely.
          cmake -S . -B "build-${{ matrix.abi }}" \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_STL=c++_static \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build "build-${{ matrix.abi }}" --target mithril -j"$(nproc)" 2>&1 | tee "native-${{ matrix.abi }}.log"
          exit "${PIPESTATUS[0]}"

      - name: Build driver-selection hook
        # Separate object: libvulkan.so must bind its android_dlopen_ext /
        # android_load_sphal_library to it, which requires a distinct mapping in
        # the namespace built for the loader.
        #
        # Non-fatal on purpose: this only adds driver redirection on top of the
        # stock path. A failure here must still ship an APK that works with the
        # platform driver, and the log is mirrored to ci-diagnostics so the
        # failure can be read rather than inferred. Flip to fatal once it builds.
        continue-on-error: true
        run: |
          set +e
          cmake --build "build-${{ matrix.abi }}" --target mithril_vkhook -j"$(nproc)" 2>&1 | tee "hook-${{ matrix.abi }}.log"
          rc="${PIPESTATUS[0]}"
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning::driver hook build failed (rc=$rc); APK ships without driver redirection"
          fi
          exit 0

      - name: Verify no unpackaged runtime dependencies
        # dlopen() reports "library not found" when a DT_NEEDED entry is missing
        # from the APK - and it names OUR library, so the launcher log gives no
        # hint about the real cause. Fail the build here instead of crashing on
        # device.
        run: |
          READELF="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          SO=$(find "build-${{ matrix.abi }}" -name 'libmithril.so' -type f | head -1)
          test -n "$SO"
          "$READELF" -d "$SO" | tee "needed-${{ matrix.abi }}.log"
          if grep -q "libc++_shared" "needed-${{ matrix.abi }}.log"; then
            echo "::error::libmithril.so needs libc++_shared.so, which the APK does not package"
            exit 1
          fi

      - name: Publish build log (diagnosis)
        # Job logs and artifacts live in blob storage that is not reachable from
        # everywhere, so mirror the tail of the build output to the
        # ci-diagnostics branch, which is readable through the API. Runs
        # unconditionally as well: a step marked continue-on-error does not make
        # the job report failure, and that is exactly when the log matters.
        if: always()
        continue-on-error: true
        run: |
          set -e
          tail -400 "native-${{ matrix.abi }}.log" > "android-${{ matrix.abi }}.log"
          # The hook is built by a separate step with its own log; without this
          # the failure is visible only as a step name and unreadable.
          if [ -f "hook-${{ matrix.abi }}.log" ]; then
            tail -400 "hook-${{ matrix.abi }}.log" > "android-hook-${{ matrix.abi }}.log"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-diagnostics 2>/dev/null || true
          # Base the branch on the REMOTE ref, not on the feature HEAD: the
          # remote branch has unrelated history, so a branch made from HEAD
          # cannot be pushed without forcing, and an earlier attempt lost the
          # log silently for exactly that reason.
          git checkout -B ci-diagnostics origin/ci-diagnostics 2>/dev/null \
            || git checkout -B ci-diagnostics
          mkdir -p ci-logs
          mv "android-${{ matrix.abi }}.log" "ci-logs/android-${{ matrix.abi }}.log"
          [ -f "android-hook-${{ matrix.abi }}.log" ] \
            && mv "android-hook-${{ matrix.abi }}.log" "ci-logs/android-hook-${{ matrix.abi }}.log"
          git add ci-logs
          git diff --cached --quiet && exit 0
          git commit -m "ci(android): ${{ matrix.abi }} build log [skip ci]"
          # The three ABI jobs share this branch and can race; retry rather
          # than let one of them silently drop its log.
          for i in 1 2 3; do
            git pull --rebase origin ci-diagnostics 2>/dev/null || true
            git push -f origin ci-diagnostics && break
            sleep 5
          done

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libmithril-${{ matrix.abi }}
          path: build-${{ matrix.abi }}/libmithril.so
          if-no-files-found: error

      - name: Upload hook .so
        uses: actions/upload-artifact@v4
        with:
          name: libmithril-vkhook-${{ matrix.abi }}
          path: build-${{ matrix.abi }}/libmithril_vkhook.so
          # Not error: the hook is best-effort, and the APK step already copes
          # with it being absent.
          if-no-files-found: warn

  apk:
    name: Package APK
    needs: native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ABI artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-out

      - name: Place libraries into jniLibs
        run: |
          set -e
          mkdir -p android/app/src/main/jniLibs
          # Explicit ABI list: the artifact names are libmithril-<abi> and
          # libmithril-vkhook-<abi>, and a glob over libmithril-* would read the
          # hook directory as an ABI called "vkhook-<abi>".
          for abi in arm64-v8a armeabi-v7a x86_64; do
            [ -f "native-out/libmithril-$abi/libmithril.so" ] || continue
            mkdir -p "android/app/src/main/jniLibs/$abi"
            cp "native-out/libmithril-$abi/libmithril.so" \
               "android/app/src/main/jniLibs/$abi/libmithril.so"
            # The hook lives beside libmithril.so so it can be found by
            # dladdr()ing our own mapping; it is dlopen'd, never linked.
            if [ -f "native-out/libmithril-vkhook-$abi/libmithril_vkhook.so" ]; then
              cp "native-out/libmithril-vkhook-$abi/libmithril_vkhook.so" \
                 "android/app/src/main/jniLibs/$abi/libmithril_vkhook.so"
            fi
          done
          find android/app/src/main/jniLibs -type f | sort

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        # Use the SDK already on the runner image rather than the
        # android-actions/setup-android action, which fails here on license
        # acceptance. Install the exact platform/build-tools the module needs.
        run: |
          set -e
          if [ -z "${ANDROID_HOME:-}" ] && [ -d /usr/local/lib/android/sdk ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          if [ -z "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME"
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM=$(command -v sdkmanager); fi
          test -n "$SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        # Pinned distribution rather than a wrapper: there is no committed
        # gradle-wrapper.jar, and downloading a fixed version keeps the build
        # reproducible.
        run: |
          set -e
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo ln -sf /opt/gradle-8.7/bin/gradle /usr/local/bin/gradle
          gradle --version | head -3

      - name: Assemble APK
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease 2>&1 | tee gradle.log
          exit "${PIPESTATUS[0]}"

      - name: Upload gradle log
        # Job logs are unreachable from here, so ship the gradle output as an
        # artifact - those are always readable through the API.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-gradle-log
          path: android/gradle.log
          if-no-files-found: ignore

      - name: Publish gradle log (diagnosis)
        # Same reason as the native stage: job logs sit in blob storage that is
        # not reachable from everywhere, while a file on ci-diagnostics is
        # readable through the API.
        if: failure()
        continue-on-error: true
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-diagnostics 2>/dev/null || true
          git checkout -B ci-diagnostics origin/ci-diagnostics 2>/dev/null \
            || git checkout -B ci-diagnostics
          mkdir -p ci-logs
          # Prefix with a marker so an empty/failed gradle run is still obvious.
          { echo "run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}";             echo "--- android/gradle.log ---";             tail -300 android/gradle.log 2>&1 || echo "(no gradle.log)"; } > ci-logs/android-apk-gradle.log
          git add ci-logs/android-apk-gradle.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci(android): APK gradle log [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin ci-diagnostics 2>/dev/null || true
            git push -f origin ci-diagnostics && break
            sleep 5
          done

      - name: Verify the APK actually contains the libraries
        # An APK that builds but does not carry the .so is useless to a
        # launcher, so check the packaged entries rather than trusting AGP.
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          test -n "$APK"
          echo "APK: $APK"
          unzip -l "$APK" | sed -n '1,40p'
          # The abiFilters in build.gradle.kts decide which ABIs ship; whichever
          # are present must contain the library, and arm64-v8a is the one a real
          # device needs.
          for abi in $(unzip -l "$APK" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u); do
            unzip -l "$APK" | grep -q "lib/$abi/libmithril.so" || {
              echo "APK ships $abi but no libmithril.so in it"; exit 1; }
          done
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmithril.so"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mithril-android-plugin-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

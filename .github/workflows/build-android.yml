name: Android build

on:
  push:
    branches-ignore:
      - 'l10n_main'
  pull_request:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: Build libmithril.so (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Configure
        run: |
          # c++_static: Gradle does not package libc++_shared.so for a prebuilt
          # .so dropped into jniLibs - it only does that for libraries it builds
          # itself. A c++_shared build therefore dlopen()s with "library not
          # found" on device. Static linking removes the dependency entirely.
          cmake -S . -B "build-${{ matrix.abi }}" \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_STL=c++_static \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          set -o pipefail
          cmake --build "build-${{ matrix.abi }}" --target mithril -j"$(nproc)" 2>&1 | tee "native-${{ matrix.abi }}.log"

      - name: Build driver-selection hook
        # This is a required part of the custom-driver WSI path. Shipping the
        # APK without it produces a green build that can create a Turnip
        # VkDevice but cannot obtain Android surface/swapchain support.
        run: |
          set -o pipefail
          cmake --build "build-${{ matrix.abi }}" --target mithril_vkhook -j"$(nproc)" 2>&1 | tee "hook-${{ matrix.abi }}.log"

      - name: Verify native outputs and runtime dependencies
        run: |
          set -e
          READELF="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          SO=$(find "build-${{ matrix.abi }}" -name 'libmithril.so' -type f | head -1)
          HOOK=$(find "build-${{ matrix.abi }}" -name 'libmithril_vkhook.so' -type f | head -1)
          test -n "$SO"
          test -n "$HOOK"
          "$READELF" -d "$SO" | tee "needed-${{ matrix.abi }}.log"
          "$READELF" -d "$HOOK" | tee "needed-hook-${{ matrix.abi }}.log"
          if grep -q "libc++_shared" "needed-${{ matrix.abi }}.log"; then
            echo "::error::libmithril.so needs libc++_shared.so, which the APK does not package"
            exit 1
          fi
          if grep -q "libc++_shared" "needed-hook-${{ matrix.abi }}.log"; then
            echo "::error::libmithril_vkhook.so needs libc++_shared.so, which the APK does not package"
            exit 1
          fi
          "$READELF" -Ws "$HOOK" | grep -q ' mithril_vkhook_init$'
          "$READELF" -Ws "$HOOK" | grep -q ' android_dlopen_ext$'
          "$READELF" -Ws "$HOOK" | grep -q ' android_load_sphal_library$'

      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-diagnostics-${{ matrix.abi }}
          path: |
            native-${{ matrix.abi }}.log
            hook-${{ matrix.abi }}.log
            needed-${{ matrix.abi }}.log
            needed-hook-${{ matrix.abi }}.log
          if-no-files-found: ignore

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libmithril-${{ matrix.abi }}
          path: build-${{ matrix.abi }}/libmithril.so
          if-no-files-found: error

      - name: Upload hook .so
        uses: actions/upload-artifact@v4
        with:
          name: libmithril-vkhook-${{ matrix.abi }}
          path: build-${{ matrix.abi }}/libmithril_vkhook.so
          if-no-files-found: error

  apk:
    name: Package APK
    needs: native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ABI artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-out

      - name: Place libraries into jniLibs
        run: |
          set -e
          mkdir -p android/app/src/main/jniLibs
          # Explicit ABI list: the artifact names are libmithril-<abi> and
          # libmithril-vkhook-<abi>, and a glob over libmithril-* would read the
          # hook directory as an ABI called "vkhook-<abi>".
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "native-out/libmithril-$abi/libmithril.so"
            test -f "native-out/libmithril-vkhook-$abi/libmithril_vkhook.so"
            mkdir -p "android/app/src/main/jniLibs/$abi"
            cp "native-out/libmithril-$abi/libmithril.so" \
               "android/app/src/main/jniLibs/$abi/libmithril.so"
            cp "native-out/libmithril-vkhook-$abi/libmithril_vkhook.so" \
               "android/app/src/main/jniLibs/$abi/libmithril_vkhook.so"
          done
          find android/app/src/main/jniLibs -type f | sort

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        # Use the SDK already on the runner image rather than the
        # android-actions/setup-android action, which fails here on license
        # acceptance. Install the exact platform/build-tools the module needs.
        run: |
          set -e
          if [ -z "${ANDROID_HOME:-}" ] && [ -d /usr/local/lib/android/sdk ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          if [ -z "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME"
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM=$(command -v sdkmanager); fi
          test -n "$SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        # Pinned distribution rather than a wrapper: there is no committed
        # gradle-wrapper.jar, and downloading a fixed version keeps the build
        # reproducible.
        run: |
          set -e
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo ln -sf /opt/gradle-8.7/bin/gradle /usr/local/bin/gradle
          gradle --version | head -3

      - name: Assemble APK
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease 2>&1 | tee gradle.log
          exit "${PIPESTATUS[0]}"

      - name: Upload gradle log
        # Job logs are unreachable from here, so ship the gradle output as an
        # artifact - those are always readable through the API.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-gradle-log
          path: android/gradle.log
          if-no-files-found: ignore

      - name: Verify the APK actually contains the libraries
        # An APK that builds but does not carry the .so is useless to a
        # launcher, so check the packaged entries rather than trusting AGP.
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          test -n "$APK"
          echo "APK: $APK"
          unzip -l "$APK" | sed -n '1,40p'
          # The abiFilters in build.gradle.kts decide which ABIs ship; whichever
          # are present must contain the library, and arm64-v8a is the one a real
          # device needs.
          for abi in $(unzip -l "$APK" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u); do
            unzip -l "$APK" | grep -q "lib/$abi/libmithril.so" || {
              echo "APK ships $abi but no libmithril.so in it"; exit 1; }
            unzip -l "$APK" | grep -q "lib/$abi/libmithril_vkhook.so" || {
              echo "APK ships $abi but no libmithril_vkhook.so in it"; exit 1; }
          done
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmithril.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmithril_vkhook.so"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mithril-android-plugin-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

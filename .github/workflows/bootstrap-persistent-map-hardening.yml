name: Bootstrap persistent map hardening

on:
  push:
    branches:
      - fix/mobilegl-style-mc262-startup-preflight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobilegl-style-mc262-startup-preflight
          fetch-depth: 2
      - name: Apply persistent-map hardening
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_persistent_map_hardening.py
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mithril-Wrapper-cpp tests/render_smoke.c
          git rm .github/scripts/apply_persistent_map_hardening.py
          git commit -m 'fix: wire persistent GL maps to Vulkan host memory'
          git push origin HEAD:fix/mobilegl-style-mc262-startup-preflight
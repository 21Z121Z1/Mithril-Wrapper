name: directmetal-unify-once

on:
  push:
    branches:
      - integration/directmetal-unified-20260815

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Skip after integration commit
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -q '\[directmetal-unify-applied\]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch DirectMetal source branch
        if: steps.guard.outputs.skip != 'true'
        run: git fetch origin agent/directmetal-fbo-sampling-a17pro

      - name: Apply minimal COPY_READ/COPY_WRITE buffer semantics
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          internal = Path('src/gl/internal.h')
          text = internal.read_text()
          old = '''extern GLuint g_bound_array_buffer;
          extern GLuint g_bound_element_buffer;
          extern GLuint g_bound_uniform_buffer;
          extern GLuint g_bound_pixel_pack_buffer;'''
          new = '''extern GLuint g_bound_array_buffer;
          extern GLuint g_bound_element_buffer;
          extern GLuint g_bound_uniform_buffer;
          extern GLuint g_bound_copy_read_buffer;
          extern GLuint g_bound_copy_write_buffer;
          extern GLuint g_bound_pixel_pack_buffer;'''
          if old not in text:
              raise SystemExit('internal.h buffer binding anchor not found')
          internal.write_text(text.replace(old, new, 1))

          vertex = Path('src/gl/vertex.cpp')
          text = vertex.read_text()
          replacements = [
              ('''GLuint g_bound_element_buffer = 0;
          GLuint g_bound_uniform_buffer = 0;
          GLuint g_bound_pixel_pack_buffer = 0;''',
               '''GLuint g_bound_element_buffer = 0;
          GLuint g_bound_uniform_buffer = 0;
          GLuint g_bound_copy_read_buffer = 0;
          GLuint g_bound_copy_write_buffer = 0;
          GLuint g_bound_pixel_pack_buffer = 0;'''),
              ('''        if (g_bound_uniform_buffer == buffers[i]) g_bound_uniform_buffer = 0;
                  if (g_bound_pixel_pack_buffer == buffers[i])''',
               '''        if (g_bound_uniform_buffer == buffers[i]) g_bound_uniform_buffer = 0;
                  if (g_bound_copy_read_buffer == buffers[i]) g_bound_copy_read_buffer = 0;
                  if (g_bound_copy_write_buffer == buffers[i]) g_bound_copy_write_buffer = 0;
                  if (g_bound_pixel_pack_buffer == buffers[i])'''),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'vertex.cpp anchor not found: {old!r}')
              text = text.replace(old, new, 1)

          # These three switch blocks occur in glBindBuffer, glBufferData,
          # glBufferSubData and BoundBufferForTarget. Insert the two GL 3.3
          # copy-buffer targets everywhere without importing the agent branch's
          # device-specific TRACE instrumentation.
          bind_old = '        case GL_UNIFORM_BUFFER: g_bound_uniform_buffer = buffer; break;\n'
          bind_new = bind_old + '''        case GL_COPY_READ_BUFFER: g_bound_copy_read_buffer = buffer; break;
                  case GL_COPY_WRITE_BUFFER: g_bound_copy_write_buffer = buffer; break;
          '''
          if text.count(bind_old) != 1:
              raise SystemExit(f'unexpected glBindBuffer anchor count: {text.count(bind_old)}')
          text = text.replace(bind_old, bind_new, 1)

          ptr_old = '        case GL_UNIFORM_BUFFER: bound = &g_bound_uniform_buffer; break;\n'
          ptr_new = ptr_old + '''        case GL_COPY_READ_BUFFER: bound = &g_bound_copy_read_buffer; break;
                  case GL_COPY_WRITE_BUFFER: bound = &g_bound_copy_write_buffer; break;
          '''
          count = text.count(ptr_old)
          if count != 3:
              raise SystemExit(f'unexpected bound-target anchor count: {count}')
          text = text.replace(ptr_old, ptr_new)
          vertex.write_text(text)
          PY
          git add src/gl/internal.h src/gl/vertex.cpp

      - name: Apply reviewed FBO, lifecycle and fail-closed semantics
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff f223cd4d0d8da9051ffd3cfc293c39407c14e538^ \
            f223cd4d0d8da9051ffd3cfc293c39407c14e538 -- \
            src/gl/fbo.cpp \
            src/gl/stub.cpp \
            tests/fbo_smoke.c \
            tests/amethyst_egl_smoke.mm \
            tests/layered_fbo_smoke.c \
            tests/unsupported_stub_smoke.c \
            cmake/MithrilSmokeTests.cmake | git apply --3way --index

      - name: Review staged diff mechanically
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          git diff --cached --stat
          ! git diff --cached | grep -E 'TRACE BUFFER|GUI VBO 33|TRACE FBO|TRACE SHADER'
          git diff --cached -- src/gl/internal.h src/gl/vertex.cpp src/gl/fbo.cpp src/gl/stub.cpp

      - name: Fetch DirectMetal shader submodules only
        if: steps.guard.outputs.skip != 'true'
        run: >-
          git submodule update --init --depth=1
          third_party/SPIRV-Cross
          third_party/SPIRV-Headers
          third_party/glslang

      - name: Configure DirectMetal
        if: steps.guard.outputs.skip != 'true'
        run: >-
          cmake -S . -B build-direct -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=OFF
          -DMITHRIL_BUILD_DIRECT=ON
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON
          -DMITHRIL_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/build-direct/artifacts"

      - name: Build DirectMetal and tests
        if: steps.guard.outputs.skip != 'true'
        run: cmake --build build-direct --parallel

      - name: Run DirectMetal semantic suite
        if: steps.guard.outputs.skip != 'true'
        run: ctest --test-dir build-direct -L directmetal --output-on-failure

      - name: Verify shipping boundary
        if: steps.guard.outputs.skip != 'true'
        run: |
          chmod +x scripts/verify_directmetal_artifact.sh
          scripts/verify_directmetal_artifact.sh \
            build-direct/artifacts/libmithril.dylib \
            build-direct/mithril_direct.boundary.json

      - name: Commit validated consolidation
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short
          git commit -m 'DirectMetal: absorb validated branch semantics [directmetal-unify-applied]'
          git push origin HEAD:integration/directmetal-unified-20260815

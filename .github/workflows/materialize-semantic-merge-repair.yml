name: Materialize semantic merge repair

on:
  push:
    branches:
      - 'fix/gl-semantic-closure-integration-20260816'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: semantic-merge-repair
  cancel-in-progress: true

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message || '', '[merge-repaired]') && !contains(github.event.head_commit.message || '', '[mrt-materialized]') }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MITHRIL_BACKEND: metal
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - name: Three-way merge concurrent target and semantic changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 7008034076a36870fe10368c3a88e94c49d7dc58 \
                           254122e37485f9815cc9a3e36b081af59877d592 \
                           becdb9caa40842e970916cae8f8db17753af7973
          for path in Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp Mithril-Wrapper-cpp/MG_State/State.h; do
            mkdir -p "$(dirname "$path")"
            git show 254122e37485f9815cc9a3e36b081af59877d592:"$path" > /tmp/current
            git show 7008034076a36870fe10368c3a88e94c49d7dc58:"$path" > /tmp/base
            git show becdb9caa40842e970916cae8f8db17753af7973:"$path" > /tmp/semantic
            git merge-file -p /tmp/current /tmp/base /tmp/semantic > "$path" || {
              echo "three-way conflict in $path"
              grep -n -C 5 '<<<<<<<\|=======\|>>>>>>>' "$path" || true
              exit 1
            }
          done
          grep -q 'currentDrawID' Mithril-Wrapper-cpp/MG_State/State.h
          grep -q 'semantic_trace_eventf' Mithril-Wrapper-cpp/MG_State/State.h
          grep -q 'account_software_primitive_queries' Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp
          git diff --check

      - name: Install native dependencies
        run: brew install vulkan-loader molten-vk ninja

      - name: Build repaired dual-backend library
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-repair -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-repair --target mithril --parallel

      - name: Commit validated merge repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp Mithril-Wrapper-cpp/MG_State/State.h
          git diff --cached --check
          git commit -m 'fix(ci): preserve concurrent draw state in semantic integration [merge-repaired]'
          git push origin HEAD:fix/gl-semantic-closure-integration-20260816

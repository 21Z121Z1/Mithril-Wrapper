name: verify-lazy-buffer-storage

on:
  push:
    branches: [perf/directmetal-lazy-buffer-storage-20260817]

permissions:
  contents: write

concurrency:
  group: verify-lazy-buffer-storage
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/directmetal-lazy-buffer-storage-20260817
          submodules: false
          fetch-depth: 0

      - name: Fetch DirectMetal shader submodules
        run: >-
          git submodule update --init --depth=1
          third_party/SPIRV-Cross
          third_party/SPIRV-Headers
          third_party/glslang

      - name: Apply lazy buffer storage phase
        run: python3 scripts/apply_lazy_buffer_storage_phase3.py

      - name: Verify source invariants
        run: |
          git diff --check
          ! grep -q 'data.assign((size_t)size, 0)' src/gl/vertex.cpp
          grep -q 'size_t storage_size = 0;' src/gl/internal.h
          grep -q 'void EnsureMaterialized()' src/gl/internal.h
          grep -q 'buffer.data.clear();' src/gl/vertex.cpp
          grep -q '!buffer.IsMaterialized() && full_write' src/gl/vertex.cpp
          grep -q 'lazy_buffer_storage_smoke' cmake/MithrilSmokeTests.cmake

      - name: Configure DirectMetal Release build
        run: >-
          cmake -S . -B build-direct -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=OFF
          -DMITHRIL_BUILD_DIRECT=ON
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON

      - name: Build DirectMetal and regression tests
        run: cmake --build build-direct --parallel

      - name: Run dedicated lazy-storage regression
        run: ctest --test-dir build-direct -R '^lazy_buffer_storage_smoke$' --output-on-failure

      - name: Run complete DirectMetal semantic suite
        run: ctest --test-dir build-direct -L directmetal --output-on-failure

      - name: Commit verified implementation
        run: |
          rm .github/workflows/verify-lazy-buffer-storage.yml
          rm scripts/apply_lazy_buffer_storage_phase3.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf: lazily materialize NULL GL buffer stores'
          git push origin HEAD:perf/directmetal-lazy-buffer-storage-20260817

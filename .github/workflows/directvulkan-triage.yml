name: DirectVulkan runtime triage

on:
  push:
    branches:
      - codex/directvulkan-overnight-recovery-20260814
  workflow_dispatch:

concurrency:
  group: directvulkan-triage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-lavapipe-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Vulkan software stack
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libvulkan-dev vulkan-tools mesa-vulkan-drivers

      - name: Build DirectVulkan
        run: |
          cmake -S . -B build-triage -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS='-Wno-error' \
            -DCMAKE_CXX_FLAGS='-Wno-error'
          cmake --build build-triage --target mithril -j2

      - name: Compile smoke drivers
        run: |
          clang -std=c11 -O0 -g -Wall -Wextra -IMithril-Wrapper-cpp/include -o tests/gl_smoke_triage tests/gl_smoke.c -ldl
          clang -D_GNU_SOURCE -std=c11 -O0 -g -Wall -Wextra -IMithril-Wrapper-cpp/include -o tests/render_smoke_triage tests/render_smoke.c -ldl
          clang -std=c11 -O0 -g -Wall -Wextra -IMithril-Wrapper-cpp/include -o tests/egl_sync_smoke_triage tests/egl_sync_smoke.c -ldl
          clang -D_GNU_SOURCE -std=c11 -O0 -g -Wall -Wextra -IMithril-Wrapper-cpp/include -o tests/overnight_regression_smoke_triage tests/overnight_regression_smoke.c -ldl

      - name: Resolve runtime and Vulkan closure
        run: |
          set -euo pipefail
          LIB=$(realpath "$(find build-triage -name 'libmithril.so' -type f | head -1)")
          test -f "$LIB"
          echo "MITHRIL_LIB=$LIB" >> "$GITHUB_ENV"
          ICD=$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)
          test -f "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          ldd -r "$LIB" 2>&1 | tee /tmp/mithril-ldd-r.txt
          ! grep -E 'undefined symbol|not found' /tmp/mithril-ldd-r.txt

      - name: GL state/API smoke
        env:
          MITHRIL_DEBUG: '1'
        run: ./tests/gl_smoke_triage "$MITHRIL_LIB"

      - name: Generic GL to Vulkan FBO draw and readback
        env:
          MITHRIL_DEBUG: '1'
        run: ./tests/render_smoke_triage "$MITHRIL_LIB"

      - name: EGL synchronization smoke
        env:
          MITHRIL_DEBUG: '1'
        run: ./tests/egl_sync_smoke_triage "$MITHRIL_LIB"

      - name: Overnight root-cause regressions
        env:
          MITHRIL_DEBUG: '1'
        run: ./tests/overnight_regression_smoke_triage "$MITHRIL_LIB"

      - name: Integrity
        if: always()
        run: |
          git diff --check 1e7f6b7a1941dcc6e4cef5b5e20359291f9924cb..HEAD
          ! grep -q 'GUI CULL PROBE' Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp

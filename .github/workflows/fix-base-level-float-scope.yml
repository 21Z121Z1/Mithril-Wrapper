name: restore-float-base-level-scope-once

on:
  pull_request:
    branches: [integration/directmetal-next]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/minecraft26-directmetal-runtime-closure-20260819'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore pre-existing float BASE_LEVEL behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/gl/texture.cpp')
          text = p.read_text()
          old = '''    if (pname == GL_TEXTURE_BASE_LEVEL || pname == GL_TEXTURE_MAX_LEVEL) {\n        if (param < 0.0f || param > static_cast<GLfloat>(INT32_MAX)) {\n            PUSH_ERROR(GL_INVALID_VALUE);\n            return;\n        }\n        const GLint level = static_cast<GLint>(param);\n        if (static_cast<GLfloat>(level) != param) {\n            PUSH_ERROR(GL_INVALID_VALUE);\n            return;\n        }\n        glTexParameteri(target, pname, level);\n        return;\n    }\n'''
          new = '''    if (pname == GL_TEXTURE_BASE_LEVEL) {\n        // Preserve the pre-existing level-zero-only frontend behavior; correct\n        // non-zero BASE_LEVEL lowering remains outside this Minecraft fix.\n        return;\n    }\n    if (pname == GL_TEXTURE_MAX_LEVEL) {\n        if (param < 0.0f || param > static_cast<GLfloat>(INT32_MAX)) {\n            PUSH_ERROR(GL_INVALID_VALUE);\n            return;\n        }\n        const GLint level = static_cast<GLint>(param);\n        if (static_cast<GLfloat>(level) != param) {\n            PUSH_ERROR(GL_INVALID_VALUE);\n            return;\n        }\n        glTexParameteri(target, pname, level);\n        return;\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'float BASE/MAX anchor count={text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/fix-base-level-float-scope.yml').unlink()
      - name: Validate product-only diff
        run: |
          git diff --check
          test ! -e .github/workflows/fix-base-level-float-scope.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/gl/texture.cpp').read_text()
          if 'if (pname == GL_TEXTURE_BASE_LEVEL || pname == GL_TEXTURE_MAX_LEVEL)' in text:
              raise SystemExit('combined BASE/MAX float path remains')
          if text.count('st.max_level = param;') != 1:
              raise SystemExit('integer MAX_LEVEL state write changed unexpectedly')
          PY
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only tests/texture_level_window_smoke.c
      - name: Commit scope correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve float texture base-level behavior'
          git push origin HEAD:${{ github.head_ref }}

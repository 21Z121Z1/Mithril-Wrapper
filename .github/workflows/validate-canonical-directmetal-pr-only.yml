name: Canonical DirectMetal Minecraft E2E PR gate

on:
  pull_request:
    branches: [ci/minecraft-on-mithril-e2e-20260815]

permissions:
  contents: read

concurrency:
  group: canonical-directmetal-minecraft-pr-only-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  canonical-minecraft:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CANONICAL_SHA: 094e8a6f7f47d10c9211f7ffd513511804f42993
      E2E_ROOT: ${{ github.workspace }}/build/canonical-pr-only-evidence
      MTL_DEBUG_LAYER: '1'
      MTL_SHADER_VALIDATION: '0'
      MITHRIL_BACKEND: metal

    steps:
      - name: Checkout validation harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: validation/directmetal-performance-e2e-20260818
          submodules: false
          persist-credentials: false

      - name: Checkout exact canonical source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 094e8a6f7f47d10c9211f7ffd513511804f42993
          path: canonical
          submodules: recursive
          persist-credentials: false

      - name: Prove source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$E2E_ROOT"
          actual=$(git -C canonical rev-parse HEAD)
          printf 'expected=%s\nactual=%s\n' "$CANONICAL_SHA" "$actual" | tee "$E2E_ROOT/canonical-identity.txt"
          test "$actual" = "$CANONICAL_SHA"
          test -z "$(git -C canonical status --porcelain)"

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
          cache-cleanup: on-success

      - name: Install native dependencies
        shell: bash
        run: brew install glfw ninja

      - name: Build exact canonical DirectMetal
        id: native
        shell: bash
        run: |
          set -euo pipefail
          cmake -S canonical -B build-canonical -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMITHRIL_BUILD_LEGACY=OFF \
            -DMITHRIL_BUILD_DIRECT=ON \
            -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON \
            -DMITHRIL_OUTPUT_DIRECTORY="$PWD/build-canonical/artifacts"
          cmake --build build-canonical --target mithril_direct --parallel
          dylib="$PWD/build-canonical/artifacts/libmithril.dylib"
          test -s "$dylib"
          echo "dylib=$dylib" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$dylib" | tee "$E2E_ROOT/built-mithril.sha256"
          file "$dylib" | tee "$E2E_ROOT/built-mithril.file.txt"
          otool -L "$dylib" | tee "$E2E_ROOT/built-mithril.otool.txt"

      - name: Native real-GPU draw/readback oracle
        shell: bash
        env:
          MITHRIL_DYLIB: ${{ steps.native.outputs.dylib }}
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          clang -std=c11 -O0 -Wall -Wextra \
            -Icanonical/include -Icanonical/third_party \
            -o build-canonical/render_smoke tests/render_smoke.c -ldl
          build-canonical/render_smoke "$MITHRIL_DYLIB" \
            | tee "$E2E_ROOT/native-render-smoke.log"

      - name: Layered texture Metal-slice oracle
        shell: bash
        env:
          MITHRIL_DYLIB: ${{ steps.native.outputs.dylib }}
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          clang -std=c11 -O0 -Wall -Wextra -Werror \
            -Icanonical/include -Icanonical/third_party \
            -o build-canonical/directmetal_layered_texture_smoke \
            tests/directmetal_layered_texture_smoke.c -ldl
          build-canonical/directmetal_layered_texture_smoke "$MITHRIL_DYLIB" \
            | tee "$E2E_ROOT/native-layered-texture-smoke.log"

      - name: Build GLFW to canonical Mithril bridge
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-canonical/bridge
          GLFW_PREFIX=$(brew --prefix glfw)
          GLFW_REAL="$GLFW_PREFIX/lib/libglfw.3.dylib"
          test -f "$GLFW_REAL" || GLFW_REAL="$GLFW_PREFIX/lib/libglfw.dylib"
          BRIDGE="$PWD/build-canonical/bridge/libglfw_mithril.dylib"
          clang++ -std=c++20 -fobjc-arc -dynamiclib -Wall -Wextra -Werror \
            ci/minecraft-e2e/native/glfw_mithril_bridge.mm \
            ci/minecraft-e2e/native/prepresent_capture.mm \
            -I"$GLFW_PREFIX/include" -Icanonical/include -Icanonical/third_party \
            -framework AppKit -framework QuartzCore -framework Foundation \
            -Wl,-reexport_library,"$GLFW_REAL" \
            -o "$BRIDGE"
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"
          echo "glfw_real=$GLFW_REAL" >> "$GITHUB_OUTPUT"
          file "$BRIDGE" | tee "$E2E_ROOT/glfw-bridge.file.txt"
          otool -L "$BRIDGE" | tee "$E2E_ROOT/glfw-bridge.otool.txt"

      - name: Real Minecraft 26.2 Client GameTest
        shell: bash
        run: |
          set -euo pipefail
          gradle -p .github/ci/minecraft-e2e --build-cache --stacktrace \
            -PmithrilDylib="${{ steps.native.outputs.dylib }}" \
            -PglfwBridge="${{ steps.bridge.outputs.bridge }}" \
            -PglfwDelegate="${{ steps.bridge.outputs.glfw_real }}" \
            -PevidenceRoot="$E2E_ROOT" \
            runProductionClientGameTest \
            | tee "$E2E_ROOT/minecraft-gradle.log"

      - name: Verify exact loaded image and DirectMetal presentation
        shell: bash
        env:
          MITHRIL_DYLIB: ${{ steps.native.outputs.dylib }}
        run: |
          set -euo pipefail
          python3 - "$E2E_ROOT" "$MITHRIL_DYLIB" "$CANONICAL_SHA" <<'PY'
          import hashlib, json, pathlib, sys
          root=pathlib.Path(sys.argv[1]); built=pathlib.Path(sys.argv[2]).resolve(); canonical=sys.argv[3]
          state=json.loads((root/'bridge-state.json').read_text())
          loaded=pathlib.Path(state['mithril_path']).resolve()
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          result={
              'canonical_sha': canonical,
              'built_path': str(built), 'loaded_path': str(loaded),
              'built_sha256': sha(built), 'loaded_sha256': sha(loaded),
              'exact_image': sha(built)==sha(loaded),
              'context_count': state.get('context_count',0),
              'swap_count': state.get('swap_count',0),
              'get_proc_address_count': state.get('get_proc_address_count',0),
              'gl_vendor': state.get('gl_vendor',''),
              'gl_renderer': state.get('gl_renderer',''),
              'gl_version': state.get('gl_version','')}
          (root/'canonical-runtime-identity.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          assert result['exact_image']
          assert result['context_count'] >= 1
          assert result['swap_count'] >= 2
          assert 'Mithril-Wrapper' in result['gl_version'] and 'Metal 3 (DirectMetal)' in result['gl_version']
          assert 'Mithril-Wrapper' in result['gl_renderer'] and 'DirectMetal' in result['gl_renderer']
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-directmetal-pr-only-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: build/canonical-pr-only-evidence/**

name: apply-directmetal-first-clear-flush

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-metal-gpu-probe-direct-metal-20260810

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MITHRIL_BACKEND: metal
      MITHRIL_EXPECT_RENDERER: Mithril DirectMetal
      MITHRIL_LIBRARY: ./output/libmithril.dylib
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Flush deferred texture storage before the first clear
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/gl/state.cpp')
          text = path.read_text()
          old = (
              '    if (!v::EnsureInit()) {\n'
              '        PUSH_ERROR(GL_INVALID_OPERATION);\n'
              '        return false;\n'
              '    }\n'
              '    auto& st = s::GetState();\n'
          )
          new = (
              '    if (!v::EnsureInit()) {\n'
              '        PUSH_ERROR(GL_INVALID_OPERATION);\n'
              '        return false;\n'
              '    }\n'
              '    // A clear may be the first GPU operation in a context. Texture storage\n'
              '    // created before lazy backend initialization must be resident before an\n'
              '    // attached FBO can be resolved, just as DrawCommon already guarantees.\n'
              '    if (!g_dirty_textures.empty()) FlushDirtyTextureUploads();\n'
              '    auto& st = s::GetState();\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one SubmitClear init block, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/gl/state.cpp

      - name: Build DirectMetal backend
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-hosted-metal -DCMAKE_BUILD_TYPE=Release
          cmake --build build-hosted-metal -j"$(sysctl -n hw.ncpu)"
          ln -sf libmithril.dylib output/libmithril.so

      - name: Prove first-operation FBO clear and broad FBO coverage
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra .github/ci/HostedDirectMetalFboProbe.c \
            -o "$RUNNER_TEMP/directmetal-base-fbo-probe"
          "$RUNNER_TEMP/directmetal-base-fbo-probe"
          clang -std=c11 -Wall -Wextra tests/fbo_smoke.c -o "$RUNNER_TEMP/fbo_smoke"
          "$RUNNER_TEMP/fbo_smoke"

      - name: Commit verified fix to experiment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/gl/state.cpp
          git commit -m 'fix: flush texture storage before first framebuffer clear'
          git push origin HEAD:ci/hosted-metal-gpu-probe-direct-metal-20260810

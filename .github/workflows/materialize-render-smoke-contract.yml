name: Materialize render smoke GL 3.3 contract

on:
  push:
    branches: ['fix/gl-semantic-closure-integration-20260816']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-render-smoke-contract
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message || '', '[render-smoke-contract]') }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MITHRIL_BACKEND: metal
      MTL_DEBUG_LAYER: '1'
      MTL_SHADER_VALIDATION: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - name: Update only stale GL version assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/render_smoke.c')
          s=p.read_text()
          replacements={
            '本测试驱动完整 GL 4.6 Core 渲染管线': '本测试驱动已广告的 GL 3.3 Core 渲染管线',
            'CHECK(major == 4 && minor == 6,\n          "GL version %d.%d (backend-up, glGetIntegerv un-hijacked)", major, minor);': 'CHECK(major == 3 && minor == 3,\n          "GL version %d.%d matches advertised 3.3 contract", major, minor);',
            'CHECK(ver && strstr(ver, "4.6"), "glGetString(GL_VERSION): %s", ver ? ver : "(null)");': 'CHECK(ver && strstr(ver, "3.3.0") && strstr(ver, "Mithril-Wrapper"),\n          "glGetString(GL_VERSION) matches contracted 3.3 wrapper identity: %s",\n          ver ? ver : "(null)");',
          }
          for old,new in replacements.items():
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'expected one stale render-smoke anchor, got {n}: {old!r}')
              s=s.replace(old,new,1)
          if 'major == 4 && minor == 6' in s or 'strstr(ver, "4.6")' in s:
              raise SystemExit('stale GL 4.6 runtime assertion remains')
          p.write_text(s)
          PY
          git diff --check
          git diff -- tests/render_smoke.c

      - name: Install native dependencies
        run: brew install vulkan-loader molten-vk ninja

      - name: Build native Mithril
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-render-contract -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS='-Wno-error' -DCMAKE_CXX_FLAGS='-Wno-error'
          cmake --build build-render-contract --target mithril --parallel
          find build-render-contract -type f -name libmithril.dylib -print -quit > /tmp/mithril-path
          test -s /tmp/mithril-path

      - name: Run GL state and real GPU render smoke
        shell: bash
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          clang -std=c11 -O0 -Wall -Wextra -IMithril-Wrapper-cpp/include -o build-render-contract/gl_smoke tests/gl_smoke.c -ldl
          clang -std=c11 -O0 -Wall -Wextra -IMithril-Wrapper-cpp/include -o build-render-contract/render_smoke tests/render_smoke.c -ldl
          build-render-contract/gl_smoke "$(cat /tmp/mithril-path)" | tee build-render-contract/gl-smoke.log
          grep -F 'GL SMOKE ALL PASSED' build-render-contract/gl-smoke.log
          build-render-contract/render_smoke "$(cat /tmp/mithril-path)" | tee build-render-contract/render-smoke.log
          grep -F 'RENDER SMOKE ALL PASSED' build-render-contract/render-smoke.log

      - name: Commit only after both smokes pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/render_smoke.c
          git diff --cached --check
          git commit -m 'test: align render smoke with GL 3.3 contract [render-smoke-contract]'
          git push origin HEAD:fix/gl-semantic-closure-integration-20260816

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: render-smoke-contract-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: build-render-contract/*.log

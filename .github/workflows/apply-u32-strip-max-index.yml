name: Materialize U32 strip max-index fix

on:
  push:
    branches:
      - ci/minecraft-on-mithril-e2e-20260815
    paths:
      - '.github/workflows/apply-u32-strip-max-index.yml'
      - '.github/ci/apply_u32_strip_max_index_fix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ci/minecraft-on-mithril-e2e-20260815
          persist-credentials: true
          fetch-depth: 0

      - name: Apply guarded semantic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/apply_u32_strip_max_index_fix.py
          git diff --check
          git diff -- Mithril-Wrapper-cpp/MG_Backend/DirectMetal/MetalCommandStream.mm

      - name: Commit product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Mithril-Wrapper-cpp/MG_Backend/DirectMetal/MetalCommandStream.mm
          git commit -m 'fix: preserve ordinary U32 max indices on Metal strips'
          git push origin HEAD:ci/minecraft-on-mithril-e2e-20260815

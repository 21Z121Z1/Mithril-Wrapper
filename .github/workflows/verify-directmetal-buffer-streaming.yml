name: verify-directmetal-buffer-streaming

on:
  push:
    branches: [perf/directmetal-buffer-streaming-20260817]

permissions:
  contents: write

concurrency:
  group: verify-directmetal-buffer-streaming
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/directmetal-buffer-streaming-20260817
          submodules: false
          fetch-depth: 0

      - name: Fetch DirectMetal shader submodules
        run: >-
          git submodule update --init --depth=1
          third_party/SPIRV-Cross
          third_party/SPIRV-Headers
          third_party/glslang

      - name: Apply resident-buffer streaming phase
        run: python3 scripts/apply_directmetal_buffer_streaming_phase2_v3.py

      - name: Verify source invariants
        run: |
          git diff --check
          ! grep -q 'newBufferWithBytes:source_data' src/metal/engine.mm
          grep -q 'source_previous_content_version' src/backend/types.h
          grep -q 'partial_cpu_upload_bytes += update_size' src/metal/engine.mm
          grep -q 'copyFromBuffer:copy.source' src/metal/engine.mm
          grep -q 'directmetal_buffer_streaming_smoke' cmake/MithrilSmokeTests.cmake

      - name: Configure DirectMetal Release build
        run: >-
          cmake -S . -B build-direct -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=OFF
          -DMITHRIL_BUILD_DIRECT=ON
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON

      - name: Build DirectMetal and regression tests
        run: cmake --build build-direct --parallel

      - name: Run dedicated resident-buffer regression
        run: ctest --test-dir build-direct -R '^directmetal_buffer_streaming_smoke$' --output-on-failure

      - name: Run complete DirectMetal semantic suite
        run: ctest --test-dir build-direct -L directmetal --output-on-failure

      - name: Commit verified implementation
        run: |
          rm .github/workflows/verify-directmetal-buffer-streaming.yml
          rm scripts/apply_directmetal_buffer_streaming_phase2.py
          rm scripts/apply_directmetal_buffer_streaming_phase2_v3.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf: stream partial DirectMetal buffer generations'
          git push origin HEAD:perf/directmetal-buffer-streaming-20260817

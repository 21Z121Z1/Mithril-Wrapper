name: Bootstrap render-pass layout contract

on:
  push:
    branches:
      - fix/mobilegl-style-mc262-startup-preflight

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobilegl-style-mc262-startup-preflight
      - name: Apply render-pass layout contract fix
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_renderpass_layout_contract.py
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/CommandStream.cpp
          git rm .github/scripts/apply_renderpass_layout_contract.py
          git commit -m 'fix: align render-pass initial layouts with explicit barriers'
          git push origin HEAD:fix/mobilegl-style-mc262-startup-preflight
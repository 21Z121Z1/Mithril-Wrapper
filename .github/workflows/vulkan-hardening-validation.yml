name: Vulkan hardening validation

on:
  push:
    branches:
      - fix/mobilegl-style-mc262-startup-preflight
      - 'ci/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-metal-regressions:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Record runner provenance
        run: |
          sw_vers
          uname -a
          xcodebuild -version
          printf 'commit=%s\n' "$GITHUB_SHA" | tee runner-provenance.txt

      - name: Install MoltenVK runtime
        run: brew install vulkan-loader molten-vk

      - name: Configure and build Mithril
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Wno-error" \
            -DCMAKE_CXX_FLAGS="-Wno-error"
          cmake --build build --config Release --target mithril -j$(sysctl -n hw.ncpu)
          DYLIB=$(find build -name 'libmithril.dylib' -type f | head -1)
          test -n "$DYLIB"
          file "$DYLIB"
          shasum -a 256 "$DYLIB" | tee mithril-sha256.txt
          dwarfdump --uuid "$DYLIB" | tee mithril-uuid.txt

      - name: Run GL state-machine smoke
        run: |
          DYLIB=$(find build -name 'libmithril.dylib' -type f | head -1)
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          clang -std=c11 -O0 -Wall -Wextra \
            -IMithril-Wrapper-cpp/include \
            -o tests/gl_smoke tests/gl_smoke.c -ldl
          ./tests/gl_smoke "$DYLIB" | tee gl-smoke.log

      - name: Run real GPU render smoke
        run: |
          DYLIB=$(find build -name 'libmithril.dylib' -type f | head -1)
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export MITHRIL_DEBUG=1
          clang -std=c11 -O0 -Wall -Wextra \
            -IMithril-Wrapper-cpp/include \
            -o tests/render_smoke tests/render_smoke.c -ldl
          ./tests/render_smoke "$DYLIB" 2>&1 | tee render-smoke.log

      - name: Run EGL fence-sync smoke
        run: |
          DYLIB=$(find build -name 'libmithril.dylib' -type f | head -1)
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export MITHRIL_DEBUG=1
          clang -std=c11 -O0 -Wall -Wextra \
            -IMithril-Wrapper-cpp/include \
            -o tests/egl_sync_smoke tests/egl_sync_smoke.c -ldl
          ./tests/egl_sync_smoke "$DYLIB" 2>&1 | tee egl-sync-smoke.log

      - name: Run CAMetalLayer surface smoke
        run: |
          DYLIB=$(find build -name 'libmithril.dylib' -type f | head -1)
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          clang++ -std=c++17 -fobjc-arc -O0 -Wall -Wextra \
            -framework Foundation -framework QuartzCore -framework Metal \
            -o tests/surface_metal_smoke tests/surface_metal_smoke.mm -ldl
          ./tests/surface_metal_smoke "$DYLIB" 2>&1 | tee surface-metal-smoke.log

      - name: Verify synchronization contracts
        run: |
          grep -q 'MVK_CONFIG_MAX_ACTIVE_METAL_COMMAND_BUFFERS_PER_QUEUE' Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Device.cpp
          ! grep -q 'MVK_CONFIG_SUBMIT_COMMAND_BUFFERS_PER_QUEUE' Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Device.cpp
          grep -q 'imageAvailablePerFrame' Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Swapchain.h
          grep -q 'backend_wait_serial' Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp
          grep -q 'safe_device_wait_idle' Mithril-Wrapper-cpp/MG_Impl/gl.cpp
          grep -q 'acquireWait' Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Device.cpp
          grep -q 'backend_wait_serial' Mithril-Wrapper-cpp/egl/egl.cpp
          grep -q 'surface_destroy' Mithril-Wrapper-cpp/egl/egl.cpp
          ! grep -q 'object_setClass' Mithril-Wrapper-cpp/egl/SurfaceMetal.mm
          echo 'Vulkan/EGL synchronization and surface contracts OK'

      - name: Upload hardening evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mithril-macos26-hardening-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            runner-provenance.txt
            mithril-sha256.txt
            mithril-uuid.txt
            gl-smoke.log
            render-smoke.log
            egl-sync-smoke.log
            surface-metal-smoke.log
            build/**/libmithril.dylib

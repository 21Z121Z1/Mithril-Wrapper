name: Minecraft backend visual differential

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/minecraft-on-mithril-e2e-vulkan-*'

permissions:
  contents: read

concurrency:
  group: mithril-backend-visual-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-visual:
    name: Real Minecraft / ${{ matrix.variant }} / visual artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: metal
            backend: metal
            nondynamic_ubo: false
            native_3comp: false
          - variant: vulkan
            backend: vulkan
            nondynamic_ubo: false
            native_3comp: false
          - variant: vulkan-nondynamic-ubo
            backend: vulkan
            nondynamic_ubo: true
            native_3comp: false
          - variant: vulkan-native-3comp
            backend: vulkan
            nondynamic_ubo: false
            native_3comp: true
    runs-on: macos-26
    timeout-minutes: 30
    env:
      E2E_ROOT: ${{ github.workspace }}/build/minecraft-${{ matrix.variant }}-visual-artifacts
      GRADLE_OPTS: -Dorg.gradle.caching=true
      MITHRIL_BACKEND: ${{ matrix.backend }}
      MITHRIL_DEBUG: '1'
      MITHRIL_TRACE_GL_ERRORS: '1'
      MTL_DEBUG_LAYER: '1'
      MTL_SHADER_VALIDATION: '0'

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          persist-credentials: false

      - name: Add bounded GL error-origin instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Mithril-Wrapper-cpp/MG_State/State.cpp')
          s = p.read_text()
          old_include = '#include "State.h"\n'
          new_include = '''#include "State.h"\n\n#include <atomic>\n#include <cstdlib>\n#include <dlfcn.h>\n'''
          assert s.count(old_include) == 1
          s = s.replace(old_include, new_include, 1)
          old = '''void state_set_error(GLenum err) {\n    if (!g_state) return;\n    g_state->errors.recordGL(err);\n}\n'''
          new = '''void state_set_error(GLenum err) {\n    if (!g_state) return;\n    static const bool trace = std::getenv("MITHRIL_TRACE_GL_ERRORS") != nullptr;\n    static std::atomic<unsigned> trace_count{0};\n    if (trace && err != GL_NO_ERROR) {\n        const unsigned n = trace_count.fetch_add(1, std::memory_order_relaxed);\n        if (n < 128) {\n            Dl_info info{};\n            void* return_address = __builtin_return_address(0);\n            const char* caller = "<unknown>";\n            if (dladdr(return_address, &info) != 0 && info.dli_sname) caller = info.dli_sname;\n            MITHRIL_LOG_WARN("gl", "GL_ERROR_ORIGIN err=0x%04x caller=%s addr=%p seq=%u",\n                             (unsigned)err, caller, return_address, n + 1);\n        }\n    }\n    g_state->errors.recordGL(err);\n}\n'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check

      - name: Disable DirectVulkan dynamic UBO descriptors for A/B arm
        if: ${{ matrix.nondynamic_ubo }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/DescriptorSet.cpp')
          s = p.read_text()
          old = 'if (!wantDynamic.empty() && wantDynamicDescriptors <= dynamicCap) {'
          new = 'if (false && !wantDynamic.empty() && wantDynamicDescriptors <= dynamicCap) {'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          grep -n -A12 -B4 'false && !wantDynamic.empty' Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/DescriptorSet.cpp

      - name: Restore native DirectVulkan three-component vertex formats for A/B arm
        if: ${{ matrix.native_3comp }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Pipeline.cpp')
          s = p.read_text()
          replacements = {
              'case 3: return VK_FORMAT_R8G8B8A8_UINT;   case 4: return VK_FORMAT_R8G8B8A8_UINT;':
                  'case 3: return VK_FORMAT_R8G8B8_UINT;     case 4: return VK_FORMAT_R8G8B8A8_UINT;',
              'case 3: return VK_FORMAT_R16G16B16A16_SINT; case 4: return VK_FORMAT_R16G16B16A16_SINT;':
                  'case 3: return VK_FORMAT_R16G16B16_SINT;    case 4: return VK_FORMAT_R16G16B16A16_SINT;',
              'case 3: return VK_FORMAT_R16G16B16A16_UINT; case 4: return VK_FORMAT_R16G16B16A16_UINT;':
                  'case 3: return VK_FORMAT_R16G16B16_UINT;    case 4: return VK_FORMAT_R16G16B16A16_UINT;',
              'case 3: return VK_FORMAT_R16G16B16A16_SFLOAT;   case 4: return VK_FORMAT_R16G16B16A16_SFLOAT;':
                  'case 3: return VK_FORMAT_R16G16B16_SFLOAT;      case 4: return VK_FORMAT_R16G16B16A16_SFLOAT;',
              'case 3: return VK_FORMAT_R8G8B8A8_UNORM;  case 4: return VK_FORMAT_R8G8B8A8_UNORM;':
                  'case 3: return VK_FORMAT_R8G8B8_UNORM;    case 4: return VK_FORMAT_R8G8B8A8_UNORM;',
              'case 3: return VK_FORMAT_R8G8B8A8_SNORM;  case 4: return VK_FORMAT_R8G8B8A8_SNORM;':
                  'case 3: return VK_FORMAT_R8G8B8_SNORM;    case 4: return VK_FORMAT_R8G8B8A8_SNORM;',
              'case 3: return VK_FORMAT_R8G8B8A8_SINT;   case 4: return VK_FORMAT_R8G8B8A8_SINT;':
                  'case 3: return VK_FORMAT_R8G8B8_SINT;     case 4: return VK_FORMAT_R8G8B8A8_SINT;',
              'case 3: return VK_FORMAT_R16G16B16A16_UNORM; case 4: return VK_FORMAT_R16G16B16A16_UNORM;':
                  'case 3: return VK_FORMAT_R16G16B16_UNORM;    case 4: return VK_FORMAT_R16G16B16A16_UNORM;',
              'case 3: return VK_FORMAT_R16G16B16A16_SNORM; case 4: return VK_FORMAT_R16G16B16A16_SNORM;':
                  'case 3: return VK_FORMAT_R16G16B16_SNORM;    case 4: return VK_FORMAT_R16G16B16A16_SNORM;',
          }
          for old, new in replacements.items():
              count = s.count(old)
              assert count >= 1, (old, count)
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          git diff -- Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Pipeline.cpp

      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/minecraft-e2e/evidence.py --root "$E2E_ROOT" init

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Install native dependencies
        shell: bash
        run: brew install glfw vulkan-loader molten-vk ninja

      - name: Build test dylib
        id: mithril
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-minecraft-${{ matrix.variant }}-visual-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Wno-error" \
            -DCMAKE_CXX_FLAGS="-Wno-error"
          cmake --build build-minecraft-${{ matrix.variant }}-visual-native --target mithril --parallel
          dylib=$(find build-minecraft-${{ matrix.variant }}-visual-native -type f -name libmithril.dylib -print | head -1)
          test -s "$dylib"
          dylib="$(cd "$(dirname "$dylib")" && pwd)/$(basename "$dylib")"
          echo "dylib=$dylib" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$dylib" | tee "$E2E_ROOT/built-mithril.sha256"

      - name: Build GLFW to Mithril EGL/CAMetalLayer bridge
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-minecraft-${{ matrix.variant }}-visual-native/bridge
          GLFW_PREFIX=$(brew --prefix glfw)
          GLFW_REAL="$GLFW_PREFIX/lib/libglfw.3.dylib"
          test -f "$GLFW_REAL" || GLFW_REAL="$GLFW_PREFIX/lib/libglfw.dylib"
          BRIDGE="$PWD/build-minecraft-${{ matrix.variant }}-visual-native/bridge/libglfw_mithril.dylib"
          clang++ -std=c++20 -fobjc-arc -dynamiclib -Wall -Wextra -Werror \
            ci/minecraft-e2e/native/glfw_mithril_bridge.mm \
            ci/minecraft-e2e/native/prepresent_capture.mm \
            -I"$GLFW_PREFIX/include" -IMithril-Wrapper-cpp/include \
            -framework AppKit -framework QuartzCore -framework Foundation \
            -Wl,-reexport_library,"$GLFW_REAL" \
            -o "$BRIDGE"
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"
          echo "glfw_real=$GLFW_REAL" >> "$GITHUB_OUTPUT"

      - name: Run real Minecraft 26.2
        shell: bash
        run: |
          set -o pipefail
          cp "$E2E_ROOT/failure.json" "$E2E_ROOT/failure-pre-minecraft.json" 2>/dev/null || true
          rm -f "$E2E_ROOT/failure.json"
          gradle -p .github/ci/minecraft-e2e --build-cache --stacktrace \
            -PmithrilBackend=${{ matrix.backend }} \
            -PmithrilDylib="${{ steps.mithril.outputs.dylib }}" \
            -PglfwBridge="${{ steps.bridge.outputs.bridge }}" \
            -PglfwDelegate="${{ steps.bridge.outputs.glfw_real }}" \
            -PevidenceRoot="$E2E_ROOT" \
            runProductionClientGameTest 2>&1 | tee "$E2E_ROOT/gradle-minecraft.log"

      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ci/minecraft-e2e/collect-diagnostics.sh \
            "$E2E_ROOT" \
            "$PWD/.github/ci/minecraft-e2e/build/run/clientGameTest"

      - name: Summarize backend warnings
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          {
            echo "variant=${{ matrix.variant }}"
            echo "backend=${{ matrix.backend }}"
            echo "nondynamic_ubo=${{ matrix.nondynamic_ubo }}"
            echo "native_3comp=${{ matrix.native_3comp }}"
            echo '=== render/backend warnings ==='
            grep -E 'GL_ERROR_ORIGIN|sampler layout/resource check|primitive restart|VK_ERROR|MTL|pipeline|descriptor|ubo arena|FALLBACK shaders|Link failed|GL ERROR' \
              "$E2E_ROOT/gradle-minecraft.log" | tail -n 2500 || true
          } | tee "$E2E_ROOT/backend-warning-summary.log"

      - name: Upload backend visual artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mithril-${{ matrix.variant }}-visual-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn
          path: build/minecraft-${{ matrix.variant }}-visual-artifacts/**

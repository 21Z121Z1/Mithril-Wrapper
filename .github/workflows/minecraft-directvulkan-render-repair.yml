name: Minecraft backend visual differential

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/minecraft-on-mithril-e2e-vulkan-*'

permissions:
  contents: read

concurrency:
  group: mithril-backend-visual-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-visual:
    name: Real Minecraft / ${{ matrix.backend }} / visual artifact
    strategy:
      fail-fast: false
      matrix:
        backend: [metal, vulkan]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      E2E_ROOT: ${{ github.workspace }}/build/minecraft-${{ matrix.backend }}-visual-artifacts
      GRADLE_OPTS: -Dorg.gradle.caching=true
      MITHRIL_BACKEND: ${{ matrix.backend }}
      MITHRIL_DEBUG: '1'
      MTL_DEBUG_LAYER: '1'
      MTL_SHADER_VALIDATION: '0'

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          persist-credentials: false

      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/minecraft-e2e/evidence.py --root "$E2E_ROOT" init

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Install native dependencies
        shell: bash
        run: brew install glfw vulkan-loader molten-vk ninja

      - name: Build exact production Mithril dylib
        id: mithril
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-minecraft-${{ matrix.backend }}-visual-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Wno-error" \
            -DCMAKE_CXX_FLAGS="-Wno-error"
          cmake --build build-minecraft-${{ matrix.backend }}-visual-native --target mithril --parallel
          dylib=$(find build-minecraft-${{ matrix.backend }}-visual-native -type f -name libmithril.dylib -print | head -1)
          test -s "$dylib"
          dylib="$(cd "$(dirname "$dylib")" && pwd)/$(basename "$dylib")"
          echo "dylib=$dylib" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$dylib" | tee "$E2E_ROOT/built-mithril.sha256"

      - name: Build GLFW to Mithril EGL/CAMetalLayer bridge
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-minecraft-${{ matrix.backend }}-visual-native/bridge
          GLFW_PREFIX=$(brew --prefix glfw)
          GLFW_REAL="$GLFW_PREFIX/lib/libglfw.3.dylib"
          test -f "$GLFW_REAL" || GLFW_REAL="$GLFW_PREFIX/lib/libglfw.dylib"
          BRIDGE="$PWD/build-minecraft-${{ matrix.backend }}-visual-native/bridge/libglfw_mithril.dylib"
          clang++ -std=c++20 -fobjc-arc -dynamiclib -Wall -Wextra -Werror \
            ci/minecraft-e2e/native/glfw_mithril_bridge.mm \
            ci/minecraft-e2e/native/prepresent_capture.mm \
            -I"$GLFW_PREFIX/include" -IMithril-Wrapper-cpp/include \
            -framework AppKit -framework QuartzCore -framework Foundation \
            -Wl,-reexport_library,"$GLFW_REAL" \
            -o "$BRIDGE"
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"
          echo "glfw_real=$GLFW_REAL" >> "$GITHUB_OUTPUT"

      - name: Run real Minecraft 26.2
        shell: bash
        run: |
          set -o pipefail
          cp "$E2E_ROOT/failure.json" "$E2E_ROOT/failure-pre-minecraft.json" 2>/dev/null || true
          rm -f "$E2E_ROOT/failure.json"
          gradle -p .github/ci/minecraft-e2e --build-cache --stacktrace \
            -PmithrilBackend=${{ matrix.backend }} \
            -PmithrilDylib="${{ steps.mithril.outputs.dylib }}" \
            -PglfwBridge="${{ steps.bridge.outputs.bridge }}" \
            -PglfwDelegate="${{ steps.bridge.outputs.glfw_real }}" \
            -PevidenceRoot="$E2E_ROOT" \
            runProductionClientGameTest 2>&1 | tee "$E2E_ROOT/gradle-minecraft.log"

      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ci/minecraft-e2e/collect-diagnostics.sh \
            "$E2E_ROOT" \
            "$PWD/.github/ci/minecraft-e2e/build/run/clientGameTest"

      - name: Summarize backend warnings
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          {
            echo "backend=${{ matrix.backend }}"
            echo '=== render/backend warnings ==='
            grep -E 'sampler layout/resource check|primitive restart|VK_ERROR|MTL|pipeline|descriptor|ubo arena|FALLBACK shaders|Link failed|GL ERROR' \
              "$E2E_ROOT/gradle-minecraft.log" | tail -n 2000 || true
          } | tee "$E2E_ROOT/backend-warning-summary.log"

      - name: Upload backend visual artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mithril-${{ matrix.backend }}-visual-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn
          path: build/minecraft-${{ matrix.backend }}-visual-artifacts/**

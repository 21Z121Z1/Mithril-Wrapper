name: DirectVulkan descriptor-pool type experiment v2

on:
  workflow_dispatch:
  push:
    branches:
      - 'experiment/dvk-descriptor-pool-types-20260827'

permissions:
  contents: read

jobs:
  minecraft:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      E2E_ROOT: ${{ github.workspace }}/build/minecraft-vulkan-pool-types-v2-artifacts
      GRADLE_OPTS: -Dorg.gradle.caching=true
      MITHRIL_BACKEND: vulkan
      MITHRIL_DEBUG: '1'
      MTL_DEBUG_LAYER: '1'
      MTL_SHADER_VALIDATION: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          persist-credentials: false
      - name: Patch dynamic descriptor pool accounting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/DescriptorSet.cpp')
          s = p.read_text()
          old = 'uint32_t uboPerSet = 0, imgPerSet = 0, ssboPerSet = 0, stImgPerSet = 0;'
          new = 'uint32_t uboPerSet = 0, dynUboPerSet = 0, imgPerSet = 0, ssboPerSet = 0, stImgPerSet = 0;'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          for old_cmp, new_cmp in [
              ('if (db.type == VK_DESCRIPTOR_TYPE_UNIFORM_BUFFER)              uboPerSet += n;', 'if (descriptor_type_for(pr, db) == VK_DESCRIPTOR_TYPE_UNIFORM_BUFFER)              uboPerSet += n;'),
              ('else if (db.type == VK_DESCRIPTOR_TYPE_COMBINED_IMAGE_SAMPLER) imgPerSet += n;', 'else if (descriptor_type_for(pr, db) == VK_DESCRIPTOR_TYPE_UNIFORM_BUFFER_DYNAMIC) dynUboPerSet += n; else if (descriptor_type_for(pr, db) == VK_DESCRIPTOR_TYPE_COMBINED_IMAGE_SAMPLER) imgPerSet += n;'),
              ('else if (db.type == VK_DESCRIPTOR_TYPE_STORAGE_BUFFER)         ssboPerSet += n;', 'else if (descriptor_type_for(pr, db) == VK_DESCRIPTOR_TYPE_STORAGE_BUFFER)         ssboPerSet += n;'),
              ('else if (db.type == VK_DESCRIPTOR_TYPE_STORAGE_IMAGE)          stImgPerSet += n;', 'else if (descriptor_type_for(pr, db) == VK_DESCRIPTOR_TYPE_STORAGE_IMAGE)          stImgPerSet += n;'),
              ('else if (db.type == VK_DESCRIPTOR_TYPE_UNIFORM_TEXEL_BUFFER)   texelPerSet += n;', 'else if (descriptor_type_for(pr, db) == VK_DESCRIPTOR_TYPE_UNIFORM_TEXEL_BUFFER)   texelPerSet += n;'),
          ]:
              assert s.count(old_cmp) == 1, old_cmp
              s = s.replace(old_cmp, new_cmp, 1)
          anchor = '        poolSizes.push_back(ps);'+chr(10)+'    }'+chr(10)+'    // samplerBuffer'
          block = chr(10).join([
              '        poolSizes.push_back(ps);',
              '    }',
              '    if (dynUboPerSet) {',
              '        VkDescriptorPoolSize ps{};',
              '        ps.type = VK_DESCRIPTOR_TYPE_UNIFORM_BUFFER_DYNAMIC;',
              '        ps.descriptorCount = maxSets * dynUboPerSet;',
              '        poolSizes.push_back(ps);',
              '    }',
              '    // samplerBuffer'
          ])
          assert s.count(anchor) == 1
          s = s.replace(anchor, block, 1)
          p.write_text(s)
          PY
          git diff --check
          grep -n -A30 -B5 'dynUboPerSet' Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/DescriptorSet.cpp
      - name: Initialize evidence
        run: python3 ci/minecraft-e2e/evidence.py --root "$E2E_ROOT" init
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - run: brew install glfw vulkan-loader molten-vk ninja
      - name: Build patched Mithril dylib
        id: mithril
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-pool-types-v2 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS='-Wno-error' -DCMAKE_CXX_FLAGS='-Wno-error'
          cmake --build build-pool-types-v2 --target mithril --parallel
          dylib=$(find build-pool-types-v2 -type f -name libmithril.dylib -print -quit)
          test -s "$dylib"
          dylib="$(cd "$(dirname "$dylib")" && pwd)/$(basename "$dylib")"
          echo "dylib=$dylib" >> "$GITHUB_OUTPUT"
      - name: Build GLFW bridge
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          GLFW_PREFIX=$(brew --prefix glfw)
          GLFW_REAL="$GLFW_PREFIX/lib/libglfw.3.dylib"
          test -f "$GLFW_REAL" || GLFW_REAL="$GLFW_PREFIX/lib/libglfw.dylib"
          mkdir -p build-pool-types-v2/bridge
          BRIDGE="$PWD/build-pool-types-v2/bridge/libglfw_mithril.dylib"
          clang++ -std=c++20 -fobjc-arc -dynamiclib -Wall -Wextra -Werror ci/minecraft-e2e/native/glfw_mithril_bridge.mm ci/minecraft-e2e/native/prepresent_capture.mm -I"$GLFW_PREFIX/include" -IMithril-Wrapper-cpp/include -framework AppKit -framework QuartzCore -framework Foundation -Wl,-reexport_library,"$GLFW_REAL" -o "$BRIDGE"
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"
          echo "glfw_real=$GLFW_REAL" >> "$GITHUB_OUTPUT"
      - name: Run real Minecraft 26.2
        shell: bash
        run: |
          set -o pipefail
          rm -f "$E2E_ROOT/failure.json"
          gradle -p .github/ci/minecraft-e2e --build-cache --stacktrace -PmithrilBackend=vulkan -PmithrilDylib="${{ steps.mithril.outputs.dylib }}" -PglfwBridge="${{ steps.bridge.outputs.bridge }}" -PglfwDelegate="${{ steps.bridge.outputs.glfw_real }}" -PevidenceRoot="$E2E_ROOT" runProductionClientGameTest 2>&1 | tee "$E2E_ROOT/gradle-minecraft.log"
      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ci/minecraft-e2e/collect-diagnostics.sh "$E2E_ROOT" "$PWD/.github/ci/minecraft-e2e/build/run/clientGameTest"
          grep -E 'vkAllocateDescriptorSets failed|descriptor pool exhausted|prepare_draw DROPPED|VUID' "$E2E_ROOT/gradle-minecraft.log" > "$E2E_ROOT/pool-types-summary.log" || true
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mithril-vulkan-pool-types-v2-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          path: build/minecraft-vulkan-pool-types-v2-artifacts/**

# Temporary verifier; deleted after the implementation is materialized.
name: verify-program-prewarm-v2

on:
  pull_request:
    branches: [integration/directmetal-next]

permissions:
  contents: write

concurrency:
  group: verify-program-prewarm-v2
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/directmetal-program-prewarm-20260818
          submodules: false
          fetch-depth: 0

      - name: Fetch shader submodules
        run: >-
          git submodule update --init --depth=1
          third_party/SPIRV-Cross
          third_party/SPIRV-Headers
          third_party/glslang

      - name: Apply program prewarm phase
        run: python3 scripts/apply_program_prewarm_v2.py

      - name: Verify source invariants
        run: |
          git diff --check
          grep -q 'EnsureBackendProgram(p, BackendProgramCreateSite::Link)' src/gl/shader.cpp
          grep -q 'EnsureBackendProgram(linked, BackendProgramCreateSite::Use)' src/gl/shader.cpp
          grep -q 'EnsureBackendProgram(prog, BackendProgramCreateSite::Draw)' src/gl/draw.cpp
          ! grep -q 'uint64_t CreateBackendProgram(sh::Program' src/gl/draw.cpp
          grep -q 'program_compiles' include/mithril/directmetal_diagnostics.h
          grep -q 'directmetal_program_prewarm_smoke' cmake/MithrilSmokeTests.cmake

      - name: Materialize implementation
        run: |
          rm .github/workflows/verify-program-prewarm-v2.yml
          rm scripts/apply_program_prewarm.py
          rm scripts/apply_program_prewarm_v2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf: prewarm native programs before first draw'
          git push origin HEAD:perf/directmetal-program-prewarm-20260818

      - name: Configure DirectMetal Release
        run: >-
          cmake -S . -B build-direct -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=OFF
          -DMITHRIL_BUILD_DIRECT=ON
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON

      - name: Build DirectMetal
        run: cmake --build build-direct --parallel

      - name: Run dedicated prewarm regression
        run: ctest --test-dir build-direct -R '^directmetal_program_prewarm_smoke$' --output-on-failure

      - name: Run complete DirectMetal suite
        run: ctest --test-dir build-direct -L directmetal --output-on-failure

      - name: Fetch Vulkan headers
        run: git submodule update --init --depth=1 third_party/Vulkan-Headers

      - name: Configure Vulkan reference
        run: >-
          cmake -S . -B build-vulkan -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=ON
          -DMITHRIL_BUILD_DIRECT=OFF
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON

      - name: Build Vulkan reference
        run: cmake --build build-vulkan --parallel

name: land-directmetal-fbo-fix

on:
  push:
    branches: [feature/direct-metal]
    paths:
      - '.github/workflows/apply-directmetal-fbo.yml'

permissions:
  contents: write

concurrency:
  group: land-directmetal-fbo-fix
  cancel-in-progress: false

jobs:
  patch-build-commit:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply exact frontend and Metal patches
        run: |
          set -euo pipefail
          echo "fbo before=$(git hash-object src/gl/fbo.cpp)"
          echo "metal before=$(git hash-object src/metal/engine.mm)"
          echo "test before=$(git hash-object tests/directmetal_fbo_smoke.c)"
          test "$(git hash-object src/gl/fbo.cpp)" = 8cb6049baf0f3fcc6faf1157a5d835b9e172c860
          test "$(git hash-object src/metal/engine.mm)" = 1c3ec8ccfece36b1c101665a685a04b85edc79b1
          python3 scripts/_apply_directmetal_fbo_frontend.py
          python3 scripts/_apply_directmetal_fbo_metal.py
          echo "fbo after=$(git hash-object src/gl/fbo.cpp)"
          echo "metal after=$(git hash-object src/metal/engine.mm)"
          echo "test after=$(git hash-object tests/directmetal_fbo_smoke.c)"
          test "$(git hash-object src/gl/fbo.cpp)" = 30540102c6b4023d83fe388d739cb70811114f8e
          test "$(git hash-object src/metal/engine.mm)" = 101e3294a04a0847a8bed817d97a77a1d6180f38
          test "$(git hash-object tests/directmetal_fbo_smoke.c)" = 6c5c3d357c7f27fd17c336683427960e97d61fd5
          git diff --check

      - name: Compile regression smoke
        run: clang -std=c11 -Wall -Wextra -Werror -fsyntax-only tests/directmetal_fbo_smoke.c

      - name: Build macOS DirectMetal library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(sysctl -n hw.ncpu)
          test -f output/libmithril.dylib
          file output/libmithril.dylib

      - name: Run FBO smoke when Metal is exposed by runner
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/metal_probe.m <<'EOF'
          #import <Metal/Metal.h>
          int main(void) { return MTLCreateSystemDefaultDevice() ? 0 : 1; }
          EOF
          clang /tmp/metal_probe.m -framework Metal -framework Foundation -o /tmp/metal_probe
          clang -std=c11 -Wall -Wextra -Werror tests/directmetal_fbo_smoke.c -o /tmp/directmetal_fbo_smoke
          if /tmp/metal_probe; then
            echo 'Metal device exposed; running DirectMetal regression smoke'
            MITHRIL_BACKEND=metal \
            MITHRIL_EXPECT_RENDERER=DirectMetal \
            MITHRIL_LIBRARY="$PWD/output/libmithril.dylib" \
            MTL_DEBUG_LAYER=1 \
            MTL_SHADER_VALIDATION=1 \
            /tmp/directmetal_fbo_smoke
          else
            echo 'Metal device is not exposed by this hosted runner; runtime smoke skipped'
          fi

      - name: Build and verify iPhoneOS arm64 dylib
        run: |
          chmod +x scripts/build_iphoneos.sh
          test -x scripts/build_iphoneos.sh
          ./scripts/build_iphoneos.sh

      - name: Commit validated implementation and remove staging helpers
        run: |
          set -euo pipefail
          rm scripts/_apply_directmetal_fbo_frontend.py
          rm scripts/_apply_directmetal_fbo_metal.py
          rm .github/workflows/apply-directmetal-fbo.yml
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gl/fbo.cpp src/metal/engine.mm scripts/build_iphoneos.sh \
                  scripts/_apply_directmetal_fbo_frontend.py \
                  scripts/_apply_directmetal_fbo_metal.py \
                  .github/workflows/apply-directmetal-fbo.yml
          git commit -m 'fix: support depth-only and subresource FBOs in DirectMetal'
          git push origin HEAD:feature/direct-metal

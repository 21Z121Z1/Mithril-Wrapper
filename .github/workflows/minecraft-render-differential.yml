name: Minecraft native vs Mithril render differential

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/minecraft-on-mithril-e2e-*'
    paths:
      - '.github/workflows/minecraft-render-differential.yml'
      - '.github/ci/minecraft-e2e/**'
      - 'ci/minecraft-e2e/**'
      - 'Mithril-Wrapper-cpp/**'
      - 'CMakeLists.txt'

permissions:
  contents: read

concurrency:
  group: minecraft-render-differential-${{ github.ref }}
  cancel-in-progress: true

env:
  DIFF_ARTIFACT_RETENTION_DAYS: '7'

jobs:
  linux-native-reference:
    name: Linux Mesa native OpenGL reference
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REF_ROOT: ${{ github.workspace }}/build/minecraft-cross-differential/reference
      GLFW_REFERENCE_PREFIX: ${{ github.workspace }}/build/glfw-3.4-install
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle 9.4.1 cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
          cache-cleanup: on-success

      - name: Install Xvfb, Mesa, and GLFW build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libgl1-mesa-dri libglx-mesa0 libgl-dev mesa-utils ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Checkout exact GLFW 3.4 reference runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: glfw/glfw
          ref: '3.4'
          path: build/glfw-3.4-src
          persist-credentials: false

      - name: Build pinned GLFW 3.4 shared library
        shell: bash
        run: |
          set -euo pipefail
          cmake -S build/glfw-3.4-src -B build/glfw-3.4-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GLFW_REFERENCE_PREFIX" \
            -DBUILD_SHARED_LIBS=ON \
            -DGLFW_BUILD_EXAMPLES=OFF \
            -DGLFW_BUILD_TESTS=OFF \
            -DGLFW_BUILD_DOCS=OFF \
            -DGLFW_BUILD_X11=ON \
            -DGLFW_BUILD_WAYLAND=OFF
          cmake --build build/glfw-3.4-build --parallel
          cmake --install build/glfw-3.4-build
          GLFW_REAL="$GLFW_REFERENCE_PREFIX/lib/libglfw.so.3"
          test -s "$GLFW_REAL"
          nm -D "$GLFW_REAL" | grep -q ' glfwInitAllocator$'

      - name: Build self-contained native pre-swap capture bridge
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/linux-reference
          cp -L "$GLFW_REFERENCE_PREFIX/lib/libglfw.so.3" build/linux-reference/libglfw.so.3
          LOCAL_GLFW="$PWD/build/linux-reference/libglfw.so.3"
          BRIDGE="$PWD/build/linux-reference/libglfw_native_capture.so"
          clang++ -std=c++20 -shared -fPIC -Wall -Wextra -Werror \
            ci/minecraft-e2e/native/glfw_linux_capture_bridge.cpp \
            -x c++ ci/minecraft-e2e/native/prepresent_capture.mm -x none \
            -I"$GLFW_REFERENCE_PREFIX/include" \
            "$LOCAL_GLFW" -Wl,-rpath,'$ORIGIN' -ldl -lGL -o "$BRIDGE"
          test -s "$BRIDGE"
          readelf -d "$BRIDGE" | tee build/linux-reference/bridge-dynamic.txt
          grep -Eq '(RPATH|RUNPATH).*\$ORIGIN' build/linux-reference/bridge-dynamic.txt
          ldd "$BRIDGE" | tee build/linux-reference/bridge-ldd.txt
          ! grep -q 'not found' build/linux-reference/bridge-ldd.txt
          echo "glfw_real=$LOCAL_GLFW" >> "$GITHUB_OUTPUT"
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"

      - name: Capture native OpenGL vanilla reference
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$REF_ROOT/native-vanilla"
          rm -rf "$ROOT"; mkdir -p "$ROOT/render"
          python3 ci/minecraft-e2e/run-lane.py --timeout 360 --log "$ROOT/runner.log" -- \
            gradle --no-daemon -p .github/ci/minecraft-e2e --build-cache --stacktrace \
            -Pe2eBackend=native -Pe2eSodium=false -Pe2eUseXVFB=true -PevidenceRoot="$ROOT" \
            -PnativeGlfwBridge="${{ steps.bridge.outputs.bridge }}" \
            -PglfwDelegate="${{ steps.bridge.outputs.glfw_real }}" \
            runDifferentialClientGameTest
          test -s "$ROOT/differential-state.json"
          test -s "$ROOT/render/prepresent-frame-0001.rgba"
          test -s "$ROOT/render/prepresent-frame-0008.rgba"

      - name: Capture native OpenGL Sodium 0.9.1 reference
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$REF_ROOT/native-sodium"
          rm -rf "$ROOT"; mkdir -p "$ROOT/render"
          python3 ci/minecraft-e2e/run-lane.py --timeout 360 --log "$ROOT/runner.log" -- \
            gradle --no-daemon -p .github/ci/minecraft-e2e --build-cache --stacktrace \
            -Pe2eBackend=native -Pe2eSodium=true -Pe2eUseXVFB=true -PevidenceRoot="$ROOT" \
            -PnativeGlfwBridge="${{ steps.bridge.outputs.bridge }}" \
            -PglfwDelegate="${{ steps.bridge.outputs.glfw_real }}" \
            runDifferentialClientGameTest
          test -s "$ROOT/differential-state.json"
          test -s "$ROOT/render/prepresent-frame-0001.rgba"
          test -s "$ROOT/render/prepresent-frame-0008.rgba"

      - name: Upload required native framebuffer reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: minecraft-native-reference-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: ${{ fromJSON(env.DIFF_ARTIFACT_RETENTION_DAYS) }}
          if-no-files-found: error
          compression-level: 6
          path: build/minecraft-cross-differential/reference/**

  macos-directmetal-candidate:
    name: macOS Mithril DirectMetal candidate
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CANDIDATE_ROOT: ${{ github.workspace }}/build/minecraft-cross-differential/candidate
      MTL_DEBUG_LAYER: '1'
      MTL_SHADER_VALIDATION: '0'
      MITHRIL_BACKEND: metal
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle 9.4.1 cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
          cache-cleanup: on-success

      - name: Install native dependencies
        run: brew install glfw vulkan-loader molten-vk ninja

      - name: Build production Mithril and pre-present bridge
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-cross-differential -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-Wno-error' -DCMAKE_CXX_FLAGS='-Wno-error'
          cmake --build build-cross-differential --target mithril --parallel
          MITHRIL=$(find build-cross-differential -type f -name libmithril.dylib -print -quit)
          test -s "$MITHRIL"
          MITHRIL="$(cd "$(dirname "$MITHRIL")" && pwd)/$(basename "$MITHRIL")"
          GLFW_PREFIX=$(brew --prefix glfw)
          GLFW_REAL="$GLFW_PREFIX/lib/libglfw.3.dylib"
          test -f "$GLFW_REAL" || GLFW_REAL="$GLFW_PREFIX/lib/libglfw.dylib"
          BRIDGE="$PWD/build-cross-differential/libglfw_mithril.dylib"
          clang++ -std=c++20 -fobjc-arc -dynamiclib -Wall -Wextra -Werror \
            ci/minecraft-e2e/native/glfw_mithril_bridge.mm \
            ci/minecraft-e2e/native/prepresent_capture.mm \
            -I"$GLFW_PREFIX/include" -IMithril-Wrapper-cpp/include \
            -framework AppKit -framework QuartzCore -framework Foundation \
            -Wl,-reexport_library,"$GLFW_REAL" -o "$BRIDGE"
          test -s "$BRIDGE"
          echo "mithril=$MITHRIL" >> "$GITHUB_OUTPUT"
          echo "glfw_real=$GLFW_REAL" >> "$GITHUB_OUTPUT"
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$MITHRIL" "$BRIDGE"

      - name: Capture Mithril DirectMetal vanilla candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$CANDIDATE_ROOT/mithril-vanilla"
          rm -rf "$ROOT"; mkdir -p "$ROOT/render"
          python3 ci/minecraft-e2e/run-lane.py --timeout 360 --log "$ROOT/runner.log" -- \
            gradle --no-daemon -p .github/ci/minecraft-e2e --build-cache --stacktrace \
            -Pe2eBackend=mithril -Pe2eSodium=false -PevidenceRoot="$ROOT" \
            -PmithrilDylib="${{ steps.build.outputs.mithril }}" \
            -PglfwBridge="${{ steps.build.outputs.bridge }}" \
            -PglfwDelegate="${{ steps.build.outputs.glfw_real }}" \
            runDifferentialClientGameTest
          test -s "$ROOT/differential-state.json"
          test -s "$ROOT/render/prepresent-frame-0001.rgba"
          test -s "$ROOT/render/prepresent-frame-0008.rgba"

      - name: Capture Mithril DirectMetal Sodium 0.9.1 candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$CANDIDATE_ROOT/mithril-sodium"
          rm -rf "$ROOT"; mkdir -p "$ROOT/render"
          python3 ci/minecraft-e2e/run-lane.py --timeout 360 --log "$ROOT/runner.log" -- \
            gradle --no-daemon -p .github/ci/minecraft-e2e --build-cache --stacktrace \
            -Pe2eBackend=mithril -Pe2eSodium=true -PevidenceRoot="$ROOT" \
            -PmithrilDylib="${{ steps.build.outputs.mithril }}" \
            -PglfwBridge="${{ steps.build.outputs.bridge }}" \
            -PglfwDelegate="${{ steps.build.outputs.glfw_real }}" \
            runDifferentialClientGameTest
          test -s "$ROOT/differential-state.json"
          test -s "$ROOT/render/prepresent-frame-0001.rgba"
          test -s "$ROOT/render/prepresent-frame-0008.rgba"

      - name: Upload required DirectMetal framebuffer candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: minecraft-directmetal-candidate-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: ${{ fromJSON(env.DIFF_ARTIFACT_RETENTION_DAYS) }}
          if-no-files-found: error
          compression-level: 6
          path: build/minecraft-cross-differential/candidate/**

  compare-framebuffers:
    name: Enforce vanilla and Sodium framebuffer differential
    needs: [linux-native-reference, macos-directmetal-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout comparator from exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Download native reference frames
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: minecraft-native-reference-${{ github.sha }}-${{ github.run_attempt }}
          path: build/cross-download/native

      - name: Download DirectMetal candidate frames
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: minecraft-directmetal-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: build/cross-download/mithril

      - name: Verify complete evidence before comparison
        shell: bash
        run: |
          set -euo pipefail
          for root in \
            build/cross-download/native/native-vanilla \
            build/cross-download/native/native-sodium \
            build/cross-download/mithril/mithril-vanilla \
            build/cross-download/mithril/mithril-sodium; do
            test -s "$root/differential-state.json"
            test -s "$root/render/prepresent-frame-0001.rgba"
            test -s "$root/render/prepresent-frame-0008.rgba"
          done

      - name: Compare vanilla native OpenGL vs DirectMetal
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/minecraft-e2e/compare-differential.py \
            --native build/cross-download/native/native-vanilla \
            --mithril build/cross-download/mithril/mithril-vanilla \
            --label vanilla --assert-pass \
            | tee build/cross-download/comparison-vanilla.log

      - name: Compare Sodium 0.9.1 native OpenGL vs DirectMetal
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/minecraft-e2e/compare-differential.py \
            --native build/cross-download/native/native-sodium \
            --mithril build/cross-download/mithril/mithril-sodium \
            --label sodium --assert-pass \
            | tee build/cross-download/comparison-sodium.log

      - name: Upload enforced cross-platform differential evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: minecraft-cross-platform-differential-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: ${{ fromJSON(env.DIFF_ARTIFACT_RETENTION_DAYS) }}
          if-no-files-found: error
          compression-level: 6
          path: build/cross-download/**

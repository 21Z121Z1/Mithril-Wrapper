name: Bootstrap depth readback and GLsync state

on:
  push:
    branches:
      - fix/mobilegl-style-mc262-startup-preflight

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobilegl-style-mc262-startup-preflight
      - name: Apply depth readback and sync state patch
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_depth_readback_sync_state.py
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/ImageOps.cpp
          git rm .github/scripts/apply_depth_readback_sync_state.py
          git commit -m 'fix: implement depth readback and canonical GLsync completion'
          git push origin HEAD:fix/mobilegl-style-mc262-startup-preflight
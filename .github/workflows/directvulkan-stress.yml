name: DirectVulkan lifecycle stress

on:
  push:
    branches:
      - codex/directvulkan-overnight-recovery-20260814
  workflow_dispatch:

concurrency:
  group: directvulkan-stress-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-lavapipe-repeated-init-render-shutdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Vulkan software stack
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libvulkan-dev mesa-vulkan-drivers

      - name: Build DirectVulkan and smoke drivers
        run: |
          cmake -S . -B build-stress -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS='-Wno-error' \
            -DCMAKE_CXX_FLAGS='-Wno-error'
          cmake --build build-stress --target mithril -j2
          clang -D_GNU_SOURCE -std=c11 -O0 -g -IMithril-Wrapper-cpp/include -o tests/render_smoke_stress tests/render_smoke.c -ldl
          clang -D_GNU_SOURCE -std=c11 -O0 -g -IMithril-Wrapper-cpp/include -o tests/overnight_regression_smoke_stress tests/overnight_regression_smoke.c -ldl

      - name: Resolve runtime
        run: |
          set -euo pipefail
          LIB=$(realpath "$(find build-stress -name 'libmithril.so' -type f | head -1)")
          test -f "$LIB"
          echo "MITHRIL_LIB=$LIB" >> "$GITHUB_ENV"
          ICD=$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)
          test -f "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          ldd -r "$LIB" 2>&1 | tee /tmp/ldd-r.txt
          ! grep -E 'undefined symbol|not found' /tmp/ldd-r.txt

      - name: Repeat complete process lifecycle ten times
        env:
          MITHRIL_DEBUG: '0'
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "=== iteration $i/10: generic render ==="
            ./tests/render_smoke_stress "$MITHRIL_LIB"
            echo "=== iteration $i/10: overnight regressions ==="
            ./tests/overnight_regression_smoke_stress "$MITHRIL_LIB"
          done

      - name: Integrity
        run: |
          git diff --check 1e7f6b7a1941dcc6e4cef5b5e20359291f9924cb..HEAD
          ! grep -q 'GUI CULL PROBE' Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp

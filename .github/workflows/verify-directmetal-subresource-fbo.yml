name: verify-directmetal-subresource-fbo

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-metal-gpu-probe-direct-metal-20260810

concurrency:
  group: verify-directmetal-subresource-fbo
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MITHRIL_BACKEND: metal
      MITHRIL_EXPECT_RENDERER: Mithril DirectMetal
      MITHRIL_LIBRARY: ./output/libmithril.dylib
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Isolate color subresource cases from the depth-only case
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/directmetal_fbo_smoke.c')
          s = p.read_text()
          marker = '    CHECK(glGetError() == GL_NO_ERROR, "depth-only clear submits without GL error");\n\n'
          insertion = (
              marker
              + '    /* The following color-subresource cases intentionally test only the selected\n'
              + '     * color image. Detach the 16x16 depth image so it cannot make the later\n'
              + '     * 4x4 framebuffer incomplete for an unrelated dimension mismatch. */\n'
              + '    glFramebufferTexture2D(GL_FRAMEBUFFER, GL_DEPTH_ATTACHMENT,\n'
              + '                           GL_TEXTURE_2D, 0, 0);\n\n'
          )
          if s.count(marker) != 1:
              raise SystemExit(f'expected one depth-only section marker, got {s.count(marker)}')
          p.write_text(s.replace(marker, insertion, 1))
          PY
          git diff --check
          git diff -- tests/directmetal_fbo_smoke.c

      - name: Build DirectMetal backend
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-hosted-metal -DCMAKE_BUILD_TYPE=Release
          cmake --build build-hosted-metal -j"$(sysctl -n hw.ncpu)"

      - name: Execute corrected subresource smoke on real hosted Metal
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra tests/directmetal_fbo_smoke.c \
            -o "$RUNNER_TEMP/directmetal_fbo_smoke"
          "$RUNNER_TEMP/directmetal_fbo_smoke"

      - name: Commit corrected regression only after GPU pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/directmetal_fbo_smoke.c
          git commit -m 'test: isolate DirectMetal FBO subresource coverage'
          git push origin HEAD:ci/hosted-metal-gpu-probe-direct-metal-20260810

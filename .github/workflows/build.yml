name: build-mithril

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'agent/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Self-test artifact contract checker
        shell: bash
        run: |
          set -euo pipefail
          bash .github/ci/verify-mithril-artifact.sh --self-test
      - name: Configure (macOS arm64 Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Compile DirectMetal FBO regression smoke
        run: clang -std=c11 -Wall -Wextra -Werror -fsyntax-only tests/directmetal_fbo_smoke.c
      - name: Locate and verify macOS artifact contract
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          DYLIB=output/libmithril.dylib
          test -f "$DYLIB"
          echo "path=$DYLIB" >> "$GITHUB_OUTPUT"
          bash .github/ci/verify-mithril-artifact.sh macos "$DYLIB"
      - name: Ad-hoc codesign
        run: codesign -s - "${{ steps.locate.outputs.path }}" || echo "codesign skipped (best-effort)"
      - name: Upload dylib
        uses: actions/upload-artifact@v7
        with:
          name: libmithril-macos-arm64
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure (iPhoneOS arm64 Release)
        run: |
          cmake -S . -B build-ios \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DMITHRIL_IOS=ON \
            -DMITHRIL_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/build-ios/output"
      - name: Build iPhoneOS dylib
        run: cmake --build build-ios -j$(sysctl -n hw.ncpu)
      - name: Locate and verify iPhoneOS artifact contract
        id: locate_ios
        shell: bash
        run: |
          set -euo pipefail
          DYLIB=build-ios/output/libmithril.dylib
          test -f "$DYLIB"
          echo "path=$DYLIB" >> "$GITHUB_OUTPUT"
          bash .github/ci/verify-mithril-artifact.sh ios "$DYLIB"
      - name: Ad-hoc codesign artifact
        run: |
          codesign --force --sign - "${{ steps.locate_ios.outputs.path }}"
          codesign --verify --verbose=2 "${{ steps.locate_ios.outputs.path }}"
      - name: Upload iPhoneOS dylib
        uses: actions/upload-artifact@v7
        with:
          name: libmithril-iphoneos-arm64
          path: ${{ steps.locate_ios.outputs.path }}
          if-no-files-found: error

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure (Linux)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Install Vulkan runtime (lavapipe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers
          vulkaninfo --summary 2>/dev/null | head -10 || true
      - name: Build smoke test binaries
        run: |
          gcc -o tests/contract_smoke tests/contract_smoke.c -ldl
          gcc -o tests/state_smoke   tests/state_smoke.c   -ldl
          gcc -o tests/shader_smoke  tests/shader_smoke.c  -ldl
          gcc -o tests/draw_smoke    tests/draw_smoke.c    -ldl
          gcc -o tests/texture_smoke tests/texture_smoke.c -ldl
          gcc -o tests/fbo_smoke     tests/fbo_smoke.c     -ldl
          gcc -o tests/3d_smoke      tests/3d_smoke.c      -ldl -lm
          gcc -o tests/render3d_smoke tests/render3d_smoke.c -ldl -lm
      - name: Run EGL contract smoke
        run: |
          output=$(./tests/contract_smoke)
          echo "$output"
          echo "$output" | grep -q "ALL CONTRACT CHECKS PASSED"
      - name: Run GL state machine smoke
        run: |
          output=$(./tests/state_smoke)
          echo "$output"
          echo "$output" | grep -q "STATE SMOKE ALL PASSED"
      - name: Run shader pipeline smoke
        run: |
          output=$(./tests/shader_smoke)
          echo "$output"
          echo "$output" | grep -q "SHADER SMOKE ALL PASSED"
      - name: Run GL->Vulkan draw smoke (lavapipe)
        run: |
          set -o pipefail
          ./tests/draw_smoke 2>&1 | tee /tmp/draw-smoke.log
          grep -q "DRAW SMOKE ALL PASSED" /tmp/draw-smoke.log
      - name: Run GL->Vulkan texture smoke (lavapipe)
        run: |
          output=$(./tests/texture_smoke)
          echo "$output"
          echo "$output" | grep -q "TEXTURE SMOKE ALL PASSED"
      - name: Run GL->Vulkan state-pipeline smoke (lavapipe)
        run: |
          output=$(./tests/fbo_smoke)
          echo "$output"
          echo "$output" | grep -q "FBO SMOKE ALL PASSED"
      - name: Run 3D depth/perspective smoke (lavapipe)
        run: |
          output=$(./tests/3d_smoke)
          echo "$output"
          echo "$output" | grep -F "3D SMOKE ALL PASSED"
      - name: Run 3D scene render smoke (lavapipe)
        run: |
          output=$(./tests/render3d_smoke)
          echo "$output"
          echo "$output" | grep -F "RENDER SMOKE ALL PASSED"
      - name: Install Pillow for image export
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow || python3 -m pip install --quiet Pillow
          python3 -c "import PIL; print('Pillow', PIL.__version__)"
      - name: Convert render to PNG
        run: |
          python3 scripts/ppm_render.py tests/render3d.ppm tests/render3d.png
          ls -la tests/render3d.ppm tests/render3d.png
      - name: Upload 3D render image (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: mithril-render3d-png
          path: |
            tests/render3d.ppm
            tests/render3d.png
          if-no-files-found: error
      - name: Verify GL symbol table (Linux .so)
        run: |
          GL_COUNT=$(nm -D --defined-only output/libmithril.so | awk '{print $3}' | grep -cE '^gl[A-Z0-9]')
          echo "GL* defined exports: $GL_COUNT"
          [ "$GL_COUNT" -ge 342 ]
          EGL_COUNT=$(nm -D --defined-only output/libmithril.so | awk '{print $3}' | grep -c '^egl')
          echo "egl* defined exports: $EGL_COUNT"
          [ "$EGL_COUNT" -ge 40 ]

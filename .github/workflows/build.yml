name: Build Mithril-Wrapper for iOS

on:
  push:
    # main 之外，同时监听 fix/** 与 feat/** 特性分支。
    # 之前只监听 main，意味着任何特性分支推上来都不会构建 —— 而 iOS 构建
    # 恰恰是本项目唯一能验证 MoltenVK/Metal 链接期问题的手段，等合进 main
    # 才发现编译不过就太晚了。
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Download ios-cmake toolchain
        run: |
          curl -fsSL -o ios.toolchain.cmake \
            https://github.com/leetal/ios-cmake/raw/master/ios.toolchain.cmake
          echo "Toolchain downloaded:"
          ls -l ios.toolchain.cmake

      - name: Prepare MoltenVK dylib + Vulkan headers
        run: |
          set -euo pipefail

          # Use the same MoltenVK binary Amethyst bundles at runtime. This file
          # is intentionally a dylib, not the static MoltenVK.xcframework.
          MOLTENVK_DYLIB="Mithril-Wrapper-cpp/3rdparty/MoltenVK/libMoltenVK.dylib"
          test -f "${MOLTENVK_DYLIB}"
          echo "=== Host-compatible MoltenVK dylib ==="
          file "${MOLTENVK_DYLIB}"
          echo "git blob: $(git hash-object "${MOLTENVK_DYLIB}")"

          # Headers are only a build-time dependency. Keep using a tagged
          # Khronos release so the CI input is reproducible.
          MOLTENVK_TAG="v1.4.2"
          TARBALL="MoltenVK-ios.tar"
          curl -fsSL -o "${TARBALL}" \
            "https://github.com/KhronosGroup/MoltenVK/releases/download/${MOLTENVK_TAG}/${TARBALL}"

          mkdir -p moltenvk-staging
          tar -xf "${TARBALL}" -C moltenvk-staging
          HDRS=$(find moltenvk-staging -type d -name "vulkan" -path "*/include/vulkan" | head -1)
          if [ -z "${HDRS}" ]; then
            echo "::error::Vulkan headers (include/vulkan/) not found in MoltenVK release."
            exit 1
          fi
          HDR_ROOT=$(dirname "${HDRS}")
          mv "${HDR_ROOT}" ./MoltenVK-Headers
          rm -rf moltenvk-staging

          echo "=== Vulkan headers ==="
          ls -l MoltenVK-Headers/vulkan/vulkan.h
          ls -l MoltenVK-Headers/vulkan/vulkan_metal.h || true

      - name: Configure (iOS arm64)
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=15.0 \
            -DENABLE_BITCODE=OFF \
            -DENABLE_ARC=OFF \
            -DMITHRIL_VULKAN_LIBRARY="${GITHUB_WORKSPACE}/Mithril-Wrapper-cpp/3rdparty/MoltenVK/libMoltenVK.dylib" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-Wno-error=implicit-function-declaration" \
            -DCMAKE_CXX_FLAGS="-Wno-error"

      - name: Build libmithril.dylib
        run: |
          cmake --build build --config RelWithDebInfo --target mithril -j$(sysctl -n hw.ncpu)

      - name: Locate dylib
        id: locate
        run: |
          DYLIB=$(find build -name 'libmithril.dylib' -type f | head -1)
          echo "Found: $DYLIB"
          echo "path=$DYLIB" >> "$GITHUB_OUTPUT"
          ls -l "$DYLIB"
          file "$DYLIB"

      - name: Verify exported EGL/GL symbols
        run: |
          DYLIB="${{ steps.locate.outputs.path }}"
          # Capture the exported-symbol table once. Re-running `nm` per symbol
          # inside the loop also triggers SIGPIPE in llvm-nm (grep -q exits
          # early), which spams the log with "LLVM ERROR: Broken pipe".
          NM_OUT=$(nm -gU "$DYLIB")
          echo "=== Exported egl* symbols ==="
          echo "$NM_OUT" | grep -Ei ' [Tt] _?egl' | head -60
          echo "=== Exported gl* symbols (sample) ==="
          echo "$NM_OUT" | grep -Ei ' [Tt] _(glCreate|glDrawArrays|glGetString)' | head
          echo "=== Required EGL entry points present? ==="
          missing=0
          # EGL 1.5 surface/config/context/sync/image/platform-surface API.
          # The wrapper now exports ~44 egl* symbols (up from ~21 in the EGL
          # 1.4 era). The list below is the full set the host dlsym()s at
          # runtime — the second half (eglCreateSync onward) is the EGL 1.5
          # sync / image / platform-surface API added by the new impl.
          for sym in eglGetDisplay eglGetPlatformDisplay eglInitialize \
                     eglTerminate eglQueryString eglBindAPI eglReleaseThread \
                     eglGetError eglGetConfigs eglChooseConfig eglGetConfigAttrib \
                     eglCreateWindowSurface eglCreatePbufferSurface \
                     eglDestroySurface eglQuerySurface eglCreateContext \
                     eglDestroyContext eglMakeCurrent eglGetCurrentContext \
                     eglGetCurrentSurface eglGetCurrentDisplay eglQueryContext \
                     eglSwapBuffers eglSwapInterval eglWaitClient eglWaitGL \
                     eglWaitNative eglGetProcAddress eglSurfaceAttrib \
                     eglBindTexImage eglReleaseTexImage eglCopyBuffers eglQueryAPI \
                     eglCreateSync eglDestroySync eglClientWaitSync eglWaitSync \
                     eglGetSyncAttrib eglCreateImage eglDestroyImage \
                     eglCreatePlatformWindowSurface eglCreatePlatformPixmapSurface \
                     eglCreatePixmapSurface eglCreatePbufferFromClientBuffer; do
            if echo "$NM_OUT" | grep -qE " [Tt] _?${sym}$"; then
              echo "OK   $sym"
            else
              echo "MISS $sym"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Required EGL entry points missing from libmithril.dylib export table — host dlsym() will fail."
            exit 1
          fi
          echo "=== Total egl* symbol count ==="
          TOTAL=$(echo "$NM_OUT" | grep -cEi ' [Tt] _?egl')
          echo "Exported egl* symbols: $TOTAL (expected >= 40)"
          if [ "$TOTAL" -lt 40 ]; then
            echo "::error::Expected at least 40 exported egl* symbols, found $TOTAL — EGL 1.5 sync/image/platform-surface impl may be missing."
            exit 1
          fi

      - name: Verify Vulkan backend + MobileGL-style MoltenVK linkage
        run: |
          set -euo pipefail
          DYLIB="${{ steps.locate.outputs.path }}"
          NM_OUT=$(nm -gU "$DYLIB")
          echo "=== Vulkan backend C API symbols (sample) ==="
          echo "$NM_OUT" | grep -Ei ' [Tt] _?(backend_init|backend_available|backend_create_swapchain|backend_get_or_create_pipeline)' | head

          echo "=== Mach-O dependencies ==="
          DEPS=$(otool -L "$DYLIB")
          echo "$DEPS"
          if ! echo "$DEPS" | grep -Fq "@rpath/libMoltenVK.dylib"; then
            echo "::error::libmithril.dylib does not dynamically depend on @rpath/libMoltenVK.dylib"
            exit 1
          fi
          if echo "$DEPS" | grep -Fq "@rpath/MoltenVK.framework/MoltenVK"; then
            echo "::error::framework-style MoltenVK install name leaked into libmithril.dylib"
            exit 1
          fi
          if echo "$DEPS" | grep -Fq "${GITHUB_WORKSPACE}"; then
            echo "::error::checkout-local absolute path leaked into Mach-O dependencies"
            exit 1
          fi

          echo "=== LC_RPATH entries ==="
          RPATHS=$(otool -l "$DYLIB" | awk '/cmd LC_RPATH/{getline; getline; print $2}')
          printf '%s\n' "$RPATHS"
          if ! printf '%s\n' "$RPATHS" | grep -Fxq "@loader_path"; then
            echo "::error::libmithril.dylib is missing LC_RPATH @loader_path"
            exit 1
          fi

      - name: Compile-check + contract-check GL smoke tests (gl_smoke.c + render_smoke.c)
        run: |
          # 参照 Uniaball/Mithril-Wrapper 的 test 集成：测试文件必须始终可编译，
          # 且其断言的 GL 符号必须存在于 dylib 导出表（否则 dlopen 冒烟会失败）。
          DYLIB="${{ steps.locate.outputs.path }}"
          # 1) 语法校验（用项目自带 GL/EGL 头，-fsyntax-only，不依赖构建产物）
          #    render_smoke.c 是真正的离屏渲染测试（macOS 原生 dlopen 驱动 GPU）。
          clang -std=c11 -fsyntax-only -Wall -Wextra \
            -IMithril-Wrapper-cpp/include tests/gl_smoke.c
          clang -std=c11 -fsyntax-only -Wall -Wextra \
            -IMithril-Wrapper-cpp/include tests/render_smoke.c
          echo "syntax OK (gl_smoke.c + render_smoke.c)"
          # 2) 契约断言：测试 dlopen 依赖的 GL 符号必须在导出表中
          NM_OUT=$(nm -gU "$DYLIB")
          missing=0
          for sym in glGetIntegerv glGetFloatv glGetBooleanv glGetString \
                     glGetStringi glGetError glViewport glScissor glEnable \
                     glDisable glIsEnabled glEnablei glDisablei glIsEnabledi \
                     glClearColor glClear glDepthMask glColorMask glBlendFunc \
                     glCullFace glFrontFace glDepthFunc glFinish glFlush \
                     glGenTextures glTexImage2D glTexStorage2D glTexSubImage2D \
                     glTexParameteri glGenerateMipmap glDrawArrays glDrawElements \
                     glGenFramebuffers glBindFramebuffer glFramebufferTexture2D \
                     glCheckFramebufferStatus glGenVertexArrays glBindVertexArray \
                     glGenBuffers glBindBuffer glBufferData \
                     glVertexAttribPointer glEnableVertexAttribArray \
                     glCreateShader glShaderSource glCompileShader glGetShaderiv \
                     glCreateProgram glAttachShader glLinkProgram glGetProgramiv \
                     glDeleteShader glDeleteProgram glUseProgram glReadPixels \
                     glActiveTexture glBindBufferBase glGetUniformLocation \
                     glGetUniformBlockIndex glUniformBlockBinding \
                     glUniform1i glUniform4f; do
            if echo "$NM_OUT" | grep -qE " [Tt] _?${sym}$"; then
              echo "ok   $sym"
            else
              echo "MISS $sym"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::gl_smoke/render_smoke tests require GL symbols missing from export table"
            exit 1
          fi
          echo "smoke contract: all symbols exported"

      - name: Ad-hoc codesign
        run: |
          codesign -s - "${{ steps.locate.outputs.path }}" || echo "codesign skipped (best-effort)"

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mithril-Wrapper-iOS-dylib
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error

      - name: Upload full build tree (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mithril-Wrapper-build-tree
          path: build
          if-no-files-found: warn

  # macOS 原生构建 + dlopen 冒烟。iOS dylib 无法在 macOS 进程里 dlopen，但
  # macOS 与 iOS 共用同一套 if(APPLE) 源（SurfaceMetal.mm / SwapchainMetal.mm /
  # DirectVulkan 后端），因此 macOS 原生构建能真实链接 MoltenVK，并允许我们用
  # dlopen 加载 libmithril.dylib 跑 GL 状态机冒烟（tests/gl_smoke.c）。这参照
  # Uniaball/Mithril-Wrapper 的 test-macos-metal job：Homebrew MoltenVK +
  # Vulkan loader，编译 smoke 测试，断言 "ALL PASSED"。gl_smoke 只断言纯状态机
  # （不依赖 Metal surface 渲染），即使 swapchain 未拉起也能稳定通过。
  test-macos-smoke:
    runs-on: macos-latest
    needs: build-ios
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan loader + MoltenVK (Homebrew)
        run: |
          brew install vulkan-loader molten-vk
          echo "brew prefix: $(brew --prefix)"
          ls -l "$(brew --prefix)/lib/libMoltenVK.dylib" 2>/dev/null || \
            ls -l "$(brew --prefix)/opt/molten-vk/lib/libMoltenVK.dylib"

      - name: Configure (macOS native, Release)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Wno-error" \
            -DCMAKE_CXX_FLAGS="-Wno-error"

      - name: Build libmithril.dylib (macOS native)
        run: |
          cmake --build build --config Release --target mithril -j$(sysctl -n hw.ncpu)
          DYLIB=$(find build -name 'libmithril.dylib' -type f | head -1)
          [ -n "$DYLIB" ] || (echo "::error::libmithril.dylib not found" && exit 1)
          echo "Built: $DYLIB"
          file "$DYLIB"

      - name: Run GL state-machine smoke (dlopen libmithril.dylib)
        run: |
          DYLIB=$(find build -name 'libmithril.dylib' -type f | head -1)
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          echo "=== DYLIB: $DYLIB ==="
          file "$DYLIB"
          echo "=== otool -L (load deps) ==="
          otool -L "$DYLIB" || true
          echo "=== build gl_smoke ==="
          clang -std=c11 -O0 -Wall -Wextra \
            -IMithril-Wrapper-cpp/include \
            -o tests/gl_smoke tests/gl_smoke.c -ldl
          echo "=== run gl_smoke ==="
          set +e
          ./tests/gl_smoke "$DYLIB"
          rc=$?
          set -e
          echo "=== gl_smoke exit: $rc ==="
          [ "$rc" -eq 0 ]

      - name: Run offscreen render smoke (dlopen + real GPU draw)
        run: |
          # 真正的离屏渲染测试：headless backend（proc_init→backend_init）下驱动
          # 完整 GL 4.6 渲染管线——离屏纹理FBO + shader编译/链接 + VAO/VBO +
          # glDrawArrays + glFinish(vkQueueSubmit) + glReadPixels 读回，验证 GPU
          # 真正执行绘制。全程绑定用户 FBO（glBindFramebuffer(0) 无 swapchain 无目标）。
          DYLIB=$(find build -name 'libmithril.dylib' -type f | head -1)
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          export MITHRIL_DEBUG=1
          echo "=== build render_smoke ==="
          clang -std=c11 -O0 -Wall -Wextra \
            -IMithril-Wrapper-cpp/include \
            -o tests/render_smoke tests/render_smoke.c -ldl
          echo "=== run render_smoke (offscreen GPU draw) ==="
          set +e
          ./tests/render_smoke "$DYLIB"
          rc=$?
          set -e
          echo "=== render_smoke exit: $rc ==="
          [ "$rc" -eq 0 ]

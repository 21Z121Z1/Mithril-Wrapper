name: build-mithril

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'refactor/**'
      - 'codex/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  directmetal-macos:
    name: DirectMetal macOS semantics + boundary
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch DirectMetal shader submodules only
        run: >-
          git submodule update --init --depth=1
          third_party/SPIRV-Cross
          third_party/SPIRV-Headers
          third_party/glslang

      - name: Assert Vulkan-Headers was not checked out
        run: test ! -f third_party/Vulkan-Headers/CMakeLists.txt

      - name: Configure Vulkan-free DirectMetal target
        run: >-
          cmake -S . -B build-direct -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=OFF
          -DMITHRIL_BUILD_DIRECT=ON
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON
          -DMITHRIL_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/build-direct/artifacts"

      - name: Build DirectMetal and regression tests
        run: cmake --build build-direct --parallel

      - name: Run DirectMetal GL semantic suite
        run: ctest --test-dir build-direct -L directmetal --output-on-failure

      - name: Prove shipping target is Vulkan-free
        run: |
          chmod +x scripts/verify_directmetal_artifact.sh
          scripts/verify_directmetal_artifact.sh \
            build-direct/artifacts/libmithril.dylib \
            build-direct/mithril_direct.boundary.json

      - name: Verify macOS artifact
        run: |
          file build-direct/artifacts/libmithril.dylib
          codesign --force --sign - build-direct/artifacts/libmithril.dylib
          codesign --verify --verbose=2 build-direct/artifacts/libmithril.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: mithril-direct-macos
          path: build-direct/artifacts/libmithril.dylib
          if-no-files-found: error

  directmetal-ios-arm64:
    name: DirectMetal iPhoneOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch DirectMetal shader submodules only
        run: >-
          git submodule update --init --depth=1
          third_party/SPIRV-Cross
          third_party/SPIRV-Headers
          third_party/glslang

      - name: Assert Vulkan-Headers was not checked out
        run: test ! -f third_party/Vulkan-Headers/CMakeLists.txt

      - name: Fetch pinned iOS CMake toolchain
        run: >-
          curl -fsSL -o ios.toolchain.cmake
          https://raw.githubusercontent.com/leetal/ios-cmake/4.5.0/ios.toolchain.cmake

      - name: Configure iPhoneOS arm64 (iOS 16 baseline)
        run: >-
          cmake -S . -B build-ios -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake
          -DPLATFORM=OS64
          -DDEPLOYMENT_TARGET=16.0
          -DENABLE_BITCODE=OFF
          -DENABLE_ARC=ON
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_IOS=ON
          -DMITHRIL_BUILD_LEGACY=OFF
          -DMITHRIL_BUILD_DIRECT=ON
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON
          -DBUILD_TESTING=OFF
          -DMITHRIL_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/build-ios/artifacts"

      - name: Build DirectMetal dylib only
        run: cmake --build build-ios --target mithril_direct --parallel

      - name: Check iPhoneOS architecture and install name
        run: |
          DYLIB=build-ios/artifacts/libmithril.dylib
          test -f "$DYLIB"
          file "$DYLIB"
          lipo -info "$DYLIB"
          file "$DYLIB" | grep -q 'Mach-O 64-bit dynamically linked shared library arm64'
          lipo -info "$DYLIB" | grep -q 'arm64'
          vtool -show-build "$DYLIB"
          vtool -show-build "$DYLIB" | grep -q 'platform IOS'
          otool -D "$DYLIB"
          otool -D "$DYLIB" | tail -n +2 | grep -qx '@rpath/libmithril.dylib'

      - name: Prove iPhoneOS shipping target is Vulkan-free
        run: |
          chmod +x scripts/verify_directmetal_artifact.sh
          scripts/verify_directmetal_artifact.sh \
            build-ios/artifacts/libmithril.dylib \
            build-ios/mithril_direct.boundary.json

      - name: Ad-hoc codesign artifact
        run: |
          codesign --force --sign - build-ios/artifacts/libmithril.dylib
          codesign --verify --verbose=2 build-ios/artifacts/libmithril.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: mithril-direct-ios-arm64
          path: build-ios/artifacts/libmithril.dylib
          if-no-files-found: error

  legacy-vulkan-linux:
    name: Vulkan reference regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan CPU runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary | head -20

      - name: Configure legacy target only
        run: >-
          cmake -S . -B build-legacy -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=ON
          -DMITHRIL_BUILD_DIRECT=OFF
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON
          -DMITHRIL_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/build-legacy/artifacts"

      - name: Build legacy target and tests
        run: cmake --build build-legacy --parallel

      - name: Run Vulkan reference smoke suite
        run: ctest --test-dir build-legacy -L vulkan --output-on-failure

      - name: Verify legacy artifact stays separate
        run: |
          test -f build-legacy/artifacts/libmithril.so
          file build-legacy/artifacts/libmithril.so
          nm -D --defined-only build-legacy/artifacts/libmithril.so | \
            awk '{print $3}' | grep -q '^glDrawArrays$'

name: build-mithril

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mithril-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  directmetal-macos:
    name: DirectMetal macOS semantics and boundary
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false

      - name: Record proof subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'source_sha=%s\nsource_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"

      - name: Fetch DirectMetal shader submodules only
        run: >-
          git submodule update --init --depth=1
          third_party/SPIRV-Cross
          third_party/SPIRV-Headers
          third_party/glslang

      - name: Assert Vulkan-Headers was not checked out
        run: test ! -f third_party/Vulkan-Headers/CMakeLists.txt

      - name: Configure Vulkan-free DirectMetal target
        run: >-
          cmake -S . -B build-direct -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=OFF
          -DMITHRIL_BUILD_DIRECT=ON
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON
          -DMITHRIL_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/build-direct/artifacts"

      - name: Build DirectMetal and regression tests
        run: cmake --build build-direct --parallel

      - name: Run DirectMetal semantic suite
        run: ctest --test-dir build-direct -L directmetal --output-on-failure

      - name: Prove shipping target is Vulkan-free
        run: |
          scripts/verify_directmetal_artifact.sh \
            build-direct/artifacts/libmithril.dylib \
            build-direct/mithril_direct.boundary.json

      - name: Verify macOS artifact
        run: |
          file build-direct/artifacts/libmithril.dylib
          codesign --force --sign - build-direct/artifacts/libmithril.dylib
          codesign --verify --verbose=2 build-direct/artifacts/libmithril.dylib

      - uses: actions/upload-artifact@v7
        with:
          name: mithril-direct-macos
          path: build-direct/artifacts/libmithril.dylib
          if-no-files-found: error

  directmetal-ios-arm64:
    name: DirectMetal iPhoneOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false

      - name: Record proof subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'source_sha=%s\nsource_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"

      - name: Fetch DirectMetal shader submodules only
        run: >-
          git submodule update --init --depth=1
          third_party/SPIRV-Cross
          third_party/SPIRV-Headers
          third_party/glslang

      - name: Assert Vulkan-Headers was not checked out
        run: test ! -f third_party/Vulkan-Headers/CMakeLists.txt

      - name: Fetch pinned iOS CMake toolchain
        run: >-
          curl -fsSL -o ios.toolchain.cmake
          https://raw.githubusercontent.com/leetal/ios-cmake/4.5.0/ios.toolchain.cmake

      - name: Build and verify the shipping iPhoneOS package
        env:
          MITHRIL_IOS_BUILD_DIR: ${{ github.workspace }}/build-ios
          MITHRIL_IOS_OUTPUT_DIR: ${{ github.workspace }}/build-ios/artifacts
          MITHRIL_IOS_DEPLOYMENT_TARGET: '16.0'
          MITHRIL_IOS_TOOLCHAIN_FILE: ${{ github.workspace }}/ios.toolchain.cmake
          MITHRIL_IOS_PLATFORM: OS64
        run: scripts/build_iphoneos.sh

      - name: Ad-hoc codesign artifact
        run: |
          codesign --force --sign - build-ios/artifacts/libmithril.dylib
          codesign --verify --verbose=2 build-ios/artifacts/libmithril.dylib

      - uses: actions/upload-artifact@v7
        with:
          name: mithril-direct-ios-arm64
          path: build-ios/artifacts/libmithril.dylib
          if-no-files-found: error

  vulkan-reference-linux:
    name: Vulkan reference regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Record proof subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'source_sha=%s\nsource_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"

      - name: Install Vulkan CPU runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary | head -20

      - name: Configure Vulkan reference target
        run: >-
          cmake -S . -B build-vulkan -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=ON
          -DMITHRIL_BUILD_DIRECT=OFF
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON
          -DMITHRIL_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/build-vulkan/artifacts"

      - name: Build Vulkan reference target and tests
        run: cmake --build build-vulkan --parallel

      - name: Run Vulkan reference suite
        run: ctest --test-dir build-vulkan -L vulkan --output-on-failure

      - name: Verify Vulkan reference artifact remains separate
        shell: bash
        run: |
          set -euo pipefail
          test -f build-vulkan/artifacts/libmithril.so
          file build-vulkan/artifacts/libmithril.so
          symbols="$(nm -D --defined-only build-vulkan/artifacts/libmithril.so | awk '{print $3}')"
          grep -Fxq 'glDrawArrays' <<<"$symbols"

name: Build Mithril-Wrapper for iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Download ios-cmake toolchain
        run: |
          curl -fsSL -o ios.toolchain.cmake \
            https://github.com/leetal/ios-cmake/raw/master/ios.toolchain.cmake
          echo "Toolchain downloaded:"
          ls -l ios.toolchain.cmake

      - name: Download MoltenVK (static framework + Vulkan headers)
        run: |
          # Pull a tagged MoltenVK release tarball (iOS-only). The tarball
          # layout (v1.4.x) is:
          #
          #   MoltenVK/MoltenVK/
          #     ├── include/vulkan/vulkan.h        ← Vulkan headers (SEPARATE
          #     │                                    from the xcframework!)
          #     ├── static/MoltenVK.xcframework/   ← static framework
          #     │     ├── Info.plist
          #     │     └── ios-arm64/libMoltenVK.a
          #     └── dynamic/MoltenVK.xcframework/  ← dynamic framework (unused)
          #
          # The static xcframework does NOT bundle headers — they live in the
          # sibling `include/` directory. We move both into place at the repo
          # root so CMakeLists.txt's find_path (MoltenVK-Headers) and
          # find_library (MoltenVK.xcframework) resolve them.
          #
          # MoltenVK v1.4.x requires iOS 15.0+ (raised minimum target).
          set -uo pipefail
          MOLTENVK_TAG="v1.4.2"
          TARBALL="MoltenVK-ios.tar"
          echo "Fetching MoltenVK ${MOLTENVK_TAG} (iOS)..."
          curl -fsSL -o "${TARBALL}" \
            "https://github.com/KhronosGroup/MoltenVK/releases/download/${MOLTENVK_TAG}/${TARBALL}"
          ls -lh "${TARBALL}"
          # Extract to a staging dir to inspect the layout.
          mkdir -p moltenvk-staging
          tar -xf "${TARBALL}" -C moltenvk-staging
          echo "=== Tarball top-level contents ==="
          ls -la moltenvk-staging/
          echo "=== Searching for STATIC MoltenVK.xcframework ==="
          # Prefer the static framework (the dynamic framework's headers live
          # inside per-platform slices, and we want static linking anyway).
          FOUND=$(find moltenvk-staging -type d -name "MoltenVK.xcframework" -path "*static*" | head -1)
          if [ -z "${FOUND}" ]; then
            # Fallback: any MoltenVK.xcframework (older tarballs may not split static/dynamic)
            FOUND=$(find moltenvk-staging -type d -name "MoltenVK.xcframework" | head -1)
          fi
          if [ -z "${FOUND}" ]; then
            echo "::error::MoltenVK.xcframework not found in tarball. Contents:"
            find moltenvk-staging -maxdepth 4 -type d | head -40
            exit 1
          fi
          echo "Found xcframework at: ${FOUND}"
          mv "${FOUND}" ./MoltenVK.xcframework
          echo "=== Searching for Vulkan headers (include/) ==="
          # The headers are in a sibling `include/` directory next to the
          # static/dynamic framework dirs: MoltenVK/MoltenVK/include/vulkan/vulkan.h
          HDRS=$(find moltenvk-staging -type d -name "vulkan" -path "*/include/vulkan" | head -1)
          if [ -z "${HDRS}" ]; then
            echo "::error::Vulkan headers (include/vulkan/) not found in tarball."
            find moltenvk-staging -maxdepth 4 -type d | head -40
            exit 1
          fi
          HDR_ROOT=$(dirname "${HDRS}")   # .../include
          echo "Found headers at: ${HDR_ROOT}"
          mv "${HDR_ROOT}" ./MoltenVK-Headers
          rm -rf moltenvk-staging
          echo "=== Verify layout ==="
          ls -ld MoltenVK.xcframework
          ls -l MoltenVK-Headers/vulkan/vulkan.h
          ls -l MoltenVK-Headers/vulkan/vulkan_metal.h || true
          ls -l MoltenVK.xcframework/ios-arm64/libMoltenVK.a
          echo "=== xcframework contents ==="
          ls -l MoltenVK.xcframework/ || true

      - name: Configure (iOS arm64)
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=15.0 \
            -DENABLE_BITCODE=OFF \
            -DENABLE_ARC=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-Wno-error=implicit-function-declaration" \
            -DCMAKE_CXX_FLAGS="-Wno-error"

      - name: Build libmithril.dylib
        run: |
          cmake --build build --config RelWithDebInfo --target mithril -j$(sysctl -n hw.ncpu)

      - name: Locate dylib
        id: locate
        run: |
          DYLIB=$(find build -name 'libmithril.dylib' -type f | head -1)
          echo "Found: $DYLIB"
          echo "path=$DYLIB" >> "$GITHUB_OUTPUT"
          ls -l "$DYLIB"
          file "$DYLIB"

      - name: Verify exported EGL/GL symbols
        run: |
          DYLIB="${{ steps.locate.outputs.path }}"
          # Capture the exported-symbol table once. Re-running `nm` per symbol
          # inside the loop also triggers SIGPIPE in llvm-nm (grep -q exits
          # early), which spams the log with "LLVM ERROR: Broken pipe".
          NM_OUT=$(nm -gU "$DYLIB")
          echo "=== Exported egl* symbols ==="
          echo "$NM_OUT" | grep -Ei ' [Tt] _?egl' | head -60
          echo "=== Exported gl* symbols (sample) ==="
          echo "$NM_OUT" | grep -Ei ' [Tt] _(glCreate|glDrawArrays|glGetString)' | head
          echo "=== Required EGL entry points present? ==="
          missing=0
          # EGL 1.5 surface/config/context/sync/image/platform-surface API.
          # The wrapper now exports ~44 egl* symbols (up from ~21 in the EGL
          # 1.4 era). The list below is the full set the host dlsym()s at
          # runtime — the second half (eglCreateSync onward) is the EGL 1.5
          # sync / image / platform-surface API added by the new impl.
          for sym in eglGetDisplay eglGetPlatformDisplay eglInitialize \
                     eglTerminate eglQueryString eglBindAPI eglReleaseThread \
                     eglGetError eglGetConfigs eglChooseConfig eglGetConfigAttrib \
                     eglCreateWindowSurface eglCreatePbufferSurface \
                     eglDestroySurface eglQuerySurface eglCreateContext \
                     eglDestroyContext eglMakeCurrent eglGetCurrentContext \
                     eglGetCurrentSurface eglGetCurrentDisplay eglQueryContext \
                     eglSwapBuffers eglSwapInterval eglWaitClient eglWaitGL \
                     eglWaitNative eglGetProcAddress eglSurfaceAttrib \
                     eglBindTexImage eglReleaseTexImage eglCopyBuffers eglQueryAPI \
                     eglCreateSync eglDestroySync eglClientWaitSync eglWaitSync \
                     eglGetSyncAttrib eglCreateImage eglDestroyImage \
                     eglCreatePlatformWindowSurface eglCreatePlatformPixmapSurface \
                     eglCreatePixmapSurface eglCreatePbufferFromClientBuffer; do
            if echo "$NM_OUT" | grep -qE " [Tt] _?${sym}$"; then
              echo "OK   $sym"
            else
              echo "MISS $sym"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Required EGL entry points missing from libmithril.dylib export table — host dlsym() will fail."
            exit 1
          fi
          echo "=== Total egl* symbol count ==="
          TOTAL=$(echo "$NM_OUT" | grep -cEi ' [Tt] _?egl')
          echo "Exported egl* symbols: $TOTAL (expected >= 40)"
          if [ "$TOTAL" -lt 40 ]; then
            echo "::error::Expected at least 40 exported egl* symbols, found $TOTAL — EGL 1.5 sync/image/platform-surface impl may be missing."
            exit 1
          fi

      - name: Verify Vulkan backend symbols
        run: |
          DYLIB="${{ steps.locate.outputs.path }}"
          NM_OUT=$(nm -gU "$DYLIB")
          echo "=== Vulkan backend C API symbols (sample) ==="
          echo "$NM_OUT" | grep -Ei ' [Tt] _?(backend_init|backend_available|backend_create_swapchain|backend_get_or_create_pipeline)' | head
          echo "=== Vulkan loader symbols (resolved by static MoltenVK link) ==="
          # vkCreateInstance / vkCreateDevice etc. are NOT exported by libmithril
          # (they are interior to the backend), so we just confirm the dylib
          # contains MoltenVK-linked code by checking for an indirect symbol.
          otool -L "$DYLIB" | head -20

      - name: Ad-hoc codesign
        run: |
          codesign -s - "${{ steps.locate.outputs.path }}" || echo "codesign skipped (best-effort)"

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mithril-Wrapper-iOS-dylib
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error

      - name: Upload full build tree (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mithril-Wrapper-build-tree
          path: build
          if-no-files-found: warn

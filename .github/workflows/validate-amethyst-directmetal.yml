name: validate-amethyst-directmetal

on:
  push:
    branches: [feature/direct-metal]
    paths:
      - '.github/workflows/validate-amethyst-directmetal.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-14
    steps:
      - name: Checkout Mithril
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: feature/direct-metal
          fetch-depth: 0

      - name: Build validated Mithril iPhoneOS artifact
        run: ./scripts/build_iphoneos.sh

      - name: Checkout Amethyst integration branch
        uses: actions/checkout@v4
        with:
          repository: 21Z121Z1/Amethyst-iOS
          ref: feature/directmetal-mithril
          path: amethyst
          submodules: recursive

      - name: Configure Amethyst native target with Mithril
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S amethyst/Natives -B amethyst/Natives/build-directmetal-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CROSSCOMPILING=true \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_C_FLAGS='-arch arm64 -include mach/mach.h' \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCONFIG_BRANCH='feature/directmetal-mithril' \
            -DCONFIG_COMMIT='9be0cb8' \
            -DCONFIG_RELEASE=0 \
            -DMITHRIL_DYLIB="$GITHUB_WORKSPACE/output/libmithril.dylib"

      - name: Compile DirectMetal integration translation units
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import shlex
          import subprocess

          build = pathlib.Path('amethyst/Natives/build-directmetal-ci').resolve()
          db = json.loads((build / 'compile_commands.json').read_text())
          wanted = {
              'ctxbridges/gl_bridge.m',
              'egl_bridge.m',
              'LauncherPreferences.m',
              'GameSurfaceView.m',
              'LauncherProfileEditorViewController.m',
          }
          selected = {}
          for entry in db:
              src = pathlib.Path(entry['file']).resolve()
              try:
                  rel = src.relative_to(pathlib.Path('amethyst/Natives').resolve()).as_posix()
              except ValueError:
                  continue
              if rel in wanted:
                  selected[rel] = entry

          missing = wanted - selected.keys()
          if missing:
              raise SystemExit(f'missing compile commands: {sorted(missing)}')

          for rel in sorted(wanted):
              entry = selected[rel]
              argv = entry.get('arguments') or shlex.split(entry['command'])
              print(f'== compile {rel} ==', flush=True)
              subprocess.run(argv, cwd=entry['directory'], check=True)
          print('AMETHYST DIRECTMETAL TRANSLATION UNITS PASSED')
          PY

      - name: Verify staged DirectMetal renderer contract
        shell: bash
        run: |
          set -euo pipefail
          DYLIB="$GITHUB_WORKSPACE/amethyst/Natives/build-directmetal-ci/libmithril.dylib"
          test -f "$DYLIB"
          file "$DYLIB"
          lipo -info "$DYLIB" | grep -q arm64
          vtool -show-build "$DYLIB" | grep -q 'platform IOS'
          otool -D "$DYLIB" | tail -n +2 | grep -qx '@rpath/libmithril.dylib'
          otool -L "$DYLIB" | grep -q '/System/Library/Frameworks/Metal.framework/Metal'
          ! otool -L "$DYLIB" | grep -q MoltenVK
          nm -gU "$DYLIB" | grep -qE ' T _?eglCreateWindowSurface$'
          nm -gU "$DYLIB" | grep -qE ' T _?eglSwapBuffers$'
          grep -q 'MITHRIL_BACKEND.*metal' amethyst/Natives/egl_bridge.m
          grep -q '@rpath/libmithril.dylib' amethyst/Natives/ctxbridges/gl_bridge.m
          grep -q 'EGL_OPENGL_API' amethyst/Natives/ctxbridges/gl_bridge.m
          grep -q 'CAMetalLayer' amethyst/Natives/ctxbridges/gl_bridge.m
          grep -q 'drawableSize' amethyst/Natives/ctxbridges/gl_bridge.m
          echo 'AMETHYST DIRECTMETAL STATIC INTEGRATION CONTRACT PASSED'

      - name: Remove temporary workflow after success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/validate-amethyst-directmetal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/validate-amethyst-directmetal.yml
          git commit -m 'chore: remove Amethyst DirectMetal validation helper'
          git push origin HEAD:feature/direct-metal

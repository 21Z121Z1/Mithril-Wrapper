name: validate-amethyst-directmetal

on:
  push:
    branches: [feature/direct-metal]
    paths:
      - '.github/workflows/validate-amethyst-directmetal.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-14
    steps:
      - name: Checkout Mithril
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: feature/direct-metal
          fetch-depth: 0

      - name: Build validated Mithril iPhoneOS artifact
        run: ./scripts/build_iphoneos.sh

      - name: Checkout Amethyst integration branch
        uses: actions/checkout@v4
        with:
          repository: 21Z121Z1/Amethyst-iOS
          ref: feature/directmetal-mithril
          path: amethyst
          submodules: recursive

      - name: Configure Amethyst native target with Mithril
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S amethyst/Natives -B amethyst/Natives/build-directmetal-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CROSSCOMPILING=true \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_C_FLAGS='-arch arm64' \
            -DCONFIG_BRANCH='feature/directmetal-mithril' \
            -DCONFIG_COMMIT='b9f5a2c' \
            -DCONFIG_RELEASE=0 \
            -DMITHRIL_DYLIB="$GITHUB_WORKSPACE/output/libmithril.dylib"

      - name: Build Amethyst native executable
        run: cmake --build amethyst/Natives/build-directmetal-ci --config Release --target AngelAuraAmethyst -j$(sysctl -n hw.ncpu)

      - name: Verify staged DirectMetal renderer
        shell: bash
        run: |
          set -euo pipefail
          DYLIB="$GITHUB_WORKSPACE/amethyst/Natives/build-directmetal-ci/libmithril.dylib"
          APP="$GITHUB_WORKSPACE/amethyst/Natives/build-directmetal-ci/AngelAuraAmethyst.app/AngelAuraAmethyst"
          test -f "$DYLIB"
          test -f "$APP"
          file "$DYLIB"
          file "$APP"
          lipo -info "$DYLIB" | grep -q arm64
          vtool -show-build "$DYLIB" | grep -q 'platform IOS'
          otool -D "$DYLIB" | tail -n +2 | grep -qx '@rpath/libmithril.dylib'
          otool -L "$DYLIB" | grep -q '/System/Library/Frameworks/Metal.framework/Metal'
          ! otool -L "$DYLIB" | grep -q MoltenVK
          nm -gU "$DYLIB" | grep -qE ' T _?eglCreateWindowSurface$'
          nm -gU "$DYLIB" | grep -qE ' T _?eglSwapBuffers$'
          echo 'AMETHYST DIRECTMETAL NATIVE LINK CONTRACT PASSED'

      - name: Remove temporary workflow after success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/validate-amethyst-directmetal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/validate-amethyst-directmetal.yml
          git commit -m 'chore: remove Amethyst DirectMetal validation helper'
          git push origin HEAD:feature/direct-metal

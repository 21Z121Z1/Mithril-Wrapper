name: fix-texture-max-level-once

on:
  pull_request:
    branches: [integration/directmetal-next]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/minecraft26-directmetal-runtime-closure-20260819'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Implement GL_TEXTURE_MAX_LEVEL end to end
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: anchor count={text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/backend/types.h',
              '''struct SampledTextureBinding {\n    uint32_t binding = 0;\n    uint64_t texture = 0;\n    TexSamplerInfo sampler;\n    bool vertex_stage = false;\n    bool fragment_stage = false;\n};\n''',
              '''struct SampledTextureBinding {\n    uint32_t binding = 0;\n    uint64_t texture = 0;\n    TexSamplerInfo sampler;\n    // Texture image-level accessibility is texture state, not sampler-object\n    // state. Carry MAX_LEVEL beside the resolved sampler snapshot so native\n    // backends can evaluate completeness and clamp accessible mip levels.\n    uint32_t max_level = 1000;\n    bool vertex_stage = false;\n    bool fragment_stage = false;\n};\n''')

          replace_once(
              'src/gl/internal.h',
              '''    GLfloat min_lod = -1000.0f, max_lod = 1000.0f, lod_bias = 0.0f;\n''',
              '''    GLfloat min_lod = -1000.0f, max_lod = 1000.0f, lod_bias = 0.0f;\n    GLint max_level = 1000;               // GL_TEXTURE_MAX_LEVEL\n''')

          p = Path('src/gl/texture.cpp')
          text = p.read_text()
          old = '''    if (pname == GL_TEXTURE_BASE_LEVEL || pname == GL_TEXTURE_MAX_LEVEL) {\n        // Image-level selection remains texture state. The CPU mirror already\n        // owns the complete explicit chain; level-window lowering is future.\n        return;\n    }\n'''
          new = '''    if (pname == GL_TEXTURE_BASE_LEVEL) {\n        // Non-zero BASE_LEVEL needs a rebased native texture view for explicit\n        // LOD operations; retain the existing level-zero-only contract here.\n        if (param != 0) PUSH_ERROR(GL_INVALID_VALUE);\n        return;\n    }\n    if (pname == GL_TEXTURE_MAX_LEVEL) {\n        if (param < 0) { PUSH_ERROR(GL_INVALID_VALUE); return; }\n        st.max_level = param;\n        return;\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'texture integer level anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''    if (pname == GL_TEXTURE_BASE_LEVEL || pname == GL_TEXTURE_MAX_LEVEL)\n        return;\n'''
          new = '''    if (pname == GL_TEXTURE_BASE_LEVEL || pname == GL_TEXTURE_MAX_LEVEL) {\n        if (param < 0.0f || param > static_cast<GLfloat>(INT32_MAX)) {\n            PUSH_ERROR(GL_INVALID_VALUE);\n            return;\n        }\n        const GLint level = static_cast<GLint>(param);\n        if (static_cast<GLfloat>(level) != param) {\n            PUSH_ERROR(GL_INVALID_VALUE);\n            return;\n        }\n        glTexParameteri(target, pname, level);\n        return;\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'texture float level anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''    if (pname == GL_TEXTURE_BASE_LEVEL) { *params = 0.0f; return; }\n    if (pname == GL_TEXTURE_MAX_LEVEL) { *params = 1000.0f; return; }\n'''
          new = '''    if (pname == GL_TEXTURE_BASE_LEVEL) { *params = 0.0f; return; }\n    if (pname == GL_TEXTURE_MAX_LEVEL) {\n        *params = static_cast<GLfloat>(state.max_level);\n        return;\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'texture query anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('src/gl/draw.cpp')
          text = p.read_text()
          text = text.replace(
              '''                    vertex_binding, tex, sampler, true, true});\n''',
              '''                    vertex_binding, tex, sampler,\n                    static_cast<uint32_t>(texture_state.max_level),\n                    true, true});\n''')
          text = text.replace(
              '''                        vertex_binding, tex, sampler, true, false});\n''',
              '''                        vertex_binding, tex, sampler,\n                        static_cast<uint32_t>(texture_state.max_level),\n                        true, false});\n''')
          text = text.replace(
              '''                        fragment_binding, tex, sampler, false, true});\n''',
              '''                        fragment_binding, tex, sampler,\n                        static_cast<uint32_t>(texture_state.max_level),\n                        false, true});\n''')
          if text.count('static_cast<uint32_t>(texture_state.max_level)') != 3:
              raise SystemExit('expected three sampled-texture level snapshots')
          p.write_text(text)

          p = Path('src/metal/engine.mm')
          text = p.read_text()
          old = '''bool HasCompleteMipChain(const ResidentTexture& texture,\n                         const backend::TexSamplerInfo& sampler) {\n    if (texture.is_buffer || texture.is_multisample) return true;\n    if (sampler.mip == backend::TexMipFilter::None) return true;\n    uint32_t largest = std::max(texture.width, texture.height);\n    if (texture.is_3d) largest = std::max(largest, texture.depth);\n    uint32_t expected = 1;\n    while (largest > 1) {\n        largest >>= 1;\n        ++expected;\n    }\n    return texture.levels >= expected;\n}\n'''
          new = '''uint32_t AccessibleMipLevels(const ResidentTexture& texture,\n                             uint32_t max_level) {\n    if (texture.is_buffer || texture.is_multisample) return 1;\n    uint32_t largest = std::max(texture.width, texture.height);\n    if (texture.is_3d) largest = std::max(largest, texture.depth);\n    uint32_t levels = 1;\n    while (largest > 1 && levels <= max_level) {\n        largest >>= 1;\n        ++levels;\n    }\n    return levels;\n}\n\nbool HasCompleteMipChain(const ResidentTexture& texture,\n                         const backend::TexSamplerInfo& sampler,\n                         uint32_t max_level) {\n    if (texture.is_buffer || texture.is_multisample) return true;\n    if (sampler.mip == backend::TexMipFilter::None) return true;\n    return texture.levels >= AccessibleMipLevels(texture, max_level);\n}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'HasCompleteMipChain anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''        backend::TexSamplerInfo sampler_info = bind.sampler;\n        if (!HasCompleteMipChain(texture->second, sampler_info)) {\n            // Minecraft can bind a level-0 image while its resident mip chain\n            // is still being populated during resource reload. Keep the\n            // persistent GL sampler state untouched and narrow only this\n            // native draw snapshot to the resident base level.\n            static bool logged_mip_fallback = false;\n            if (!logged_mip_fallback) {\n                ML_LOG_WARN("metal: incomplete mip chain; using resident base-level sampler");\n                logged_mip_fallback = true;\n            }\n            sampler_info.mip = backend::TexMipFilter::None;\n            sampler_info.min_lod = 0.0f;\n            sampler_info.max_lod = 0.0f;\n            sampler_info.lod_bias = 0.0f;\n        }\n        id<MTLSamplerState> sampler = GetOrCreateSampler(\n            sampler_info, texture->second.levels);\n'''
          new = '''        const backend::TexSamplerInfo& sampler_info = bind.sampler;\n        if (!HasCompleteMipChain(texture->second, sampler_info,\n                                 bind.max_level)) {\n            ML_LOG_ERROR("metal: incomplete mip chain for sampled texture %llu",\n                         (unsigned long long)bind.texture);\n            return false;\n        }\n        const NSUInteger accessible_levels = std::min<NSUInteger>(\n            texture->second.levels, AccessibleMipLevels(texture->second,\n                                                        bind.max_level));\n        id<MTLSamplerState> sampler = GetOrCreateSampler(\n            sampler_info, accessible_levels);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'mip fallback anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # Add an executable regression for Minecraft's mipmapLevels=0 shape:
          # a mipmapped minifier with only level 0 defined is complete when
          # GL_TEXTURE_MAX_LEVEL is explicitly zero.
          Path('tests/texture_level_window_smoke.c').write_text(r'''/* DirectMetal GL_TEXTURE_MAX_LEVEL completeness regression. */
#include <dlfcn.h>
#include <stdio.h>
#include <stdlib.h>
#include <string.h>

#define GL_VERTEX_SHADER 0x8B31
#define GL_FRAGMENT_SHADER 0x8B30
#define GL_ARRAY_BUFFER 0x8892
#define GL_STATIC_DRAW 0x88E4
#define GL_FLOAT 0x1406
#define GL_FALSE 0
#define GL_TRIANGLE_STRIP 0x0005
#define GL_TEXTURE0 0x84C0
#define GL_TEXTURE_2D 0x0DE1
#define GL_RGBA 0x1908
#define GL_RGBA8 0x8058
#define GL_UNSIGNED_BYTE 0x1401
#define GL_TEXTURE_MIN_FILTER 0x2801
#define GL_TEXTURE_MAG_FILTER 0x2800
#define GL_TEXTURE_MAX_LEVEL 0x813D
#define GL_NEAREST 0x2600
#define GL_NEAREST_MIPMAP_LINEAR 0x2702
#define GL_COLOR_BUFFER_BIT 0x00004000
#define GL_NO_ERROR 0
#define GL_INVALID_VALUE 0x0501

typedef unsigned int GLenum; typedef unsigned int GLuint; typedef int GLint;
typedef int GLsizei; typedef long GLsizeiptr; typedef unsigned char GLboolean;
typedef unsigned int GLbitfield;
typedef GLenum (*fnGetError)(void);
typedef GLuint (*fnCreateShader)(GLenum);
typedef void (*fnShaderSource)(GLuint, GLsizei, const char* const*, const GLint*);
typedef void (*fnCompileShader)(GLuint); typedef GLuint (*fnCreateProgram)(void);
typedef void (*fnAttachShader)(GLuint, GLuint); typedef void (*fnLinkProgram)(GLuint);
typedef void (*fnUseProgram)(GLuint); typedef GLint (*fnGetUniformLocation)(GLuint,const char*);
typedef void (*fnUniform1i)(GLint,GLint); typedef void (*fnGenVertexArrays)(GLsizei,GLuint*);
typedef void (*fnBindVertexArray)(GLuint); typedef void (*fnGenBuffers)(GLsizei,GLuint*);
typedef void (*fnBindBuffer)(GLenum,GLuint); typedef void (*fnBufferData)(GLenum,GLsizeiptr,const void*,GLenum);
typedef void (*fnEnableVertexAttribArray)(GLuint); typedef void (*fnVertexAttribPointer)(GLuint,GLint,GLenum,GLboolean,GLsizei,const void*);
typedef void (*fnGenTextures)(GLsizei,GLuint*); typedef void (*fnActiveTexture)(GLenum);
typedef void (*fnBindTexture)(GLenum,GLuint); typedef void (*fnTexImage2D)(GLenum,GLint,GLint,GLsizei,GLsizei,GLint,GLenum,GLenum,const void*);
typedef void (*fnTexParameteri)(GLenum,GLenum,GLint); typedef void (*fnGetTexParameteriv)(GLenum,GLenum,GLint*);
typedef void (*fnViewport)(GLint,GLint,GLsizei,GLsizei); typedef void (*fnClearColor)(float,float,float,float);
typedef void (*fnClear)(GLbitfield); typedef void (*fnDrawArrays)(GLenum,GLint,GLsizei);
typedef void (*fnFinish)(void); typedef void (*fnReadPixels)(GLint,GLint,GLsizei,GLsizei,GLenum,GLenum,void*);

static int failures;
#define CHECK(c,m,...) do { if(c) printf("ok  : " m "\n", ##__VA_ARGS__); else { printf("FAIL: " m "\n", ##__VA_ARGS__); ++failures; } } while(0)
#define LOAD(t,n) t n=(t)dlsym(h,#n)
static int near8(unsigned char v,int want){ return abs((int)v-want)<=3; }

int main(void) {
    const char* path=getenv("MITHRIL_LIBRARY");
#if defined(__APPLE__)
    if(!path) path="./output/libmithril.dylib";
#else
    if(!path) path="./output/libmithril.so";
#endif
    void* h=dlopen(path,RTLD_NOW|RTLD_GLOBAL); if(!h){fprintf(stderr,"dlopen: %s\n",dlerror());return 2;}
    LOAD(fnGetError,glGetError); LOAD(fnCreateShader,glCreateShader); LOAD(fnShaderSource,glShaderSource);
    LOAD(fnCompileShader,glCompileShader); LOAD(fnCreateProgram,glCreateProgram); LOAD(fnAttachShader,glAttachShader);
    LOAD(fnLinkProgram,glLinkProgram); LOAD(fnUseProgram,glUseProgram); LOAD(fnGetUniformLocation,glGetUniformLocation);
    LOAD(fnUniform1i,glUniform1i); LOAD(fnGenVertexArrays,glGenVertexArrays); LOAD(fnBindVertexArray,glBindVertexArray);
    LOAD(fnGenBuffers,glGenBuffers); LOAD(fnBindBuffer,glBindBuffer); LOAD(fnBufferData,glBufferData);
    LOAD(fnEnableVertexAttribArray,glEnableVertexAttribArray); LOAD(fnVertexAttribPointer,glVertexAttribPointer);
    LOAD(fnGenTextures,glGenTextures); LOAD(fnActiveTexture,glActiveTexture); LOAD(fnBindTexture,glBindTexture);
    LOAD(fnTexImage2D,glTexImage2D); LOAD(fnTexParameteri,glTexParameteri); LOAD(fnGetTexParameteriv,glGetTexParameteriv);
    LOAD(fnViewport,glViewport); LOAD(fnClearColor,glClearColor); LOAD(fnClear,glClear); LOAD(fnDrawArrays,glDrawArrays);
    LOAD(fnFinish,glFinish); LOAD(fnReadPixels,glReadPixels);
    CHECK(glGetError&&glCreateShader&&glShaderSource&&glCompileShader&&glCreateProgram&&glAttachShader&&glLinkProgram&&glUseProgram&&glGetUniformLocation&&glUniform1i&&glGenVertexArrays&&glBindVertexArray&&glGenBuffers&&glBindBuffer&&glBufferData&&glEnableVertexAttribArray&&glVertexAttribPointer&&glGenTextures&&glActiveTexture&&glBindTexture&&glTexImage2D&&glTexParameteri&&glGetTexParameteriv&&glViewport&&glClearColor&&glClear&&glDrawArrays&&glFinish&&glReadPixels,"required symbols resolve");
    if(failures) return 1;
    const char* vs_src="#version 150\nlayout(location=0) in vec2 p;\nvoid main(){gl_Position=vec4(p,0,1);}\n";
    const char* fs_src="#version 150\nuniform sampler2D image;\nlayout(location=0) out vec4 c;\nvoid main(){c=texture(image,vec2(0.5));}\n";
    GLuint vs=glCreateShader(GL_VERTEX_SHADER),fs=glCreateShader(GL_FRAGMENT_SHADER); glShaderSource(vs,1,&vs_src,NULL); glShaderSource(fs,1,&fs_src,NULL); glCompileShader(vs); glCompileShader(fs);
    GLuint prog=glCreateProgram(); glAttachShader(prog,vs); glAttachShader(prog,fs); glLinkProgram(prog); glUseProgram(prog); GLint loc=glGetUniformLocation(prog,"image"); glUniform1i(loc,0);
    const float quad[]={-1,-1,1,-1,-1,1,1,1}; GLuint vao=0,vbo=0; glGenVertexArrays(1,&vao); glBindVertexArray(vao); glGenBuffers(1,&vbo); glBindBuffer(GL_ARRAY_BUFFER,vbo); glBufferData(GL_ARRAY_BUFFER,sizeof(quad),quad,GL_STATIC_DRAW); glEnableVertexAttribArray(0); glVertexAttribPointer(0,2,GL_FLOAT,GL_FALSE,2*sizeof(float),NULL);
    const unsigned char red[]={255,0,0,255,255,0,0,255,255,0,0,255,255,0,0,255}; GLuint tex=0; glGenTextures(1,&tex); glActiveTexture(GL_TEXTURE0); glBindTexture(GL_TEXTURE_2D,tex); glTexImage2D(GL_TEXTURE_2D,0,GL_RGBA8,2,2,0,GL_RGBA,GL_UNSIGNED_BYTE,red); glTexParameteri(GL_TEXTURE_2D,GL_TEXTURE_MIN_FILTER,GL_NEAREST_MIPMAP_LINEAR); glTexParameteri(GL_TEXTURE_2D,GL_TEXTURE_MAG_FILTER,GL_NEAREST); glTexParameteri(GL_TEXTURE_2D,GL_TEXTURE_MAX_LEVEL,0);
    GLint max_level=-1; glGetTexParameteriv(GL_TEXTURE_2D,GL_TEXTURE_MAX_LEVEL,&max_level); CHECK(max_level==0,"GL_TEXTURE_MAX_LEVEL round-trips as texture state");
    glTexParameteri(GL_TEXTURE_2D,GL_TEXTURE_MAX_LEVEL,-1); CHECK(glGetError()==GL_INVALID_VALUE,"negative GL_TEXTURE_MAX_LEVEL is rejected");
    glViewport(0,0,16,16); glClearColor(0,0,0,1); glClear(GL_COLOR_BUFFER_BIT); glDrawArrays(GL_TRIANGLE_STRIP,0,4); glFinish(); unsigned char px[4]={0}; glReadPixels(8,8,1,1,GL_RGBA,GL_UNSIGNED_BYTE,px); CHECK(near8(px[0],255)&&near8(px[1],0)&&near8(px[2],0)&&near8(px[3],255),"MAX_LEVEL=0 makes level-zero mipmapped texture complete (%u,%u,%u,%u)",px[0],px[1],px[2],px[3]); CHECK(glGetError()==GL_NO_ERROR,"level-window draw leaves GL_NO_ERROR");
    printf("\nTEXTURE LEVEL WINDOW SMOKE %s\n",failures?"FAILED":"ALL PASSED"); return failures?1:0;
}
''')

          replace_once(
              'cmake/MithrilSmokeTests.cmake',
              '''    sampler_smoke\n    sampler_array_smoke\n''',
              '''    sampler_smoke\n    texture_level_window_smoke\n    sampler_array_smoke\n''')

          Path('.github/workflows/fix-texture-max-level.yml').unlink()

      - name: Validate source shape
        run: |
          git diff --check
          test ! -e .github/workflows/fix-texture-max-level.yml
          grep -q 'GLint max_level = 1000' src/gl/internal.h
          grep -q 'AccessibleMipLevels' src/metal/engine.mm
          ! grep -q 'using resident base-level sampler' src/metal/engine.mm
          grep -q 'texture_level_window_smoke' cmake/MithrilSmokeTests.cmake
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only tests/texture_level_window_smoke.c
      - name: Commit root-cause fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: honor texture max level in DirectMetal completeness'
          git push origin HEAD:${{ github.head_ref }}

name: Mithril DirectVulkan iOS arm64 Artifact

on:
  push:
    branches:
      - codex/dvk-ios-artifact-20260831
    paths:
      - 'CMakeLists.txt'
      - 'Mithril-Wrapper-cpp/**'
      - '.gitmodules'
      - '.github/workflows/ios-directvulkan-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mithril-directvulkan-ios-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  MOLTENVK_TAG: v1.4.2
  NATIVE_BASELINE: de2261ef80f34f4df2afbfa414def2f53ffe9442

jobs:
  build-ios-arm64:
    name: Build iPhoneOS arm64 DirectVulkan libmithril.dylib
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 2

      - name: Prove native source matches validated DirectVulkan baseline
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$NATIVE_BASELINE^{commit}"
          git diff --exit-code "$NATIVE_BASELINE" HEAD -- CMakeLists.txt Mithril-Wrapper-cpp

      - name: Fetch pinned ios-cmake toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o ios.toolchain.cmake \
            https://raw.githubusercontent.com/leetal/ios-cmake/4.5.0/ios.toolchain.cmake
          test -s ios.toolchain.cmake
          shasum -a 256 ios.toolchain.cmake

      - name: Fetch MoltenVK static iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          TARBALL=MoltenVK-ios.tar
          curl -fsSL -o "$TARBALL" \
            "https://github.com/KhronosGroup/MoltenVK/releases/download/${MOLTENVK_TAG}/${TARBALL}"
          mkdir -p moltenvk-staging
          tar -xf "$TARBALL" -C moltenvk-staging

          FOUND=$(find moltenvk-staging -type d -name MoltenVK.xcframework -path '*static*' | head -1)
          if [ -z "$FOUND" ]; then
            FOUND=$(find moltenvk-staging -type d -name MoltenVK.xcframework | head -1)
          fi
          test -n "$FOUND"
          mv "$FOUND" ./MoltenVK.xcframework

          HDRS=$(find moltenvk-staging -type d -name vulkan -path '*/include/vulkan' | head -1)
          test -n "$HDRS"
          mv "$(dirname "$HDRS")" ./MoltenVK-Headers
          rm -rf moltenvk-staging

          test -f MoltenVK.xcframework/ios-arm64/libMoltenVK.a
          test -f MoltenVK-Headers/vulkan/vulkan.h

      - name: Configure iPhoneOS arm64 DirectVulkan-only build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-ios-dvk -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/ios.toolchain.cmake" \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=15.0 \
            -DENABLE_BITCODE=OFF \
            -DENABLE_ARC=OFF \
            -DMITHRIL_METAL_BACKEND=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-Wno-error=implicit-function-declaration' \
            -DCMAKE_CXX_FLAGS='-Wno-error'

      - name: Build libmithril.dylib
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-ios-dvk --config Release --target mithril --parallel
          DYLIB=$(find build-ios-dvk -type f -name libmithril.dylib -print | head -1)
          test -n "$DYLIB"
          test -s "$DYLIB"
          DYLIB="$(cd "$(dirname "$DYLIB")" && pwd)/$(basename "$DYLIB")"
          echo "path=$DYLIB" >> "$GITHUB_OUTPUT"
          ls -lh "$DYLIB"

      - name: Verify iPhoneOS Mach-O and DirectVulkan payload
        shell: bash
        run: |
          set -euo pipefail
          DYLIB='${{ steps.build.outputs.path }}'

          file "$DYLIB" | tee /tmp/file.txt
          grep -q 'arm64' /tmp/file.txt

          echo '=== LC_BUILD_VERSION ==='
          xcrun vtool -show-build "$DYLIB" | tee /tmp/build-version.txt
          grep -Eiq 'platform[[:space:]]+IOS|platform[[:space:]]+2' /tmp/build-version.txt
          if grep -Eiq 'platform[[:space:]]+MACOS|platform[[:space:]]+1' /tmp/build-version.txt; then
            echo '::error::Mach-O is tagged for macOS, not iOS'
            exit 1
          fi

          echo '=== linked libraries ==='
          otool -L "$DYLIB" | tee /tmp/otool.txt
          if grep -E '^\s+/(opt/homebrew|usr/local)/' /tmp/otool.txt; then
            echo '::error::non-portable Homebrew dependency found in iOS dylib'
            exit 1
          fi
          if grep -Fq 'libMoltenVK.dylib' /tmp/otool.txt; then
            echo '::error::iOS artifact unexpectedly depends on dynamic MoltenVK'
            exit 1
          fi

          nm -gU "$DYLIB" > /tmp/nm-global.txt
          missing=0
          for sym in \
            eglGetDisplay eglInitialize eglChooseConfig eglBindAPI \
            eglCreateWindowSurface eglCreateContext eglMakeCurrent eglSwapBuffers \
            glGetString glGetError glCreateShader glCreateProgram glDrawArrays \
            glDrawElements glReadPixels; do
            if grep -qE " [Tt] _?${sym}$" /tmp/nm-global.txt; then
              echo "OK   $sym"
            else
              echo "MISS $sym"
              missing=1
            fi
          done
          test "$missing" -eq 0

          nm "$DYLIB" > /tmp/nm-all.txt
          for sym in dvk_init dvk_available dvk_create_swapchain dvk_texture_upload; do
            if grep -qE " _?${sym}$" /tmp/nm-all.txt; then
              echo "DVK  $sym"
            else
              echo "::error::DirectVulkan symbol missing: $sym"
              exit 1
            fi
          done
          if grep -qE ' _dmt_(init|available|create_swapchain)$' /tmp/nm-all.txt; then
            echo '::error::DirectMetal backend unexpectedly present in DirectVulkan-only artifact'
            exit 1
          fi

          strings "$DYLIB" > /tmp/mithril-strings.txt
          grep -Fq 'Vulkan 1.2 (MoltenVK)' /tmp/mithril-strings.txt
          echo 'Verified iPhoneOS arm64 DirectVulkan-only payload.'

      - name: Ad-hoc sign
        shell: bash
        run: |
          set -euo pipefail
          DYLIB='${{ steps.build.outputs.path }}'
          codesign --force --sign - "$DYLIB"
          codesign --verify --strict --verbose=2 "$DYLIB"

      - name: Create artifact metadata and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp '${{ steps.build.outputs.path }}' dist/libmithril.dylib
          shasum -a 256 dist/libmithril.dylib | tee dist/libmithril.dylib.sha256
          cat > dist/BUILD_INFO.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          workflow_commit=${GITHUB_SHA}
          native_fix_baseline=${NATIVE_BASELINE}
          target=iPhoneOS arm64
          deployment_target=15.0
          backend=DirectVulkan only
          api=Vulkan 1.2 via static MoltenVK
          moltenvk=${MOLTENVK_TAG}
          signing=ad-hoc
          EOF
          cat dist/BUILD_INFO.txt

      - name: Upload iOS DirectVulkan dylib
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Mithril-DirectVulkan-iOS-arm64-de2261ef
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

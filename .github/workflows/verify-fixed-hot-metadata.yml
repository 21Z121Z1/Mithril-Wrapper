name: verify-fixed-hot-metadata

on:
  push:
    branches: [perf/directmetal-fixed-hot-metadata-20260818]

permissions:
  contents: write

concurrency:
  group: verify-fixed-hot-metadata
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/directmetal-fixed-hot-metadata-20260818
          submodules: false
          fetch-depth: 0

      - name: Fetch shader submodules
        run: >-
          git submodule update --init --depth=1
          third_party/SPIRV-Cross
          third_party/SPIRV-Headers
          third_party/glslang

      - name: Apply fixed metadata phase
        run: python3 scripts/apply_fixed_hot_metadata.py

      - name: Verify performance-shape invariants
        run: |
          git diff --check
          grep -q 'FixedList<VertexAttr, kMaxVertexAttributes> attrs' src/backend/types.h
          ! grep -q 'std::vector<VertexAttr> attrs' src/backend/types.h
          grep -q 'FixedList<GLuint, kMaxAttribs> vertex_slots' src/gl/draw.cpp
          grep -q 'FixedList<GLuint, kMaxAttribs> instance_slots' src/gl/draw.cpp
          grep -q 'FixedList<sh::VertexInput, kMaxAttribs> constant_inputs' src/gl/draw.cpp
          grep -q 'FixedList<v::UniformBufferBinding' src/gl/draw.cpp
          grep -q 'FixedList<v::SampledTextureBinding' src/gl/draw.cpp
          grep -q 'FixedList<v::VertexAttr, v::kMaxVertexAttributes> native_attrs' src/gl/draw.cpp
          grep -q 'op.v_attrs.assign(params.vertex_stream.attrs.begin()' src/vk/draw.cpp

      - name: Materialize implementation
        run: |
          rm .github/workflows/verify-fixed-hot-metadata.yml
          rm scripts/apply_fixed_hot_metadata.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf: inline fixed hot draw metadata'
          git push origin HEAD:perf/directmetal-fixed-hot-metadata-20260818

      - name: Configure DirectMetal Release
        run: >-
          cmake -S . -B build-direct -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=OFF
          -DMITHRIL_BUILD_DIRECT=ON
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON

      - name: Build DirectMetal
        run: cmake --build build-direct --parallel

      - name: Run geometry/metadata regressions
        run: >-
          ctest --test-dir build-direct
          -R '^(typed_vertex_smoke|packed_vertex_attrib_smoke|sampler_array_smoke|ubo_smoke|directmetal_multidraw_lowering_smoke)$'
          --output-on-failure

      - name: Run complete DirectMetal suite
        run: ctest --test-dir build-direct -L directmetal --output-on-failure

      - name: Fetch Vulkan headers
        run: git submodule update --init --depth=1 third_party/Vulkan-Headers

      - name: Configure Vulkan reference
        run: >-
          cmake -S . -B build-vulkan -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=ON
          -DMITHRIL_BUILD_DIRECT=OFF
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON

      - name: Build Vulkan reference
        run: cmake --build build-vulkan --parallel

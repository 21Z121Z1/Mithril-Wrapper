name: repository-reconstruction-once
on:
  push:
    branches: [maintenance/apply-consolidation-20260920]
permissions:
  contents: read
  pull-requests: read
jobs:
  evidence:
    if: github.repository == '21Z121Z1/Mithril-Wrapper'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture immutable transfer input and open review evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence
          gh api 'repos/21Z121Z1/Mithril-Wrapper/contents/.github/workflows/apply-consolidation-once.yml?ref=abdbaec95fc90823ac1aee5f730c28fd46a536e4' --jq .content | base64 --decode > /tmp/evidence/transfer.yml
          for n in 16 17 18 19 21 33 36 40; do
            gh api "repos/21Z121Z1/Mithril-Wrapper/pulls/$n/reviews?per_page=100" > "/tmp/evidence/pr-$n-reviews.json"
            gh api "repos/21Z121Z1/Mithril-Wrapper/pulls/$n/comments?per_page=100" > "/tmp/evidence/pr-$n-comments.json"
          done
          gh api 'repos/21Z121Z1/Amethyst-iOS/branches?per_page=100' > /tmp/evidence/amethyst-branches.json
      - uses: actions/upload-artifact@v7
        with:
          name: remaining-review-evidence
          path: /tmp/evidence
          retention-days: 7
          if-no-files-found: error

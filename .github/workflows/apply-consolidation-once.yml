name: repository-reconstruction-once
on:
  push:
    branches: [maintenance/apply-consolidation-20260920]
permissions:
  contents: read
jobs:
  local-runtime:
    if: github.repository == '21Z121Z1/Mithril-Wrapper'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify Debian software Vulkan runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime
          cd /tmp/runtime
          curl --fail --location --output mesa-vulkan-drivers.deb 'https://deb.debian.org/debian/pool/main/m/mesa/mesa-vulkan-drivers_25.0.7-2+deb13u1_amd64.deb'
          printf '%s  %s\n' caf2f7d296b7522efe74e40a74bce762a3ce84c33b53b5e54e1248ac2e0a13a5 mesa-vulkan-drivers.deb | sha256sum --check --strict
      - uses: actions/upload-artifact@v7
        with:
          name: isolated-vulkan-runtime
          path: /tmp/runtime
          retention-days: 1
          if-no-files-found: error

name: repository-reconstruction-once
on:
  push:
    branches: [maintenance/apply-consolidation-20260920]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  evidence:
    if: github.repository == '21Z121Z1/Mithril-Wrapper'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a3cd8e2c07fece3f2440687d9fb3574abe7379d6
          persist-credentials: false
      - name: Capture final jobs, raw logs, and complete workflow registry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final-evidence
          python3 - <<'PY'
          import json,pathlib,subprocess
          repo='21Z121Z1/Mithril-Wrapper'; out=pathlib.Path('/tmp/final-evidence')
          def read(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path],text=True))
          head='a3cd8e2c07fece3f2440687d9fb3574abe7379d6'
          assert read('git/ref/heads/consolidation/main-20260920')['object']['sha']==head
          workflows=[]; page=1
          while True:
              data=read('actions/workflows?per_page=100&page='+str(page)); workflows.extend(data['workflows'])
              if len(workflows)>=data['total_count']: break
              page+=1
          (out/'all-workflows.json').write_text(json.dumps(workflows,indent=2)+'\n')
          runs=read('actions/runs?head_sha='+head+'&per_page=20')['workflow_runs']
          for run in runs:
              rid=run['id']
              for suffix in ('','/jobs','/artifacts'):
                  data=read('actions/runs/'+str(rid)+suffix)
                  (out/(str(rid)+(suffix.replace('/','-') or '-run')+'.json')).write_text(json.dumps(data,indent=2)+'\n')
              for job in read('actions/runs/'+str(rid)+'/jobs')['jobs']:
                  if job['status']=='completed':
                      with (out/(str(job['id'])+'.log')).open('wb') as f:
                          subprocess.run(['gh','api','--allow-escape-sequences','repos/'+repo+'/actions/jobs/'+str(job['id'])+'/logs'],stdout=f,check=True)
          (out/'head.json').write_text(json.dumps(read('git/commits/'+head),indent=2)+'\n')
          print('Captured runs:',[(r['id'],r['status'],r['conclusion']) for r in runs])
          PY
      - name: Generate local-only Minecraft references and keep aggregate facts
        shell: bash
        env:
          MINECRAFT_REFERENCE_DIR: ${{ runner.temp }}/minecraft-reference
        run: |
          set -euo pipefail
          if [[ -n "${JAVA_HOME_25_X64:-}" ]]; then
            export JAVA_HOME="$JAVA_HOME_25_X64"; export PATH="$JAVA_HOME/bin:$PATH"
          elif [[ -n "${JAVA_HOME_21_X64:-}" ]]; then
            export JAVA_HOME="$JAVA_HOME_21_X64"; export PATH="$JAVA_HOME/bin:$PATH"
          fi
          for version in 26.2 26.3; do
            export MINECRAFT_REFERENCE_VERSION="$version"
            if SRC="$(bash scripts/minecraft-reference.sh --print-path 2>"$RUNNER_TEMP/reference-$version.log")"; then
              export SRC
              python3 - <<'PY'
          import collections,json,os,pathlib,re
          version=os.environ['MINECRAFT_REFERENCE_VERSION']; root=pathlib.Path(os.environ['SRC'])
          calls=collections.Counter(); imports=collections.Counter(); gl_files=0; vk_files=0; count=0
          for path in root.rglob('*.java'):
              count+=1; text=path.read_text(errors='replace')
              gl_files+=('org.lwjgl.opengl.' in text); vk_files+=('org.lwjgl.vulkan.' in text)
              qualifiers=[]
              for package,name in re.findall(r'import\s+(org\.lwjgl\.(?:opengl|vulkan))\.([A-Za-z0-9_]+)\s*;',text):
                  imports[package+'.'+name]+=1
                  if package.endswith('opengl'): qualifiers.append(re.escape(name))
              if qualifiers:
                  calls.update(re.findall(r'\b(?:'+'|'.join(qualifiers)+r')\.(gl[A-Za-z0-9_]+)\s*\(',text))
          info=dict(line.split('=',1) for line in (root.parent/'REFERENCE_INFO.txt').read_text().splitlines() if '=' in line)
          info.pop('sources_dir',None)
          result={'version':version,'status':'success','reference':info,'java_files':count,'gl_importing_files':gl_files,'vulkan_importing_files':vk_files,'qualified_gl_calls':dict(sorted(calls.items())),'lwjgl_imports':dict(sorted(imports.items())),'limitation':'Static qualified-call inventory only. It excludes external library implementation, reflection and runtime dispatch. It is not client execution or rendering evidence.'}
          pathlib.Path('/tmp/final-evidence/minecraft-'+version+'.json').write_text(json.dumps(result,indent=2)+'\n')
          print(version,':',count,'Java files;',len(calls),'distinct qualified GL call names; no source uploaded')
          PY
            else
              VERSION="$version" python3 - <<'PY'
          import json,os,pathlib
          version=os.environ['VERSION']
          pathlib.Path('/tmp/final-evidence/minecraft-'+version+'.json').write_text(json.dumps({'version':version,'status':'failed','limitation':'Reference generator failed. No source or decompiler log is uploaded.'})+'\n')
          print('Reference generation failed for',version)
          PY
            fi
          done
          rm -rf "$MINECRAFT_REFERENCE_DIR"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: final-reviewed-evidence
          path: /tmp/final-evidence
          retention-days: 7
          if-no-files-found: error

name: repository-reconstruction-once
on:
  push:
    branches: [maintenance/apply-consolidation-20260920]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: repository-reconstruction-once
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.repository == '21Z121Z1/Mithril-Wrapper'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: consolidation/main-20260920
          fetch-depth: 0
          persist-credentials: false
      - name: Capture read-only repository and reference evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/reconstruction/api
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request, urllib.error
          out = pathlib.Path('/tmp/reconstruction')
          repo = '21Z121Z1/Mithril-Wrapper'
          errors = []
          def get(path, name, paginate=False):
              result=[]
              url='https://api.github.com/'+path
              while url:
                  req=urllib.request.Request(url, headers={
                      'Authorization': 'Bearer '+os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28'})
                  try:
                      with urllib.request.urlopen(req, timeout=45) as response:
                          data=json.load(response)
                          result.append(data)
                          links=response.headers.get('Link','')
                  except urllib.error.HTTPError as exc:
                      errors.append({'path':path,'status':exc.code})
                      return None
                  next_url=None
                  if paginate:
                      for link in links.split(','):
                          if 'rel="next"' in link:
                              next_url=link.split(';')[0].strip().strip('<>')
                  url=next_url
              data=result if paginate else result[0]
              (out/'api'/name).write_text(json.dumps(data,indent=2)+'\n')
              return data
          info=get('repos/'+repo,'repository.json')
          for endpoint,name,paged in [
              ('branches?per_page=100','branches.json',True),
              ('tags?per_page=100','tags.json',True),
              ('pulls?state=all&per_page=100','pulls.json',True),
              ('actions/workflows?per_page=100','workflows.json',False),
              ('actions/runs?per_page=100','runs.json',False),
              ('rulesets?per_page=100','rulesets.json',False),
              ('branches/main/protection','protection.json',False)]:
              get('repos/'+repo+'/'+endpoint,name,paged)
          for number in (41,40,39,38,34):
              for suffix in ('','/reviews','/comments','/commits'):
                  get(f'repos/{repo}/pulls/{number}{suffix}',f'pr-{number}{suffix.replace("/","-") or "-info"}.json',suffix in ('/comments','/commits'))
              get(f'repos/{repo}/issues/{number}/comments',f'pr-{number}-discussion.json',True)
          refs={'MithrilWrapper-Dev/Mithril-Wrapper','Uniaball/Mithril-Wrapper',
                'herbrine8403/Mithril-Wrapper','EternityQwQ/Mithril-Wrapper'}
          for key in ('parent','source'):
              if info and info.get(key): refs.add(info[key]['full_name'])
          checked=set()
          while refs-checked:
              refrepo=sorted(refs-checked)[0]; checked.add(refrepo)
              prefix=refrepo.replace('/','--')
              data=get('repos/'+refrepo,prefix+'-repo.json')
              if not data: continue
              canonical=data['full_name']
              for key in ('parent','source'):
                  if data.get(key): refs.add(data[key]['full_name'])
              forks=get('repos/'+canonical+'/forks?per_page=100',prefix+'-forks.json',True)
              if forks:
                  refs.update(f['full_name'] for page in forks for f in page if not f['private'])
              get('repos/'+canonical+'/branches?per_page=100',prefix+'-branches.json',True)
              get('repos/'+canonical+'/pulls?state=all&per_page=100',prefix+'-pulls.json',True)
              if canonical == repo: continue
              cmd=['git','fetch','--no-tags','https://github.com/'+canonical+'.git',
                   '+refs/heads/*:refs/remotes/reference-'+prefix+'/*',
                   '+refs/tags/*:refs/tags/reference-'+prefix+'/*']
              run=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (out/(prefix+'-fetch.txt')).write_text(run.stdout)
              if run.returncode: errors.append({'fetch':canonical,'status':run.returncode})
          (out/'read-errors.json').write_text(json.dumps(errors,indent=2)+'\n')
          PY
          git for-each-ref --format='%(refname) %(objectname)' > /tmp/reconstruction/refs.txt
          git log --graph --all --decorate --oneline > /tmp/reconstruction/graph.txt
          git ls-tree -r HEAD > /tmp/reconstruction/candidate-tree.txt
          git bundle create /tmp/reconstruction/mithril.bundle --all
          git bundle verify /tmp/reconstruction/mithril.bundle
          printf 'candidate_sha=%s\ncandidate_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee /tmp/reconstruction/subject.txt
          du -sh /tmp/reconstruction
      - uses: actions/upload-artifact@v7
        with:
          name: mithril-readonly-reconstruction
          path: /tmp/reconstruction
          retention-days: 7
          if-no-files-found: error

name: repository-reconstruction-once
on:
  push:
    branches: [maintenance/apply-consolidation-20260920]
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == '21Z121Z1/Mithril-Wrapper'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0cdc5fcd5f89cddf590c3fba87e5bcd6b1808869
          submodules: recursive
          persist-credentials: false
      - name: Reconstruct reviewed edits and verify every tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EDITS: 
        run: |
          set -euo pipefail
          git config user.name '21Z121Z1'
          git config user.email '89170834+21Z121Z1@users.noreply.github.com'
          python3 - <<'PY'
          import base64, gzip, json, os, pathlib, subprocess
          repo = '21Z121Z1/Mithril-Wrapper'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(path, data):
              return json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/'+repo+'/'+path, '--input', '-'], input=json.dumps(data), text=True))
          parent = '0cdc5fcd5f89cddf590c3fba87e5bcd6b1808869'
          base_tree = git('rev-parse','HEAD^{tree}')
          commits = []
          steps = json.loads(gzip.decompress(base64.b64decode(os.environ['EDITS'])))
          for step in steps:
              entries = []
              for change in step['files']:
                  path = pathlib.Path(change['path'])
                  assert not path.is_absolute() and '..' not in path.parts
                  entry = {'path':str(path), 'mode':'100644', 'type':'blob'}
                  if change.get('delete'):
                      path.unlink()
                      entry['sha'] = None
                  else:
                      lines = path.read_text().splitlines(keepends=True)
                      for start, end, replacement in reversed(change['edits']):
                          lines[start:end] = replacement
                      text = ''.join(lines)
                      path.write_text(text)
                      entry['content'] = text
                  entries.append(entry)
              subprocess.run(['git','add','--all'],check=True)
              tree = git('write-tree')
              assert tree == step['tree'], (tree, step['tree'])
              remote_tree = api('git/trees', {'base_tree':base_tree, 'tree':entries})['sha']
              assert remote_tree == tree
              commit = api('git/commits', {'message':step['message'], 'tree':tree, 'parents':[parent]})['sha']
              commits.append({'sha':commit,'tree':tree,'message':step['message']})
              subprocess.run(['git','commit','-m',step['message']],check=True)
              parent, base_tree = commit, tree
          pathlib.Path('/tmp/transferred-commits.json').write_text(json.dumps(commits,indent=2)+'\n')
          print(json.dumps(commits,indent=2))
          PY
      - name: Verify reconstructed candidate with Vulkan reference
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers
          cmake -S . -B build-vulkan -G Ninja -DCMAKE_BUILD_TYPE=Release -DMITHRIL_BUILD_LEGACY=ON -DMITHRIL_BUILD_DIRECT=OFF -DMITHRIL_OUTPUT_DIRECTORY="$PWD/build-vulkan/artifacts"
          cmake --build build-vulkan --parallel
          ctest --test-dir build-vulkan -L vulkan --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          name: verified-convergence-commits
          path: /tmp/transferred-commits.json
          retention-days: 7
          if-no-files-found: error

name: repository-reconstruction-once
on:
  push:
    branches: [maintenance/apply-consolidation-20260920]
permissions:
  contents: read
  actions: write
  pull-requests: read
jobs:
  platform-gate:
    if: github.repository == '21Z121Z1/Mithril-Wrapper'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check exact product refs and dispatch existing runtime gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final-evidence
          python3 - <<'PY'
          import json,pathlib,subprocess
          repo='21Z121Z1/Mithril-Wrapper'; out=pathlib.Path('/tmp/final-evidence')
          def read(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path],text=True))
          head=read('git/ref/heads/consolidation/main-20260920')['object']['sha']
          main=read('git/ref/heads/main')['object']['sha']
          assert head=='a3cd8e2c07fece3f2440687d9fb3574abe7379d6'
          assert main=='7f6d676f7dbfe5b10f7367cd429c7dae994954e7'
          tree=read('git/commits/'+head)['tree']['sha']
          assert tree=='dc7daa7df3406a79d9ec31186f6cd8806e533891'
          (out/'subject.json').write_text(json.dumps({'head':head,'tree':tree,'main':main},indent=2)+'\n')
          workflows=[]
          page=1
          while True:
              data=read('actions/workflows?per_page=100&page='+str(page))
              workflows.extend(data['workflows'])
              if len(workflows)>=data['total_count']: break
              page+=1
          (out/'all-workflows.json').write_text(json.dumps(workflows,indent=2)+'\n')
          print('Workflow definitions:',len(workflows))
          (out/'build-runs.json').write_text(json.dumps(read('actions/runs?head_sha='+head+'&per_page=20'),indent=2)+'\n')
          (out/'branches.json').write_text(json.dumps(read('branches?per_page=100'),indent=2)+'\n')
          (out/'open-prs.json').write_text(json.dumps(read('pulls?state=open&per_page=100'),indent=2)+'\n')
          subprocess.run(['gh','api','--method','POST','repos/'+repo+'/actions/workflows/hosted-metal-gpu-probe.yml/dispatches','-f','ref=consolidation/main-20260920'],check=True)
          print('Dispatched existing runtime gate for',head)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: final-platform-dispatch
          path: /tmp/final-evidence
          retention-days: 7
          if-no-files-found: error

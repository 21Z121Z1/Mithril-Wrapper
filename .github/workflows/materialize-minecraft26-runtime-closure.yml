name: materialize-minecraft26-runtime-closure-once

on:
  push:
    branches: [fix/minecraft26-directmetal-runtime-closure-20260819]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/minecraft26-directmetal-runtime-closure-20260819
          fetch-depth: 0
      - name: Apply reviewed runtime closure
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"anchor mismatch in {path}: {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          # 1. DirectMetal: preserve draws during transient resident-mip population.
          replace_once(
              'src/metal/engine.mm',
              '''        if (!HasCompleteMipChain(texture->second, bind.sampler)) {\n            ML_LOG_ERROR("metal: incomplete mip chain for sampled texture %llu",\n                         (unsigned long long)bind.texture);\n            return false;\n        }\n        id<MTLSamplerState> sampler = GetOrCreateSampler(\n            bind.sampler, texture->second.levels);\n''',
              '''        backend::TexSamplerInfo sampler_info = bind.sampler;\n        if (!HasCompleteMipChain(texture->second, sampler_info)) {\n            // Minecraft can bind a level-0 image while its resident mip chain\n            // is still being populated during resource reload. Keep the\n            // persistent GL sampler state untouched and narrow only this\n            // native draw snapshot to the resident base level.\n            static bool logged_mip_fallback = false;\n            if (!logged_mip_fallback) {\n                ML_LOG_WARN("metal: incomplete mip chain; using resident base-level sampler");\n                logged_mip_fallback = true;\n            }\n            sampler_info.mip = backend::TexMipFilter::None;\n            sampler_info.min_lod = 0.0f;\n            sampler_info.max_lod = 0.0f;\n            sampler_info.lod_bias = 0.0f;\n        }\n        id<MTLSamplerState> sampler = GetOrCreateSampler(\n            sampler_info, texture->second.levels);\n''')

          # 2. DirectMetal: size the EGL default target from the first real FBO blit
          # before resolving that destination. This avoids carrying the bootstrap
          # extent into Minecraft's window-sized composite.
          replace_once(
              'src/metal/engine.mm',
              '''    ResolvedTarget source;\n    ResolvedTarget destination;\n    if (!ResolveTarget(src_id, &source) || !ResolveTarget(dst_id, &destination))\n        return;\n    if (source.samples != 1 || destination.samples != 1) {\n''',
              '''    ResolvedTarget source;\n    if (!ResolveTarget(src_id, &source)) return;\n\n    // Minecraft renders into an application FBO before blitting to the EGL\n    // default framebuffer. The CAMetalLayer may still carry its bootstrap\n    // extent at the first real window-sized blit, so synchronize the default\n    // target before resolving the destination texture.\n    if (!dst_id && source.width > 0 && source.height > 0 &&\n        (source.width != engine.width || source.height != engine.height)) {\n        if (engine.layer)\n            engine.layer.drawableSize = CGSizeMake(source.width, source.height);\n        if (!SetTargetSize((uint32_t)source.width, (uint32_t)source.height))\n            return;\n    }\n\n    ResolvedTarget destination;\n    if (!ResolveTarget(dst_id, &destination)) return;\n    if (source.samples != 1 || destination.samples != 1) {\n''')

          # 3. Shader API: expose a cross-stage reconciliation pass that can retain
          # explicit layout(location=) authority while fixing independently assigned
          # automatic varying locations.
          replace_once(
              'src/shader/shader.h',
              '''bool ApplyStageLocationBindings(\n    std::vector<uint32_t>& spirv, GLenum stage, const std::string& source,\n    const std::unordered_map<std::string, GLuint>& requested,\n    uint32_t max_locations, std::string& error);\n\n''',
              '''bool ApplyStageLocationBindings(\n    std::vector<uint32_t>& spirv, GLenum stage, const std::string& source,\n    const std::unordered_map<std::string, GLuint>& requested,\n    uint32_t max_locations, std::string& error);\n\n// Reconcile the linked vertex-output / fragment-input interface after the two\n// stages have been compiled independently. Automatic locations match by GLSL\n// name; explicit layout(location=) declarations remain authoritative.\nbool AlignStageInterfaceLocations(\n    std::vector<uint32_t>& vertex_spirv,\n    std::vector<uint32_t>& fragment_spirv,\n    const std::string& vertex_source,\n    const std::string& fragment_source,\n    std::string& error);\n\n''')

          reflect_anchor = '''bool ApplyStageLocationBindings(\n    std::vector<uint32_t>& words, GLenum stage, const std::string& source,\n    const std::unordered_map<std::string, GLuint>& requested,\n    uint32_t max_locations, std::string& error) {\n'''
          p = Path('src/shader/reflect.cpp')
          text = p.read_text()
          if 'bool AlignStageInterfaceLocations(' not in text:
              # Insert immediately before ReflectProgram, after the complete location-binding helper.
              marker = '\nbool ReflectProgram(Program& program, std::string& error) {'
              if marker not in text:
                  raise SystemExit('ReflectProgram insertion anchor missing')
              implementation = r'''\n\nbool AlignStageInterfaceLocations(\n    std::vector<uint32_t>& vertex_spirv,\n    std::vector<uint32_t>& fragment_spirv,\n    const std::string& vertex_source,\n    const std::string& fragment_source,\n    std::string& error) {\n    if (vertex_spirv.empty() || fragment_spirv.empty()) {\n        error = "missing stage SPIR-V for interface matching";\n        return false;\n    }\n\n    try {\n        spirv_cross::Compiler vertex(vertex_spirv);\n        spirv_cross::Compiler fragment(fragment_spirv);\n        const auto vertex_resources = vertex.get_shader_resources();\n        const auto fragment_resources = fragment.get_shader_resources();\n        const auto explicit_vertex =\n            ExplicitLocationNames(vertex_source, "out");\n        const auto explicit_fragment =\n            ExplicitLocationNames(fragment_source, "in");\n\n        struct InterfaceOutput {\n            uint32_t id = 0;\n            uint32_t location = 0;\n            uint32_t span = 1;\n            spirv_cross::SPIRType::BaseType base =\n                spirv_cross::SPIRType::Unknown;\n            uint32_t vecsize = 1;\n            uint32_t columns = 1;\n            std::vector<uint32_t> array;\n            bool explicit_location = false;\n        };\n\n        std::unordered_map<std::string, InterfaceOutput> outputs;\n        for (const auto& resource : vertex_resources.stage_outputs) {\n            if (resource.name.empty() ||\n                !vertex.has_decoration(resource.id, spv::DecorationLocation))\n                continue;\n            const auto& type = vertex.get_type(resource.type_id);\n            outputs[resource.name] = {\n                resource.id,\n                vertex.get_decoration(resource.id, spv::DecorationLocation),\n                InterfaceLocationSpan(type),\n                type.basetype, type.vecsize, type.columns, type.array,\n                explicit_vertex.count(resource.name) != 0,\n            };\n        }\n\n        for (const auto& resource : fragment_resources.stage_inputs) {\n            if (resource.name.empty() ||\n                !fragment.has_decoration(resource.id, spv::DecorationLocation))\n                continue;\n            auto output = outputs.find(resource.name);\n            if (output == outputs.end()) continue;\n\n            const auto& input_type = fragment.get_type(resource.type_id);\n            const auto& linked = output->second;\n            if (input_type.basetype != linked.base ||\n                input_type.vecsize != linked.vecsize ||\n                input_type.columns != linked.columns ||\n                input_type.array != linked.array ||\n                InterfaceLocationSpan(input_type) != linked.span) {\n                error = "cross-stage interface type mismatch for " +\n                        resource.name;\n                return false;\n            }\n\n            const uint32_t input_location = fragment.get_decoration(\n                resource.id, spv::DecorationLocation);\n            const bool input_explicit =\n                explicit_fragment.count(resource.name) != 0;\n\n            // If both sides explicitly selected locations, location matching is\n            // authoritative; do not rewrite either stage merely because names\n            // happen to match. Otherwise make the automatic side follow the\n            // explicit side, or (when both are automatic) make FS follow VS.\n            if (linked.explicit_location && input_explicit) continue;\n            if (input_location == linked.location) continue;\n\n            if (input_explicit && !linked.explicit_location) {\n                if (!RewriteLocation(vertex_spirv, linked.id, input_location)) {\n                    error = "vertex interface has no mutable Location decoration: " +\n                            resource.name;\n                    return false;\n                }\n            } else {\n                if (!RewriteLocation(fragment_spirv, resource.id,\n                                     linked.location)) {\n                    error = "fragment interface has no mutable Location decoration: " +\n                            resource.name;\n                    return false;\n                }\n            }\n        }\n        return true;\n    } catch (const std::exception& exception) {\n        error = std::string("cross-stage interface remap failed: ") +\n                exception.what();\n        return false;\n    }\n}\n'''
              text = text.replace(marker, implementation + marker, 1)
              p.write_text(text)

          replace_once(
              'src/gl/shader.cpp',
              '''    if (!sh::ReflectProgram(*p, reflection_error)) {\n''',
              '''    if (!sh::AlignStageInterfaceLocations(\n            p->vertex_spirv, p->fragment_spirv,\n            vertex_source, fragment_source, reflection_error)) {\n        p->info_log = "link failed: " + reflection_error;\n        ML_LOG_WARN("glLinkProgram(%u): %s", program, p->info_log.c_str());\n        return;\n    }\n    if (!sh::ReflectProgram(*p, reflection_error)) {\n''')

          # 4/5. Serialize the vendored glslang stage transaction and keep the
          # Minecraft compiler workarounds narrow to iPhoneOS builds + exact text.
          p = Path('src/shader/glsl.cpp')
          text = p.read_text()
          if 'rewrite_minecraft_projection_swizzles' not in text:
              marker = '\nbool is_opaque_glsl_type(const std::string& name) {'
              compat = r'''\n\n#if defined(MITHRIL_IOS)\n// Minecraft 26.2's projection helper writes two disjoint swizzles. The\n// iPhoneOS arm64 build of the currently pinned glslang can lose this l-value\n// shape; lower only the exact helper sequence observed on device.\nvoid rewrite_minecraft_projection_swizzles(std::string& src) {\n    static const std::string xy =\n        "projection.xy = vec2(projection.x + projection.w, projection.y + projection.w);";\n    static const std::string zw = "projection.zw = position.zw;";\n    const size_t first = src.find(xy);\n    const size_t second = src.find(\n        zw, first == std::string::npos ? 0 : first + xy.size());\n    if (first == std::string::npos || second == std::string::npos) return;\n    const size_t end = second + zw.size();\n    src.replace(\n        first, end - first,\n        "projection = vec4((position.x + position.w) * 0.5, "\n        "(position.y + position.w) * 0.5, position.z, position.w);");\n}\n\nvoid rewrite_minecraft_ios_vector_compatibility(std::string& src) {\n    auto replace_all = [&](const std::string& from, const std::string& to) {\n        size_t offset = 0;\n        while ((offset = src.find(from, offset)) != std::string::npos) {\n            src.replace(offset, from.size(), to);\n            offset += to.size();\n        }\n    };\n\n    replace_all("float distXZ = length(pos.xz);",\n                "float distXZ = length(vec2(pos.x, pos.z));");\n    replace_all(\n        "return texture(lightMap, clamp((uv / 256.0) + 0.5 / 16.0, "\n        "vec2(0.5 / 16.0), vec2(15.5 / 16.0)));",\n        "vec2 uvf = vec2(uv);\\n"\n        "    return texture(lightMap, clamp((uvf / 256.0) + 0.5 / 16.0, "\n        "vec2(0.5 / 16.0), vec2(15.5 / 16.0))); ");\n    replace_all(\n        "return vec4(mix(inColor.rgb, fogColor.rgb, fogValue * fogColor.a), inColor.a);",\n        "return vec4(mix(vec3(inColor.x, inColor.y, inColor.z), "\n        "vec3(fogColor.x, fogColor.y, fogColor.z), fogValue * fogColor.a), inColor.a);");\n    replace_all(\n        "return vec4(color.rgb * lightAccum, color.a);",\n        "return vec4(vec3(color.x, color.y, color.z) * lightAccum, color.a);");\n    replace_all(\n        "color.rgb = mix(overlayColor.rgb, color.rgb, overlayColor.a);",\n        "color = vec4(mix(vec3(overlayColor.x, overlayColor.y, overlayColor.z), "\n        "vec3(color.x, color.y, color.z), overlayColor.a), color.a);");\n    replace_all(\n        "fragColor = vec4(color.rgb * fade, color.a);",\n        "fragColor = vec4(vec3(color.x, color.y, color.z) * fade, color.a);");\n    replace_all(\n        "fragColor = vec4(ColorModulator.rgb * vertexColor.rgb, ColorModulator.a);",\n        "fragColor = vec4(vec3(ColorModulator.x, ColorModulator.y, ColorModulator.z) * "\n        "vec3(vertexColor.x, vertexColor.y, vertexColor.z), ColorModulator.a);");\n    replace_all(\n        "vec4 texColor = texture(Sampler0, texCoord0).rrrr;",\n        "vec4 texColor = vec4(texture(Sampler0, texCoord0).r);");\n    replace_all(\n        "vec3 ndc1 = linePosStart.xyz / linePosStart.w;",\n        "vec3 ndc1 = vec3(linePosStart.x, linePosStart.y, linePosStart.z) / linePosStart.w;");\n    replace_all(\n        "vec3 ndc2 = linePosEnd.xyz / linePosEnd.w;",\n        "vec3 ndc2 = vec3(linePosEnd.x, linePosEnd.y, linePosEnd.z) / linePosEnd.w;");\n    replace_all(\n        "vec2 lineScreenDirection = normalize((ndc2.xy - ndc1.xy) * ScreenSize);",\n        "vec2 lineScreenDirection = normalize((vec2(ndc2.x, ndc2.y) - "\n        "vec2(ndc1.x, ndc1.y)) * ScreenSize);");\n    replace_all(\n        "texCoord0 = (TextureMat * vec4(UV0, 0.0, 1.0)).xy;",\n        "vec4 texCoord0Transformed = TextureMat * vec4(UV0, 0.0, 1.0);\\n"\n        "    texCoord0 = vec2(texCoord0Transformed.x, texCoord0Transformed.y);");\n    replace_all(\n        "vec3 color = textureProj(Sampler0, texProj0).rgb * COLORS[0];",\n        "vec4 portalBase = textureProj(Sampler0, texProj0);\\n"\n        "    vec3 color = vec3(portalBase.x, portalBase.y, portalBase.z) * COLORS[0];");\n    replace_all(\n        "color += textureProj(Sampler1, texProj0 * end_portal_layer(float(i + 1))).rgb * COLORS[i];",\n        "vec4 portalLayer = textureProj(Sampler1, texProj0 * end_portal_layer(float(i + 1)));\\n"\n        "        color += vec3(portalLayer.x, portalLayer.y, portalLayer.z) * COLORS[i];");\n}\n#endif\n'''
              if marker not in text:
                  raise SystemExit('glsl compatibility insertion anchor missing')
              text = text.replace(marker, compat + marker, 1)

          if 'glslang_compile_mutex' not in text:
              marker = 'Cache& cache() { static Cache c; return c; }\n'
              mutex_code = '''Cache& cache() { static Cache c; return c; }\n\n// The pinned glslang build owns process-global parser/IO state. Minecraft\n// submits shader work from multiple executor threads during resource loading;\n// serialize one complete compile transaction while retaining the result cache.\nstd::mutex& glslang_compile_mutex() {\n    static std::mutex m;\n    return m;\n}\n'''
              if text.count(marker) != 1:
                  raise SystemExit('glslang mutex anchor mismatch')
              text = text.replace(marker, mutex_code, 1)

          text = text.replace(
              '''bool CompileStage(GLenum stage, const std::string& src,\n                  std::vector<uint32_t>& spirv, std::string& info) {\n    glslang_init();\n''',
              '''bool CompileStage(GLenum stage, const std::string& src,\n                  std::vector<uint32_t>& spirv, std::string& info) {\n    std::lock_guard<std::mutex> glslang_lock(glslang_compile_mutex());\n    glslang_init();\n''', 1)
          text = text.replace(
              '''    ensure_glsl_version(source);\n    rewrite_desktop_builtins(source);\n\n''',
              '''    ensure_glsl_version(source);\n    rewrite_desktop_builtins(source);\n#if defined(MITHRIL_IOS)\n    rewrite_minecraft_projection_swizzles(source);\n    rewrite_minecraft_ios_vector_compatibility(source);\n#endif\n\n''', 1)
          p.write_text(text)

          # Regression: reversed declaration order must still preserve name-based
          # VS->FS values after independent SPIR-V compilation.
          Path('tests/minecraft26_link_smoke.c').write_text(r'''/* DirectMetal Minecraft 26.2 linked-interface regression. */\n#include <dlfcn.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\n#define GL_VERTEX_SHADER 0x8B31\n#define GL_FRAGMENT_SHADER 0x8B30\n#define GL_COMPILE_STATUS 0x8B81\n#define GL_LINK_STATUS 0x8B82\n#define GL_ARRAY_BUFFER 0x8892\n#define GL_STATIC_DRAW 0x88E4\n#define GL_FLOAT 0x1406\n#define GL_FALSE 0\n#define GL_TRIANGLE_STRIP 0x0005\n#define GL_RGBA 0x1908\n#define GL_UNSIGNED_BYTE 0x1401\n#define GL_COLOR_BUFFER_BIT 0x00004000\n#define GL_RENDERER 0x1F01\n#define GL_NO_ERROR 0\n\ntypedef unsigned int GLenum;\ntypedef unsigned int GLuint;\ntypedef int GLint;\ntypedef int GLsizei;\ntypedef long GLsizeiptr;\ntypedef unsigned char GLboolean;\ntypedef unsigned int GLbitfield;\n\ntypedef const unsigned char* (*fnGetString)(GLenum);\ntypedef GLenum (*fnGetError)(void);\ntypedef GLuint (*fnCreateShader)(GLenum);\ntypedef void (*fnShaderSource)(GLuint, GLsizei, const char* const*, const GLint*);\ntypedef void (*fnCompileShader)(GLuint);\ntypedef void (*fnGetShaderiv)(GLuint, GLenum, GLint*);\ntypedef GLuint (*fnCreateProgram)(void);\ntypedef void (*fnAttachShader)(GLuint, GLuint);\ntypedef void (*fnLinkProgram)(GLuint);\ntypedef void (*fnGetProgramiv)(GLuint, GLenum, GLint*);\ntypedef void (*fnUseProgram)(GLuint);\ntypedef void (*fnGenVertexArrays)(GLsizei, GLuint*);\ntypedef void (*fnBindVertexArray)(GLuint);\ntypedef void (*fnGenBuffers)(GLsizei, GLuint*);\ntypedef void (*fnBindBuffer)(GLenum, GLuint);\ntypedef void (*fnBufferData)(GLenum, GLsizeiptr, const void*, GLenum);\ntypedef void (*fnEnableVertexAttribArray)(GLuint);\ntypedef void (*fnVertexAttribPointer)(GLuint, GLint, GLenum, GLboolean, GLsizei, const void*);\ntypedef void (*fnViewport)(GLint, GLint, GLsizei, GLsizei);\ntypedef void (*fnClearColor)(float, float, float, float);\ntypedef void (*fnClear)(GLbitfield);\ntypedef void (*fnDrawArrays)(GLenum, GLint, GLsizei);\ntypedef void (*fnFinish)(void);\ntypedef void (*fnReadPixels)(GLint, GLint, GLsizei, GLsizei, GLenum, GLenum, void*);\n\nstatic int failures;\n#define CHECK(c, m, ...) do { if (c) printf("ok  : " m "\\n", ##__VA_ARGS__); else { printf("FAIL: " m "\\n", ##__VA_ARGS__); ++failures; } } while (0)\n#define LOAD(t, n) t n = (t)dlsym(h, #n)\n\nstatic int near_u8(unsigned char v, int want) {\n    return abs((int)v - want) <= 3;\n}\n\nint main(void) {\n    const char* path = getenv("MITHRIL_LIBRARY");\n#if defined(__APPLE__)\n    if (!path) path = "./output/libmithril.dylib";\n#else\n    if (!path) path = "./output/libmithril.so";\n#endif\n    void* h = dlopen(path, RTLD_NOW | RTLD_GLOBAL);\n    if (!h) { fprintf(stderr, "dlopen: %s\\n", dlerror()); return 2; }\n    LOAD(fnGetString, glGetString); LOAD(fnGetError, glGetError);\n    LOAD(fnCreateShader, glCreateShader); LOAD(fnShaderSource, glShaderSource);\n    LOAD(fnCompileShader, glCompileShader); LOAD(fnGetShaderiv, glGetShaderiv);\n    LOAD(fnCreateProgram, glCreateProgram); LOAD(fnAttachShader, glAttachShader);\n    LOAD(fnLinkProgram, glLinkProgram); LOAD(fnGetProgramiv, glGetProgramiv);\n    LOAD(fnUseProgram, glUseProgram); LOAD(fnGenVertexArrays, glGenVertexArrays);\n    LOAD(fnBindVertexArray, glBindVertexArray); LOAD(fnGenBuffers, glGenBuffers);\n    LOAD(fnBindBuffer, glBindBuffer); LOAD(fnBufferData, glBufferData);\n    LOAD(fnEnableVertexAttribArray, glEnableVertexAttribArray);\n    LOAD(fnVertexAttribPointer, glVertexAttribPointer); LOAD(fnViewport, glViewport);\n    LOAD(fnClearColor, glClearColor); LOAD(fnClear, glClear);\n    LOAD(fnDrawArrays, glDrawArrays); LOAD(fnFinish, glFinish);\n    LOAD(fnReadPixels, glReadPixels);\n\n    CHECK(glGetString && glGetError && glCreateShader && glShaderSource &&\n          glCompileShader && glGetShaderiv && glCreateProgram && glAttachShader &&\n          glLinkProgram && glGetProgramiv && glUseProgram && glGenVertexArrays &&\n          glBindVertexArray && glGenBuffers && glBindBuffer && glBufferData &&\n          glEnableVertexAttribArray && glVertexAttribPointer && glViewport &&\n          glClearColor && glClear && glDrawArrays && glFinish && glReadPixels,\n          "required symbols resolve");\n    if (failures) return 1;\n    const char* renderer = (const char*)glGetString(GL_RENDERER);\n    CHECK(renderer && strstr(renderer, "DirectMetal"),\n          "renderer is DirectMetal (%s)", renderer ? renderer : "null");\n\n    const char* vs_src =\n        "#version 150\\n"\n        "layout(location=0) in vec2 position;\\n"\n        "out vec4 firstColor;\\n"\n        "out vec4 secondColor;\\n"\n        "void main(){ gl_Position=vec4(position,0,1); firstColor=vec4(1,0,0,1); secondColor=vec4(0,1,0,1); }\\n";\n    const char* fs_src =\n        "#version 150\\n"\n        "in vec4 secondColor;\\n"\n        "in vec4 firstColor;\\n"\n        "layout(location=0) out vec4 color;\\n"\n        "void main(){ color=0.75*firstColor+0.25*secondColor; }\\n";\n    GLuint vs = glCreateShader(GL_VERTEX_SHADER), fs = glCreateShader(GL_FRAGMENT_SHADER);\n    glShaderSource(vs, 1, &vs_src, NULL); glShaderSource(fs, 1, &fs_src, NULL);\n    glCompileShader(vs); glCompileShader(fs);\n    GLint ok_vs=0, ok_fs=0; glGetShaderiv(vs, GL_COMPILE_STATUS, &ok_vs);\n    glGetShaderiv(fs, GL_COMPILE_STATUS, &ok_fs);\n    CHECK(ok_vs && ok_fs, "reversed varying-order shaders compile");\n    GLuint program = glCreateProgram(); glAttachShader(program, vs); glAttachShader(program, fs);\n    glLinkProgram(program); GLint linked=0; glGetProgramiv(program, GL_LINK_STATUS, &linked);\n    CHECK(linked, "cross-stage interface links after name/location reconciliation");\n    glUseProgram(program);\n\n    const float quad[] = {-1,-1, 1,-1, -1,1, 1,1};\n    GLuint vao=0, vbo=0; glGenVertexArrays(1,&vao); glBindVertexArray(vao);\n    glGenBuffers(1,&vbo); glBindBuffer(GL_ARRAY_BUFFER,vbo);\n    glBufferData(GL_ARRAY_BUFFER,sizeof(quad),quad,GL_STATIC_DRAW);\n    glEnableVertexAttribArray(0); glVertexAttribPointer(0,2,GL_FLOAT,GL_FALSE,2*sizeof(float),NULL);\n    glViewport(0,0,16,16); glClearColor(0,0,0,1); glClear(GL_COLOR_BUFFER_BIT);\n    glDrawArrays(GL_TRIANGLE_STRIP,0,4); glFinish();\n    unsigned char px[4]={0}; glReadPixels(8,8,1,1,GL_RGBA,GL_UNSIGNED_BYTE,px);\n    CHECK(near_u8(px[0],191) && near_u8(px[1],64) && near_u8(px[2],0),\n          "varyings retain source names across reversed declaration order (%u,%u,%u,%u)",\n          px[0],px[1],px[2],px[3]);\n    CHECK(glGetError()==GL_NO_ERROR, "runtime closure smoke leaves GL_NO_ERROR");\n    printf("\\nMINECRAFT26 LINK SMOKE %s\\n", failures ? "FAILED" : "ALL PASSED");\n    return failures ? 1 : 0;\n}\n''')

          # Register semantic regression in the durable DirectMetal CTest gate.
          replace_once(
              'cmake/MithrilSmokeTests.cmake',
              '''    directmetal_async_pso_smoke\n    lazy_buffer_storage_smoke)\n''',
              '''    directmetal_async_pso_smoke\n    minecraft26_link_smoke\n    lazy_buffer_storage_smoke)\n''')

          # Extend the existing CAMetalLayer integration smoke with the exact
          # Minecraft offscreen-FBO -> EGL default framebuffer resize seam.
          p = Path('tests/amethyst_egl_smoke.mm')
          text = p.read_text()
          if 'window-sized FBO blit resizes CAMetalLayer default target' not in text:
              text = text.replace(
                  '#define GL_NO_ERROR 0\n',
                  '''#define GL_NO_ERROR 0\n#define GL_TEXTURE_2D 0x0DE1\n#define GL_RGBA 0x1908\n#define GL_RGBA8 0x8058\n#define GL_UNSIGNED_BYTE 0x1401\n#define GL_FRAMEBUFFER 0x8D40\n#define GL_READ_FRAMEBUFFER 0x8CA8\n#define GL_DRAW_FRAMEBUFFER 0x8CA9\n#define GL_FRAMEBUFFER_COMPLETE 0x8CD5\n#define GL_COLOR_ATTACHMENT0 0x8CE0\n#define GL_NEAREST 0x2600\n''', 1)
              text = text.replace(
                  'typedef unsigned int (*fn_glGetError)(void);\n',
                  '''typedef unsigned int (*fn_glGetError)(void);\ntypedef void (*fn_glGenTextures)(int, unsigned int*);\ntypedef void (*fn_glBindTexture)(unsigned int, unsigned int);\ntypedef void (*fn_glTexImage2D)(unsigned int, int, int, int, int, int, unsigned int, unsigned int, const void*);\ntypedef void (*fn_glGenFramebuffers)(int, unsigned int*);\ntypedef void (*fn_glBindFramebuffer)(unsigned int, unsigned int);\ntypedef void (*fn_glFramebufferTexture2D)(unsigned int, unsigned int, unsigned int, unsigned int, int);\ntypedef unsigned int (*fn_glCheckFramebufferStatus)(unsigned int);\ntypedef void (*fn_glBlitFramebuffer)(int, int, int, int, int, int, int, int, unsigned int, unsigned int);\n''', 1)
              text = text.replace(
                  '''        LOAD(fn_glGetError, glGetError);\n''',
                  '''        LOAD(fn_glGetError, glGetError);\n        LOAD(fn_glGenTextures, glGenTextures);\n        LOAD(fn_glBindTexture, glBindTexture);\n        LOAD(fn_glTexImage2D, glTexImage2D);\n        LOAD(fn_glGenFramebuffers, glGenFramebuffers);\n        LOAD(fn_glBindFramebuffer, glBindFramebuffer);\n        LOAD(fn_glFramebufferTexture2D, glFramebufferTexture2D);\n        LOAD(fn_glCheckFramebufferStatus, glCheckFramebufferStatus);\n        LOAD(fn_glBlitFramebuffer, glBlitFramebuffer);\n''', 1)
              text = text.replace(
                  '''                  glGetError && mithrilTestArmNextPresentedPixel &&\n''',
                  '''                  glGetError && glGenTextures && glBindTexture &&\n                  glTexImage2D && glGenFramebuffers && glBindFramebuffer &&\n                  glFramebufferTexture2D && glCheckFramebufferStatus &&\n                  glBlitFramebuffer && mithrilTestArmNextPresentedPixel &&\n''', 1)
              insert_before = '''        layer.drawableSize = CGSizeMake(56, 96);\n'''
              block = r'''        /* Minecraft's first real frame is composed into an application FBO\n         * whose extent can exceed the EGL bootstrap target. Blitting that FBO\n         * to framebuffer 0 must resize the CAMetalLayer/default Metal target\n         * before the destination is resolved. */\n        unsigned int blitTexture = 0;\n        unsigned int blitFbo = 0;\n        glGenTextures(1, &blitTexture);\n        glBindTexture(GL_TEXTURE_2D, blitTexture);\n        glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA8, 96, 64, 0, GL_RGBA,\n                     GL_UNSIGNED_BYTE, nullptr);\n        glGenFramebuffers(1, &blitFbo);\n        glBindFramebuffer(GL_FRAMEBUFFER, blitFbo);\n        glFramebufferTexture2D(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0,\n                               GL_TEXTURE_2D, blitTexture, 0);\n        CHECK(glCheckFramebufferStatus(GL_FRAMEBUFFER) == GL_FRAMEBUFFER_COMPLETE,\n              "window-sized source FBO is complete");\n        glClearColor(0.2f, 0.4f, 0.6f, 1.0f);\n        glClear(GL_COLOR_BUFFER_BIT);\n        glBindFramebuffer(GL_READ_FRAMEBUFFER, blitFbo);\n        glBindFramebuffer(GL_DRAW_FRAMEBUFFER, 0);\n        glBlitFramebuffer(0, 0, 96, 64, 0, 0, 96, 64,\n                          GL_COLOR_BUFFER_BIT, GL_NEAREST);\n        CHECK((int)layer.drawableSize.width == 96 &&\n                  (int)layer.drawableSize.height == 64,\n              "window-sized FBO blit resizes CAMetalLayer default target");\n        CHECK(mithrilTestArmNextPresentedPixel(48, 32),\n              "post-blit resized drawable capture is armed");\n        CHECK(eglSwapBuffers(display, surface) == EGL_TRUE,\n              "resized default target presents after application-FBO blit");\n        glFinish();\n        CHECK(layer.capturedDrawable.texture.width == 96 &&\n                  layer.capturedDrawable.texture.height == 64,\n              "post-blit presented drawable adopts 96x64 source extent");\n        CHECK(glGetError() == GL_NO_ERROR && eglGetError() == EGL_SUCCESS,\n              "window-sized FBO blit/present leaves GL/EGL errors clean");\n\n'''
              if insert_before not in text:
                  raise SystemExit('Amethyst resize insertion anchor missing')
              text = text.replace(insert_before, block + insert_before, 1)
              p.write_text(text)

          # The helper is intentionally absent from the resulting product tree.
          helper = Path('.github/workflows/materialize-minecraft26-runtime-closure.yml')
          helper.unlink()

      - name: Validate patch shape
        run: |
          git diff --check
          test ! -e .github/workflows/materialize-minecraft26-runtime-closure.yml
          grep -q 'AlignStageInterfaceLocations' src/shader/reflect.cpp
          grep -q 'using resident base-level sampler' src/metal/engine.mm
          grep -q 'minecraft26_link_smoke' cmake/MithrilSmokeTests.cmake
          grep -q 'window-sized FBO blit resizes CAMetalLayer default target' tests/amethyst_egl_smoke.mm
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close Minecraft 26.2 DirectMetal runtime gaps'
          git push origin HEAD:fix/minecraft26-directmetal-runtime-closure-20260819

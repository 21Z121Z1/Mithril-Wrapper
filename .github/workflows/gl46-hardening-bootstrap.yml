name: GL 4.6 semantic hardening executor

on:
  workflow_dispatch:
  push:
    branches: ['ci/minecraft-on-mithril-e2e-20260815']
    paths:
      - '.github/workflows/gl46-hardening-bootstrap.yml'
      - 'ci/gl46-hardening/apply.py'
      - 'ci/gl46-hardening/apply_errors.py'
      - 'ci/gl46-hardening/apply_reflection.py'
      - 'ci/gl46-hardening/apply_reflection_visibility.py'
      - 'ci/gl46-hardening/apply_sampler.py'
      - 'ci/gl46-hardening/apply_texture_dsa_v2.py'
      - 'ci/gl46-hardening/apply_readpixels.py'

permissions:
  contents: write

concurrency:
  group: gl46-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch with write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ci/minecraft-on-mithril-e2e-20260815
          fetch-depth: 2
          persist-credentials: true
      - name: Apply deterministic semantic hardening patches
        run: |
          python3 ci/gl46-hardening/apply.py --apply
          python3 ci/gl46-hardening/apply_errors.py --apply
          python3 ci/gl46-hardening/apply_reflection.py --apply
          python3 ci/gl46-hardening/apply_reflection_visibility.py --apply
          python3 ci/gl46-hardening/apply_sampler.py --apply
          python3 ci/gl46-hardening/apply_texture_dsa_v2.py --apply
          python3 ci/gl46-hardening/apply_readpixels.py --apply
      - name: Verify composite hardening fixed point
        run: |
          set -euo pipefail
          python3 ci/gl46-hardening/apply.py --verify
          python3 ci/gl46-hardening/apply_errors.py --verify
          # Reflection visibility intentionally refines the base reflection
          # canonical form. Re-apply the pair and require the combined final
          # tree to remain stable instead of asking the base migration to erase
          # the public-visibility refinement during standalone verification.
          before=$(sha256sum Mithril-Wrapper-cpp/MG_Impl/GL46_Compat.cpp | cut -d' ' -f1)
          python3 ci/gl46-hardening/apply_reflection.py --apply
          python3 ci/gl46-hardening/apply_reflection_visibility.py --apply
          after=$(sha256sum Mithril-Wrapper-cpp/MG_Impl/GL46_Compat.cpp | cut -d' ' -f1)
          test "$before" = "$after"
          python3 ci/gl46-hardening/apply_reflection_visibility.py --verify
          python3 ci/gl46-hardening/apply_sampler.py --verify
          python3 ci/gl46-hardening/apply_texture_dsa_v2.py --verify
          python3 ci/gl46-hardening/apply_readpixels.py --verify
      - name: Mechanical diff checks
        run: |
          git diff --check
          git status --short
          git diff --stat
      - name: Commit hardened implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No implementation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mithril-Wrapper-cpp/MG_Impl/GL46_Compat.cpp \
                  Mithril-Wrapper-cpp/MG_Impl/Getter.cpp \
                  Mithril-Wrapper-cpp/MG_Backend/DirectMetal/MetalBackend.mm \
                  ci/minecraft-e2e/native/glfw_mithril_bridge.mm \
                  verify/gl46_semantic_audit.py
          git commit -m 'gl: harden public GL 4.6 reflection visibility'
          git push origin HEAD:ci/minecraft-on-mithril-e2e-20260815

name: normalize-canonical-branches-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-canonical-branches-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize canonical branch workflow contracts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request, urllib.error

          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com')
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def request(url, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read().decode()) if r.status != 204 else None

          def update(branch, path, replacements, message):
              qref = urllib.parse.quote(branch, safe='')
              qpath = urllib.parse.quote(path, safe='/')
              url = f'{api}/repos/{repo}/contents/{qpath}?ref={qref}'
              item = request(url)
              text = base64.b64decode(item['content']).decode()
              original = text
              for old, new, expected in replacements:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{branch}:{path}: expected {expected} occurrence(s) of {old!r}, found {count}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'{branch}:{path}: no change produced')
              body = {
                  'message': message,
                  'content': base64.b64encode(text.encode()).decode(),
                  'sha': item['sha'],
                  'branch': branch,
              }
              request(f'{api}/repos/{repo}/contents/{qpath}', 'PUT', body)
              print(f'updated {branch}:{path}')

          update(
              'integration/directmetal-next', '.github/workflows/build.yml',
              [('integration/directmetal-unified-20260815', 'integration/directmetal-next', 2)],
              'ci: target DirectMetal next canonical branch')
          update(
              'integration/directmetal-next', '.github/workflows/README.md',
              [('# DirectMetal integration Actions', '# DirectMetal next Actions', 1),
               ('integration/directmetal-unified-20260815', 'integration/directmetal-next', 1)],
              'docs: define DirectMetal next workflow ownership')

          update(
              'integration/directvulkan-reference', '.github/workflows/directvulkan-validation.yml',
              [('codex/directvulkan-overnight-recovery-20260814', 'integration/directvulkan-reference', 2)],
              'ci: target DirectVulkan reference canonical branch')
          update(
              'integration/directvulkan-reference', '.github/workflows/README.md',
              [('canonical recovery baseline', 'canonical DirectVulkan reference baseline', 1)],
              'docs: define DirectVulkan reference workflow ownership')

          old_semantic = """on:\n  push:\n    branches:\n      - 'fix/gl-semantic-closure-*'\n      - 'ci/minecraft-on-mithril-e2e-20260815'\n  workflow_dispatch:\n"""
          new_semantic = """on:\n  push:\n    branches: [integration/legacy-capability-port]\n  pull_request:\n    branches: [integration/legacy-capability-port]\n  workflow_dispatch:\n"""
          update(
              'integration/legacy-capability-port', '.github/workflows/gl-semantic-closure.yml',
              [(old_semantic, new_semantic, 1)],
              'ci: target legacy capability canonical branch')

          old_client = """on:\n  workflow_dispatch:\n  push:\n    branches:\n      - 'ci/minecraft-on-mithril-e2e-*'\n  pull_request:\n    branches: [main]\n"""
          new_client = """on:\n  workflow_dispatch:\n  push:\n    branches: [integration/legacy-capability-port]\n  pull_request:\n    branches: [integration/legacy-capability-port]\n"""
          update(
              'integration/legacy-capability-port', '.github/workflows/minecraft-client-e2e.yml',
              [(old_client, new_client, 1)],
              'ci: route Minecraft E2E through legacy capability integration')

          update(
              'integration/legacy-capability-port', '.github/workflows/minecraft-render-differential.yml',
              [("      - 'ci/minecraft-on-mithril-e2e-*'", '      - integration/legacy-capability-port', 1)],
              'ci: route render differential through legacy capability integration')

          readme_prefix = "# GL semantic integration Actions\n\nThis branch keeps three durable evidence planes:\n"
          readme_new = "# Legacy capability-port Actions\n\nThis is a migration source, not a shipping branch. It converges validated behavior from the historical `Mithril-Wrapper-cpp` tree so tests and semantics can be ported into the clean `src/*` product tree. New product features belong on `integration/directmetal-next` or `integration/directvulkan-reference`.\n\nThis branch keeps three durable evidence planes:\n"
          update(
              'integration/legacy-capability-port', '.github/workflows/README.md',
              [(readme_prefix, readme_new, 1)],
              'docs: define legacy capability-port boundary')
          PY

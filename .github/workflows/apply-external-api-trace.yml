name: Apply external API semantic trace

on:
  push:
    branches:
      - 'fix/gl-semantic-closure-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply reviewed API trace transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/e2e/apply_external_api_trace.py
          python3 ci/e2e/apply_api_trace_contract.py
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            Mithril-Wrapper-cpp/MG_Impl/includes.h \
            Mithril-Wrapper-cpp/MG_State/State.cpp \
            ci/e2e/check_gl_semantic_contract.py \
            ci/e2e/gl_semantic_contract.json
          git commit -m 'feat(ci): trace externally observed GL API surface'
          git push origin HEAD:${GITHUB_REF_NAME}

name: Remove accepted overnight GUI cull probe

on:
  push:
    branches:
      - codex/directvulkan-overnight-recovery-20260814

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/directvulkan-overnight-recovery-20260814
          fetch-depth: 0

      - name: Remove only the behavior-changing bounded GUI cull probe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp')
          s = p.read_text()
          start = '    // Bounded physical probe for the missing Minecraft GUI/HUD.  The GUI\n'
          end = '    backend_set_color_write_mask(\n'
          if s.count(start) != 1 or s.count(end) != 1:
              raise SystemExit(f'marker mismatch: start={s.count(start)} end={s.count(end)}')
          a = s.index(start)
          b = s.index(end, a)
          removed = s[a:b]
          required = ['#define IS_GUI', 'GUI CULL PROBE', 'backend_set_cull_mode(0)', 'guiCullProbe < 48']
          missing = [x for x in required if x not in removed]
          if missing:
              raise SystemExit(f'probe shape changed; refusing cleanup: {missing}')
          p.write_text(s[:a] + s[b:])
          print(removed)
          PY
          ! grep -q 'GUI CULL PROBE' Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp
          grep -q 'g_state->frontFace == GL_CCW ? 0' Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp
          git diff --check

      - name: Commit production-semantic cleanup
        run: |
          set -euo pipefail
          rm .github/workflows/cleanup-overnight-gui-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: remove behavior-changing GUI cull probe'
          git push origin HEAD:codex/directvulkan-overnight-recovery-20260814

name: One-shot Cubemap Contract

on:
  push:
    branches:
      - codex/dvk-a11-single-mvk-shader-oracle-20260831
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Resources.cpp")
          s = p.read_text()

          a = """    VkImageCreateInfo ici{};
    ici.sType = VK_STRUCTURE_TYPE_IMAGE_CREATE_INFO;
    ici.imageType = imgType;
"""
          b = """    VkImageCreateInfo ici{};
    ici.sType = VK_STRUCTURE_TYPE_IMAGE_CREATE_INFO;
    // A 2D image viewed as VK_IMAGE_VIEW_TYPE_CUBE must be created with
    // VK_IMAGE_CREATE_CUBE_COMPATIBLE_BIT; six array layers alone are not enough.
    if (target == GL_TEXTURE_CUBE_MAP) {
        ici.flags |= VK_IMAGE_CREATE_CUBE_COMPATIBLE_BIT;
    }
    ici.imageType = imgType;
"""
          assert s.count(a) == 1
          s = s.replace(a, b, 1)

          a = """        primaryViewUsage.usage = ici.usage &
            (VK_IMAGE_USAGE_TRANSFER_SRC_BIT | VK_IMAGE_USAGE_TRANSFER_DST_BIT |
             VK_IMAGE_USAGE_SAMPLED_BIT | VK_IMAGE_USAGE_STORAGE_BIT);
"""
          b = """        // Transfer commands address VkImage subresources directly; the primary
        // cube view is consumed only by shader descriptors. Keep its contract narrow.
        primaryViewUsage.usage = ici.usage &
            (VK_IMAGE_USAGE_SAMPLED_BIT | VK_IMAGE_USAGE_STORAGE_BIT);
"""
          assert s.count(a) == 1
          s = s.replace(a, b, 1)
          s = s.replace(
              "    // restrict a view to a subset of the parent image usages. Transfer usages\n"
              "    // are retained because they are harmless for view creation; all attachment\n"
              "    // usages are deliberately excluded. Actual FBO views are created below as\n",
              "    // restrict a view to a subset of the parent image usages. All attachment\n"
              "    // usages are deliberately excluded. Actual FBO views are created below as\n",
              1)
          p.write_text(s)
          PY
          git diff --check
          grep -Fq VK_IMAGE_CREATE_CUBE_COMPATIBLE_BIT Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Resources.cpp
          git diff -- Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Resources.cpp

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/oneshot-tighten-cubemap-contract.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Resources.cpp .github/workflows/oneshot-tighten-cubemap-contract.yml
          git commit -m 'fix(dvk): make cubemap images Vulkan-compatible'
          git push origin HEAD:codex/dvk-a11-single-mvk-shader-oracle-20260831

        CHECK((__bridge CAMetalLayer*)same == existing, "existing CAMetalLayer is reused");
        CHECK(ew == 123 && eh == 77, "existing nonzero drawableSize is preserved (%dx%d)", ew, eh);
    }
    dlclose(h);
    printf("SURFACE METAL SMOKE: %d failure(s)\n", failures);
    return failures ? 1 : 0;
}
''')


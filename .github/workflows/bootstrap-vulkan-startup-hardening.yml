          s = s.replace('显式设为 1（METAL_SEMAPHORE）强制所有平台使用真实 Metal 信号量，',
                        '显式设为 2（METAL_EVENTS_WHERE_AVAILABLE）在可用平台强制使用 MTLEvent，')

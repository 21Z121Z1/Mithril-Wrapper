name: Bootstrap Vulkan startup hardening

on:
  push:
    branches:
      - fix/mobilegl-style-mc262-startup-preflight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobilegl-style-mc262-startup-preflight
          fetch-depth: 3
      - name: Apply staged hardening patch
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^^:.github/workflows/bootstrap-vulkan-startup-hardening.yml > /tmp/staged.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/staged.yml').read_text()
          begin = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          payload = text.split(begin, 1)[1].split(end, 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in payload.splitlines())
          compile(code, '<staged-hardening>', 'exec')
          exec(code, {'__name__': '__main__'})
          PY
          git diff --check
          git status --short
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mithril-Wrapper-cpp tests .github/workflows/build.yml
          git commit -m 'fix: harden Vulkan frame and GL synchronization semantics'
          git push origin HEAD:fix/mobilegl-style-mc262-startup-preflight
              '''    // Tracks whether imageAvailable has been consumed by a vkQueueSubmit wait\n''',
              '''    // Tracks whether the current frame-slot acquire semaphore has been consumed\n'''
              '''    // by a vkQueueSubmit wait\n''')

          p = Path('Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/SwapchainCommon.cpp')
          s = p.read_text()
          s = s.replace('#include "Device.h"\n#include "Resources.h"',
                        '#include "Device.h"\n#include "CommandStream.h"\n#include "Resources.h"')
          old = '''    // Acquire semaphore.\n'''
          old += '''    VkSemaphoreCreateInfo semi{};\n'''
          old += '''    semi.sType = VK_STRUCTURE_TYPE_SEMAPHORE_CREATE_INFO;\n'''
          old += '''    vkCreateSemaphore(b->device, &semi, nullptr, &sc->imageAvailable);\n'''
          new = '''    // Acquire semaphores: one per frame slot. Before a slot is reused,\n'''
          new += '''    ensure_command_buffer_recording() waits its fence, proving the previous\n'''
          new += '''    queue wait on that acquire semaphore has completed.\n'''
          new += '''    VkSemaphoreCreateInfo semi{};\n'''
          new += '''    semi.sType = VK_STRUCTURE_TYPE_SEMAPHORE_CREATE_INFO;\n'''
          new += '''    sc->imageAvailablePerFrame.resize(kMaxFramesInFlight, VK_NULL_HANDLE);\n'''
          new += '''    for (int i = 0; i < kMaxFramesInFlight; ++i) {\n'''
          new += '''        if (vkCreateSemaphore(b->device, &semi, nullptr, &sc->imageAvailablePerFrame[i]) != VK_SUCCESS) {\n'''
          new += '''            MITHRIL_LOG_ERROR("vk", "failed to create acquire semaphore for frame slot %d", i);\n'''
          new += '''            destroy_swapchain(sc);\n'''
          new += '''            return nullptr;\n'''
          new += '''        }\n'''
          new += '''    }\n'''
          if old not in s: raise SystemExit('SwapchainCommon: acquire creation block not found')
          s = s.replace(old, new, 1)
          s = s.replace('''    if (sc->imageAvailable) { vkDestroySemaphore(b->device, sc->imageAvailable, nullptr); sc->imageAvailable = VK_NULL_HANDLE; }\n''',
                        '''    for (auto& sem : sc->imageAvailablePerFrame) {\n'''
                        '''        if (sem) { vkDestroySemaphore(b->device, sem, nullptr); sem = VK_NULL_HANDLE; }\n'''
                        '''    }\n'''
                        '''    sc->imageAvailablePerFrame.clear();\n'''
                        '''    sc->imageAvailableFrameSlot = -1;\n''')
          old = '''        uint32_t idx = 0;\n'''
          old += '''        VkResult r = vkAcquireNextImageKHR(b->device, sc->swapchain, UINT64_MAX,\n'''
          old += '''                                           sc->imageAvailable, VK_NULL_HANDLE, &idx);\n'''
          new = '''        // Standard Vulkan frame loop: retire the frame slot before reusing\n'''
          new += '''        // its acquire semaphore. ensure_command_buffer_recording() waits the\n'''
          new += '''        // slot fence (if pending), drains deferred resources, then begins the\n'''
          new += '''        // slot's command buffer. This proves the previous wait operation on\n'''

          replace_once(
              'Mithril-Wrapper-cpp/MG_Impl/gl.cpp',
              '''void glFinish(void) {\n'''
              '''    MITHRIL_ENSURE_INIT();\n'''
              '''    backend_end_render_pass();\n'''
              '''    backend_commit();\n'''
              '''}\n''',
              '''void glFinish(void) {\n'''
              '''    MITHRIL_ENSURE_INIT();\n'''
              '''    backend_end_render_pass();\n'''
              '''    backend_commit();\n'''

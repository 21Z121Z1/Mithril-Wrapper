          p.write_text(s)

          # 5) Acquire semaphores are frame resources, not a single globally-reused binary semaphore.
          replace_once(
              'Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Swapchain.h',
              '''    // Semaphore signaled by vkAcquireNextImageKHR; the next vkQueueSubmit\n'''
              '''    // waits on it (at COLOR_ATTACHMENT_OUTPUT stage) before the recorded\n'''
              '''    // layout-transition barrier + draw commands execute.\n'''
              '''    VkSemaphore     imageAvailable = VK_NULL_HANDLE;\n''',
              '''    // Acquire semaphores are indexed by the in-flight frame slot. Vulkan\n'''
              '''    // requires an acquire semaphore to have no uncompleted signal/wait\n'''
              '''    // operations when reused. The slot fence is waited before that slot's\n'''
              '''    // semaphore is handed to vkAcquireNextImageKHR again.\n'''
              '''    std::vector<VkSemaphore> imageAvailablePerFrame;\n'''
              '''    int             imageAvailableFrameSlot = -1;\n''')
          replace_once(

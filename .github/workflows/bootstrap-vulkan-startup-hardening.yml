                        '    //   single GPU error permanently kills rendering (black screen forever).',
                        'MVK_CONFIG_RESUME_LOST_DEVICE=1: allow MoltenVK to continue using a Metal\n'
                        '    //   device after a recoverable loss when the underlying physical device\n'
                        '    //   remains usable. It does NOT recreate VkDevice; Mithril owns rebuild.\n'

        CAMetalLayer* existing = [CAMetalLayer layer];
        existing.bounds = CGRectMake(0, 0, 80, 40);
        existing.contentsScale = 3.0;
        existing.drawableSize = CGSizeMake(123, 77);  // host-controlled dynamic resolution

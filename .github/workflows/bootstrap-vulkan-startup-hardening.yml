name: Bootstrap Vulkan startup hardening

on:
  push:
    branches:
      - fix/mobilegl-style-mc262-startup-preflight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobilegl-style-mc262-startup-preflight
          fetch-depth: 0
      - name: Apply validated startup/synchronization hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {n}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))

          # 1) depth-only FBOs are legal: only reject a draw when BOTH color and depth are absent.
          replace_once(
              'Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp',
              '#include "../MG_Backend/DirectVulkan/LogRing.h"  // draw 路径打点（GPU fault 诊断）\n',
              '#include "../MG_Backend/DirectVulkan/LogRing.h"  // draw 路径打点（GPU fault 诊断）\n'
              '#include "../MG_Backend/DirectVulkan/Device.h"   // real GLsync submission serials\n')
          replace_once(
              'Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp',
              '''    // Defensive: if no color attachment is bound at all (e.g. the EGL default\n'''
              '''    // framebuffer has no swapchain yet because the surface isn't sized), skip\n'''
              '''    // the draw. Beginning a render pass with all-null attachments produces a\n'''
              '''    // validation error and a no-op pass on MoltenVK, so skipping is both\n'''
              '''    // cheaper and avoids log spam.\n'''
              '''    if (color_count <= 0) {\n'''
              '''        bool any_color = false;\n'''
              '''        for (int i = 0; i < 8; ++i) if (colors[i] != VK_NULL_HANDLE) { any_color = true; break; }\n'''
              '''        if (!any_color) {\n'''
              '''            log_prepare_draw_miss("no color attachment (eglDefaultColor unset or FBO empty)",\n'''
              '''                                  prog->id);\n'''
              '''            return false;\n'''
              '''        }\n'''
              '''    }\n''',
              '''    // A framebuffer may legally be depth-only (shadow maps / depth prepasses).\n'''
              '''    // Reject only a truly attachment-less target.  The Vulkan render-pass path\n'''
              '''    // below already supports color_count==0 with a valid depth attachment.\n'''
              '''    if (color_count <= 0) {\n'''
              '''        bool any_color = false;\n'''
              '''        for (int i = 0; i < 8; ++i) if (colors[i] != VK_NULL_HANDLE) { any_color = true; break; }\n'''
              '''        if (!any_color && depth_view == VK_NULL_HANDLE) {\n'''
              '''            log_prepare_draw_miss("no framebuffer attachment (default surface unavailable or FBO empty)",\n'''
              '''                                  prog->id);\n'''
              '''            return false;\n'''
              '''        }\n'''
              '''    }\n''')

          # 2) Wire GLsync to the existing per-submit serial/fence backend instead of immediate-signaled stubs.
          replace_once(
              'Mithril-Wrapper-cpp/MG_State/State.h',
              '''struct Sync {\n'''
              '''    void*       handle = nullptr;\n'''
              '''    GLenum      condition = GL_SYNC_GPU_COMMANDS_COMPLETE;\n'''
              '''    GLbitfield  flags = 0;\n'''
              '''    bool        signaled = false;\n'''
              '''    bool        markedForDeletion = false;\n'''
              '''};''',
              '''struct Sync {\n'''
              '''    void*       handle = nullptr;\n'''
              '''    GLenum      condition = GL_SYNC_GPU_COMMANDS_COMPLETE;\n'''
              '''    GLbitfield  flags = 0;\n'''
              '''    // Vulkan submission serial that must complete before this GL fence signals.\n'''
              '''    // Zero means there was no submitted GPU work before the fence.\n'''
              '''    uint64_t    submitSerial = 0;\n'''
              '''    bool        signaled = false;\n'''
              '''    bool        markedForDeletion = false;\n'''
              '''};''')
          replace_once(
              'Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Device.h',
              '''uint64_t backend_frame_serial_advance(int frameSlot);\n'''
              '''// Returns the highest serial whose GPU submission has definitely completed.\n''',
              '''uint64_t backend_frame_serial_advance(int frameSlot);\n'''
              '''// Returns the latest serial that has actually been submitted to the queue.\n'''
              '''uint64_t backend_current_submit_serial();\n'''
              '''// Returns the highest serial whose GPU submission has definitely completed.\n''')

          p = Path('Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp')
          s = p.read_text()
          start = s.index('/* ---- Sync objects (P1-16 FIX) ---- */')
          end = s.index('\n} // extern "C"', start)
          new_sync = r'''/* ---- Sync objects: real GPU completion semantics ------------------------- */
// The DirectVulkan backend already tracks a monotonically increasing serial for
// every vkQueueSubmit and associates it with the frame-slot fence.  GL syncs
// must use that mechanism: reporting a fence as signaled at creation lets
// persistent-mapped upload rings overwrite bytes the GPU is still consuming.
GLsync glFenceSync(GLenum condition, GLbitfield flags) {
    MITHRIL_ENSURE_INIT();
    if (condition != GL_SYNC_GPU_COMMANDS_COMPLETE) {
        mithril::state_set_error(GL_INVALID_ENUM);
        return nullptr;
    }
    if (flags != 0) {
        mithril::state_set_error(GL_INVALID_VALUE);
        return nullptr;
    }

    // Eagerly flush commands preceding the fence. Drivers are allowed to flush
    // earlier than required; doing it here gives the software fence an exact
    // Vulkan submission serial without inventing a second synchronization path.
    backend_end_render_pass();
    backend_commit();

    mithril::Sync sync;
    sync.handle = g_state->nextSyncHandle;
    sync.condition = condition;
    sync.flags = flags;
    sync.submitSerial = mithril::vk::backend_current_submit_serial();
    sync.signaled = sync.submitSerial <= mithril::vk::backend_last_completed_serial();
    sync.markedForDeletion = false;
    g_state->syncObjects[sync.handle] = sync;
    g_state->nextSyncHandle = reinterpret_cast<void*>(
        reinterpret_cast<uintptr_t>(g_state->nextSyncHandle) + 1);
    return reinterpret_cast<GLsync>(sync.handle);
}

void glDeleteSync(GLsync sync) {
    MITHRIL_ENSURE_INIT();
    if (!sync) return;
    void* handle = reinterpret_cast<void*>(sync);
    auto it = g_state->syncObjects.find(handle);
    if (it == g_state->syncObjects.end()) {
        mithril::state_set_error(GL_INVALID_VALUE);
        return;
    }
    g_state->syncObjects.erase(it);
}

GLenum glClientWaitSync(GLsync sync, GLbitfield flags, GLuint64 timeout) {
    MITHRIL_ENSURE_INIT();
    if (!sync) {
        mithril::state_set_error(GL_INVALID_VALUE);
        return GL_WAIT_FAILED;
    }
    if (flags & ~GL_SYNC_FLUSH_COMMANDS_BIT) {
        mithril::state_set_error(GL_INVALID_VALUE);
        return GL_WAIT_FAILED;
    }
    void* handle = reinterpret_cast<void*>(sync);
    auto it = g_state->syncObjects.find(handle);
    if (it == g_state->syncObjects.end()) {
        mithril::state_set_error(GL_INVALID_VALUE);
        return GL_WAIT_FAILED;
    }
    mithril::Sync& s = it->second;

    if (s.submitSerial <= mithril::vk::backend_last_completed_serial()) {
        s.signaled = true;
        return GL_ALREADY_SIGNALED;
    }

    // glFenceSync currently flushes eagerly, but honour the API flag as well so
    // this remains correct if fence creation becomes lazy in the future.
    if (flags & GL_SYNC_FLUSH_COMMANDS_BIT) {
        backend_end_render_pass();
        backend_commit();
    }

    if (mithril::vk::backend_wait_serial(s.submitSerial, (uint64_t)timeout)) {
        s.signaled = true;
        return GL_CONDITION_SATISFIED;
    }
    return GL_TIMEOUT_EXPIRED;
}

void glWaitSync(GLsync sync, GLbitfield flags, GLuint64 timeout) {
    MITHRIL_ENSURE_INIT();
    if (!sync || flags != 0 || timeout != GL_TIMEOUT_IGNORED) {
        mithril::state_set_error(GL_INVALID_VALUE);
        return;
    }
    void* handle = reinterpret_cast<void*>(sync);
    auto it = g_state->syncObjects.find(handle);
    if (it == g_state->syncObjects.end()) {
        mithril::state_set_error(GL_INVALID_VALUE);
        return;
    }
    // Mithril uses one Vulkan graphics queue for all contexts. A host wait is
    // conservative but preserves GL server-wait semantics across thread/context
    // hand-offs until a native VkSemaphore-backed cross-context path exists.
    if (mithril::vk::backend_wait_serial(it->second.submitSerial, UINT64_MAX)) {
        it->second.signaled = true;
    }
}

GLboolean glIsSync(GLsync sync) {
    MITHRIL_ENSURE_INIT();
    if (!sync) return GL_FALSE;
    void* handle = reinterpret_cast<void*>(sync);
    return g_state->syncObjects.find(handle) != g_state->syncObjects.end()
        ? GL_TRUE : GL_FALSE;
}

void glGetSynciv(GLsync sync, GLenum pname, GLsizei bufSize, GLsizei* length, GLint* values) {
    MITHRIL_ENSURE_INIT();
    if (length) *length = 0;
    if (bufSize < 0) {
        mithril::state_set_error(GL_INVALID_VALUE);
        return;
    }
    if (!sync || !values || bufSize == 0) return;
    void* handle = reinterpret_cast<void*>(sync);
    auto it = g_state->syncObjects.find(handle);
    if (it == g_state->syncObjects.end()) {
        mithril::state_set_error(GL_INVALID_VALUE);
        return;
    }
    mithril::Sync& s = it->second;
    if (!s.signaled && s.submitSerial <= mithril::vk::backend_last_completed_serial()) {
        s.signaled = true;
    }
    GLint v = 0;
    switch (pname) {
        case GL_OBJECT_TYPE:    v = GL_SYNC_FENCE; break;
        case GL_SYNC_CONDITION: v = (GLint)s.condition; break;
        case GL_SYNC_FLAGS:     v = (GLint)s.flags; break;
        case GL_SYNC_STATUS:    v = s.signaled ? GL_SIGNALED : GL_UNSIGNALED; break;
        default:
            mithril::state_set_error(GL_INVALID_ENUM);
            return;
    }
    values[0] = v;
    if (length) *length = 1;
}
'''
          p.write_text(s[:start] + new_sync + s[end:])

          # 3) glFinish must wait for completion; glFlush remains submit-only.

name: normalize-runtime-closure-newlines-repair-once

on:
  pull_request:
    branches: [integration/directmetal-next]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/minecraft26-directmetal-runtime-closure-20260819'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Normalize generated source blocks robustly
        shell: python
        run: |
          from pathlib import Path

          SENTINEL = '__MITHRIL_LITERAL_BACKSLASH_N__'

          def normalize_fragment(fragment):
              fragment = fragment.replace('\\\\n', SENTINEL)
              fragment = fragment.replace('\\n', '\n')
              return fragment.replace(SENTINEL, '\\n')

          def normalize_between(path, start_marker, end_marker):
              p = Path(path)
              text = p.read_text()
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              p.write_text(text[:start] + normalize_fragment(text[start:end]) + text[end:])

          normalize_between(
              'src/shader/glsl.cpp',
              r'\n\n#if defined(MITHRIL_IOS)\n',
              'bool is_opaque_glsl_type')
          normalize_between(
              'src/shader/reflect.cpp',
              r'\n\nbool AlignStageInterfaceLocations(\n',
              'bool ReflectProgram(')

          p = Path('tests/minecraft26_link_smoke.c')
          p.write_text(normalize_fragment(p.read_text()))

          normalize_between(
              'tests/amethyst_egl_smoke.mm',
              "        /* Minecraft's first real frame is composed into an application FBO",
              '        layer.drawableSize = CGSizeMake(56, 96);')

          for path in [
              '.github/workflows/normalize-runtime-closure-newlines.yml',
              '.github/workflows/normalize-runtime-closure-newlines-repair.yml',
          ]:
              p = Path(path)
              if p.exists():
                  p.unlink()

      - name: Validate normalized source
        run: |
          git diff --check
          test ! -e .github/workflows/normalize-runtime-closure-newlines.yml
          test ! -e .github/workflows/normalize-runtime-closure-newlines-repair.yml
          python3 - <<'PY'
          from pathlib import Path
          glsl = Path('src/shader/glsl.cpp').read_text()
          reflect = Path('src/shader/reflect.cpp').read_text()
          amethyst = Path('tests/amethyst_egl_smoke.mm').read_text()
          smoke = Path('tests/minecraft26_link_smoke.c').read_text()
          bad = [
              ('src/shader/glsl.cpp', r'\n\n#if defined(MITHRIL_IOS)\n', glsl),
              ('src/shader/reflect.cpp', r'\n\nbool AlignStageInterfaceLocations(\n', reflect),
              ('tests/amethyst_egl_smoke.mm', r'FBO\n         * whose extent', amethyst),
          ]
          for path, needle, text in bad:
              if needle in text:
                  raise SystemExit(f'malformed literal newline remains in {path}: {needle}')
          if len(smoke.splitlines()) < 80:
              raise SystemExit('minecraft26_link_smoke.c did not expand to source lines')
          if '#if defined(MITHRIL_IOS)' not in glsl or '#endif' not in glsl:
              raise SystemExit('iOS compatibility guard missing')
          if 'bool AlignStageInterfaceLocations(' not in reflect:
              raise SystemExit('stage interface reconciliation missing')
          PY
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only tests/minecraft26_link_smoke.c
      - name: Commit normalized product tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: normalize generated runtime closure source'
          git push origin HEAD:${{ github.head_ref }}

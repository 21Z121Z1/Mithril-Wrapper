name: Bootstrap iOS compile corrections

on:
  push:
    branches:
      - fix/mobilegl-style-mc262-startup-preflight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobilegl-style-mc262-startup-preflight
      - name: Fix iOS compile and child-layer resize semantics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/SwapchainCommon.cpp')
          s = p.read_text()
          s = s.replace(
              '    // Acquire semaphores: one per frame slot. Before a slot is reused,\n'
              '    ensure_command_buffer_recording() waits its fence, proving the previous\n'
              '    queue wait on that acquire semaphore has completed.\n',
              '    // Acquire semaphores: one per frame slot. Before a slot is reused,\n'
              '    // ensure_command_buffer_recording() waits its fence, proving the previous\n'
              '    // queue wait on that acquire semaphore has completed.\n',
              1)
          p.write_text(s)

          p = Path('Mithril-Wrapper-cpp/egl/SurfaceMetal.mm')
          s = p.read_text()
          old = '''        mtlLayer = [CAMetalLayer layer];\n        mtlLayer.frame = layer.bounds;\n        mtlLayer.contentsScale = layer.contentsScale > 0.0 ? layer.contentsScale : 1.0;\n        mtlLayer.autoresizingMask = kCALayerWidthSizable | kCALayerHeightSizable;\n        mtlLayer.delegate = layer.delegate;\n        [layer addSublayer:mtlLayer];\n'''
          new = '''        mtlLayer = [CAMetalLayer layer];\n        mtlLayer.frame = layer.bounds;\n        mtlLayer.contentsScale = layer.contentsScale > 0.0 ? layer.contentsScale : 1.0;\n        // CALayer autoresizingMask is unavailable on iOS. Mark our child so\n        // surface_get_size() can synchronize it to the parent after UIView\n        // layout (including the common create-at-0x0 then resize startup path).\n        mtlLayer.name = @"Mithril-Wrapper-owned-CAMetalLayer";\n        mtlLayer.delegate = layer.delegate;\n        [layer addSublayer:mtlLayer];\n'''
          if s.count(old) != 1: raise SystemExit('SurfaceMetal child block mismatch')
          s = s.replace(old, new, 1)
          old = '''    CAMetalLayer* mtlLayer = (CAMetalLayer*)layer;\n    CGSize sz = mtlLayer.drawableSize;\n    if (out_w) *out_w = (int)sz.width;\n'''
          new = '''    CAMetalLayer* mtlLayer = (CAMetalLayer*)layer;\n    if ([mtlLayer.name isEqualToString:@"Mithril-Wrapper-owned-CAMetalLayer"] &&\n        mtlLayer.superlayer) {\n        CALayer* parent = mtlLayer.superlayer;\n        const CGFloat scale = parent.contentsScale > 0.0 ? parent.contentsScale : 1.0;\n        mtlLayer.frame = parent.bounds;\n        mtlLayer.contentsScale = scale;\n        const CGSize bounds = parent.bounds.size;\n        mtlLayer.drawableSize = CGSizeMake(bounds.width * scale, bounds.height * scale);\n    }\n    CGSize sz = mtlLayer.drawableSize;\n    if (out_w) *out_w = (int)sz.width;\n'''
          if s.count(old) != 1: raise SystemExit('SurfaceMetal size block mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/SwapchainCommon.cpp \
                  Mithril-Wrapper-cpp/egl/SurfaceMetal.mm
          git commit -m 'fix: make Metal surface fallback iOS-safe'
          git push origin HEAD:fix/mobilegl-style-mc262-startup-preflight
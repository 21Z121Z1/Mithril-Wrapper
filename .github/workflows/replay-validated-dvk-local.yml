name: Replay validated local DirectVulkan fixes

on:
  push:
    branches:
      - fix/dvk-atlas-fbo-subresources-local-20260827
    paths:
      - .github/workflows/replay-validated-dvk-local.yml

permissions:
  contents: write

jobs:
  replay-and-verify:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout exact replay base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Vulkan build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install vulkan-loader molten-vk ninja

      - name: Replay only locally validated Codex patches
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/replay_validated_dvk.py
          git diff --check
          git diff --name-status

      - name: Build production Mithril
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-replay-dvk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-Wno-error' \
            -DCMAKE_CXX_FLAGS='-Wno-error'
          cmake --build build-replay-dvk --target mithril --parallel

      - name: Run validated mip/FBO GPU regression
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra -Werror \
            tests/fbo_clear_sample_smoke.c \
            -IMithril-Wrapper-cpp/include \
            -o build-replay-dvk/fbo_clear_sample_smoke
          MITHRIL_BACKEND=vulkan \
          MITHRIL_DEBUG=0 \
          DYLD_LIBRARY_PATH="$(brew --prefix molten-vk)/lib" \
            ./build-replay-dvk/fbo_clear_sample_smoke \
            ./build-replay-dvk/libmithril.dylib | tee build-replay-dvk/fbo-clear-sample.log
          grep -F 'FBO CLEAR SAMPLE SMOKE PASSED' build-replay-dvk/fbo-clear-sample.log

      - name: Commit verified production changes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            Mithril-Wrapper-cpp/MG_Impl/Buffer.cpp \
            Mithril-Wrapper-cpp/MG_Backend/Backend.h \
            Mithril-Wrapper-cpp/MG_Backend/Dispatch.cpp \
            Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Resources.h \
            Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Resources.cpp \
            Mithril-Wrapper-cpp/MG_Backend/DirectMetal/MetalBackend.mm \
            Mithril-Wrapper-cpp/MG_Impl/Framebuffer.cpp \
            Mithril-Wrapper-cpp/MG_Impl/includes.h \
            Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp \
            tests/fbo_clear_sample_smoke.c
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(vulkan): replay validated FBO subresource fixes'
          git push origin "HEAD:${GITHUB_REF_NAME}"

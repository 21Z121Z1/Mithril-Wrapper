name: Minecraft DirectVulkan Distribution

on:
  push:
    branches:
      - codex/dvk-gui-production-20260830
    paths:
      - 'CMakeLists.txt'
      - 'Mithril-Wrapper-cpp/**'
      - 'ci/minecraft-e2e/**'
      - '.github/ci/minecraft-e2e/**'
      - '.github/workflows/minecraft-directvulkan-distribution.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minecraft-directvulkan-distribution-${{ github.ref }}
  cancel-in-progress: true

env:
  DIST_ROOT: build/mithril-directvulkan-minecraft-dist
  E2E_ROOT: build/mithril-directvulkan-distribution-e2e
  MITHRIL_BACKEND: vulkan

jobs:
  package-and-prove:
    name: Package DirectVulkan field-test runtime
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0

      - name: Prove native source matches DirectVulkan fix baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=de2261ef80f34f4df2afbfa414def2f53ffe9442
          git cat-file -e "$BASE^{commit}"
          extra=$(git diff --name-only "$BASE" HEAD | grep -v '^\.github/workflows/minecraft-directvulkan-distribution\.yml$' || true)
          if test -n "$extra"; then
            echo '::error::native/source drift from DirectVulkan fix baseline:'
            printf '%s\n' "$extra"
            exit 1
          fi

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Install native dependencies
        run: brew install glfw vulkan-loader molten-vk ninja

      - name: Build Release Mithril
        id: mithril
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-directvulkan-dist -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-Wno-error' \
            -DCMAKE_CXX_FLAGS='-Wno-error'
          cmake --build build-directvulkan-dist --target mithril --parallel
          dylib=$(find build-directvulkan-dist -type f -name libmithril.dylib -print -quit)
          test -s "$dylib"
          dylib="$(cd "$(dirname "$dylib")" && pwd)/$(basename "$dylib")"
          file "$dylib"
          file "$dylib" | grep -F arm64
          otool -L "$dylib"
          echo "path=$dylib" >> "$GITHUB_OUTPUT"

      - name: Gate fixed unpack, PBO, readback and glyph semantics
        shell: bash
        run: |
          set -euo pipefail
          MVK_LIB="$(brew --prefix molten-vk)/lib"

          clang -std=c11 -Wall -Wextra -Werror tests/texture_unpack_smoke.c \
            -IMithril-Wrapper-cpp/include -o build-directvulkan-dist/texture_unpack_smoke
          MITHRIL_BACKEND=vulkan DYLD_LIBRARY_PATH="$MVK_LIB" \
            build-directvulkan-dist/texture_unpack_smoke '${{ steps.mithril.outputs.path }}' \
            | tee build-directvulkan-dist/texture-unpack.log
          grep -F 'TEXTURE UNPACK SMOKE PASSED' build-directvulkan-dist/texture-unpack.log

          clang -std=c11 -Wall -Wextra -Werror tests/persistent_pbo_unpack_smoke.c \
            -IMithril-Wrapper-cpp/include -o build-directvulkan-dist/persistent_pbo_unpack_smoke
          MITHRIL_BACKEND=vulkan DYLD_LIBRARY_PATH="$MVK_LIB" \
            build-directvulkan-dist/persistent_pbo_unpack_smoke '${{ steps.mithril.outputs.path }}' \
            | tee build-directvulkan-dist/persistent-pbo.log
          grep -F 'PERSISTENT PBO UNPACK SMOKE PASSED' build-directvulkan-dist/persistent-pbo.log

          clang -std=c11 -Wall -Wextra -Werror tests/gui_glyph_pipeline_smoke.c \
            -IMithril-Wrapper-cpp/include -o build-directvulkan-dist/gui_glyph_pipeline_smoke
          MITHRIL_BACKEND=vulkan DYLD_LIBRARY_PATH="$MVK_LIB" \
            build-directvulkan-dist/gui_glyph_pipeline_smoke '${{ steps.mithril.outputs.path }}' \
            | tee build-directvulkan-dist/glyph-user-fbo.log
          grep -F 'glyph_rgb_mismatches=0' build-directvulkan-dist/glyph-user-fbo.log
          grep -F 'GUI GLYPH PIPELINE SMOKE PASSED' build-directvulkan-dist/glyph-user-fbo.log

      - name: Build portable GLFW bridge that forces DirectVulkan
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-directvulkan-dist/bridge
          GLFW_PREFIX=$(brew --prefix glfw)
          GLFW_REAL="$GLFW_PREFIX/lib/libglfw.3.dylib"
          test -f "$GLFW_REAL" || GLFW_REAL="$GLFW_PREFIX/lib/libglfw.dylib"
          test -f "$GLFW_REAL"

          cat > build-directvulkan-dist/bridge/portable_env_shim.mm <<'EOF'
          #include <dlfcn.h>
          #include <cstdlib>
          #include <string>
          #include <limits.h>
          #include <unistd.h>

          static std::string self_dir() {
              Dl_info info{};
              if (!dladdr((void*)&self_dir, &info) || !info.dli_fname) return {};
              char resolved[PATH_MAX];
              const char* src = realpath(info.dli_fname, resolved) ? resolved : info.dli_fname;
              std::string p(src);
              auto slash = p.find_last_of('/');
              return slash == std::string::npos ? std::string() : p.substr(0, slash);
          }

          __attribute__((constructor)) static void configure_mithril_field_test() {
              std::string dir = self_dir();
              if (dir.empty()) return;
              setenv("MITHRIL_BACKEND", "vulkan", 1);
              std::string mithril = dir + "/libmithril.dylib";
              std::string glfw = dir + "/runtime/libglfw.3.dylib";
              setenv("MITHRIL_E2E_MITHRIL_DYLIB", mithril.c_str(), 0);
              setenv("MITHRIL_E2E_GLFW_DELEGATE", glfw.c_str(), 0);
          }
          EOF

          BRIDGE="$PWD/build-directvulkan-dist/bridge/libglfw_mithril.dylib"
          clang++ -std=c++20 -fobjc-arc -dynamiclib -Wall -Wextra -Werror \
            ci/minecraft-e2e/native/glfw_mithril_bridge.mm \
            ci/minecraft-e2e/native/prepresent_capture.mm \
            build-directvulkan-dist/bridge/portable_env_shim.mm \
            -I"$GLFW_PREFIX/include" -IMithril-Wrapper-cpp/include \
            -framework AppKit -framework QuartzCore -framework Foundation \
            -Wl,-reexport_library,"$GLFW_REAL" \
            -o "$BRIDGE"
          echo "path=$BRIDGE" >> "$GITHUB_OUTPUT"
          echo "glfw=$GLFW_REAL" >> "$GITHUB_OUTPUT"
          echo "glfw_prefix=$GLFW_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Gate DirectVulkan default framebuffer y-flip and glyph readback
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$E2E_ROOT"
          python3 ci/minecraft-e2e/evidence.py --root "$E2E_ROOT" init
          clang++ -std=c++20 -Wall -Wextra -Werror \
            tests/glfw_default_glyph_smoke.cpp \
            -I'${{ steps.bridge.outputs.glfw_prefix }}/include' \
            -IMithril-Wrapper-cpp/include \
            '${{ steps.bridge.outputs.path }}' \
            -framework AppKit -framework Foundation \
            -o build-directvulkan-dist/glfw_default_glyph_smoke
          MITHRIL_BACKEND=vulkan \
          MITHRIL_E2E_MITHRIL_DYLIB='${{ steps.mithril.outputs.path }}' \
          MITHRIL_E2E_GLFW_DELEGATE='${{ steps.bridge.outputs.glfw }}' \
          MITHRIL_E2E_ROOT="$PWD/$E2E_ROOT" \
          DYLD_LIBRARY_PATH="$(brew --prefix molten-vk)/lib" \
            build-directvulkan-dist/glfw_default_glyph_smoke \
            | tee build-directvulkan-dist/glyph-default.log
          grep -F 'glyph_cell_mismatches=0' build-directvulkan-dist/glyph-default.log
          grep -F 'GLFW DEFAULT G/I GLYPH SMOKE PASSED' build-directvulkan-dist/glyph-default.log

      - name: Assemble self-contained field-test bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$DIST_ROOT"
          mkdir -p "$DIST_ROOT/runtime" "$DIST_ROOT/launch" "$DIST_ROOT/evidence" "$DIST_ROOT/licenses"
          cp '${{ steps.mithril.outputs.path }}' "$DIST_ROOT/libmithril.dylib"
          cp '${{ steps.bridge.outputs.path }}' "$DIST_ROOT/libglfw_mithril.dylib"
          cp '${{ steps.bridge.outputs.glfw }}' "$DIST_ROOT/runtime/libglfw.3.dylib"

          MOLTENVK_REAL=$(otool -L "$DIST_ROOT/libmithril.dylib" | awk '/MoltenVK/{print $1; exit}')
          test -f "$MOLTENVK_REAL"
          cp "$MOLTENVK_REAL" "$DIST_ROOT/runtime/libMoltenVK.dylib"
          old_glfw=$(otool -L "$DIST_ROOT/libglfw_mithril.dylib" | awk '/libglfw\.3\.dylib/{print $1; exit}')
          install_name_tool -change "$MOLTENVK_REAL" '@loader_path/runtime/libMoltenVK.dylib' "$DIST_ROOT/libmithril.dylib"
          install_name_tool -change "$old_glfw" '@loader_path/runtime/libglfw.3.dylib' "$DIST_ROOT/libglfw_mithril.dylib"
          install_name_tool -id '@loader_path/libmithril.dylib' "$DIST_ROOT/libmithril.dylib"
          install_name_tool -id '@loader_path/libglfw_mithril.dylib' "$DIST_ROOT/libglfw_mithril.dylib"
          install_name_tool -id '@loader_path/libMoltenVK.dylib' "$DIST_ROOT/runtime/libMoltenVK.dylib"
          install_name_tool -id '@loader_path/libglfw.3.dylib' "$DIST_ROOT/runtime/libglfw.3.dylib"

          for f in "$DIST_ROOT/runtime/libMoltenVK.dylib" "$DIST_ROOT/runtime/libglfw.3.dylib" \
                   "$DIST_ROOT/libmithril.dylib" "$DIST_ROOT/libglfw_mithril.dylib"; do
            codesign --force --sign - "$f"
          done

          cat > "$DIST_ROOT/launch/print-jvm-args.sh" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          ROOT=$(cd "$(dirname "$0")/.." && pwd)
          printf '%s\n' \
            "-Dorg.lwjgl.glfw.libname=$ROOT/libglfw_mithril.dylib" \
            "-Dorg.lwjgl.opengl.libname=$ROOT/libmithril.dylib"
          EOF
          chmod +x "$DIST_ROOT/launch/print-jvm-args.sh"

          cat > "$DIST_ROOT/launch/check-bundle.sh" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          ROOT=$(cd "$(dirname "$0")/.." && pwd)
          cd "$ROOT"
          shasum -a 256 -c SHA256SUMS
          for f in libmithril.dylib libglfw_mithril.dylib runtime/libMoltenVK.dylib runtime/libglfw.3.dylib; do
            file "$f"
            codesign --verify --strict "$f"
            ! otool -L "$f" | tail -n +2 | awk '{print $1}' | grep -E '^/(opt/homebrew|usr/local)/'
          done
          echo 'Bundle integrity and dependency closure passed.'
          EOF
          chmod +x "$DIST_ROOT/launch/check-bundle.sh"

          cat > "$DIST_ROOT/README.md" <<EOF
          # Mithril DirectVulkan Minecraft 26.2 field-test runtime

          macOS Apple Silicon test bundle. Native DirectVulkan fix baseline:
          de2261ef80f34f4df2afbfa414def2f53ffe9442

          The GLFW bridge forces MITHRIL_BACKEND=vulkan before Mithril initializes.

          Usage:
          1. Keep this extracted directory intact.
          2. Run ./launch/check-bundle.sh
          3. Run ./launch/print-jvm-args.sh
          4. Add both printed -Dorg.lwjgl... options to the Minecraft 26.2 JVM arguments.
          5. Use Java 25 and launch normally.

          This is an ad-hoc-signed field-test build, not a notarized public release.
          If macOS blocks it, report the exact Gatekeeper/quarantine message.
          EOF

          cat > "$DIST_ROOT/BUILD_INFO.json" <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "package_commit": "${GITHUB_SHA}",
            "native_fix_baseline": "de2261ef80f34f4df2afbfa414def2f53ffe9442",
            "target": "macOS arm64",
            "minecraft": "26.2",
            "java": "25",
            "backend": "DirectVulkan / Vulkan 1.2 / MoltenVK",
            "signing": "ad-hoc"
          }
          EOF

          for dep in molten-vk glfw; do
            prefix=$(brew --prefix "$dep")
            while IFS= read -r f; do
              test -f "$f" || continue
              cp "$f" "$DIST_ROOT/licenses/${dep}-$(basename "$f")" || true
            done < <(find "$prefix" -maxdepth 4 -type f \( -iname 'LICENSE*' -o -iname 'NOTICE*' -o -iname 'COPYING*' \) -print 2>/dev/null || true)
          done

          cp build-directvulkan-dist/texture-unpack.log "$DIST_ROOT/evidence/"
          cp build-directvulkan-dist/persistent-pbo.log "$DIST_ROOT/evidence/"
          cp build-directvulkan-dist/glyph-user-fbo.log "$DIST_ROOT/evidence/"
          cp build-directvulkan-dist/glyph-default.log "$DIST_ROOT/evidence/"

          {
            for f in libmithril.dylib libglfw_mithril.dylib runtime/libMoltenVK.dylib runtime/libglfw.3.dylib; do
              echo "=== $f ==="
              otool -L "$DIST_ROOT/$f"
            done
          } | tee "$DIST_ROOT/evidence/otool-dependencies.txt"
          ! grep -E '^\s+/(opt/homebrew|usr/local)/' "$DIST_ROOT/evidence/otool-dependencies.txt"

          (
            cd "$DIST_ROOT"
            shasum -a 256 libmithril.dylib libglfw_mithril.dylib \
              runtime/libMoltenVK.dylib runtime/libglfw.3.dylib BUILD_INFO.json > SHA256SUMS
          )
          "$DIST_ROOT/launch/check-bundle.sh"

      - name: Prove bundled bridge forces Vulkan and finds sibling runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > build-directvulkan-dist/portable_bridge_env_smoke.c <<'EOF'
          #include <dlfcn.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          int main(int argc, char **argv) {
              if (argc != 2) return 2;
              unsetenv("MITHRIL_BACKEND");
              unsetenv("MITHRIL_E2E_MITHRIL_DYLIB");
              unsetenv("MITHRIL_E2E_GLFW_DELEGATE");
              void *h = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
              if (!h) { fprintf(stderr, "%s\n", dlerror()); return 3; }
              const char *b = getenv("MITHRIL_BACKEND");
              const char *m = getenv("MITHRIL_E2E_MITHRIL_DYLIB");
              const char *g = getenv("MITHRIL_E2E_GLFW_DELEGATE");
              if (!b || strcmp(b, "vulkan") != 0) return 4;
              if (!m || !strstr(m, "/libmithril.dylib")) return 5;
              if (!g || !strstr(g, "/runtime/libglfw.3.dylib")) return 6;
              printf("backend=%s\nmithril=%s\nglfw=%s\n", b, m, g);
              dlclose(h);
              return 0;
          }
          EOF
          clang -std=c11 -Wall -Wextra -Werror build-directvulkan-dist/portable_bridge_env_smoke.c \
            -o build-directvulkan-dist/portable_bridge_env_smoke -ldl
          build-directvulkan-dist/portable_bridge_env_smoke \
            "$PWD/$DIST_ROOT/libglfw_mithril.dylib" \
            | tee "$DIST_ROOT/evidence/portable-bridge-smoke.txt"

      - name: Create distribution archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="Mithril-DirectVulkan-Minecraft-26.2-macos-arm64-${GITHUB_SHA}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$DIST_ROOT" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" | tee "$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "checksum=$ARCHIVE.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload launcher-ready DirectVulkan field-test distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Mithril-DirectVulkan-Minecraft-26.2-macos-arm64-${{ github.sha }}
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Mithril-DirectVulkan-distribution-evidence-${{ github.sha }}
          path: |
            ${{ env.DIST_ROOT }}/evidence/**
            ${{ env.E2E_ROOT }}/**
            build-directvulkan-dist/*.log
          if-no-files-found: warn
          retention-days: 14
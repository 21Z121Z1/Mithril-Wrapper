name: hosted-metal-gpu-probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/direct-metal
      - codex/autonomous-direct-metal-next

concurrency:
  group: directmetal-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  directmetal-hosted:
    name: DirectMetal hosted offscreen GPU required
    runs-on: macos-26
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MITHRIL_BACKEND: metal
      MITHRIL_EXPECT_RENDERER: Mithril DirectMetal
      MITHRIL_LIBRARY: ./output/libmithril.dylib
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Describe hosted Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          echo "CI=${CI:-<unset>}"
          uname -a
          sw_vers
          system_profiler SPHardwareDataType SPDisplaysDataType || true
          test "$(uname -m)" = "arm64"

      - name: Execute real Metal compute/readback capability probe
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -O -framework Metal .github/ci/HostedMetalCapabilityProbe.swift -o "$RUNNER_TEMP/hosted-metal-gpu-probe"
          "$RUNNER_TEMP/hosted-metal-gpu-probe"

      - name: Build Mithril DirectMetal backend
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-hosted-metal -DCMAKE_BUILD_TYPE=Release
          cmake --build build-hosted-metal -j"$(sysctl -n hw.ncpu)"
          file output/libmithril.dylib
          otool -L output/libmithril.dylib
          nm -m output/libmithril.dylib | grep -E 'MTLCreateSystemDefaultDevice|OBJC_CLASS_\$_MTL' || true
          ln -sf libmithril.dylib output/libmithril.so

      - name: Run required DirectMetal offscreen gates
        shell: bash
        run: |
          set -euo pipefail
          tests=(state_smoke shader_smoke draw_smoke texture_smoke sampler_smoke matrix_uniform_smoke provoking_vertex_smoke buffer_texture_smoke typed_vertex_smoke packed_vertex_attrib_smoke ubo_smoke query_smoke sync_smoke stencil_persistence_smoke 3d_smoke render3d_smoke fbo_smoke directmetal_fbo_smoke)
          for test_name in "${tests[@]}"; do
            echo "==> ${test_name}"
            clang -std=c11 -Wall -Wextra "tests/${test_name}.c" -o "$RUNNER_TEMP/${test_name}"
            "$RUNNER_TEMP/${test_name}"
          done

      - name: Replay Amethyst EGL negotiation and presentation
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build-hosted-metal \
            -V -R '^amethyst_egl_smoke$'

      - name: Require first-operation FBO clear/readback regression
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra .github/ci/HostedDirectMetalFboProbe.c -o "$RUNNER_TEMP/directmetal-base-fbo-probe"
          "$RUNNER_TEMP/directmetal-base-fbo-probe"

      - name: Classify presentation-only EGL contract
        shell: bash
        run: |
          set -uo pipefail
          clang -std=c11 -Wall -Wextra tests/contract_smoke.c -o "$RUNNER_TEMP/contract_smoke"
          set +e
          "$RUNNER_TEMP/contract_smoke" 2>&1 | tee "$RUNNER_TEMP/contract_smoke.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'HOSTED_EGL_WINDOW_SURFACE_SUPPORTED=true' >> "$GITHUB_STEP_SUMMARY"
          elif grep -Fq 'eglCreateWindowSurface failed' "$RUNNER_TEMP/contract_smoke.log"; then
            echo 'HOSTED_EGL_WINDOW_SURFACE_SUPPORTED=false' >> "$GITHUB_STEP_SUMMARY"
            echo 'Window-surface/presentation coverage remains a physical display-session gate.' >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$rc"
          fi

  ios-directmetal-cross-build-required:
    name: iPhoneOS DirectMetal arm64 cross-build required
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cross-compile Mithril DirectMetal for arm64 iPhoneOS
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos --show-sdk-version
          cmake -S . -B build-hosted-ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$sdk" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DMITHRIL_IOS=ON \
            -DMITHRIL_OUTPUT_DIRECTORY="$PWD/build-hosted-ios/output" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          cmake --build build-hosted-ios --config Release --target mithril

      - name: Verify iPhoneOS Mach-O platform contract
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find build-hosted-ios/output -type f -name 'libmithril.dylib' -print -quit)"
          test -n "$artifact"
          file "$artifact"
          otool -D "$artifact"
          xcrun vtool -show-build "$artifact" | tee "$RUNNER_TEMP/vtool.txt"
          grep -Eiq 'platform[[:space:]]+(IOS|2)' "$RUNNER_TEMP/vtool.txt"
          lipo -info "$artifact" | grep -q arm64
          otool -L "$artifact" | grep -q '/System/Library/Frameworks/Metal.framework/'

  ios-simulator-directmetal-runtime-required:
    name: iOS Simulator DirectMetal host-GPU runtime required
    runs-on: macos-26
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Select and boot an iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime, devices in d["devices"].items() if "iOS" in runtime for x in devices if x.get("isAvailable") and x.get("name", "").startswith("iPhone")))')"
          test -n "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Cross-build DirectMetal for arm64 iOS Simulator
        id: build
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          cmake -S . -B build-hosted-ios-sim \
            -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT="$sdk" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DMITHRIL_IOS=ON \
            -DMITHRIL_OUTPUT_DIRECTORY="$PWD/build-hosted-ios-sim/output" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          cmake --build build-hosted-ios-sim --config Release --target mithril
          artifact="$(find build-hosted-ios-sim/output -type f -name 'libmithril.dylib' -print -quit)"
          test -n "$artifact"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          file "$artifact"
          xcrun vtool -show-build "$artifact" | tee "$RUNNER_TEMP/vtool-sim.txt"
          grep -Eiq 'platform[[:space:]]+(IOSSIMULATOR|7)' "$RUNNER_TEMP/vtool-sim.txt"

      - name: Compile simulator DirectMetal smoke executables
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          target_flags=(-target arm64-apple-ios16.0-simulator -isysroot "$sdk")
          for test_name in draw_smoke provoking_vertex_smoke packed_vertex_attrib_smoke fbo_smoke directmetal_fbo_smoke stencil_persistence_smoke; do
            xcrun --sdk iphonesimulator clang "${target_flags[@]}" \
              -std=c11 -Wall -Wextra -Dmain=mithril_smoke_main \
              -c "tests/${test_name}.c" -o "$RUNNER_TEMP/${test_name}.o"
            xcrun --sdk iphonesimulator clang "${target_flags[@]}" \
              -std=c11 -Wall -Wextra .github/ci/SimulatorSmokeSentinel.c \
              "$RUNNER_TEMP/${test_name}.o" -o "$RUNNER_TEMP/${test_name}"
          done

      - name: Package, install and launch DirectMetal smokes as Simulator apps
        shell: bash
        run: |
          set -euo pipefail
          udid="${{ steps.simulator.outputs.udid }}"
          dylib="${{ steps.build.outputs.artifact }}"
          run_app() {
            local test_name="$1" bundle="$2" expected="$3"
            local app="$RUNNER_TEMP/${test_name}.app"
            mkdir -p "$app"
            cp "$RUNNER_TEMP/${test_name}" "$app/${test_name}"
            cp "$dylib" "$app/libmithril.dylib"
            cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>${test_name}</string>
          <key>CFBundleIdentifier</key><string>${bundle}</string>
          <key>CFBundleName</key><string>${test_name}</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>LSRequiresIPhoneOS</key><true/>
          <key>MinimumOSVersion</key><string>16.0</string>
          <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict></plist>
          PLIST
            codesign --force --sign - --timestamp=none "$app/libmithril.dylib"
            codesign --force --sign - --timestamp=none "$app"
            xcrun simctl install "$udid" "$app"

            local container sentinel output rc actual
            container="$(xcrun simctl get_app_container "$udid" "$bundle" data)"
            sentinel="$container/tmp/mithril-ci-result.txt"
            rm -f "$sentinel"

            set +e
            output="$(SIMCTL_CHILD_MITHRIL_LIBRARY='@executable_path/libmithril.dylib' \
              SIMCTL_CHILD_MITHRIL_BACKEND=metal \
              SIMCTL_CHILD_MITHRIL_EXPECT_RENDERER='Mithril DirectMetal' \
              SIMCTL_CHILD_MITHRIL_SIMULATOR_SUCCESS_MARKER="$expected" \
              xcrun simctl launch --console "$udid" "$bundle" 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$output"
            test "$rc" -eq 0

            for _ in $(seq 1 30); do
              if [[ -f "$sentinel" ]]; then break; fi
              sleep 1
            done
            if [[ ! -f "$sentinel" ]]; then
              echo "::error::${test_name} exited without writing the Simulator success sentinel"
              xcrun simctl spawn "$udid" log show --style compact --last 2m \
                --predicate "process == '${test_name}'" || true
              return 1
            fi

            actual="$(tr -d '\r\n' < "$sentinel")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::${test_name} sentinel mismatch: expected '${expected}', got '${actual}'"
              return 1
            fi
            echo "${test_name}: verified sandbox sentinel '${actual}'"
          }
          run_app draw_smoke com.mithril.ci.draw 'DRAW SMOKE ALL PASSED'
          run_app provoking_vertex_smoke com.mithril.ci.provoking 'provoking_vertex_smoke: PASS'
          run_app packed_vertex_attrib_smoke com.mithril.ci.packedattrib 'packed_vertex_attrib_smoke: PASS'
          run_app fbo_smoke com.mithril.ci.fbofull 'FBO SMOKE ALL PASSED'
          run_app directmetal_fbo_smoke com.mithril.ci.fbo 'directmetal_fbo_smoke: PASS'
          run_app stencil_persistence_smoke com.mithril.ci.stencil 'stencil_persistence_smoke: PASS'

      - name: Shutdown Simulator
        if: always()
        shell: bash
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" || true

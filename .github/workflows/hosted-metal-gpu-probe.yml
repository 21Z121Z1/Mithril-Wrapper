name: hosted-metal-gpu-probe

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-metal-gpu-probe-direct-metal-20260810

jobs:
  probe:
    runs-on: macos-26
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Describe hosted Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          echo "CI=${CI:-<unset>}"
          uname -a
          sw_vers
          system_profiler SPHardwareDataType SPDisplaysDataType || true
          test "$(uname -m)" = "arm64"

      - name: Compile Metal capability probe
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -O -framework Metal \
            .github/ci/HostedMetalCapabilityProbe.swift \
            -o "$RUNNER_TEMP/hosted-metal-gpu-probe"

      - name: Execute real offscreen Metal GPU workload
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hosted-metal-gpu-probe"

      - name: Build Mithril DirectMetal backend
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-hosted-metal -DCMAKE_BUILD_TYPE=Release
          cmake --build build-hosted-metal -j"$(sysctl -n hw.ncpu)"
          file output/libmithril.dylib
          otool -L output/libmithril.dylib
          nm -m output/libmithril.dylib | grep -E 'MTLCreateSystemDefaultDevice|OBJC_CLASS_\$_MTL' || true

      - name: Compile DirectMetal FBO regression smoke
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra \
            tests/directmetal_fbo_smoke.c \
            -o "$RUNNER_TEMP/directmetal-fbo-smoke"

      - name: Run real Mithril DirectMetal offscreen FBO/readback smoke
        shell: bash
        env:
          MITHRIL_BACKEND: metal
          MITHRIL_EXPECT_RENDERER: Mithril DirectMetal
          MITHRIL_LIBRARY: ./output/libmithril.dylib
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/directmetal-fbo-smoke"

name: hosted-metal-gpu-probe

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-metal-gpu-probe-direct-metal-20260810

concurrency:
  group: directmetal-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  directmetal-hosted:
    name: DirectMetal hosted offscreen GPU
    runs-on: macos-26
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MITHRIL_BACKEND: metal
      MITHRIL_EXPECT_RENDERER: Mithril DirectMetal
      MITHRIL_LIBRARY: ./output/libmithril.dylib
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Describe hosted Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          echo "CI=${CI:-<unset>}"
          uname -a
          sw_vers
          system_profiler SPHardwareDataType SPDisplaysDataType || true
          test "$(uname -m)" = "arm64"

      - name: Compile and execute real Metal compute/readback capability probe
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -O -framework Metal \
            .github/ci/HostedMetalCapabilityProbe.swift \
            -o "$RUNNER_TEMP/hosted-metal-gpu-probe"
          "$RUNNER_TEMP/hosted-metal-gpu-probe"

      - name: Build Mithril DirectMetal backend
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-hosted-metal -DCMAKE_BUILD_TYPE=Release
          cmake --build build-hosted-metal -j"$(sysctl -n hw.ncpu)"
          file output/libmithril.dylib
          otool -L output/libmithril.dylib
          nm -m output/libmithril.dylib | grep -E 'MTLCreateSystemDefaultDevice|OBJC_CLASS_\$_MTL' || true
          # Several legacy smoke programs still hard-code the Linux basename.
          # Keep that compatibility local to CI so they exercise the same dylib.
          ln -sf libmithril.dylib output/libmithril.so

      - name: Run required DirectMetal offscreen gates
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            state_smoke
            shader_smoke
            draw_smoke
            texture_smoke
            sampler_smoke
            buffer_texture_smoke
            typed_vertex_smoke
            ubo_smoke
            query_smoke
            sync_smoke
            3d_smoke
            render3d_smoke
            fbo_smoke
            directmetal_fbo_smoke
          )
          for test_name in "${tests[@]}"; do
            echo "==> ${test_name}"
            clang -std=c11 -Wall -Wextra "tests/${test_name}.c" -o "$RUNNER_TEMP/${test_name}"
            "$RUNNER_TEMP/${test_name}"
          done

      - name: Require first-operation FBO clear/readback regression
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra \
            .github/ci/HostedDirectMetalFboProbe.c \
            -o "$RUNNER_TEMP/directmetal-base-fbo-probe"
          "$RUNNER_TEMP/directmetal-base-fbo-probe"

      - name: Classify presentation-only EGL contract
        shell: bash
        run: |
          set -uo pipefail
          clang -std=c11 -Wall -Wextra tests/contract_smoke.c -o "$RUNNER_TEMP/contract_smoke"
          set +e
          "$RUNNER_TEMP/contract_smoke" 2>&1 | tee "$RUNNER_TEMP/contract_smoke.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'HOSTED_EGL_WINDOW_SURFACE_SUPPORTED=true' >> "$GITHUB_STEP_SUMMARY"
          elif grep -Fq 'eglCreateWindowSurface failed' "$RUNNER_TEMP/contract_smoke.log"; then
            echo 'HOSTED_EGL_WINDOW_SURFACE_SUPPORTED=false' >> "$GITHUB_STEP_SUMMARY"
            echo 'Window-surface/presentation coverage remains a physical display-session gate.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unexpected contract_smoke failure (exit ${rc})." >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi

  ios-directmetal-cross-build:
    name: iOS DirectMetal arm64 cross-build candidate
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve iPhoneOS SDK
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$sdk"
          echo "path=$sdk" >> "$GITHUB_OUTPUT"
          xcrun --sdk iphoneos --show-sdk-version

      - name: Cross-compile Mithril DirectMetal for arm64 iOS
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-hosted-ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${{ steps.sdk.outputs.path }}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DMITHRIL_IOS=ON \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          cmake --build build-hosted-ios --config Release --target mithril

      - name: Verify iOS Mach-O platform contract
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find output -type f -name 'libmithril.dylib' -print -quit)"
          test -n "$artifact"
          echo "artifact=$artifact"
          file "$artifact"
          otool -D "$artifact"
          xcrun vtool -show-build "$artifact" | tee "$RUNNER_TEMP/vtool.txt"
          grep -Eiq 'platform[[:space:]]+(IOS|2)' "$RUNNER_TEMP/vtool.txt"
          lipo -info "$artifact" | grep -q arm64
          otool -L "$artifact" | grep -q '/System/Library/Frameworks/Metal.framework/'

  ios-simulator-directmetal-runtime:
    name: iOS Simulator DirectMetal runtime candidate
    runs-on: macos-26
    continue-on-error: true
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Select and boot an iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime, devices in d["devices"].items() if "iOS" in runtime for x in devices if x.get("isAvailable") and x.get("name", "").startswith("iPhone")))')"
          test -n "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Cross-build DirectMetal for arm64 iOS Simulator
        id: build
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          cmake -S . -B build-hosted-ios-sim \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$sdk" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DMITHRIL_IOS=ON \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          cmake --build build-hosted-ios-sim --config Release --target mithril
          artifact="$(find output -type f -name 'libmithril.dylib' -print -quit)"
          test -n "$artifact"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          file "$artifact"
          xcrun vtool -show-build "$artifact" | tee "$RUNNER_TEMP/vtool-sim.txt"
          grep -Eiq 'platform[[:space:]]+(IOSSIMULATOR|7)' "$RUNNER_TEMP/vtool-sim.txt"

      - name: Compile simulator DirectMetal smoke executables
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          for test_name in draw_smoke directmetal_fbo_smoke; do
            xcrun --sdk iphonesimulator clang \
              -target arm64-apple-ios16.0-simulator \
              -isysroot "$sdk" \
              -std=c11 -Wall -Wextra \
              "tests/${test_name}.c" \
              -o "$RUNNER_TEMP/${test_name}-sim"
          done

      - name: Execute DirectMetal draw and FBO readback inside iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="${{ steps.simulator.outputs.udid }}"
          sim_tmp="$HOME/Library/Developer/CoreSimulator/Devices/$udid/data/tmp"
          mkdir -p "$sim_tmp"
          cp "${{ steps.build.outputs.artifact }}" "$sim_tmp/libmithril.dylib"
          cp "$RUNNER_TEMP/draw_smoke-sim" "$sim_tmp/draw_smoke"
          cp "$RUNNER_TEMP/directmetal_fbo_smoke-sim" "$sim_tmp/directmetal_fbo_smoke"
          chmod +x "$sim_tmp/draw_smoke" "$sim_tmp/directmetal_fbo_smoke"
          for test_name in draw_smoke directmetal_fbo_smoke; do
            echo "==> simulator ${test_name}"
            xcrun simctl spawn "$udid" /usr/bin/env \
              MITHRIL_LIBRARY=/tmp/libmithril.dylib \
              MITHRIL_BACKEND=metal \
              MITHRIL_EXPECT_RENDERER='Mithril DirectMetal' \
              "/tmp/${test_name}"
          done

      - name: Shutdown Simulator
        if: always()
        shell: bash
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" || true

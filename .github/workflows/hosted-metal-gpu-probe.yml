name: hosted-metal-gpu-probe

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-metal-gpu-probe-direct-metal-20260810

jobs:
  directmetal-hosted:
    name: DirectMetal hosted GPU
    runs-on: macos-26
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MITHRIL_BACKEND: metal
      MITHRIL_EXPECT_RENDERER: Mithril DirectMetal
      MITHRIL_LIBRARY: ./output/libmithril.dylib
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Describe hosted Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          echo "CI=${CI:-<unset>}"
          uname -a
          sw_vers
          system_profiler SPHardwareDataType SPDisplaysDataType || true
          test "$(uname -m)" = "arm64"

      - name: Compile and execute real Metal compute/readback capability probe
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -O -framework Metal \
            .github/ci/HostedMetalCapabilityProbe.swift \
            -o "$RUNNER_TEMP/hosted-metal-gpu-probe"
          "$RUNNER_TEMP/hosted-metal-gpu-probe"

      - name: Build Mithril DirectMetal backend
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-hosted-metal -DCMAKE_BUILD_TYPE=Release
          cmake --build build-hosted-metal -j"$(sysctl -n hw.ncpu)"
          file output/libmithril.dylib
          otool -L output/libmithril.dylib
          nm -m output/libmithril.dylib | grep -E 'MTLCreateSystemDefaultDevice|OBJC_CLASS_\$_MTL' || true
          # Several legacy smoke programs still hard-code the Linux basename.
          # Keep that compatibility local to CI so they exercise the same dylib.
          ln -sf libmithril.dylib output/libmithril.so

      - name: Run required DirectMetal draw/readback gates
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            draw_smoke
            sampler_smoke
            buffer_texture_smoke
            typed_vertex_smoke
            ubo_smoke
            query_smoke
            sync_smoke
          )
          for test_name in "${tests[@]}"; do
            echo "==> ${test_name}"
            clang -std=c11 -Wall -Wextra "tests/${test_name}.c" -o "$RUNNER_TEMP/${test_name}"
            "$RUNNER_TEMP/${test_name}"
          done

      - name: Discover additional hosted DirectMetal smoke coverage
        shell: bash
        run: |
          set -uo pipefail
          tests=(
            contract_smoke
            state_smoke
            shader_smoke
            texture_smoke
            3d_smoke
            render3d_smoke
            fbo_smoke
            directmetal_fbo_smoke
          )

          echo '## DirectMetal hosted smoke discovery' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/mithril-smoke-logs"
          for test_name in "${tests[@]}"; do
            src="tests/${test_name}.c"
            exe="$RUNNER_TEMP/${test_name}"
            log="$RUNNER_TEMP/mithril-smoke-logs/${test_name}.log"

            if ! clang -std=c11 -Wall -Wextra "$src" -o "$exe" >"$log" 2>&1; then
              echo "- ❌ ${test_name}: compile failed" | tee -a "$GITHUB_STEP_SUMMARY"
              cat "$log"
              continue
            fi

            set +e
            "$exe" 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "- ✅ ${test_name}" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ ${test_name}: exit ${rc}" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Compile and run minimal base-FBO regression diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra \
            .github/ci/HostedDirectMetalFboProbe.c \
            -o "$RUNNER_TEMP/directmetal-base-fbo-probe"
          "$RUNNER_TEMP/directmetal-base-fbo-probe"

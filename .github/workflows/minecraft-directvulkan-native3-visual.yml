name: DirectVulkan primitive-restart Minecraft visual

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/minecraft-on-mithril-e2e-vulkan-*'

permissions:
  contents: read

concurrency:
  group: dvk-restart-minecraft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minecraft-restart-ab:
    name: Minecraft 26.2 / ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            restart_mode: baseline
          - variant: strip-force-on
            restart_mode: strip_on
          - variant: restart-force-off
            restart_mode: force_off
    runs-on: macos-26
    timeout-minutes: 30
    env:
      E2E_ROOT: ${{ github.workspace }}/build/minecraft-restart-${{ matrix.variant }}-artifacts
      MITHRIL_BACKEND: vulkan
      MITHRIL_DEBUG: '1'
      MTL_DEBUG_LAYER: '1'
      MTL_SHADER_VALIDATION: '0'
      GRADLE_OPTS: -Dorg.gradle.caching=true

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          persist-credentials: false

      - name: Instrument and apply primitive-restart A/B
        shell: bash
        env:
          RESTART_MODE: ${{ matrix.restart_mode }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Pipeline.cpp')
          s = p.read_text()
          old = '''    ia.primitiveRestartEnable =\n        (mithril::g_state && (mithril::g_state->primitiveRestart ||\n                              mithril::g_state->primitiveRestartFixedIndex))\n            ? VK_TRUE : VK_FALSE;\n'''
          assert s.count(old) == 1, s.count(old)
          mode = os.environ['RESTART_MODE']
          if mode == 'strip_on':
              assignment = '''    ia.primitiveRestartEnable =\n        (mithril::g_state && (mithril::g_state->primitiveRestart ||\n                              mithril::g_state->primitiveRestartFixedIndex))\n            ? VK_TRUE : VK_FALSE;\n    const bool mithril_restart_strip_like =\n        ia.topology == VK_PRIMITIVE_TOPOLOGY_LINE_STRIP ||\n        ia.topology == VK_PRIMITIVE_TOPOLOGY_TRIANGLE_STRIP ||\n        ia.topology == VK_PRIMITIVE_TOPOLOGY_TRIANGLE_FAN;\n    if (mithril_restart_strip_like) ia.primitiveRestartEnable = VK_TRUE;\n'''
          elif mode == 'force_off':
              assignment = '''    ia.primitiveRestartEnable = VK_FALSE;\n'''
          else:
              assignment = old
          s = s.replace(old, assignment, 1)

          marker = '''    // ---- Viewport / scissor (dynamic) ----\n'''
          probe = '''    static unsigned mithril_restart_probe_count = 0;\n    if (mithril_restart_probe_count < 256) {\n        MITHRIL_LOG_WARN("vk",\n            "IA_PROBE program=%u glmode=0x%x topology=%d gl_restart=%d fixed_restart=%d restart_index=%u final_vk_restart=%d list_restart_supported=%d",\n            (unsigned)program, (unsigned)gl_primitive_mode, (int)ia.topology,\n            mithril::g_state && mithril::g_state->primitiveRestart ? 1 : 0,\n            mithril::g_state && mithril::g_state->primitiveRestartFixedIndex ? 1 : 0,\n            mithril::g_state ? (unsigned)mithril::g_state->primitiveRestartIndex : 0u,\n            ia.primitiveRestartEnable == VK_TRUE ? 1 : 0,\n            b->listRestartSupported ? 1 : 0);\n        ++mithril_restart_probe_count;\n    }\n\n'''
          assert s.count(marker) == 1
          s = s.replace(marker, probe + marker, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Pipeline.cpp

      - name: Initialize evidence
        shell: bash
        run: python3 ci/minecraft-e2e/evidence.py --root "$E2E_ROOT" init

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Install dependencies
        run: brew install glfw vulkan-loader molten-vk ninja

      - name: Build A/B dylib
        id: mithril
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-restart-${{ matrix.variant }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS='-Wno-error' -DCMAKE_CXX_FLAGS='-Wno-error'
          cmake --build build-restart-${{ matrix.variant }} --target mithril --parallel
          dylib=$(find build-restart-${{ matrix.variant }} -type f -name libmithril.dylib -print -quit)
          test -s "$dylib"
          dylib="$(cd "$(dirname "$dylib")" && pwd)/$(basename "$dylib")"
          echo "dylib=$dylib" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$dylib" | tee "$E2E_ROOT/built-mithril.sha256"

      - name: Build GLFW bridge
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          GLFW_PREFIX=$(brew --prefix glfw)
          GLFW_REAL="$GLFW_PREFIX/lib/libglfw.3.dylib"
          test -f "$GLFW_REAL" || GLFW_REAL="$GLFW_PREFIX/lib/libglfw.dylib"
          mkdir -p build-restart-${{ matrix.variant }}/bridge
          BRIDGE="$PWD/build-restart-${{ matrix.variant }}/bridge/libglfw_mithril.dylib"
          clang++ -std=c++20 -fobjc-arc -dynamiclib -Wall -Wextra -Werror \
            ci/minecraft-e2e/native/glfw_mithril_bridge.mm ci/minecraft-e2e/native/prepresent_capture.mm \
            -I"$GLFW_PREFIX/include" -IMithril-Wrapper-cpp/include \
            -framework AppKit -framework QuartzCore -framework Foundation \
            -Wl,-reexport_library,"$GLFW_REAL" -o "$BRIDGE"
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"
          echo "glfw_real=$GLFW_REAL" >> "$GITHUB_OUTPUT"

      - name: Run real Minecraft 26.2
        shell: bash
        run: |
          set -o pipefail
          rm -f "$E2E_ROOT/failure.json"
          gradle -p .github/ci/minecraft-e2e --build-cache --stacktrace \
            -PmithrilBackend=vulkan \
            -PmithrilDylib="${{ steps.mithril.outputs.dylib }}" \
            -PglfwBridge="${{ steps.bridge.outputs.bridge }}" \
            -PglfwDelegate="${{ steps.bridge.outputs.glfw_real }}" \
            -PevidenceRoot="$E2E_ROOT" runProductionClientGameTest \
            2>&1 | tee "$E2E_ROOT/gradle-minecraft.log"

      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ci/minecraft-e2e/collect-diagnostics.sh "$E2E_ROOT" "$PWD/.github/ci/minecraft-e2e/build/run/clientGameTest"
          grep -E 'IA_PROBE|primitive restart|VK_ERROR_FEATURE_NOT_PRESENT|prepare_draw DROPPED|DRAW-OVERRUN' \
            "$E2E_ROOT/gradle-minecraft.log" > "$E2E_ROOT/restart-summary.log" || true

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mithril-vulkan-restart-${{ matrix.variant }}-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          compression-level: 6
          path: build/minecraft-restart-${{ matrix.variant }}-artifacts/**

name: update-final-candidate-pin

on:
  push:
    branches: [validation/directmetal-performance-e2e-20260818]

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/directmetal-performance-e2e-20260818
          fetch-depth: 0
      - name: Pin final product candidate and remove updater
        shell: python
        run: |
          from pathlib import Path
          old = '5e94df04d73a5aa1244d5c737e8c05758247644d'
          new = 'ff87ed0ac97867fdc5d36c6974627e3faea1f43b'
          files = [
              Path('.github/workflows/validate-canonical-directmetal-minecraft-e2e.yml'),
              Path('.github/workflows/validate-canonical-directmetal-pr-only.yml'),
          ]
          for path in files:
              text = path.read_text()
              if old not in text and new not in text:
                  raise SystemExit(f'{path}: candidate pin not found')
              text = text.replace(old, new)
              text = text.replace('Candidate 5e94df04', 'Candidate ff87ed0a')
              path.write_text(text)
          Path('.github/workflows/update-final-candidate-pin.yml').unlink()
      - name: Commit final validation pin
        run: |
          git diff --check
          grep -R 'ff87ed0ac97867fdc5d36c6974627e3faea1f43b' \
            .github/workflows/validate-canonical-directmetal-*.yml
          ! grep -R '5e94df04d73a5aa1244d5c737e8c05758247644d' \
            .github/workflows/validate-canonical-directmetal-*.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'validation: pin final DirectMetal candidate ff87ed0a'
          git push origin HEAD:validation/directmetal-performance-e2e-20260818

name: retire-absorbed-branches-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-branches-once.yml

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Delete audited obsolete branch refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branches=(
            'chore/actions-workflow-cleanup-20260816'
            'chore/actions-workflow-cleanup-e2e-20260816'
            'chore/directmetal-integration-ci-cleanup-20260816'
            'chore/directvulkan-ci-cleanup-20260816'
            'chore/directvulkan-gui-ci-cleanup-20260816'
            'chore/dual-backend-ios-ci-cleanup-20260816'
            'chore/gl-semantic-ci-cleanup-20260816'
            'chore/mobilegl-ios-ci-cleanup-20260816'
            'chore/mobilegl-startup-ci-cleanup-20260816'
            'agent/directmetal-fbo-sampling-a17pro'
            'refactor/directmetal-clean-shipping'
            'snapshot/codex-directvulkan-overnight-20260814'
            'integration/glsl-mobilegl-preflight-20260814'
            'sync/glsl-conversion-mobilegl-style-20260814'
            'ready/glsl-mobilegl-mc262-20260814'
            'refactor/glsl-mobilegl-preflight-20260814'
            'probe/gl-pixel-store-semantics-20260816'
            'probe/gl-raster-semantics-20260816'
            'probe/gl-sampler-semantics-20260816'
            'probe/gl-semantic-mrt-20260816'
          )

          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs/heads"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          for branch in "${branches[@]}"; do
            echo "Retiring $branch"
            code=$(curl -sS -o "$RUNNER_TEMP/delete.json" -w '%{http_code}' -X DELETE "${auth[@]}" "$api/$branch")
            case "$code" in
              204) echo "deleted: $branch" ;;
              404) echo "already absent: $branch" ;;
              *)
                cat "$RUNNER_TEMP/delete.json" || true
                echo "unexpected DELETE status $code for $branch" >&2
                exit 1
                ;;
            esac
          done

          echo 'Verifying audited refs are absent...'
          for branch in "${branches[@]}"; do
            code=$(curl -sS -o "$RUNNER_TEMP/verify.json" -w '%{http_code}' "${auth[@]}" "$api/$branch")
            if [[ "$code" != 404 ]]; then
              cat "$RUNNER_TEMP/verify.json" || true
              echo "branch still exists after retirement: $branch (HTTP $code)" >&2
              exit 1
            fi
          done

          echo "All ${#branches[@]} audited obsolete refs are absent."

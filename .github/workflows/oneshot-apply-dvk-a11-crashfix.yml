name: One-shot apply DirectVulkan A11 crashfix

on:
  push:
    branches:
      - codex/dvk-a11-single-mvk-shader-oracle-20260831
    paths:
      - '.github/workflows/oneshot-apply-dvk-a11-crashfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source baseline is untouched
        shell: bash
        run: |
          set -euo pipefail
          BASE=fc36aae0b65a581f4ed1caf93b1cef1751caaa55
          git cat-file -e "$BASE^{commit}"
          git diff --exit-code "$BASE" HEAD -- CMakeLists.txt Mithril-Wrapper-cpp

      - name: Apply source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---- CMake: explicit MoltenVK linkage policy + diagnostic toggles ----
          p = Path('CMakeLists.txt')
          s = p.read_text()
          needle = 'set(CMAKE_POSITION_INDEPENDENT_CODE ON)\n'
          insert = '''set(CMAKE_POSITION_INDEPENDENT_CODE ON)\n\n# iOS distribution policy: Mithril may either embed MoltenVK (standalone builds)\n# or link the single MoltenVK dylib supplied by the host application. Amethyst\n# already ships Frameworks/libMoltenVK.dylib, so production candidate builds use\n# HOST_DYLIB to avoid two Objective-C MoltenVK runtimes in one process.\nset(MITHRIL_MOLTENVK_LINKAGE "STATIC" CACHE STRING\n    "MoltenVK linkage mode on Apple platforms: STATIC or HOST_DYLIB")\nset_property(CACHE MITHRIL_MOLTENVK_LINKAGE PROPERTY STRINGS STATIC HOST_DYLIB)\nset(MOLTENVK_HOST_DYLIB "" CACHE FILEPATH\n    "Host-provided libMoltenVK.dylib used when MITHRIL_MOLTENVK_LINKAGE=HOST_DYLIB")\n\n# Diagnostics are opt-in for normal builds. The iOS crash candidate enables both:\n# serialize the full glslang transaction and snapshot the exact raw/rewritten GLSL\n# immediately before parse(), so an in-parser SIGSEGV leaves a reproducible oracle.\noption(MITHRIL_SERIALIZE_GLSLANG "Serialize complete glslang compile/link transactions" OFF)\noption(MITHRIL_SHADER_CRASH_ORACLE "Snapshot last raw and rewritten GLSL before glslang parse" OFF)\n'''
          assert s.count(needle) == 1
          s = s.replace(needle, insert, 1)

          pattern = re.compile(
              r'    # Link against the MoltenVK static library\..*?'
              r'    message\(STATUS "MoltenVK library: \$\{MOLTENVK_LIBRARY\}"\)\n',
              re.S)
          m = pattern.search(s)
          assert m, 'MoltenVK find_library block not found'
          replacement = '''    # Keep headers independent from runtime linkage. For Amethyst packaging,\n    # HOST_DYLIB links exactly the dylib already shipped in the host app instead\n    # of embedding another MoltenVK archive into libmithril.dylib.\n    if(MITHRIL_MOLTENVK_LINKAGE STREQUAL "HOST_DYLIB")\n        if(NOT IOS)\n            message(FATAL_ERROR "MITHRIL_MOLTENVK_LINKAGE=HOST_DYLIB is supported only for iOS packaging")\n        endif()\n        if(NOT MOLTENVK_HOST_DYLIB OR NOT EXISTS "${MOLTENVK_HOST_DYLIB}")\n            message(FATAL_ERROR\n                "HOST_DYLIB requires -DMOLTENVK_HOST_DYLIB=/path/to/libMoltenVK.dylib")\n        endif()\n        get_filename_component(MOLTENVK_LIBRARY "${MOLTENVK_HOST_DYLIB}" ABSOLUTE)\n        message(STATUS "MoltenVK linkage: HOST_DYLIB (${MOLTENVK_LIBRARY})")\n    elseif(MITHRIL_MOLTENVK_LINKAGE STREQUAL "STATIC")\n        find_library(MOLTENVK_LIBRARY\n            NAMES MoltenVK libMoltenVK\n            PATHS\n                "${CMAKE_SOURCE_DIR}/MoltenVK.xcframework/ios-arm64"\n                "${CMAKE_SOURCE_DIR}/MoltenVK.xcframework"\n                "${CMAKE_SOURCE_DIR}/Mithril-Wrapper-cpp/3rdparty/MoltenVK"\n            NO_CMAKE_FIND_ROOT_PATH\n            REQUIRED\n        )\n        message(STATUS "MoltenVK linkage: STATIC (${MOLTENVK_LIBRARY})")\n    else()\n        message(FATAL_ERROR\n            "Unsupported MITHRIL_MOLTENVK_LINKAGE='${MITHRIL_MOLTENVK_LINKAGE}' (expected STATIC or HOST_DYLIB)")\n    endif()\n'''
          s = s[:m.start()] + replacement + s[m.end():]

          old = '    if(IOS)\n        add_custom_command(TARGET ${PROJECT_NAME} POST_BUILD\n'
          new = '    if(IOS AND MITHRIL_MOLTENVK_LINKAGE STREQUAL "STATIC")\n        add_custom_command(TARGET ${PROJECT_NAME} POST_BUILD\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          needle = '''target_compile_definitions(${PROJECT_NAME} PRIVATE\n    MITHRIL_COMMIT_ID="${MITHRIL_COMMIT_ID}"\n)\n'''
          insert = needle + '''if(MITHRIL_SERIALIZE_GLSLANG)\n    target_compile_definitions(${PROJECT_NAME} PRIVATE MITHRIL_SERIALIZE_GLSLANG=1)\nendif()\nif(MITHRIL_SHADER_CRASH_ORACLE)\n    target_compile_definitions(${PROJECT_NAME} PRIVATE MITHRIL_SHADER_CRASH_ORACLE=1)\nendif()\n'''
          assert s.count(needle) == 1
          s = s.replace(needle, insert, 1)
          p.write_text(s)

          # ---- DirectVulkan: cube sampling view vs attachment view semantics ----
          p = Path('Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Resources.cpp')
          s = p.read_text()

          old = '''    barrier.subresourceRange.levelCount = (uint32_t)tex.levels;\n    barrier.subresourceRange.baseArrayLayer = 0;\n    barrier.subresourceRange.layerCount = 1;\n'''
          new = '''    barrier.subresourceRange.levelCount = (uint32_t)tex.levels;\n    barrier.subresourceRange.baseArrayLayer = 0;\n    // A cubemap is one 2D image with six array layers. Global texture-layout\n    // transitions must cover all faces; transitioning only layer 0 leaves faces\n    // 1..5 in an incompatible layout before upload/sampling.\n    barrier.subresourceRange.layerCount =\n        tex.target == GL_TEXTURE_CUBE_MAP ? 6u : 1u;\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          needle = '''    vci.components = { VK_COMPONENT_SWIZZLE_IDENTITY, VK_COMPONENT_SWIZZLE_IDENTITY,\n                       VK_COMPONENT_SWIZZLE_IDENTITY, VK_COMPONENT_SWIZZLE_IDENTITY };\n    // FIX (GPU page fault root cause): the view creation return value was not\n'''
          insert = '''    vci.components = { VK_COMPONENT_SWIZZLE_IDENTITY, VK_COMPONENT_SWIZZLE_IDENTITY,\n                       VK_COMPONENT_SWIZZLE_IDENTITY, VK_COMPONENT_SWIZZLE_IDENTITY };\n\n    // A cubemap's primary view is a sampling/storage view, never the framebuffer\n    // attachment view. Without an explicit view-usage restriction, Vulkan makes\n    // the view inherit ici.usage, including COLOR_ATTACHMENT_BIT. MoltenVK then\n    // treats the six-layer cube view as a layered render target; A11 supports\n    // cube arrays but not layered rendering and rejects vkCreateImageView.\n    // VK_VERSION_1_1 VkImageViewUsageCreateInfo is the spec-defined way to\n    // restrict a view to a subset of the parent image usages. Transfer usages\n    // are retained because they are harmless for view creation; all attachment\n    // usages are deliberately excluded. Actual FBO views are created below as\n    // dedicated 2D/2D-array attachment views.\n    VkImageViewUsageCreateInfo primaryViewUsage{};\n    if (target == GL_TEXTURE_CUBE_MAP) {\n        primaryViewUsage.sType = VK_STRUCTURE_TYPE_IMAGE_VIEW_USAGE_CREATE_INFO;\n        primaryViewUsage.usage = ici.usage &\n            (VK_IMAGE_USAGE_TRANSFER_SRC_BIT | VK_IMAGE_USAGE_TRANSFER_DST_BIT |\n             VK_IMAGE_USAGE_SAMPLED_BIT | VK_IMAGE_USAGE_STORAGE_BIT);\n        if (primaryViewUsage.usage != 0) {\n            vci.pNext = &primaryViewUsage;\n        }\n    }\n    // FIX (GPU page fault root cause): the view creation return value was not\n'''
          assert s.count(needle) == 1
          s = s.replace(needle, insert, 1)

          needle = '''VkImageView dvk_get_texture_attachment_view(GLuint name, GLint level,\n                                            GLint layer,\n                                            GLboolean layered) {\n    using namespace mithril::vk;\n    auto& tbl = texture_table();\n'''
          insert = '''VkImageView dvk_get_texture_attachment_view(GLuint name, GLint level,\n                                            GLint layer,\n                                            GLboolean layered) {\n    using namespace mithril::vk;\n    Backend* b = backend();\n    auto& tbl = texture_table();\n'''
          assert s.count(needle) == 1
          s = s.replace(needle, insert, 1)

          needle = '''    vci.components = {VK_COMPONENT_SWIZZLE_IDENTITY,\n                      VK_COMPONENT_SWIZZLE_IDENTITY,\n                      VK_COMPONENT_SWIZZLE_IDENTITY,\n                      VK_COMPONENT_SWIZZLE_IDENTITY};\n    VkImageView view = VK_NULL_HANDLE;\n    if (vkCreateImageView(backend()->device, &vci, nullptr, &view) != VK_SUCCESS)\n        return VK_NULL_HANDLE;\n'''
          insert = '''    vci.components = {VK_COMPONENT_SWIZZLE_IDENTITY,\n                      VK_COMPONENT_SWIZZLE_IDENTITY,\n                      VK_COMPONENT_SWIZZLE_IDENTITY,\n                      VK_COMPONENT_SWIZZLE_IDENTITY};\n\n    // Attachment views get only attachment usage. A face-specific cubemap FBO\n    // therefore remains a single-layer VK_IMAGE_VIEW_TYPE_2D even though the\n    // parent image is also sampled through a six-layer cube view. Layered GL\n    // attachments retain their real layerCount and are allowed to fail on GPUs\n    // (such as A11) that cannot provide layered render targets; silently\n    // flattening them to one face would violate GL semantics.\n    VkImageViewUsageCreateInfo attachmentViewUsage{};\n    attachmentViewUsage.sType = VK_STRUCTURE_TYPE_IMAGE_VIEW_USAGE_CREATE_INFO;\n    const bool depthStencil = aspect != VK_IMAGE_ASPECT_COLOR_BIT;\n    attachmentViewUsage.usage = depthStencil\n        ? VK_IMAGE_USAGE_DEPTH_STENCIL_ATTACHMENT_BIT\n        : VK_IMAGE_USAGE_COLOR_ATTACHMENT_BIT;\n    vci.pNext = &attachmentViewUsage;\n\n    VkImageView view = VK_NULL_HANDLE;\n    const VkResult viewResult = vkCreateImageView(b->device, &vci, nullptr, &view);\n    if (viewResult != VK_SUCCESS) {\n        MITHRIL_LOG_WARN("vk",\n            "attachment vkCreateImageView failed tex=%u level=%d baseLayer=%u "\n            "layerCount=%u layered=%d result=%d",\n            name, level, baseLayer, layerCount, layered ? 1 : 0, (int)viewResult);\n        return VK_NULL_HANDLE;\n    }\n'''
          assert s.count(needle) == 1
          s = s.replace(needle, insert, 1)
          p.write_text(s)

          # ---- glslang: opt-in transaction serialization + crash oracle ----
          p = Path('Mithril-Wrapper-cpp/MG_Impl/Shader.cpp')
          s = p.read_text()
          needle = '#include <atomic>\n#include <cstdio>\n'
          insert = '#include <atomic>\n#include <cstdio>\n#include <cstdlib>\n'
          assert s.count(needle) == 1
          s = s.replace(needle, insert, 1)

          needle = '''struct StageConfig {\n    glslang::TShader* shader;\n    EShLanguage lang;\n    const std::string* source;\n};\n'''
          insert = '''// Forward declaration; the stable FNV-1a implementation below is shared by\n// the link cache and the crash oracle so hashes are deterministic across runs.\nuint64_t fnv1a(const std::string& s);\n\nstd::mutex& glslang_transaction_mutex() {\n    static std::mutex m;\n    return m;\n}\n\nconst char* shader_stage_label(EShLanguage lang) {\n    switch (lang) {\n        case EShLangVertex:   return "vert";\n        case EShLangFragment: return "frag";\n        case EShLangGeometry: return "geom";\n        case EShLangTessControl: return "tesc";\n        case EShLangTessEvaluation: return "tese";\n        case EShLangCompute:  return "comp";\n        default:              return "unknown";\n    }\n}\n\nvoid dump_shader_oracle_snapshot(const char* phase, EShLanguage lang,\n                                 const std::string& source) {\n#if defined(MITHRIL_SHADER_CRASH_ORACLE)\n    const char* dir = std::getenv("MITHRIL_SHADER_DUMP_DIR");\n    if (!dir || !*dir) dir = std::getenv("TMPDIR");\n    if (!dir || !*dir) return;\n\n    const uint64_t hash = fnv1a(source);\n    static std::atomic<uint64_t> sequence{0};\n    const uint64_t seq = sequence.fetch_add(1, std::memory_order_relaxed) + 1;\n    char path[1024];\n    std::snprintf(path, sizeof(path), "%s/mithril-shader-last-%s-%s.glsl",\n                  dir, phase, shader_stage_label(lang));\n    if (FILE* f = std::fopen(path, "wb")) {\n        std::fwrite(source.data(), 1, source.size(), f);\n        std::fclose(f);\n    } else {\n        MITHRIL_LOG_WARN("shader", "crash oracle could not write %s", path);\n    }\n\n    // This file is intentionally overwritten immediately before every parse.\n    // If glslang SIGSEGVs inside parse(), it identifies the exact transformed\n    // source that was active, while the per-stage raw files preserve the input.\n    if (std::strcmp(phase, "preprocessed") == 0) {\n        char meta[1024];\n        std::snprintf(meta, sizeof(meta), "%s/mithril-shader-last-parse.meta", dir);\n        if (FILE* f = std::fopen(meta, "wb")) {\n            std::fprintf(f, "sequence=%llu\\nstage=%s\\nhash=%016llx\\nbytes=%zu\\nsource=%s\\n",\n                         (unsigned long long)seq, shader_stage_label(lang),\n                         (unsigned long long)hash, source.size(), path);\n            std::fclose(f);\n        }\n    }\n    MITHRIL_LOG_INFO("shader",\n        "crash-oracle phase=%s seq=%llu stage=%s hash=%016llx bytes=%zu path=%s",\n        phase, (unsigned long long)seq, shader_stage_label(lang),\n        (unsigned long long)hash, source.size(), path);\n#else\n    (void)phase; (void)lang; (void)source;\n#endif\n}\n\nstruct StageConfig {\n    glslang::TShader* shader;\n    EShLanguage lang;\n    const std::string* source;\n};\n'''
          assert s.count(needle) == 1
          s = s.replace(needle, insert, 1)

          needle = '''    // EShMsgDefault exactly as MobileGL uses; the Vulkan client dialect\n    // already enforces Vulkan rules, and EShMsgVulkanRules on top would\n    // re-impose the strict "no loose uniforms" check the relaxed mode is\n    // meant to lift.\n    if (!sh.parse(&resources, 460, ECoreProfile,\n'''
          insert = '''    // Snapshot after every Mithril rewrite and immediately before glslang\n    // touches the source. A parser crash therefore leaves the exact reproducer.\n    dump_shader_oracle_snapshot("preprocessed", cfg.lang, *cfg.source);\n\n    // EShMsgDefault exactly as MobileGL uses; the Vulkan client dialect\n    // already enforces Vulkan rules, and EShMsgVulkanRules on top would\n    // re-impose the strict "no loose uniforms" check the relaxed mode is\n    // meant to lift.\n    if (!sh.parse(&resources, 460, ECoreProfile,\n'''
          assert s.count(needle) == 1
          s = s.replace(needle, insert, 1)

          needle = '''bool shader_compile_stage(GLenum gl_stage, const std::string& glsl_source,\n                          std::string& out_info_log) {\n    glslang_init();\n'''
          insert = '''bool shader_compile_stage(GLenum gl_stage, const std::string& glsl_source,\n                          std::string& out_info_log) {\n#if defined(MITHRIL_SERIALIZE_GLSLANG)\n    std::lock_guard<std::mutex> glslangTransaction(glslang_transaction_mutex());\n#endif\n    glslang_init();\n'''
          assert s.count(needle) == 1
          s = s.replace(needle, insert, 1)

          needle = '''    if (lang == EShLangCount) {\n        out_info_log = "unsupported shader stage";\n        return false;\n    }\n\n    // Same preprocessing as the link path so COMPILE_STATUS matches what a\n'''
          insert = '''    if (lang == EShLangCount) {\n        out_info_log = "unsupported shader stage";\n        return false;\n    }\n    dump_shader_oracle_snapshot("raw", lang, glsl_source);\n\n    // Same preprocessing as the link path so COMPILE_STATUS matches what a\n'''
          assert s.count(needle) == 1
          s = s.replace(needle, insert, 1)

          needle = '''bool shader_link_program(const std::string& vs_source, const std::string& fs_source,\n                         const std::unordered_map<std::string, GLuint>* attrib_bindings,\n                         ShaderLinkOutput& out, std::string& out_info_log) {\n    // Cache key: both sources + attrib bindings. The Y-flipped and\n'''
          insert = '''bool shader_link_program(const std::string& vs_source, const std::string& fs_source,\n                         const std::unordered_map<std::string, GLuint>* attrib_bindings,\n                         ShaderLinkOutput& out, std::string& out_info_log) {\n#if defined(MITHRIL_SERIALIZE_GLSLANG)\n    std::lock_guard<std::mutex> glslangTransaction(glslang_transaction_mutex());\n#endif\n    // Cache key: both sources + attrib bindings. The Y-flipped and\n'''
          assert s.count(needle) == 1
          s = s.replace(needle, insert, 1)

          needle = '''    }\n\n    // Preprocess (shared by both variants).\n    std::string vs = vs_source;\n'''
          insert = '''    }\n\n    dump_shader_oracle_snapshot("raw", EShLangVertex, vs_source);\n    dump_shader_oracle_snapshot("raw", EShLangFragment, fs_source);\n\n    // Preprocess (shared by both variants).\n    std::string vs = vs_source;\n'''
          # This exact boundary is unique immediately after the link-cache lookup.
          assert s.count(needle) >= 1
          s = s.replace(needle, insert, 1)
          p.write_text(s)
          PY

          git diff --check
          git diff --stat
          git diff -- CMakeLists.txt Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Resources.cpp Mithril-Wrapper-cpp/MG_Impl/Shader.cpp

      - name: Source-level policy gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cm = Path('CMakeLists.txt').read_text()
          rs = Path('Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Resources.cpp').read_text()
          sh = Path('Mithril-Wrapper-cpp/MG_Impl/Shader.cpp').read_text()
          assert 'MITHRIL_MOLTENVK_LINKAGE "STATIC"' in cm
          assert 'MITHRIL_MOLTENVK_LINKAGE STREQUAL "HOST_DYLIB"' in cm
          assert 'MOLTENVK_HOST_DYLIB' in cm
          assert 'VK_STRUCTURE_TYPE_IMAGE_VIEW_USAGE_CREATE_INFO' in rs
          assert 'VK_IMAGE_USAGE_COLOR_ATTACHMENT_BIT' not in rs[rs.index('primaryViewUsage.usage ='):rs.index('if (primaryViewUsage.usage != 0)')]
          assert 'tex.target == GL_TEXTURE_CUBE_MAP ? 6u : 1u' in rs
          assert 'attachmentViewUsage.usage = depthStencil' in rs
          assert 'MITHRIL_SERIALIZE_GLSLANG' in sh
          assert 'mithril-shader-last-parse.meta' in sh
          assert 'dump_shader_oracle_snapshot("preprocessed"' in sh
          print('source policy gates: PASS')
          PY

      - name: Commit source fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/oneshot-apply-dvk-a11-crashfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt Mithril-Wrapper-cpp .github/workflows/oneshot-apply-dvk-a11-crashfix.yml
          git commit -m 'fix(dvk): isolate cube views, reuse host MoltenVK, instrument glslang'
          git push origin HEAD:codex/dvk-a11-single-mvk-shader-oracle-20260831

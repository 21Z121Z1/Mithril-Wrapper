name: One-shot apply DirectVulkan A11 crashfix

on:
  push:
    branches:
      - codex/dvk-a11-single-mvk-shader-oracle-20260831
    paths:
      - '.github/workflows/oneshot-apply-dvk-a11-crashfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply cubemap contract follow-up
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Resources.cpp')
          s = p.read_text()
          old = "    VkImageCreateInfo ici{};\n    ici.sType = VK_STRUCTURE_TYPE_IMAGE_CREATE_INFO;\n    ici.imageType = imgType;\n"
          new = "    VkImageCreateInfo ici{};\n    ici.sType = VK_STRUCTURE_TYPE_IMAGE_CREATE_INFO;\n    // Vulkan requires CUBE_COMPATIBLE for a 2D image viewed through\n    // VK_IMAGE_VIEW_TYPE_CUBE; six array layers alone are not sufficient.\n    if (target == GL_TEXTURE_CUBE_MAP) {\n        ici.flags |= VK_IMAGE_CREATE_CUBE_COMPATIBLE_BIT;\n    }\n    ici.imageType = imgType;\n"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = "        primaryViewUsage.usage = ici.usage &\n            (VK_IMAGE_USAGE_TRANSFER_SRC_BIT | VK_IMAGE_USAGE_TRANSFER_DST_BIT |\n             VK_IMAGE_USAGE_SAMPLED_BIT | VK_IMAGE_USAGE_STORAGE_BIT);\n"
          new = "        // Transfer commands address VkImage subresources directly; this view\n        // is consumed only by shader descriptors, so keep its usage minimal.\n        primaryViewUsage.usage = ici.usage &\n            (VK_IMAGE_USAGE_SAMPLED_BIT | VK_IMAGE_USAGE_STORAGE_BIT);\n"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = "    // restrict a view to a subset of the parent image usages. Transfer usages\n    // are retained because they are harmless for view creation; all attachment\n    // usages are deliberately excluded. Actual FBO views are created below as\n"
          new = "    // restrict a view to a subset of the parent image usages. All attachment\n    // usages are deliberately excluded. Actual FBO views are created below as\n"
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          grep -Fq 'VK_IMAGE_CREATE_CUBE_COMPATIBLE_BIT' Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Resources.cpp
          git diff -- Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Resources.cpp

      - name: Commit source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/oneshot-apply-dvk-a11-crashfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mithril-Wrapper-cpp/MG_Backend/DirectVulkan/Resources.cpp .github/workflows/oneshot-apply-dvk-a11-crashfix.yml
          git commit -m 'fix(dvk): make cubemap images Vulkan-compatible'
          git push origin HEAD:codex/dvk-a11-single-mvk-shader-oracle-20260831

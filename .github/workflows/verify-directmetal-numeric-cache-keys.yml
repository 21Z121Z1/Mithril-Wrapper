name: verify-directmetal-numeric-cache-keys

on:
  push:
    branches: [perf/directmetal-numeric-cache-keys-20260817]

permissions:
  contents: write

concurrency:
  group: verify-directmetal-numeric-cache-keys
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/directmetal-numeric-cache-keys-20260817
          submodules: false
          fetch-depth: 0

      - name: Fetch DirectMetal shader submodules
        run: >-
          git submodule update --init --depth=1
          third_party/SPIRV-Cross
          third_party/SPIRV-Headers
          third_party/glslang

      - name: Apply numeric cache-key phase
        run: python3 scripts/apply_directmetal_numeric_cache_keys_phase4.py

      - name: Verify source invariants
        run: |
          git diff --check
          ! grep -q 'std::unordered_map<std::string, PipelineBundle>' src/metal/engine.mm
          ! grep -q 'std::unordered_map<std::string, CachedSampler>' src/metal/engine.mm
          ! grep -q 'std::string PipelineKey(' src/metal/engine.mm
          ! grep -q 'std::string SamplerCacheKey(' src/metal/engine.mm
          ! grep -q 'std::ostringstream target_key' src/metal/engine.mm
          grep -q 'using PipelineCacheKey = FixedNumericKey<96>;' src/metal/engine.mm
          grep -q 'BuildPipelineCacheKey' src/metal/engine.mm
          grep -q 'BuildSamplerCacheKey' src/metal/engine.mm

      - name: Configure DirectMetal Release build
        run: >-
          cmake -S . -B build-direct -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=OFF
          -DMITHRIL_BUILD_DIRECT=ON
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON

      - name: Build DirectMetal and regression tests
        run: cmake --build build-direct --parallel

      - name: Run complete DirectMetal semantic suite
        run: ctest --test-dir build-direct -L directmetal --output-on-failure

      - name: Commit verified implementation
        run: |
          rm .github/workflows/verify-directmetal-numeric-cache-keys.yml
          rm scripts/apply_directmetal_numeric_cache_keys_phase4.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf: use numeric DirectMetal pipeline and sampler keys'
          git push origin HEAD:perf/directmetal-numeric-cache-keys-20260817

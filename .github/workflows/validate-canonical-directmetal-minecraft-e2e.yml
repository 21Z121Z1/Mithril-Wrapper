# Validation-only workflow: harness branch is not product code; the tested dylib is built from the exact candidate SHA below.
name: Validate DirectMetal fix candidate in Minecraft 26.2

on:
  push:
    branches: [validation/directmetal-performance-e2e-20260818]
  pull_request:
    branches: [ci/minecraft-on-mithril-e2e-20260815]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-directmetal-fix-candidate-minecraft-e2e
  cancel-in-progress: true

jobs:
  minecraft-directmetal-candidate:
    name: Candidate 5e94df04 / CTest / real Minecraft / GPU evidence
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: 5e94df04d73a5aa1244d5c737e8c05758247644d
      E2E_ROOT: ${{ github.workspace }}/build/candidate-minecraft-e2e-artifacts
      GRADLE_OPTS: -Dorg.gradle.caching=true
      MTL_DEBUG_LAYER: '1'
      MTL_SHADER_VALIDATION: '0'
      CPATH: ${{ github.workspace }}/candidate/third_party

    steps:
      - name: Checkout E2E harness only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: validation/directmetal-performance-e2e-20260818
          submodules: false
          persist-credentials: false

      - name: Checkout exact DirectMetal fix candidate under test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 5e94df04d73a5aa1244d5c737e8c05758247644d
          path: candidate
          submodules: recursive
          persist-credentials: false

      - name: Prove harness/source separation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          printf '%s\n' "$CANDIDATE_SHA" > candidate-tested.sha
          test -z "$(git -C candidate status --porcelain)"
          python3 ci/minecraft-e2e/evidence.py --root "$E2E_ROOT" init
          python3 ci/minecraft-e2e/evidence.py --root "$E2E_ROOT" event \
            --event candidate_source_pinned --phase preflight \
            --message "testing DirectMetal fix candidate exact SHA $CANDIDATE_SHA; E2E harness is external validation-only code"

      - name: Fingerprint macOS / Metal host
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            sw_vers
            system_profiler SPHardwareDataType SPDisplaysDataType
            xcodebuild -version
            clang --version
          } | tee "$E2E_ROOT/environment-host.txt"
          test "$(uname -m)" = arm64

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
          cache-cleanup: on-success

      - name: Install native runtime dependencies
        shell: bash
        run: brew install glfw ninja

      - name: Build exact DirectMetal candidate and semantic tests
        id: mithril
        shell: bash
        run: |
          set -euo pipefail
          cmake -S candidate -B build-candidate -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMITHRIL_BUILD_LEGACY=OFF \
            -DMITHRIL_BUILD_DIRECT=ON \
            -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON \
            -DMITHRIL_OUTPUT_DIRECTORY="$PWD/build-candidate/artifacts"
          cmake --build build-candidate --parallel
          dylib="$PWD/build-candidate/artifacts/libmithril.dylib"
          test -s "$dylib"
          echo "dylib=$dylib" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$dylib" | tee "$E2E_ROOT/built-mithril.sha256"
          file "$dylib" | tee "$E2E_ROOT/built-mithril.file.txt"
          otool -L "$dylib" | tee "$E2E_ROOT/built-mithril.otool.txt"
          nm -gU "$dylib" | sort > "$E2E_ROOT/built-mithril.exports.txt"

      - name: Authoritative DirectMetal semantic and real-GPU gate
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build-candidate -L directmetal --output-on-failure \
            2>&1 | tee "$E2E_ROOT/directmetal-ctest.log"
          grep -q '100% tests passed' "$E2E_ROOT/directmetal-ctest.log"
          grep -q 'directmetal_incomplete_fbo_smoke' "$E2E_ROOT/directmetal-ctest.log"
          grep -q 'amethyst_egl_smoke' "$E2E_ROOT/directmetal-ctest.log"
          python3 ci/minecraft-e2e/evidence.py --root "$E2E_ROOT" event \
            --event directmetal_semantic_gpu_gate_passed --phase native_control \
            --message "candidate DirectMetal CTest including incomplete-FBO fail-closed and CAMetalLayer presentation smoke passed"

      - name: Prove shipping DirectMetal boundary
        shell: bash
        env:
          MITHRIL_DYLIB: ${{ steps.mithril.outputs.dylib }}
        run: |
          set -euo pipefail
          candidate/scripts/verify_directmetal_artifact.sh \
            "$MITHRIL_DYLIB" build-candidate/mithril_direct.boundary.json \
            | tee "$E2E_ROOT/directmetal-boundary.txt"

      - name: Build GLFW -> candidate Mithril EGL/CAMetalLayer bridge
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-candidate/bridge
          GLFW_PREFIX=$(brew --prefix glfw)
          GLFW_REAL="$GLFW_PREFIX/lib/libglfw.3.dylib"
          test -f "$GLFW_REAL" || GLFW_REAL="$GLFW_PREFIX/lib/libglfw.dylib"
          BRIDGE="$PWD/build-candidate/bridge/libglfw_mithril.dylib"
          clang++ -std=c++20 -fobjc-arc -dynamiclib -Wall -Wextra -Werror \
            ci/minecraft-e2e/native/glfw_mithril_bridge.mm \
            ci/minecraft-e2e/native/prepresent_capture.mm \
            -I"$GLFW_PREFIX/include" -Icandidate/include \
            -framework AppKit -framework QuartzCore -framework Foundation \
            -Wl,-reexport_library,"$GLFW_REAL" \
            -o "$BRIDGE"
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"
          echo "glfw_real=$GLFW_REAL" >> "$GITHUB_OUTPUT"
          file "$BRIDGE" | tee "$E2E_ROOT/glfw-bridge.file.txt"
          otool -L "$BRIDGE" | tee "$E2E_ROOT/glfw-bridge.otool.txt"

      - name: Run real Minecraft 26.2 production Client GameTest on candidate dylib
        shell: bash
        run: |
          set +e
          cp "$E2E_ROOT/failure.json" "$E2E_ROOT/failure-pre-minecraft.json"
          rm -f "$E2E_ROOT/failure.json"
          gradle -p .github/ci/minecraft-e2e --build-cache --stacktrace \
            -PmithrilDylib="${{ steps.mithril.outputs.dylib }}" \
            -PglfwBridge="${{ steps.bridge.outputs.bridge }}" \
            -PglfwDelegate="${{ steps.bridge.outputs.glfw_real }}" \
            -PevidenceRoot="$E2E_ROOT" \
            runProductionClientGameTest
          rc=$?
          if [[ $rc -eq 0 ]]; then
            [[ -f "$E2E_ROOT/failure.json" ]] || \
              cp "$E2E_ROOT/failure-pre-minecraft.json" "$E2E_ROOT/failure.json"
          else
            if [[ -f "$E2E_ROOT/failure.json" ]]; then
              python3 - "$E2E_ROOT/failure.json" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          try: d=json.loads(p.read_text())
          except Exception: d={}
          if d.get('failure_id'):
              d['status']='failed'
              d.setdefault('retryable', False)
              p.write_text(json.dumps(d, indent=2, sort_keys=True)+'\n')
          PY
            else
              cp "$E2E_ROOT/failure-pre-minecraft.json" "$E2E_ROOT/failure.json"
            fi
            python3 ci/minecraft-e2e/evidence.py --root "$E2E_ROOT" fail \
              --failure-id RUNTIME_MINECRAFT_E2E_FAILED --phase minecraft_client \
              --message "DirectMetal candidate $CANDIDATE_SHA production Client GameTest failed; preserve more specific in-game failure if present"
            exit $rc
          fi

      - name: Verify exact candidate image and DirectMetal activity
        shell: bash
        env:
          MITHRIL_DYLIB: ${{ steps.mithril.outputs.dylib }}
        run: |
          set -euo pipefail
          python3 - "$E2E_ROOT" "$MITHRIL_DYLIB" "$CANDIDATE_SHA" <<'PY'
          import hashlib, json, pathlib, sys
          root=pathlib.Path(sys.argv[1]); built=pathlib.Path(sys.argv[2]).resolve(); candidate=sys.argv[3]
          state=json.loads((root/'bridge-state.json').read_text())
          loaded=pathlib.Path(state['mithril_path']).resolve()
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          identity={
            'schema_version':'1.2', 'candidate_sha':candidate,
            'built_path':str(built), 'loaded_path':str(loaded),
            'built_sha256':sha(built), 'loaded_sha256':sha(loaded),
            'exact_image':sha(built)==sha(loaded),
            'context_count':state.get('context_count',0),
            'swap_count':state.get('swap_count',0),
            'get_proc_address_count':state.get('get_proc_address_count',0),
            'gl_vendor':state.get('gl_vendor',''),
            'gl_renderer':state.get('gl_renderer',''),
            'gl_version':state.get('gl_version','')
          }
          (root/'wrapper-identity.json').write_text(json.dumps(identity,indent=2)+'\n')
          if not identity['exact_image']: raise SystemExit('WRAPPER_WRONG_IMAGE')
          if identity['context_count'] < 1: raise SystemExit('WRAPPER_CONTEXT_NOT_CREATED')
          if identity['swap_count'] < 2: raise SystemExit('PRESENT_NOT_SCHEDULED')
          if 'Mithril-Wrapper' not in identity['gl_version'] or 'Metal 3 (DirectMetal)' not in identity['gl_version']:
              raise SystemExit('WRAPPER_NOT_ACTIVE_DIRECTMETAL')
          if 'Mithril-Wrapper' not in identity['gl_renderer'] or 'DirectMetal' not in identity['gl_renderer']:
              raise SystemExit('WRAPPER_RENDERER_IDENTITY_MISMATCH')
          print(json.dumps(identity,indent=2))
          PY

      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ci/minecraft-e2e/collect-diagnostics.sh \
            "$E2E_ROOT" \
            "$PWD/.github/ci/minecraft-e2e/build/run/clientGameTest"

      - name: Finalize evidence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [[ ! -f "$E2E_ROOT/failure.json" && -f "$E2E_ROOT/failure-pre-minecraft.json" ]]; then
            cp "$E2E_ROOT/failure-pre-minecraft.json" "$E2E_ROOT/failure.json"
          fi
          python3 ci/minecraft-e2e/evidence.py --root "$E2E_ROOT" finalize

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: directmetal-candidate-minecraft-e2e-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/candidate-minecraft-e2e-artifacts/**
            candidate-tested.sha

      - name: Enforce required E2E oracles
        if: always()
        shell: bash
        run: python3 ci/minecraft-e2e/evidence.py --root "$E2E_ROOT" finalize --assert-pass

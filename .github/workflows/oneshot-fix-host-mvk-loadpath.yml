name: One-shot host MoltenVK load path

on:
  push:
    branches:
      - codex/dvk-a11-single-mvk-shader-oracle-20260831
    paths:
      - '.github/workflows/oneshot-fix-host-mvk-loadpath.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Correct load-path ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("CMakeLists.txt"); s=p.read_text(); old="if(IOS AND MITHRIL_MOLTENVK_LINKAGE STREQUAL \"STATIC\")\n        add_custom_command(TARGET ${PROJECT_NAME} POST_BUILD"; new="if(IOS AND MITHRIL_MOLTENVK_LINKAGE STREQUAL \"HOST_DYLIB\")\n        add_custom_command(TARGET ${PROJECT_NAME} POST_BUILD"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'
          git diff --check
          grep -Fq 'if(IOS AND MITHRIL_MOLTENVK_LINKAGE STREQUAL "HOST_DYLIB")' CMakeLists.txt
          git diff -- CMakeLists.txt

      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/oneshot-fix-host-mvk-loadpath.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt .github/workflows/oneshot-fix-host-mvk-loadpath.yml
          git commit -m 'fix(build): rewrite host MoltenVK load path in Mithril'
          git push origin HEAD:codex/dvk-a11-single-mvk-shader-oracle-20260831

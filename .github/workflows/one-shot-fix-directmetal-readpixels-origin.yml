name: One-shot DirectMetal readPixels origin fix

on:
  push:
    branches:
      - ci/minecraft-on-mithril-e2e-20260815
    paths:
      - .github/workflows/one-shot-fix-directmetal-readpixels-origin.yml

permissions:
  contents: write

jobs:
  apply-source-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/minecraft-on-mithril-e2e-20260815
          persist-credentials: true
          fetch-depth: 1
      - name: Apply exact readPixels coordinate fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header = Path('Mithril-Wrapper-cpp/MG_Backend/DirectMetal/MetalResources.h')
          text = header.read_text(encoding='utf-8')
          old = '''int  dmt_internal_read_pixels(MetalTexture* colorSrc, int x, int y, int w, int h,\n                              GLenum format, GLenum type, void* out_pixels);'''
          new = '''int  dmt_internal_read_pixels(MetalTexture* colorSrc, int x, int y, int w, int h,\n                              GLenum format, GLenum type, void* out_pixels,\n                              int flip_y);'''
          if text.count(old) != 1:
              raise SystemExit('MetalResources.h readback declaration mismatch')
          header.write_text(text.replace(old, new), encoding='utf-8')

          backend = Path('Mithril-Wrapper-cpp/MG_Backend/DirectMetal/MetalBackend.mm')
          text = backend.read_text(encoding='utf-8')
          old = '''    dmt::MetalTexture* src = nullptr;\n    const bool readDepth = (format == GL_DEPTH_COMPONENT);\n    if (!g_state || g_state->currentReadFBO == 0) {'''
          new = '''    dmt::MetalTexture* src = nullptr;\n    const bool readDepth = (format == GL_DEPTH_COMPONENT);\n    const bool readDefaultFramebuffer = (!g_state || g_state->currentReadFBO == 0);\n    if (readDefaultFramebuffer) {'''
          if text.count(old) != 1:
              raise SystemExit('MetalBackend.mm read source selection mismatch')
          text = text.replace(old, new)
          old = '''    return dmt::dmt_internal_read_pixels(src, x, y, w, h, format, type,\n                                         out_pixels);'''
          new = '''    // User FBO textures are already stored in GL bottom-left row order; only\n    // the drawable/default framebuffer uses the presentation-oriented Metal\n    // row order that needs conversion on readback.\n    return dmt::dmt_internal_read_pixels(src, x, y, w, h, format, type,\n                                         out_pixels, readDefaultFramebuffer ? 1 : 0);'''
          if text.count(old) != 1:
              raise SystemExit('MetalBackend.mm readback call mismatch')
          backend.write_text(text.replace(old, new), encoding='utf-8')

          resources = Path('Mithril-Wrapper-cpp/MG_Backend/DirectMetal/MetalResources.mm')
          text = resources.read_text(encoding='utf-8')
          old = '''int dmt_internal_read_pixels(MetalTexture* colorSrc, int x, int y, int w, int h,\n                             GLenum format, GLenum type, void* out_pixels) {'''
          new = '''int dmt_internal_read_pixels(MetalTexture* colorSrc, int x, int y, int w, int h,\n                             GLenum format, GLenum type, void* out_pixels,\n                             int flip_y) {'''
          if text.count(old) != 1:
              raise SystemExit('MetalResources.mm readback definition mismatch')
          text = text.replace(old, new)
          old = '''    // Metal rows are top-down; GL readPixels expects bottom-left origin —\n    // flip rows. Only the RGBA/UNSIGNED_BYTE layout is fully supported, same\n    // as the Vulkan path.\n    const uint8_t* src = (const uint8_t*)rb.contents;\n    bool bgra = (colorSrc->vkFormat == VK_FORMAT_B8G8R8A8_UNORM);\n    for (int r = 0; r < h; ++r) {\n        const uint8_t* srow = src + (NSUInteger)r * rowBytes;\n        uint8_t* drow = (uint8_t*)out_pixels + (NSUInteger)(h - 1 - r) * rowBytes;'''
          new = '''    // User FBO textures keep GL bottom-left row order in storage. The\n    // drawable/default framebuffer is presentation-oriented and therefore\n    // requires the historical row reversal. The caller knows which source\n    // class is being read and passes flip_y explicitly.\n    const uint8_t* src = (const uint8_t*)rb.contents;\n    bool bgra = (colorSrc->vkFormat == VK_FORMAT_B8G8R8A8_UNORM);\n    for (int r = 0; r < h; ++r) {\n        const uint8_t* srow = src + (NSUInteger)r * rowBytes;\n        const int dstRow = flip_y ? (h - 1 - r) : r;\n        uint8_t* drow = (uint8_t*)out_pixels + (NSUInteger)dstRow * rowBytes;'''
          if text.count(old) != 1:
              raise SystemExit('MetalResources.mm row conversion mismatch')
          resources.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- Mithril-Wrapper-cpp/MG_Backend/DirectMetal/MetalResources.h \
                       Mithril-Wrapper-cpp/MG_Backend/DirectMetal/MetalBackend.mm \
                       Mithril-Wrapper-cpp/MG_Backend/DirectMetal/MetalResources.mm
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mithril-Wrapper-cpp/MG_Backend/DirectMetal/MetalResources.h \
                  Mithril-Wrapper-cpp/MG_Backend/DirectMetal/MetalBackend.mm \
                  Mithril-Wrapper-cpp/MG_Backend/DirectMetal/MetalResources.mm
          git commit -m 'fix(metal): preserve user-FBO row order on readPixels'
          git push origin HEAD:ci/minecraft-on-mithril-e2e-20260815

name: fix-hosted-directmetal-target-once

on:
  push:
    branches:
      - integration/directmetal-unified-20260815

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Align hosted cross-builds with shipping target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/hosted-metal-gpu-probe.yml')
          text = p.read_text()
          old = 'cmake --build build-hosted-ios --config Release --target mithril'
          new = 'cmake --build build-hosted-ios --config Release --target mithril_direct'
          if text.count(old) != 1:
              raise SystemExit(f'iPhoneOS target anchor count={text.count(old)}')
          text = text.replace(old, new)
          old = 'cmake --build build-hosted-ios-sim --config Release --target mithril'
          new = 'cmake --build build-hosted-ios-sim --config Release --target mithril_direct'
          if text.count(old) != 1:
              raise SystemExit(f'Simulator target anchor count={text.count(old)}')
          p.write_text(text)
          PY
          git diff --check
          git diff -- .github/workflows/hosted-metal-gpu-probe.yml
          git rm .github/workflows/fix-hosted-directmetal-target-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/hosted-metal-gpu-probe.yml
          git commit -m 'ci: align hosted iOS builds with mithril_direct target'
          git push origin HEAD:integration/directmetal-unified-20260815

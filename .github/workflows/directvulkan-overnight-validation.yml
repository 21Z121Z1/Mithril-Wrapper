name: DirectVulkan overnight recovery validation

on:
  push:
    branches:
      - codex/directvulkan-overnight-recovery-20260814
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-lavapipe-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Vulkan software stack
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libvulkan-dev vulkan-tools mesa-vulkan-drivers
          vulkaninfo --summary || true

      - name: Configure and build headless DirectVulkan
        run: |
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-Wno-error" \
            -DCMAKE_CXX_FLAGS="-Wno-error"
          cmake --build build-linux --target mithril -j2

      - name: Compile smoke programs
        run: |
          clang -std=c11 -O0 -g -Wall -Wextra -IMithril-Wrapper-cpp/include -o tests/gl_smoke tests/gl_smoke.c -ldl
          clang -D_GNU_SOURCE -std=c11 -O0 -g -Wall -Wextra -IMithril-Wrapper-cpp/include -o tests/render_smoke tests/render_smoke.c -ldl
          clang -std=c11 -O0 -g -Wall -Wextra -IMithril-Wrapper-cpp/include -o tests/egl_sync_smoke tests/egl_sync_smoke.c -ldl
          if test -f tests/overnight_regression_smoke.c; then
            clang -D_GNU_SOURCE -std=c11 -O0 -g -Wall -Wextra -IMithril-Wrapper-cpp/include -o tests/overnight_regression_smoke tests/overnight_regression_smoke.c -ldl
          fi

      - name: Run complete GL to Vulkan draw/readback smokes on lavapipe
        env:
          MITHRIL_DEBUG: '1'
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          set -euo pipefail
          LIB=$(find build-linux -name 'libmithril.so' -type f | head -1)
          test -n "$LIB"
          file "$LIB"
          ./tests/gl_smoke "$LIB"
          ./tests/render_smoke "$LIB"
          ./tests/egl_sync_smoke "$LIB"
          if test -x tests/overnight_regression_smoke; then ./tests/overnight_regression_smoke "$LIB"; fi

      - name: Validate recovered invariants
        run: |
          set -euo pipefail
          git diff --check 1e7f6b7a1941dcc6e4cef5b5e20359291f9924cb..HEAD
          grep -q 'g_state->frontFace == GL_CCW ? 0' Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp
          grep -q 'type_description->type_name' Mithril-Wrapper-cpp/MG_Impl/Shader.cpp
          grep -q 'GL_PIXEL_UNPACK_BUFFER' Mithril-Wrapper-cpp/MG_Impl/Texture.cpp

  macos26-native-gpu:
    runs-on: macos-26-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Vulkan loader and MoltenVK
        run: brew install vulkan-loader molten-vk

      - name: Configure native arm64
        run: |
          cmake -B build-native \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-Wno-error" \
            -DCMAKE_CXX_FLAGS="-Wno-error"

      - name: Build Mithril
        run: cmake --build build-native --config RelWithDebInfo --target mithril -j$(sysctl -n hw.ncpu)

      - name: Locate and inspect dylib
        id: dylib
        run: |
          set -euo pipefail
          DYLIB=$(find build-native -name 'libmithril.dylib' -type f | head -1)
          test -n "$DYLIB"
          echo "path=$DYLIB" >> "$GITHUB_OUTPUT"
          file "$DYLIB"
          otool -L "$DYLIB"
          nm -gU "$DYLIB" | grep -E '(_eglGetDisplay|_glDrawElements|_glGetString|_backend_init)$'

      - name: Compile host smoke programs
        run: |
          clang -std=c11 -O0 -Wall -Wextra -IMithril-Wrapper-cpp/include -o tests/gl_smoke tests/gl_smoke.c -ldl
          clang -std=c11 -O0 -Wall -Wextra -IMithril-Wrapper-cpp/include -o tests/render_smoke tests/render_smoke.c -ldl
          clang -std=c11 -O0 -Wall -Wextra -IMithril-Wrapper-cpp/include -o tests/egl_sync_smoke tests/egl_sync_smoke.c -ldl
          clang++ -std=c++17 -fobjc-arc -O0 -Wall -Wextra \
            -framework Foundation -framework QuartzCore -framework Metal \
            -o tests/surface_metal_smoke tests/surface_metal_smoke.mm -ldl
          if test -f tests/overnight_regression_smoke.c; then
            clang -std=c11 -O0 -Wall -Wextra -IMithril-Wrapper-cpp/include -o tests/overnight_regression_smoke tests/overnight_regression_smoke.c -ldl
          fi

      - name: Run host state and real-GPU smokes
        env:
          MITHRIL_DEBUG: '1'
        run: |
          set -euo pipefail
          DYLIB='${{ steps.dylib.outputs.path }}'
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          ./tests/gl_smoke "$DYLIB"
          ./tests/render_smoke "$DYLIB"
          ./tests/egl_sync_smoke "$DYLIB"
          ./tests/surface_metal_smoke "$DYLIB"
          if test -x tests/overnight_regression_smoke; then ./tests/overnight_regression_smoke "$DYLIB"; fi

      - name: Source integrity checks
        run: |
          git diff --check 1e7f6b7a1941dcc6e4cef5b5e20359291f9924cb..HEAD
          grep -q 'g_state->frontFace == GL_CCW ? 0' Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp
          grep -q 'maxSamplerAnisotropy' Mithril-Wrapper-cpp/MG_Impl/Getter_gpu.mm
          grep -q 'type_description' Mithril-Wrapper-cpp/MG_Impl/Shader.cpp

  ios-arm64-cross-build:
    runs-on: macos-26-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch iOS toolchain and MoltenVK 1.4.2
        run: |
          set -euo pipefail
          curl -fsSL -o ios.toolchain.cmake https://github.com/leetal/ios-cmake/raw/master/ios.toolchain.cmake
          curl -fsSL -o MoltenVK-ios.tar https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar
          mkdir moltenvk-staging
          tar -xf MoltenVK-ios.tar -C moltenvk-staging
          FOUND=$(find moltenvk-staging -type d -name MoltenVK.xcframework -path '*static*' | head -1)
          test -n "$FOUND"
          mv "$FOUND" ./MoltenVK.xcframework
          HDRS=$(find moltenvk-staging -type d -name vulkan -path '*/include/vulkan' | head -1)
          test -n "$HDRS"
          mv "$(dirname "$HDRS")" ./MoltenVK-Headers
          test -f MoltenVK.xcframework/ios-arm64/libMoltenVK.a
          test -f MoltenVK-Headers/vulkan/vulkan.h

      - name: Configure iOS arm64
        run: |
          cmake -B build-ios \
            -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=15.0 \
            -DENABLE_BITCODE=OFF \
            -DENABLE_ARC=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-Wno-error=implicit-function-declaration" \
            -DCMAKE_CXX_FLAGS="-Wno-error"

      - name: Build iOS dylib
        run: cmake --build build-ios --config RelWithDebInfo --target mithril -j$(sysctl -n hw.ncpu)

      - name: Verify iOS ABI and exports
        run: |
          set -euo pipefail
          DYLIB=$(find build-ios -name 'libmithril.dylib' -type f | head -1)
          test -n "$DYLIB"
          file "$DYLIB"
          NM_OUT=$(nm -gU "$DYLIB")
          for sym in eglGetDisplay eglInitialize eglCreateContext eglMakeCurrent eglSwapBuffers glGetString glGetIntegerv glTexSubImage2D glDrawArrays glDrawElements; do
            echo "$NM_OUT" | grep -qE " [Tt] _?${sym}$" || { echo "missing $sym"; exit 1; }
          done
          otool -L "$DYLIB"

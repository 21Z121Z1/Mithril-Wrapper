name: apply-validation-harness-fix

on:
  push:
    branches: [validation/directmetal-performance-e2e-20260818]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[validation-harness-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/directmetal-performance-e2e-20260818
          fetch-depth: 0

      - name: Correct depth-only FBO contract and candidate pin
        shell: python
        run: |
          from pathlib import Path

          old_sha = "094e8a6f7f47d10c9211f7ffd513511804f42993"
          candidate_sha = "5e94df04d73a5aa1244d5c737e8c05758247644d"

          for filename in (
              ".github/workflows/validate-canonical-directmetal-minecraft-e2e.yml",
              ".github/workflows/validate-canonical-directmetal-pr-only.yml",
          ):
              p = Path(filename)
              text = p.read_text()
              if old_sha not in text and candidate_sha not in text:
                  raise SystemExit(f"{filename}: neither old nor candidate SHA present")
              text = text.replace(old_sha, candidate_sha)
              text = text.replace("Canonical 094e8a6f / real Minecraft / GPU evidence",
                                  "Candidate 5e94df04 / real Minecraft / GPU evidence")
              text = text.replace("testing integration/directmetal-next exact SHA $CANONICAL_SHA; E2E harness is external test-only code",
                                  "testing DirectMetal fix candidate exact SHA $CANONICAL_SHA; E2E harness is external test-only code")
              p.write_text(text)

          p = Path("tests/render_smoke.c")
          text = p.read_text()

          def replace_once(old, new):
              global text
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"render_smoke anchor count={count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "typedef GLenum    (*checkFBO_fn)(GLenum);\n",
              "typedef GLenum    (*checkFBO_fn)(GLenum);\n"
              "typedef void      (*drawBuffer_fn)(GLenum);\n"
              "typedef void      (*readBuffer_fn)(GLenum);\n",
          )
          replace_once(
              "    checkFBO_fn checkFBO       = NULL;\n",
              "    checkFBO_fn checkFBO       = NULL;\n"
              "    drawBuffer_fn drawBuffer   = NULL;\n"
              "    readBuffer_fn readBuffer   = NULL;\n",
          )
          replace_once(
              "    RESOLVE(checkFBO, \"glCheckFramebufferStatus\");\n",
              "    RESOLVE(checkFBO, \"glCheckFramebufferStatus\");\n"
              "    RESOLVE(drawBuffer, \"glDrawBuffer\");\n"
              "    RESOLVE(readBuffer, \"glReadBuffer\");\n",
          )
          replace_once(
              """        framebufferTex2D(GL_FRAMEBUFFER, GL_DEPTH_ATTACHMENT, GL_TEXTURE_2D, depthTex, 0);\n        GLenum depthStatus = checkFBO(GL_FRAMEBUFFER);\n""",
              """        framebufferTex2D(GL_FRAMEBUFFER, GL_DEPTH_ATTACHMENT, GL_TEXTURE_2D, depthTex, 0);\n        /* A depth-only framebuffer is complete only when its color draw/read\n         * selectors are GL_NONE. The old harness left the default\n         * GL_COLOR_ATTACHMENT0 selectors active and then kept issuing GPU\n         * commands against a framebuffer it had just proven incomplete. */\n        drawBuffer(GL_NONE);\n        readBuffer(GL_NONE);\n        GLenum depthStatus = checkFBO(GL_FRAMEBUFFER);\n""",
          )
          p.write_text(text)

      - name: Mechanical checks
        run: |
          git diff --check
          grep -q 'drawBuffer(GL_NONE);' tests/render_smoke.c
          grep -q 'readBuffer(GL_NONE);' tests/render_smoke.c
          grep -R '5e94df04d73a5aa1244d5c737e8c05758247644d' \
            .github/workflows/validate-canonical-directmetal-*.yml
          ! grep -R '094e8a6f7f47d10c9211f7ffd513511804f42993' \
            .github/workflows/validate-canonical-directmetal-*.yml

      - name: Commit harness correction
        run: |
          if git diff --quiet; then
            echo "Harness already corrected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/render_smoke.c \
                  .github/workflows/validate-canonical-directmetal-minecraft-e2e.yml \
                  .github/workflows/validate-canonical-directmetal-pr-only.yml
          git commit -m "validation: fix depth-only FBO and test DirectMetal candidate [validation-harness-fixed]"
          git push origin HEAD:validation/directmetal-performance-e2e-20260818

name: Materialize structured production semantic trace

on:
  push:
    branches: ['fix/gl-semantic-closure-integration-20260816']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-production-semantic-trace
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      E2E_ROOT: ${{ github.workspace }}/build/structured-trace-e2e
      MITHRIL_BACKEND: metal
      MTL_DEBUG_LAYER: '1'
      MTL_SHADER_VALIDATION: '0'
      GRADLE_OPTS: -Dorg.gradle.caching=true
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - name: Apply structured semantic trace instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/e2e/apply_structured_semantic_trace.py
          git diff --check
          git diff --stat

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Install native dependencies
        run: brew install glfw vulkan-loader molten-vk ninja

      - name: Build instrumented production Mithril
        id: mithril
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$E2E_ROOT"
          cmake -S . -B build-structured-trace -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS='-Wno-error' -DCMAKE_CXX_FLAGS='-Wno-error'
          cmake --build build-structured-trace --target mithril --parallel
          dylib=$(find build-structured-trace -type f -name libmithril.dylib -print -quit)
          test -s "$dylib"
          dylib="$(cd "$(dirname "$dylib")" && pwd)/$(basename "$dylib")"
          echo "dylib=$dylib" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$dylib" | tee "$E2E_ROOT/mithril.sha256"

      - name: Build production GLFW bridge
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          GLFW_PREFIX=$(brew --prefix glfw)
          GLFW_REAL="$GLFW_PREFIX/lib/libglfw.3.dylib"
          [[ -f "$GLFW_REAL" ]] || GLFW_REAL="$GLFW_PREFIX/lib/libglfw.dylib"
          BRIDGE="$PWD/build-structured-trace/libglfw_mithril.dylib"
          clang++ -std=c++20 -fobjc-arc -dynamiclib -Wall -Wextra -Werror ci/minecraft-e2e/native/glfw_mithril_bridge.mm ci/minecraft-e2e/native/prepresent_capture.mm -I"$GLFW_PREFIX/include" -IMithril-Wrapper-cpp/include -framework AppKit -framework QuartzCore -framework Foundation -Wl,-reexport_library,"$GLFW_REAL" -o "$BRIDGE"
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"
          echo "glfw_real=$GLFW_REAL" >> "$GITHUB_OUTPUT"

      - name: Run real Minecraft 26.2 with structured semantic trace
        shell: bash
        env:
          MITHRIL_GL_SEMANTIC_TRACE: ${{ github.workspace }}/build/structured-trace-e2e/gl-semantic-trace.tsv
        run: |
          set -euo pipefail
          rm -f "$MITHRIL_GL_SEMANTIC_TRACE"
          gradle -p .github/ci/minecraft-e2e --build-cache --stacktrace -PmithrilDylib='${{ steps.mithril.outputs.dylib }}' -PglfwBridge='${{ steps.bridge.outputs.bridge }}' -PglfwDelegate='${{ steps.bridge.outputs.glfw_real }}' -PevidenceRoot="$E2E_ROOT" runProductionClientGameTest
          test -s "$MITHRIL_GL_SEMANTIC_TRACE"

      - name: Verify wrapper identity and structured domains
        shell: bash
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"
          python3 - "$E2E_ROOT" '${{ steps.mithril.outputs.dylib }}' <<'PY'
          import hashlib, json, pathlib, sys
          root=pathlib.Path(sys.argv[1]); built=pathlib.Path(sys.argv[2]).resolve()
          state=json.loads((root/'bridge-state.json').read_text())
          loaded=pathlib.Path(state['mithril_path']).resolve()
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          if sha(built)!=sha(loaded): raise SystemExit('WRAPPER_WRONG_IMAGE')
          if state.get('swap_count',0)<2: raise SystemExit('PRESENT_NOT_SCHEDULED')
          if 'DirectMetal' not in state.get('gl_renderer',''): raise SystemExit('WRAPPER_RENDERER_IDENTITY_MISMATCH')
          PY
          python3 ci/e2e/check_gl_semantic_contract.py --manifest ci/e2e/gl_semantic_contract.json --getter Mithril-Wrapper-cpp/MG_Impl/Getter.cpp --dylib '${{ steps.mithril.outputs.dylib }}' --trace "$E2E_ROOT/gl-semantic-trace.tsv" --require-trace --report "$E2E_ROOT/contract-report.json"
          python3 - "$E2E_ROOT/gl-semantic-trace.tsv" <<'PY'
          import collections, sys
          required={'api_call','vao_vertex_fetch','draw','buffer_mapping_storage','textures_samplers','framebuffer_mrt','blend_depth_stencil','pixel_pack_unpack'}
          counts=collections.Counter()
          for line in open(sys.argv[1],errors='replace'):
              parts=line.rstrip('\n').split('\t',3)
              if len(parts)==4: counts[parts[0]]+=1
          print('structured trace domains:',dict(sorted(counts.items())))
          missing=required-set(counts)
          if missing: raise SystemExit('missing structured trace domains: '+','.join(sorted(missing)))
          PY

      - name: Commit only validated structured tracing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mithril-Wrapper-cpp/MG_State/State.h Mithril-Wrapper-cpp/MG_State/State.cpp Mithril-Wrapper-cpp/MG_Impl/Buffer.cpp Mithril-Wrapper-cpp/MG_Impl/Texture.cpp Mithril-Wrapper-cpp/MG_Impl/Stubs.cpp Mithril-Wrapper-cpp/MG_Impl/Framebuffer.cpp Mithril-Wrapper-cpp/MG_Impl/gl.cpp ci/e2e/gl_semantic_contract.json
          git diff --cached --check
          git commit -m 'ci(trace): record production GL parameter semantics [trace-domains-materialized]'
          git push origin HEAD:fix/gl-semantic-closure-integration-20260816

      - name: Upload trace validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: structured-production-trace-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: build/structured-trace-e2e/

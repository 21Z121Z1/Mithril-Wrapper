name: Recover Codex overnight DirectVulkan state

on:
  push:
    branches:
      - codex/directvulkan-overnight-recovery-20260814

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: codex/directvulkan-overnight-recovery-20260814
          fetch-depth: 0

      - name: Verify recovery base
        run: |
          set -euo pipefail
          BASE=1e7f6b7a1941dcc6e4cef5b5e20359291f9924cb
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --quiet "$BASE" -- . ':!.github/recovery/**' ':!.github/scripts/replay_codex_overnight_20260814.py' ':!.github/workflows/recover-codex-overnight-20260814.yml'

      - name: Replay all Codex patch events
        run: python3 .github/scripts/replay_codex_overnight_20260814.py

      - name: Materialize recovered source snapshot
        run: |
          set -euo pipefail
          rm -rf .github/recovery
          rm .github/scripts/replay_codex_overnight_20260814.py
          rm .github/workflows/recover-codex-overnight-20260814.yml
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: recover overnight DirectVulkan device-debug state'
          git push origin HEAD:codex/directvulkan-overnight-recovery-20260814

name: Apply query semantic fix

on:
  push:
    branches:
      - 'fix/gl-semantic-closure-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply reviewed query transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ci/e2e/apply_query_semantics_fix.py')
          s=p.read_text()
          old='''    if n != 1:\n        raise SystemExit(f"{label}: expected one match, found {n}")\n    p.write_text(s.replace(old, new, 1))\n'''
          new='''    if label == "multidraw elements staged accounting" and n == 2:\n        p.write_text(s.replace(old, new))\n        return\n    if n != 1:\n        raise SystemExit(f"{label}: expected one match, found {n}")\n    p.write_text(s.replace(old, new, 1))\n'''
          if old not in s:
              raise SystemExit('materializer helper anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          python3 ci/e2e/apply_query_semantics_fix.py
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp tests/query_sync_smoke.c
          git commit -m 'fix(gl): account software primitive queries and assert errors'
          git push origin HEAD:${GITHUB_REF_NAME}

name: DirectVulkan UV input probe

on:
  workflow_dispatch:
  push:
    branches:
      - 'experiment/dvk-uv-input-probe-20260827'

permissions:
  contents: read

jobs:
  minecraft:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      E2E_ROOT: ${{ github.workspace }}/build/minecraft-vulkan-uv-probe-artifacts
      GRADLE_OPTS: -Dorg.gradle.caching=true
      MITHRIL_BACKEND: vulkan
      MITHRIL_DEBUG: '1'
      MTL_DEBUG_LAYER: '1'
      MTL_SHADER_VALIDATION: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          persist-credentials: false
      - name: Use backend-reported UBO alignment
        run: python3 ci/minecraft-e2e/patch_real_ubo_alignment.py
      - name: Instrument UV and Vulkan vertex input
        run: python3 ci/minecraft-e2e/patch_uv_input_probe.py
      - run: git diff --check
      - name: Initialize evidence
        run: python3 ci/minecraft-e2e/evidence.py --root "$E2E_ROOT" init
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - run: brew install glfw vulkan-loader molten-vk ninja
      - name: Build probed Mithril dylib
        id: mithril
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-uv-probe -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS='-Wno-error' -DCMAKE_CXX_FLAGS='-Wno-error'
          cmake --build build-uv-probe --target mithril --parallel
          dylib=$(find build-uv-probe -type f -name libmithril.dylib -print -quit)
          test -s "$dylib"
          dylib="$(cd "$(dirname "$dylib")" && pwd)/$(basename "$dylib")"
          echo "dylib=$dylib" >> "$GITHUB_OUTPUT"
      - name: Build GLFW bridge
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          GLFW_PREFIX=$(brew --prefix glfw)
          GLFW_REAL="$GLFW_PREFIX/lib/libglfw.3.dylib"
          test -f "$GLFW_REAL" || GLFW_REAL="$GLFW_PREFIX/lib/libglfw.dylib"
          mkdir -p build-uv-probe/bridge
          BRIDGE="$PWD/build-uv-probe/bridge/libglfw_mithril.dylib"
          clang++ -std=c++20 -fobjc-arc -dynamiclib -Wall -Wextra -Werror ci/minecraft-e2e/native/glfw_mithril_bridge.mm ci/minecraft-e2e/native/prepresent_capture.mm -I"$GLFW_PREFIX/include" -IMithril-Wrapper-cpp/include -framework AppKit -framework QuartzCore -framework Foundation -Wl,-reexport_library,"$GLFW_REAL" -o "$BRIDGE"
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"
          echo "glfw_real=$GLFW_REAL" >> "$GITHUB_OUTPUT"
      - name: Run real Minecraft 26.2
        shell: bash
        run: |
          set -o pipefail
          rm -f "$E2E_ROOT/failure.json"
          gradle -p .github/ci/minecraft-e2e --build-cache --stacktrace -PmithrilBackend=vulkan -PmithrilDylib="${{ steps.mithril.outputs.dylib }}" -PglfwBridge="${{ steps.bridge.outputs.bridge }}" -PglfwDelegate="${{ steps.bridge.outputs.glfw_real }}" -PevidenceRoot="$E2E_ROOT" runProductionClientGameTest 2>&1 | tee "$E2E_ROOT/gradle-minecraft.log"
      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ci/minecraft-e2e/collect-diagnostics.sh "$E2E_ROOT" "$PWD/.github/ci/minecraft-e2e/build/run/clientGameTest"
          grep -E 'UV_PROBE|UV_ATTR|UV_VERT|VK_INPUT_SHADER|VK_INPUT_ATTR' "$E2E_ROOT/gradle-minecraft.log" > "$E2E_ROOT/uv-probe.log" || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mithril-vulkan-uv-probe-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          compression-level: 6
          path: build/minecraft-vulkan-uv-probe-artifacts/**

name: Bootstrap EGL sync and surface lifecycle

on:
  push:
    branches:
      - fix/mobilegl-style-mc262-startup-preflight

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobilegl-style-mc262-startup-preflight
      - name: Apply EGL synchronization and surface lifecycle patch
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_egl_sync_surface_lifecycle.py
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mithril-Wrapper-cpp tests
          git rm .github/scripts/apply_egl_sync_surface_lifecycle.py
          git commit -m 'fix: back EGL fences and waits with Vulkan completion'
          git push origin HEAD:fix/mobilegl-style-mc262-startup-preflight
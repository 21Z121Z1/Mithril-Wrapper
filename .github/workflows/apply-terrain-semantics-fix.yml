name: Apply terrain semantics source fix

on:
  push:
    branches:
      - ci/minecraft-on-mithril-e2e-20260815
    paths:
      - ci/e2e/run_terrain_semantics_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout patch source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 2
      - name: Materialize reviewed source edits
        run: |
          set -euo pipefail
          python3 ci/e2e/run_terrain_semantics_fix.py
          git diff --check
          git diff --stat
          test -n "$(git status --short)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Mithril-Wrapper-cpp/MG_Impl/Shader.h \
                  Mithril-Wrapper-cpp/MG_Impl/Shader.cpp \
                  Mithril-Wrapper-cpp/MG_Impl/Program.cpp \
                  Mithril-Wrapper-cpp/MG_Impl/Drawing.cpp \
                  Mithril-Wrapper-cpp/MG_State/State.h \
                  Mithril-Wrapper-cpp/MG_Backend/DirectMetal/MetalCommandStream.mm
          git commit -m 'fix(directmetal): implement terrain indexed semantics'
          git push origin HEAD:ci/minecraft-on-mithril-e2e-20260815

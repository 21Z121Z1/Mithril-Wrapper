name: apply-link-graph-cleanup

on:
  push:
    branches: [fix/directmetal-incomplete-fbo-20260819]
  pull_request:
    branches: [integration/directmetal-next]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/directmetal-incomplete-fbo-20260819
          fetch-depth: 0
      - name: Remove redundant direct static-library edges
        shell: python
        run: |
          from pathlib import Path
          p = Path('CMakeLists.txt')
          text = p.read_text()
          old = '''    target_link_libraries(${target} PRIVATE\n        glslang::glslang\n        glslang::SPIRV\n        glslang::glslang-default-resource-limits\n        spirv-cross-core)\n'''
          new = '''    # glslang::SPIRV exposes glslang transitively. Do not add a second\n    # direct glslang edge: Apple ld warns and ignores that duplicate archive.\n    # SPIRV-Cross core is backend-specific below: spirv-cross-msl already\n    # carries core transitively for DirectMetal; the legacy target links core\n    # explicitly because it does not consume the MSL target.\n    target_link_libraries(${target} PRIVATE\n        glslang::SPIRV\n        glslang::glslang-default-resource-limits)\n'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('frontend link anchor changed')
              text = text.replace(old, new, 1)
          old_legacy = '    target_link_libraries(mithril_legacy PRIVATE Vulkan::Headers)\n'
          new_legacy = '    target_link_libraries(mithril_legacy PRIVATE Vulkan::Headers spirv-cross-core)\n'
          if new_legacy not in text:
              if text.count(old_legacy) != 1:
                  raise SystemExit('legacy link anchor changed')
              text = text.replace(old_legacy, new_legacy, 1)
          p.write_text(text)
          Path('.github/workflows/apply-link-graph-cleanup.yml').unlink()
      - name: Commit link graph cleanup
        run: |
          git diff --check
          grep -q 'glslang::SPIRV' CMakeLists.txt
          grep -q 'mithril_legacy PRIVATE Vulkan::Headers spirv-cross-core' CMakeLists.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt .github/workflows/apply-link-graph-cleanup.yml
          git commit -m 'build: remove redundant transitive static-library edges'
          git push origin HEAD:fix/directmetal-incomplete-fbo-20260819

name: apply-directmetal-buffer-streaming

on:
  push:
    branches: [perf/directmetal-buffer-streaming-20260817]

permissions:
  contents: write

concurrency:
  group: apply-directmetal-buffer-streaming
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/directmetal-buffer-streaming-20260817
          submodules: false
          fetch-depth: 0

      - name: Fetch DirectMetal shader submodules
        run: >-
          git submodule update --init --depth=1
          third_party/SPIRV-Cross
          third_party/SPIRV-Headers
          third_party/glslang

      - name: Apply buffer-streaming implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count}, found {actual}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < minimum:
                  raise SystemExit(f"{path}: expected >= {minimum}, found {actual}: {old!r}")
              p.write_text(text.replace(old, new))
              return actual

          # -----------------------------------------------------------------
          # Frontend buffer storage: logical size is distinct from materialized
          # CPU bytes so glBufferData(NULL) does not eagerly zero the allocation.
          # The most recent mutation range is carried to the native backend.
          # -----------------------------------------------------------------
          replace_exact(
              "src/gl/internal.h",
              '''struct BufferData {
              std::vector<uint8_t> data;
              uint64_t lifetime_id = 0;
              uint64_t content_version = 0;
              bool defined = false;
              bool mapped = false;
              bool map_writable = false;
              size_t map_offset = 0;
          };
          ''',
              '''struct BufferData {
              std::vector<uint8_t> data;
              size_t storage_size = 0;
              uint64_t lifetime_id = 0;
              uint64_t content_version = 0;
              uint64_t previous_content_version = 0;
              size_t update_offset = 0;
              size_t update_size = 0;
              bool update_is_partial = false;
              bool defined = false;
              bool mapped = false;
              bool map_writable = false;
              size_t map_offset = 0;
              size_t map_length = 0;

              size_t Size() const { return storage_size; }
              bool IsMaterialized() const { return data.size() == storage_size; }
              void EnsureMaterialized() {
                  // NULL glBufferData contents are undefined by GL.  Materialize
                  // deterministic zero bytes only when CPU-visible contents are
                  // actually required; a later full overwrite skips this write.
                  if (!IsMaterialized()) data.assign(storage_size, 0);
              }
              void RecordUpdate(size_t offset, size_t size, bool partial) {
                  previous_content_version = content_version;
                  ++content_version;
                  update_offset = offset;
                  update_size = size;
                  update_is_partial = partial;
              }
          };
          ''')

          # Backend resident-source snapshots carry enough version/range metadata
          # to prove whether a native partial replacement is safe.
          replace_exact(
              "src/backend/types.h",
              "    uint64_t source_content_version = 0;\n",
              "    uint64_t source_content_version = 0;\n"
              "    uint64_t source_previous_content_version = 0;\n"
              "    uint64_t source_update_offset = 0;\n"
              "    uint64_t source_update_size = 0;\n"
              "    bool source_update_is_partial = false;\n",
              count=2)

          # -----------------------------------------------------------------
          # Buffer API mutations and CPU observation paths.
          # -----------------------------------------------------------------
          replace_exact(
              "src/gl/vertex.cpp",
              '''    if (data) {
                  it->second.data.assign((const uint8_t*)data, (const uint8_t*)data + size);
              } else {
                  it->second.data.assign((size_t)size, 0);
              }
              ++it->second.content_version;
              it->second.defined = data != nullptr;
          }
          ''',
              '''    BufferData& buffer = it->second;
              buffer.storage_size = static_cast<size_t>(size);
              if (data) {
                  buffer.data.assign((const uint8_t*)data,
                                     (const uint8_t*)data + size);
              } else {
                  // GL leaves a NULL data store undefined. Keep only its logical
                  // size until a CPU read/partial write actually needs bytes.
                  buffer.data.clear();
              }
              buffer.RecordUpdate(0, buffer.Size(), false);
              buffer.defined = data != nullptr;
          }
          ''')

          replace_exact(
              "src/gl/vertex.cpp",
              '''    if (offset + size > (GLintptr)it->second.data.size()) {
                  PUSH_ERROR(GL_INVALID_VALUE);
                  return;
              }
              if (it->second.defined && size > 0 &&
                  std::memcmp(it->second.data.data() + offset, data,
                              static_cast<size_t>(size)) == 0)
                  return;
              std::memcpy(it->second.data.data() + offset, data, size);
              ++it->second.content_version;
              it->second.defined = true;
          }
          ''',
              '''    BufferData& buffer = it->second;
              if (static_cast<uint64_t>(offset) > buffer.Size() ||
                  static_cast<uint64_t>(size) > buffer.Size() -
                      static_cast<size_t>(offset)) {
                  PUSH_ERROR(GL_INVALID_VALUE);
                  return;
              }
              const size_t write_offset = static_cast<size_t>(offset);
              const size_t write_size = static_cast<size_t>(size);
              if (!write_size) return;
              const bool full_write = write_offset == 0 && write_size == buffer.Size();
              if (!buffer.IsMaterialized() && full_write) {
                  buffer.data.assign((const uint8_t*)data,
                                     (const uint8_t*)data + write_size);
              } else {
                  buffer.EnsureMaterialized();
                  if (buffer.defined &&
                      std::memcmp(buffer.data.data() + write_offset, data,
                                  write_size) == 0)
                      return;
                  std::memcpy(buffer.data.data() + write_offset, data, write_size);
              }
              buffer.RecordUpdate(write_offset, write_size, !full_write);
              buffer.defined = true;
          }
          ''')

          # Every size query/bounds check in this TU is about GL storage size,
          # not whether lazy CPU bytes happen to be materialized.
          for old, new in (
              ("found->second.data.size()", "found->second.Size()"),
              ("src->data.size()", "src->Size()"),
              ("dst->data.size()", "dst->Size()"),
              ("b->data.size()", "b->Size()"),
          ):
              replace_all("src/gl/vertex.cpp", old, new)

          replace_exact(
              "src/gl/vertex.cpp",
              '''        output->buffer = &found->second;
              output->data = found->second.data.empty()
                  ? nullptr : found->second.data.data() + offset + base;
          ''',
              '''        found->second.EnsureMaterialized();
              output->buffer = &found->second;
              output->data = found->second.data.empty()
                  ? nullptr : found->second.data.data() + offset + base;
          ''')
          replace_exact(
              "src/gl/vertex.cpp",
              '''    output->buffer = &found->second;
              output->data = found->second.data.empty()
                  ? nullptr : found->second.data.data() + offset;
          ''',
              '''    found->second.EnsureMaterialized();
              output->buffer = &found->second;
              output->data = found->second.data.empty()
                  ? nullptr : found->second.data.data() + offset;
          ''')
          replace_exact(
              "src/gl/vertex.cpp",
              '''    ++destination->buffer->content_version;
              destination->buffer->defined = true;
          ''',
              '''    destination->buffer->RecordUpdate(
                  0, destination->buffer->Size(), false);
              destination->buffer->defined = true;
          ''')

          replace_exact(
              "src/gl/vertex.cpp",
              '''    std::memmove(dst->data.data() + writeoffset, src->data.data() + readoffset,
                           size);
              ++dst->content_version;
              dst->defined = true;
          ''',
              '''    src->EnsureMaterialized();
              dst->EnsureMaterialized();
              std::memmove(dst->data.data() + writeoffset, src->data.data() + readoffset,
                           size);
              const bool full_write = writeoffset == 0 &&
                  static_cast<size_t>(size) == dst->Size();
              dst->RecordUpdate(static_cast<size_t>(writeoffset),
                                static_cast<size_t>(size), !full_write);
              dst->defined = true;
          ''')

          replace_exact(
              "src/gl/vertex.cpp",
              '''    std::memcpy(data, b->data.data() + offset, size);
          }

          void* APIENTRY glMapBuffer(GLenum target, GLenum access) {
          ''',
              '''    b->EnsureMaterialized();
              std::memcpy(data, b->data.data() + offset, size);
          }

          void* APIENTRY glMapBuffer(GLenum target, GLenum access) {
          ''')

          replace_exact(
              "src/gl/vertex.cpp",
              '''    if (b->mapped) { PUSH_ERROR(GL_INVALID_OPERATION); return nullptr; }
              if (b->data.empty()) { PUSH_ERROR(GL_OUT_OF_MEMORY); return nullptr; }
              b->mapped = true;
              b->map_offset = 0;
              b->map_writable = access != GL_READ_ONLY;
              if (b->map_writable) {
                  ++b->content_version;
                  b->defined = true;
              }
              return b->data.data();
          ''',
              '''    if (b->mapped) { PUSH_ERROR(GL_INVALID_OPERATION); return nullptr; }
              if (!b->Size()) { PUSH_ERROR(GL_OUT_OF_MEMORY); return nullptr; }
              b->EnsureMaterialized();
              b->mapped = true;
              b->map_offset = 0;
              b->map_length = b->Size();
              b->map_writable = access != GL_READ_ONLY;
              if (b->map_writable) {
                  b->RecordUpdate(0, b->Size(), false);
                  b->defined = true;
              }
              return b->data.data();
          ''')

          replace_exact(
              "src/gl/vertex.cpp",
              '''    if (offset + length > (GLintptr)b->Size()) { PUSH_ERROR(GL_INVALID_VALUE); return nullptr; }
              b->mapped = true;
              b->map_offset = static_cast<size_t>(offset);
              b->map_writable = access != GL_MAP_READ_BIT;
              if (b->map_writable) {
                  ++b->content_version;
                  b->defined = true;
              }
              return b->data.data() + offset;
          ''',
              '''    if (offset + length > (GLintptr)b->Size()) { PUSH_ERROR(GL_INVALID_VALUE); return nullptr; }
              b->EnsureMaterialized();
              b->mapped = true;
              b->map_offset = static_cast<size_t>(offset);
              b->map_length = static_cast<size_t>(length);
              b->map_writable = access != GL_MAP_READ_BIT;
              if (b->map_writable) {
                  const bool full_write = b->map_offset == 0 && b->map_length == b->Size();
                  b->RecordUpdate(b->map_offset, b->map_length, !full_write);
                  b->defined = true;
              }
              return b->data.data() + offset;
          ''')
          replace_exact(
              "src/gl/vertex.cpp",
              '''    b->map_writable = false;
              b->map_offset = 0;
              return GL_TRUE;  // host-coherent staging: nothing to flush
          ''',
              '''    b->map_writable = false;
              b->map_offset = 0;
              b->map_length = 0;
              return GL_TRUE;  // host-coherent staging: nothing to flush
          ''')
          replace_exact(
              "src/gl/vertex.cpp",
              '''    ++b->content_version;
              b->defined = true;
          }

          void APIENTRY glEnableVertexAttribArray''',
              '''    b->RecordUpdate(0, b->Size(), false);
              b->defined = true;
          }

          void APIENTRY glEnableVertexAttribArray''')

          # -----------------------------------------------------------------
          # Draw-time readers materialize lazy undefined bytes only when needed
          # and forward the exact latest mutation metadata to DirectMetal.
          # -----------------------------------------------------------------
          replace_exact(
              "src/gl/draw.cpp",
              '''    auto bit = g_buffers.find(a.buffer);
              if (bit == g_buffers.end()) return false;
              GLuint type_sz = AttribTypeSize(a.type);
          ''',
              '''    auto bit = g_buffers.find(a.buffer);
              if (bit == g_buffers.end()) return false;
              bit->second.EnsureMaterialized();
              GLuint type_sz = AttribTypeSize(a.type);
          ''')
          replace_exact(
              "src/gl/draw.cpp",
              '''    auto buffer = g_buffers.find(a.buffer);
              if (buffer == g_buffers.end()) return false;
              const uint32_t type_size = AttribTypeSize(a.type);
          ''',
              '''    auto buffer = g_buffers.find(a.buffer);
              if (buffer == g_buffers.end()) return false;
              buffer->second.EnsureMaterialized();
              const uint32_t type_size = AttribTypeSize(a.type);
          ''')
          replace_all("src/gl/draw.cpp", "bit->second.data.size()", "bit->second.Size()")
          replace_all("src/gl/draw.cpp", "buffer->second.data.size()", "buffer->second.Size()")
          replace_exact(
              "src/gl/draw.cpp",
              '''        const uint64_t start = (uint64_t)std::max(row_base, 0) *
                                     (uint64_t)std::max(resident_stride, 0);
          ''',
              '''        if (resident) bit->second.EnsureMaterialized();
              const uint64_t start = (uint64_t)std::max(row_base, 0) *
                                     (uint64_t)std::max(resident_stride, 0);
          ''')
          replace_exact(
              "src/gl/draw.cpp",
              '''            vstream.source_lifetime_id = bit->second.lifetime_id;
              vstream.source_content_version = bit->second.content_version;
              vstream.binding_offset = start;
          ''',
              '''            vstream.source_lifetime_id = bit->second.lifetime_id;
              vstream.source_content_version = bit->second.content_version;
              vstream.source_previous_content_version =
                  bit->second.previous_content_version;
              vstream.source_update_offset = bit->second.update_offset;
              vstream.source_update_size = bit->second.update_size;
              vstream.source_update_is_partial = bit->second.update_is_partial;
              vstream.binding_offset = start;
          ''')
          replace_exact(
              "src/gl/draw.cpp",
              '''        const uint64_t offset = static_cast<uint64_t>(indexed.offset);
              const uint64_t available = indexed.whole_buffer
          ''',
              '''        buffer->second.EnsureMaterialized();
              const uint64_t offset = static_cast<uint64_t>(indexed.offset);
              const uint64_t available = indexed.whole_buffer
          ''')
          replace_exact(
              "src/gl/draw.cpp",
              '''            binding.source_lifetime_id = buffer->second.lifetime_id;
              binding.source_content_version = buffer->second.content_version;
              binding.offset = offset;
          ''',
              '''            binding.source_lifetime_id = buffer->second.lifetime_id;
              binding.source_content_version = buffer->second.content_version;
              binding.source_previous_content_version =
                  buffer->second.previous_content_version;
              binding.source_update_offset = buffer->second.update_offset;
              binding.source_update_size = buffer->second.update_size;
              binding.source_update_is_partial = buffer->second.update_is_partial;
              binding.offset = offset;
          ''')
          replace_exact(
              "src/gl/draw.cpp",
              '''    auto bit = g_buffers.find(g_bound_element_buffer);
              if (bit == g_buffers.end()) { *err = GL_INVALID_OPERATION; return out; }
              GLuint idx_sz;
          ''',
              '''    auto bit = g_buffers.find(g_bound_element_buffer);
              if (bit == g_buffers.end()) { *err = GL_INVALID_OPERATION; return out; }
              bit->second.EnsureMaterialized();
              GLuint idx_sz;
          ''')

          # PBO and texture-buffer readers also honor logical lazy storage.
          replace_all("src/gl/texture.cpp", "buffer->second.data.size()", "buffer->second.Size()")
          replace_exact(
              "src/gl/texture.cpp",
              '''        output->data = buffer->second.data.empty()
                  ? nullptr : buffer->second.data.data() + offset + base;
          ''',
              '''        buffer->second.EnsureMaterialized();
              output->data = buffer->second.data.empty()
                  ? nullptr : buffer->second.data.data() + offset + base;
          ''')
          replace_exact(
              "src/gl/texture.cpp",
              '''    output->data = buffer->second.data.empty()
                  ? nullptr : buffer->second.data.data() + offset;
          ''',
              '''    buffer->second.EnsureMaterialized();
              output->data = buffer->second.data.empty()
                  ? nullptr : buffer->second.data.data() + offset;
          ''')
          replace_exact(
              "src/gl/texture.cpp",
              '''    if (buffer == g_buffers.end() ||
                  texture.tex_buffer_source_version == buffer->second.content_version)
                  return;

              const uint32_t bytes_per_texel = texture.tex_buffer_bytes_per_texel;
          ''',
              '''    if (buffer == g_buffers.end() ||
                  texture.tex_buffer_source_version == buffer->second.content_version)
                  return;
              buffer->second.EnsureMaterialized();

              const uint32_t bytes_per_texel = texture.tex_buffer_bytes_per_texel;
          ''')

          # -----------------------------------------------------------------
          # DirectMetal diagnostics for deterministic performance-shape tests.
          # -----------------------------------------------------------------
          replace_exact(
              "include/mithril/directmetal_diagnostics.h",
              '''void mithrilResetDirectMetalBindingStats(void);
          int mithrilGetDirectMetalBindingStatsV1(
              MithrilDirectMetalBindingStatsV1* output, size_t output_size);
          ''',
              '''void mithrilResetDirectMetalBindingStats(void);
          int mithrilGetDirectMetalBindingStatsV1(
              MithrilDirectMetalBindingStatsV1* output, size_t output_size);

          #define MITHRIL_DIRECT_METAL_BUFFER_STATS_VERSION 1u

          typedef struct MithrilDirectMetalBufferStatsV1 {
              uint32_t version;
              uint32_t struct_size;
              uint64_t resident_allocations;
              uint64_t resident_reuses;
              uint64_t full_cpu_upload_bytes;
              uint64_t partial_cpu_upload_bytes;
              uint64_t preserve_blit_bytes;
          } MithrilDirectMetalBufferStatsV1;

          void mithrilResetDirectMetalBufferStats(void);
          int mithrilGetDirectMetalBufferStatsV1(
              MithrilDirectMetalBufferStatsV1* output, size_t output_size);
          ''')

          # -----------------------------------------------------------------
          # Native generation queue: never mutate an in-flight resident buffer.
          # A partial update CPU-writes only the dirty range into a new/free
          # generation and preserves the unchanged prefix/suffix with a Metal
          # blit ordered before the render pass. Completed generations recycle.
          # -----------------------------------------------------------------
          replace_exact(
              "src/metal/engine.mm",
              '''struct ResidentBuffer {
              id<MTLBuffer> buffer = nil;
              uint64_t content_version = 0;
              size_t size = 0;
          };
          ''',
              '''struct ResidentBuffer {
              id<MTLBuffer> buffer = nil;
              uint64_t content_version = 0;
              size_t size = 0;
          };

          struct PendingResidentCopy {
              id<MTLBuffer> source = nil;
              id<MTLBuffer> destination = nil;
              NSUInteger prefix_size = 0;
              NSUInteger suffix_offset = 0;
              NSUInteger suffix_size = 0;
          };
          ''')
          replace_exact(
              "src/metal/engine.mm",
              '''struct CommandCompletion {
              std::mutex mutex;
              std::condition_variable condition;
              bool completed = false;
              bool success = false;
          };
          ''',
              '''struct CommandCompletion {
              std::mutex mutex;
              std::condition_variable condition;
              bool completed = false;
              bool success = false;
          };

          struct RetiredResidentBuffer {
              id<MTLBuffer> buffer = nil;
              std::shared_ptr<CommandCompletion> completion;
          };
          ''')
          replace_exact(
              "src/metal/engine.mm",
              '''MithrilDirectMetalBindingStatsV1 EmptyBindingStats() {
              MithrilDirectMetalBindingStatsV1 stats{};
              stats.version = MITHRIL_DIRECT_METAL_BINDING_STATS_VERSION;
              stats.struct_size = static_cast<uint32_t>(sizeof(stats));
              return stats;
          }
          ''',
              '''MithrilDirectMetalBindingStatsV1 EmptyBindingStats() {
              MithrilDirectMetalBindingStatsV1 stats{};
              stats.version = MITHRIL_DIRECT_METAL_BINDING_STATS_VERSION;
              stats.struct_size = static_cast<uint32_t>(sizeof(stats));
              return stats;
          }

          MithrilDirectMetalBufferStatsV1 EmptyBufferStats() {
              MithrilDirectMetalBufferStatsV1 stats{};
              stats.version = MITHRIL_DIRECT_METAL_BUFFER_STATS_VERSION;
              stats.struct_size = static_cast<uint32_t>(sizeof(stats));
              return stats;
          }
          ''')
          replace_exact(
              "src/metal/engine.mm",
              '''    MithrilDirectMetalBindingStatsV1 binding_stats = EmptyBindingStats();
              std::vector<PendingDraw> draws;
          ''',
              '''    MithrilDirectMetalBindingStatsV1 binding_stats = EmptyBindingStats();
              MithrilDirectMetalBufferStatsV1 buffer_stats = EmptyBufferStats();
              std::vector<PendingResidentCopy> pending_resident_copies;
              std::vector<id<MTLBuffer>> resident_retire_on_submit;
              std::vector<RetiredResidentBuffer> retired_resident_buffers;
              std::vector<id<MTLBuffer>> resident_buffer_pool;
              std::vector<PendingDraw> draws;
          ''')

          old_retain = '''id<MTLBuffer> RetainResidentBytes(const uint8_t* source_data,
                                            size_t source_size,
                                            uint64_t lifetime_id,
                                            uint64_t content_version) {
              if (!source_data || !source_size || !lifetime_id) return nil;
              auto& engine = GetEngine();
              ResidentBuffer& resident = engine.resident_buffers[lifetime_id];
              if (!resident.buffer || resident.content_version != content_version ||
                  resident.size != source_size) {
                  resident.buffer = [engine.device newBufferWithBytes:source_data
                                                              length:source_size
                                                             options:MTLResourceStorageModeShared];
                  if (!resident.buffer) {
                      engine.resident_buffers.erase(lifetime_id);
                      return nil;
                  }
                  resident.buffer.label = @"Mithril resident GL buffer";
                  resident.content_version = content_version;
                  resident.size = source_size;
                  static bool logged_resident_path = false;
                  if (!logged_resident_path) {
                      ML_LOG_INFO("metal: resident GL buffer path active "
                                  "(lifetime/version keyed)");
                      logged_resident_path = true;
                  }
              }
              return resident.buffer;
          }

          id<MTLBuffer> RetainResidentBuffer(const backend::VertexStream& stream) {
              if (!stream.HasResidentSource()) return nil;
              return RetainResidentBytes(stream.source_data, stream.source_size,
                                         stream.source_lifetime_id,
                                         stream.source_content_version);
          }
          '''
          new_retain = '''bool CompletionReady(const std::shared_ptr<CommandCompletion>& completion) {
              if (!completion) return true;
              std::lock_guard<std::mutex> lock(completion->mutex);
              return completion->completed;
          }

          constexpr size_t kMaxResidentBufferPoolEntries = 32;

          void ReclaimResidentBuffers() {
              auto& engine = GetEngine();
              for (auto it = engine.retired_resident_buffers.begin();
                   it != engine.retired_resident_buffers.end();) {
                  if (!CompletionReady(it->completion)) {
                      ++it;
                      continue;
                  }
                  if (it->buffer &&
                      engine.resident_buffer_pool.size() < kMaxResidentBufferPoolEntries)
                      engine.resident_buffer_pool.push_back(it->buffer);
                  it = engine.retired_resident_buffers.erase(it);
              }
          }

          id<MTLBuffer> AcquireResidentBuffer(size_t size) {
              auto& engine = GetEngine();
              ReclaimResidentBuffers();
              for (size_t i = 0; i < engine.resident_buffer_pool.size(); ++i) {
                  id<MTLBuffer> candidate = engine.resident_buffer_pool[i];
                  if (candidate && [candidate length] == size) {
                      engine.resident_buffer_pool[i] =
                          engine.resident_buffer_pool.back();
                      engine.resident_buffer_pool.pop_back();
                      ++engine.buffer_stats.resident_reuses;
                      return candidate;
                  }
              }
              id<MTLBuffer> buffer = [engine.device
                  newBufferWithLength:size options:MTLResourceStorageModeShared];
              if (buffer) ++engine.buffer_stats.resident_allocations;
              return buffer;
          }

          id<MTLBuffer> RetainResidentBytes(const uint8_t* source_data,
                                            size_t source_size,
                                            uint64_t lifetime_id,
                                            uint64_t content_version,
                                            uint64_t previous_content_version,
                                            size_t update_offset,
                                            size_t update_size,
                                            bool update_is_partial) {
              if (!source_data || !source_size || !lifetime_id) return nil;
              auto& engine = GetEngine();
              ResidentBuffer& resident = engine.resident_buffers[lifetime_id];
              if (resident.buffer && resident.content_version == content_version &&
                  resident.size == source_size)
                  return resident.buffer;

              const bool valid_update_range =
                  update_offset <= source_size &&
                  update_size <= source_size - update_offset;
              const size_t update_end = valid_update_range
                  ? update_offset + update_size : 0;
              const bool can_preserve_with_blit =
                  resident.buffer && resident.size == source_size &&
                  resident.content_version == previous_content_version &&
                  update_is_partial && update_size != 0 && valid_update_range &&
                  source_size % 4 == 0 && update_offset % 4 == 0 &&
                  update_size % 4 == 0 && update_end % 4 == 0;

              id<MTLBuffer> replacement = AcquireResidentBuffer(source_size);
              if (!replacement) return nil;

              if (can_preserve_with_blit) {
                  std::memcpy(static_cast<uint8_t*>(replacement.contents) + update_offset,
                              source_data + update_offset, update_size);
                  engine.buffer_stats.partial_cpu_upload_bytes += update_size;
                  engine.buffer_stats.preserve_blit_bytes += source_size - update_size;
                  engine.pending_resident_copies.push_back({
                      resident.buffer, replacement,
                      static_cast<NSUInteger>(update_offset),
                      static_cast<NSUInteger>(update_end),
                      static_cast<NSUInteger>(source_size - update_end)});
              } else {
                  std::memcpy(replacement.contents, source_data, source_size);
                  engine.buffer_stats.full_cpu_upload_bytes += source_size;
              }

              if (resident.buffer)
                  engine.resident_retire_on_submit.push_back(resident.buffer);
              resident.buffer = replacement;
              resident.buffer.label = @"Mithril resident GL buffer";
              resident.content_version = content_version;
              resident.size = source_size;

              static bool logged_resident_path = false;
              if (!logged_resident_path) {
                  ML_LOG_INFO("metal: resident GL buffer generations active "
                              "(partial CPU update + ordered preservation blit)");
                  logged_resident_path = true;
              }
              return resident.buffer;
          }

          id<MTLBuffer> RetainResidentBuffer(const backend::VertexStream& stream) {
              if (!stream.HasResidentSource()) return nil;
              return RetainResidentBytes(
                  stream.source_data, stream.source_size,
                  stream.source_lifetime_id, stream.source_content_version,
                  stream.source_previous_content_version,
                  static_cast<size_t>(stream.source_update_offset),
                  static_cast<size_t>(stream.source_update_size),
                  stream.source_update_is_partial);
          }
          '''
          replace_exact("src/metal/engine.mm", old_retain, new_retain)

          replace_exact(
              "src/metal/engine.mm",
              '''        id<MTLBuffer> resident = RetainResidentBytes(
                  binding.source_data, binding.source_size,
                  binding.source_lifetime_id, binding.source_content_version);
          ''',
              '''        id<MTLBuffer> resident = RetainResidentBytes(
                  binding.source_data, binding.source_size,
                  binding.source_lifetime_id, binding.source_content_version,
                  binding.source_previous_content_version,
                  static_cast<size_t>(binding.source_update_offset),
                  static_cast<size_t>(binding.source_update_size),
                  binding.source_update_is_partial);
          ''')

          replace_exact(
              "src/metal/engine.mm",
              '''    id<MTLCommandBuffer> command = [engine.queue commandBuffer];
              if (!command) return false;
              command.label = @"Mithril DirectMetal frame";

              std::vector<std::shared_ptr<OcclusionQueryState>> query_states;
          ''',
              '''    id<MTLCommandBuffer> command = [engine.queue commandBuffer];
              if (!command) return false;
              command.label = @"Mithril DirectMetal frame";

              if (!engine.pending_resident_copies.empty()) {
                  id<MTLBlitCommandEncoder> resident_blit =
                      [command blitCommandEncoder];
                  if (!resident_blit) return false;
                  resident_blit.label = @"Mithril resident buffer preservation";
                  for (const auto& copy : engine.pending_resident_copies) {
                      if (copy.prefix_size) {
                          [resident_blit copyFromBuffer:copy.source
                                           sourceOffset:0
                                               toBuffer:copy.destination
                                      destinationOffset:0
                                                   size:copy.prefix_size];
                      }
                      if (copy.suffix_size) {
                          [resident_blit copyFromBuffer:copy.source
                                           sourceOffset:copy.suffix_offset
                                               toBuffer:copy.destination
                                      destinationOffset:copy.suffix_offset
                                                   size:copy.suffix_size];
                      }
                  }
                  [resident_blit endEncoding];
              }

              std::vector<std::shared_ptr<OcclusionQueryState>> query_states;
          ''')

          replace_exact(
              "src/metal/engine.mm",
              '''    auto completion = CommitCommandBuffer(command);
              if (!completion) return false;
              for (const auto& query : query_states) {
          ''',
              '''    auto completion = CommitCommandBuffer(command);
              if (!completion) return false;
              for (id<MTLBuffer> buffer : engine.resident_retire_on_submit)
                  engine.retired_resident_buffers.push_back({buffer, completion});
              engine.resident_retire_on_submit.clear();
              engine.pending_resident_copies.clear();
              for (const auto& query : query_states) {
          ''')

          replace_exact(
              "src/metal/engine.mm",
              '''extern "C" int mithrilGetDirectMetalBindingStatsV1(
              MithrilDirectMetalBindingStatsV1* output, size_t output_size) {
              if (!output || output_size < sizeof(*output)) return 0;
              *output = GetEngine().binding_stats;
              return 1;
          }

          } // namespace mithril::metal
          ''',
              '''extern "C" int mithrilGetDirectMetalBindingStatsV1(
              MithrilDirectMetalBindingStatsV1* output, size_t output_size) {
              if (!output || output_size < sizeof(*output)) return 0;
              *output = GetEngine().binding_stats;

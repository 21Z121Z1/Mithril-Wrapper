name: One-shot apply control hardening

on:
  push:
    branches:
      - ci/minecraft-on-mithril-e2e-20260815
    paths:
      - .github/workflows/one-shot-apply-control-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/minecraft-on-mithril-e2e-20260815
          persist-credentials: true
          fetch-depth: 1
      - name: Apply exact source patch
        run: |
          set -euo pipefail
          python3 ci/minecraft-e2e/apply_control_hardening.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/ci/minecraft-e2e/src/main/java/dev/mithril/e2e/MithrilClientGameTest.java
          git commit -m 'ci: isolate Minecraft framebuffer control state'
          git push origin HEAD:ci/minecraft-on-mithril-e2e-20260815

name: diagnose-vulkan-draw

on:
  push:
    branches: [feature/direct-metal]
    paths:
      - '.github/workflows/diagnose-vulkan-draw.yml'

permissions:
  contents: write

concurrency:
  group: diagnose-vulkan-draw
  cancel-in-progress: false

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply exact Vulkan viewport patch
        run: |
          set -euo pipefail
          test "$(git hash-object src/vk/draw.cpp)" = cd4056478c7f7dd443c1bdd64b5e60b53dcec26c
          test "$(git hash-object src/vk/pipeline.cpp)" = 545fd31e138ca77ceceb0126fd87fb4b3eefc922
          python3 - <<'PY'
          from pathlib import Path

          draw = Path('src/vk/draw.cpp')
          s = draw.read_text()
          old = '''            VkViewport vp{};
                      vp.x = op.dynamic.viewport[0];
                      vp.y = op.dynamic.viewport[1];
                      vp.width = std::min<float>(op.dynamic.viewport[2], pw);
                      vp.height = std::min<float>(op.dynamic.viewport[3], ph);
                      vp.minDepth = 0.f;
                      vp.maxDepth = 1.f;
          '''
          new = '''            // GL window coordinates are bottom-left-origin while the Vulkan
                      // framebuffer is top-left-origin. Vulkan 1.1 permits a negative
                      // viewport height, so flip during rasterization and keep readback,
                      // scissor and framebuffer coordinates in their natural conventions.
                      VkViewport vp{};
                      vp.x = op.dynamic.viewport[0];
                      vp.y = static_cast<float>(ph) - op.dynamic.viewport[1];
                      vp.width = std::min<float>(op.dynamic.viewport[2], pw);
                      vp.height = -std::min<float>(op.dynamic.viewport[3], ph);
                      vp.minDepth = 0.f;
                      vp.maxDepth = 1.f;
          '''
          if s.count(old) != 1:
              raise SystemExit(f'draw viewport anchor count={s.count(old)}')
          draw.write_text(s.replace(old, new))

          pipeline = Path('src/vk/pipeline.cpp')
          s = pipeline.read_text()
          old = '''    // Vulkan's framebuffer is +Y-down (we keep the GL bottom-left flip in the
              // readout), so a GL front-face winding maps to the opposite Vk value.
              rs.frontFace = op.pipe.front_face == GL_CW ? VK_FRONT_FACE_COUNTER_CLOCKWISE
                                                          : VK_FRONT_FACE_CLOCKWISE;
          '''
          new = '''    // The negative-height viewport restores GL's bottom-left raster mapping,
              // so front-face winding now maps directly instead of compensating here.
              rs.frontFace = op.pipe.front_face == GL_CW ? VK_FRONT_FACE_CLOCKWISE
                                                          : VK_FRONT_FACE_COUNTER_CLOCKWISE;
          '''
          if s.count(old) != 1:
              raise SystemExit(f'front-face anchor count={s.count(old)}')
          pipeline.write_text(s.replace(old, new))
          PY
          git diff --check
          git diff -- src/vk/draw.cpp src/vk/pipeline.cpp

      - name: Configure and build Linux reference backend
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Install lavapipe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers
          vulkaninfo --summary 2>/dev/null | head -10 || true

      - name: Build all Linux smoke binaries
        run: |
          gcc -o tests/contract_smoke tests/contract_smoke.c -ldl
          gcc -o tests/state_smoke tests/state_smoke.c -ldl
          gcc -o tests/shader_smoke tests/shader_smoke.c -ldl
          gcc -o tests/draw_smoke tests/draw_smoke.c -ldl
          gcc -o tests/texture_smoke tests/texture_smoke.c -ldl
          gcc -o tests/fbo_smoke tests/fbo_smoke.c -ldl
          gcc -o tests/3d_smoke tests/3d_smoke.c -ldl -lm
          gcc -o tests/render3d_smoke tests/render3d_smoke.c -ldl -lm

      - name: Run complete Linux smoke suite
        env:
          MITHRIL_LIBRARY: ${{ github.workspace }}/output/libmithril.so
        run: |
          set -euo pipefail
          ./tests/contract_smoke
          ./tests/state_smoke
          ./tests/shader_smoke
          ./tests/draw_smoke
          ./tests/texture_smoke
          ./tests/fbo_smoke
          ./tests/3d_smoke
          ./tests/render3d_smoke

      - name: Commit only after the full suite passes
        run: |
          set -euo pipefail
          rm .github/workflows/diagnose-vulkan-draw.yml
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vk/draw.cpp src/vk/pipeline.cpp .github/workflows/diagnose-vulkan-draw.yml
          git commit -m 'fix: restore GL viewport orientation in Vulkan backend'
          git push origin HEAD:feature/direct-metal

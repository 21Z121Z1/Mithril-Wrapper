name: diagnose-vulkan-draw

on:
  push:
    branches: [feature/direct-metal]
    paths:
      - '.github/workflows/diagnose-vulkan-draw.yml'

jobs:
  draw-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Mithril
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
      - name: Install lavapipe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers
      - name: Build draw smoke
        run: gcc -O0 -g -o /tmp/draw_smoke tests/draw_smoke.c -ldl
      - name: Run draw smoke with complete output
        shell: bash
        run: |
          set -o pipefail
          MITHRIL_LIBRARY="$PWD/output/libmithril.so" /tmp/draw_smoke 2>&1 | tee /tmp/draw-smoke.log

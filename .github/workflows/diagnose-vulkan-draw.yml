name: diagnose-vulkan-draw

on:
  push:
    branches: [feature/direct-metal]
    paths:
      - '.github/workflows/diagnose-vulkan-draw.yml'

jobs:
  draw-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Mithril
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
      - name: Install lavapipe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers
      - name: Build Y-swapped diagnostic
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tests/draw_smoke.c').read_text()
          low = 'readPixels(127, 152, 3, 3, GL_RGBA, GL_UNSIGNED_BYTE, red_patch);'
          high = 'readPixels(383, 357, 3, 3, GL_RGBA, GL_UNSIGNED_BYTE, green_patch);'
          if source.count(low) != 1 or source.count(high) != 1:
              raise SystemExit('line-strip sample anchors changed')
          source = source.replace(low,
              'readPixels(127, 357, 3, 3, GL_RGBA, GL_UNSIGNED_BYTE, red_patch);')
          source = source.replace(high,
              'readPixels(383, 152, 3, 3, GL_RGBA, GL_UNSIGNED_BYTE, green_patch);')
          Path('/tmp/y_swapped.c').write_text(source)
          PY
          gcc -O0 -g -o /tmp/y_swapped /tmp/y_swapped.c -ldl
      - name: Run Y-swapped smoke
        run: MITHRIL_LIBRARY="$PWD/output/libmithril.so" /tmp/y_swapped

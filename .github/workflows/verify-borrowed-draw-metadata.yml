name: verify-borrowed-draw-metadata

on:
  push:
    branches: [perf/directmetal-borrowed-draw-metadata-20260818]

permissions:
  contents: write

concurrency:
  group: verify-borrowed-draw-metadata
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/directmetal-borrowed-draw-metadata-20260818
          submodules: false
          fetch-depth: 0

      - name: Fetch shader submodules
        run: >-
          git submodule update --init --depth=1
          third_party/SPIRV-Cross
          third_party/SPIRV-Headers
          third_party/glslang

      - name: Apply borrowed metadata phase
        run: python3 scripts/apply_borrowed_draw_metadata.py

      - name: Verify performance-shape invariants
        run: |
          git diff --check
          grep -q 'ArrayView<UniformBufferBinding> uniform_buffers' src/backend/types.h
          grep -q 'ArrayView<SampledTextureBinding> sampled_textures' src/backend/types.h
          ! grep -q 'std::vector<UniformBufferBinding> uniform_buffers' src/backend/types.h
          ! grep -q 'std::vector<SampledTextureBinding> sampled_textures' src/backend/types.h
          grep -q 'InlineList<BoundUniformBuffer, kMaxPendingUniformBufferBindings>' src/metal/engine.mm
          grep -q 'InlineList<BoundTexture, kMaxPendingTextureBindings>' src/metal/engine.mm
          ! grep -q 'std::vector<BoundUniformBuffer> uniform_buffers' src/metal/engine.mm
          ! grep -q 'std::vector<BoundTexture> textures' src/metal/engine.mm
          grep -q 'pending.params.uniform_buffers = {}' src/metal/engine.mm
          grep -q 'pending.params.sampled_textures = {}' src/metal/engine.mm

      - name: Materialize implementation
        run: |
          rm .github/workflows/verify-borrowed-draw-metadata.yml
          rm scripts/apply_borrowed_draw_metadata.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf: borrow hot draw metadata views'
          git push origin HEAD:perf/directmetal-borrowed-draw-metadata-20260818

      - name: Configure DirectMetal Release
        run: >-
          cmake -S . -B build-direct -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=OFF
          -DMITHRIL_BUILD_DIRECT=ON
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON

      - name: Build DirectMetal
        run: cmake --build build-direct --parallel

      - name: Run metadata-sensitive regressions
        run: >-
          ctest --test-dir build-direct
          -R '^(sampler_array_smoke|ubo_smoke|directmetal_multidraw_lowering_smoke)$'
          --output-on-failure

      - name: Run complete DirectMetal suite
        run: ctest --test-dir build-direct -L directmetal --output-on-failure

      - name: Fetch Vulkan headers
        run: git submodule update --init --depth=1 third_party/Vulkan-Headers

      - name: Configure Vulkan reference
        run: >-
          cmake -S . -B build-vulkan -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=ON
          -DMITHRIL_BUILD_DIRECT=OFF
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON

      - name: Build Vulkan reference
        run: cmake --build build-vulkan --parallel
